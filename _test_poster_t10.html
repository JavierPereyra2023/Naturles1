<!doctype html>
<html><head><meta charset="utf-8"><title>Test cartel t=10s</title></head>
<body style="margin:0">
<iframe id="f" src="unidades/biologia/celulas/neurona.html" style="width:100%;height:100vh;border:0"></iframe>
<script>
  document.getElementById('f').addEventListener('load', function () {
    var w = document.getElementById('f').contentWindow;
    var d = document.getElementById('f').contentDocument;
    setTimeout(function () {
      // Simular tiempo del audio en t=10s
      var a = d.getElementById('poster-audio');
      a.currentTime = 10;
      // Forzar el "playing" para que activateStep marque la card 2
      d.querySelectorAll('.poster-step').forEach(function (s) {
        var a2 = parseFloat(s.getAttribute('data-start'));
        var b = parseFloat(s.getAttribute('data-end'));
        var active = (10 >= a2 && 10 < b);
        s.classList.toggle('is-active', active);
        s.classList.toggle('is-done', 10 >= b);
      });
    }, 1500);
  });
</script>
</body></html>
