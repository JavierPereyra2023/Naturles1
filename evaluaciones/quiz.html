<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz · Ciencias Naturales</title><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><style>body{background:#080c0a;color:#c8d4cc;font-family:Inter,sans-serif}.answer{border:1px solid #27302b;transition:.2s}.answer:hover,.answer:focus{border-color:#2dd4bf;background:#0e1915}.answer.selected{border-color:#2dd4bf;background:#0d948822}.correct{border-color:#22c55e!important;background:#22c55e22}.wrong{border-color:#ef4444!important;background:#ef444422}</style></head><body><main class="max-w-3xl mx-auto px-5 py-10"><a href="index.html" class="text-xs uppercase font-bold text-teal-400">← Volver a los quizzes</a><div id="app" class="mt-8"></div></main><script src="js/quiz-data.js"></script><script src="js/quiz-app.js"></script><script>const id=new URLSearchParams(location.search).get('unidad'),u=QUIZ_UNITS.find(x=>x.id===id),app=document.getElementById('app');let n=0,answers=[];if(!u){app.innerHTML='<h1>Quiz no encontrado</h1>';throw 0}function draw(){let q=u.questions[n];app.innerHTML=`<p class="text-xs font-bold uppercase tracking-widest text-teal-400">${u.title} · ${n+1}/${u.questions.length}</p><h1 class="font-[Playfair_Display] text-4xl font-bold text-white mt-3">${q.text}</h1><div class="mt-7 grid gap-3">${q.options.map((o,i)=>`<button class="answer text-left p-4 rounded" data-i="${i}"><b class="mr-3 text-teal-300">${'ABCD'[i]}</b>${o}</button>`).join('')}</div><button id="next" disabled class="mt-7 bg-teal-500 disabled:opacity-30 text-black font-extrabold uppercase text-xs px-6 py-4 rounded">${n===u.questions.length-1?'Ver resultado':'Siguiente'}</button>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[n]=+b.dataset.i;document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{n++;n<u.questions.length?draw():finish()}}function finish(){let correct=answers.reduce((s,a,i)=>s+(a===u.questions[i].correct),0),score=correct/u.questions.length*100,d=QuizProgress.read(),old=d.units[u.id]?.best||0;d.units[u.id]={best:Math.max(old,score),attempts:(d.units[u.id]?.attempts||0)+1};QuizProgress.save(d);app.innerHTML=`<p class="text-xs font-bold uppercase tracking-widest text-teal-400">Resultado guardado</p><h1 class="font-[Playfair_Display] text-5xl font-bold text-white mt-3">${Math.round(score)} puntos</h1><p class="mt-4">Respondiste ${correct} de ${u.questions.length} correctamente. ${score>=QuizProgress.pass?'¡Unidad aprobada!':'Necesitás 60 puntos para aprobar; podés reintentar.'}</p><div class="mt-8 flex gap-3"><a class="bg-teal-500 text-black font-bold text-xs uppercase px-5 py-3 rounded" href="index.html">Ver mi progreso</a><button class="border border-white/20 px-5 py-3 rounded text-xs font-bold uppercase" onclick="location.reload()">Reintentar</button></div>`}draw()</script></body></html>
