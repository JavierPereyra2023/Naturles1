<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17272d">
  <title>Maqueta 3D de energía mareomotriz</title>
  <style>
    :root {
      --bg: oklch(22% 0.035 226);
      --surface: oklch(28% 0.025 220 / 82%);
      --fg: oklch(96% 0.015 205);
      --muted: oklch(78% 0.025 205);
      --border: oklch(88% 0.025 205 / 22%);
      --accent: oklch(72% 0.125 194);
      --font-display: "Aptos Display", "Segoe UI", sans-serif;
      --font-body: "Aptos", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body { font-family: var(--font-body); color: var(--fg); }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #scene:active { cursor: grabbing; }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      background: var(--bg);
      transition: opacity .7s ease, visibility .7s ease;
    }
    .loading.done { opacity: 0; visibility: hidden; }
    .loading-mark {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .controls {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 14px 45px rgb(0 0 0 / 28%);
    }
    button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      color: var(--fg);
      background: transparent;
      cursor: pointer;
      transition: background .2s ease, transform .15s ease;
    }
    button:hover { background: rgb(255 255 255 / 10%); }
    button:active { transform: translateY(2px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.active { background: rgb(255 255 255 / 15%); }
    button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .time-indicator {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: 18px;
      z-index: 8;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }
    .time-indicator::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 2px;
      height: 13px;
      border-radius: 2px;
      background: var(--fg);
      transform-origin: bottom;
      transform: translateX(-50%) rotate(var(--sun-angle, 0deg));
    }
    .hint {
      position: fixed;
      left: 18px;
      bottom: 20px;
      z-index: 8;
      margin: 0;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgb(15 24 28 / 58%);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
      backdrop-filter: blur(10px);
      opacity: 1;
      transition: opacity .5s ease;
      pointer-events: none;
    }
    .hint.hidden { opacity: 0; }
    .fatal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      color: var(--fg);
      background: var(--bg);
      text-align: center;
      line-height: 1.55;
    }
    @media (max-width: 620px) {
      .controls {
        bottom: max(12px, env(safe-area-inset-bottom));
        gap: 4px;
        padding: 5px;
        max-width: calc(100vw - 16px);
      }
      button { width: 42px; height: 44px; }
      .hint { left: 50%; bottom: 82px; transform: translateX(-50%); white-space: nowrap; }
      .time-indicator { top: 12px; right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-mark { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <main data-od-id="maqueta-mareomotriz">
    <div class="loading" id="loading" aria-live="polite">
      <div class="loading-mark" aria-label="Cargando maqueta"></div>
    </div>
    <canvas id="scene" data-od-id="lienzo-3d" aria-label="Maqueta tridimensional interactiva de una central mareomotriz"></canvas>
    <div class="time-indicator" id="timeIndicator" data-od-id="indicador-ciclo-diario" aria-hidden="true"></div>
    <p class="hint" id="hint">Arrastrá para mirar · pellizcá para acercarte</p>
    <nav class="controls" data-od-id="controles-recorrido" aria-label="Controles de la maqueta">
      <button id="tourBtn" class="active" data-od-id="boton-recorrido" aria-label="Pausar recorrido automático" title="Recorrido automático">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="overviewBtn" data-od-id="boton-vista-general" aria-label="Vista general" title="Vista general">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
      <button id="barrageBtn" data-od-id="boton-vista-parque-marino" aria-label="Acercarse al parque de turbinas submarinas" title="Turbinas submarinas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 19 9 5h6l3 14M8 13h8M7 16h10"/></svg>
      </button>
      <button id="circuitBtn" data-od-id="boton-vista-circuito" aria-label="Seguir el circuito eléctrico" title="Circuito eléctrico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="17" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="19" cy="14" r="2"/><path d="m6.5 15.5 4-6.8M13.8 8.2l3.5 4.3M7 17h10"/></svg>
      </button>
      <button id="villageBtn" data-od-id="boton-vista-poblacion" aria-label="Acercarse a la población" title="Población y paisaje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 12 5-4 4 3 4-6 5 5v9H3zM8 19v-5h4v5M16 19v-6h3"/></svg>
      </button>
      <button id="animalsBtn" data-od-id="boton-vista-animales" aria-label="Observar los animales pastando" title="Animales pastando">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5c0-2 1.6-3.5 3.6-3.5h6.8c2 0 3.6 1.5 3.6 3.5V14H6c-1.1 0-2-.9-2-2zM18 10l2-2M7 14v4M15 14v4M5 9 3 7"/><circle cx="15.5" cy="9.5" r=".5"/></svg>
      </button>
      <button id="soundBtn" data-od-id="boton-sonido" aria-label="Activar ambiente sonoro" title="Ambiente sonoro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7L8 10zM16 9.5c1.5 1.3 1.5 3.7 0 5M18.5 7c3 2.8 3 7.2 0 10"/></svg>
      </button>
    </nav>
    <div class="fatal" id="fatal">No se pudo iniciar la escena 3D. Probá abrir el archivo con conexión a internet y un navegador actualizado.</div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#scene");
    const loading = document.querySelector("#loading");
    const fatal = document.querySelector("#fatal");
    const tourBtn = document.querySelector("#tourBtn");
    const hint = document.querySelector("#hint");
    const timeIndicator = document.querySelector("#timeIndicator");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const clamp = THREE.MathUtils.clamp;
    let renderer, scene, camera, controls, clock, sun, hemi, water, seaWater, waterMat, openSea;
    let sunDisc, moonDisc, stars, sunGlow, moonGlow, sunGlitter;
    let touring = !reducedMotion;
    let tourTime = 0;
    let lastInteraction = 0;
    let audioContext, ambienceMaster, oceanGain, birdGain, birdTimer, audioOn = false;
    const mixers = [];
    const birds = [];
    const grazers = [];
    const turbineRotors = [];
    const treeCanopies = [];
    const waveBands = [];
    const surfLines = [];
    const buoys = [];
    const powerWaves = [];
    const villageLights = [];
    const houseNightLights = [];
    const houseServicePoints = [];
    const servicePaths = [];
    let powerPath, gridPath, distributionPath;
    const cameraTarget = new THREE.Vector3(0, 2, 0);
    const underwaterTint = new THREE.Color();
    const tourStops = [
      {position:new THREE.Vector3(62,38,62),target:new THREE.Vector3(0,-1,3)},
      {position:new THREE.Vector3(14,-3.1,30),target:new THREE.Vector3(0,-3.6,2)},
      {position:new THREE.Vector3(68,17,-23),target:new THREE.Vector3(42,3,-43)},
      {position:new THREE.Vector3(57,18,-24),target:new THREE.Vector3(35,2,-46)},
      {position:new THREE.Vector3(-4,8,-31),target:new THREE.Vector3(0,1.5,-46)}
    ];

    function mat(color, roughness=.75, metalness=0) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }
    function mesh(geometry, material, position=[0,0,0], rotation=[0,0,0], cast=true) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(...position);
      object.rotation.set(...rotation);
      object.castShadow = cast;
      object.receiveShadow = true;
      scene.add(object);
      return object;
    }
    function addTo(parent, geometry, material, position=[0,0,0], rotation=[0,0,0]) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(...position);
      object.rotation.set(...rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }
    function seeded(seed) {
      let x = Math.sin(seed * 999) * 43758.5453;
      return x - Math.floor(x);
    }

    const SHORE_BASE = -30;
    const BEACH_SLOPE = 1.63/7;
    function shoreLine(x) {
      const settled=Math.exp(-Math.pow((x-38)/28,2));
      const wildness=1-.74*settled;
      return SHORE_BASE + wildness*(
        Math.sin(x*.072)*3.6
        + Math.cos(x*.039+1.7)*2.7
        + Math.sin(x*.168+.6)*.85
      );
    }
    function ground(x,z) {
      const d = z-shoreLine(x);
      let h;
      if (d<-7) {
        h = 1.18+Math.sin(x*.075)*.16+Math.cos(z*.09+x*.03)*.13;
      } else if (d<0) {
        const k=(d+7)/7;
        h = THREE.MathUtils.lerp(1.18,-.45,k*k*(3-2*k));
      } else if (d<14) {
        const k=d/14;
        h = THREE.MathUtils.lerp(-.45,-6,k*k*(3-2*k));
      } else {
        h = -6-Math.min((d-14)*.13,5);
      }
      const rough = clamp((d-1)/5,0,1);
      h += rough*(Math.sin(x*.38+z*.21)*.16+Math.cos(x*.12-z*.19)*.26);
      return h;
    }
    const groundStops = [
      [-10.4, new THREE.Color(0x27383a)],
      [-6.8, new THREE.Color(0x2f4640)],
      [-4.2, new THREE.Color(0x496054)],
      [-1.4, new THREE.Color(0x7d7d5e)],
      [-0.15, new THREE.Color(0xb3a077)],
      [0.72, new THREE.Color(0xd3bd91)],
      [0.98, new THREE.Color(0xb3b473)],
      [1.12, new THREE.Color(0x6d8a45)],
      [1.6, new THREE.Color(0x52703c)]
    ];
    function groundColor(h,target) {
      if (h<=groundStops[0][0]) return target.copy(groundStops[0][1]);
      for (let i=1;i<groundStops.length;i++) {
        if (h<=groundStops[i][0]) {
          const [h0,c0]=groundStops[i-1], [h1,c1]=groundStops[i];
          return target.copy(c0).lerp(c1,(h-h0)/(h1-h0));
        }
      }
      return target.copy(groundStops[groundStops.length-1][1]);
    }

    function makeTerrain() {
      const geo = new THREE.PlaneGeometry(240, 230, 150, 130);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count*3);
      const tint = new THREE.Color();
      for (let i=0; i<pos.count; i++) {
        const x = pos.getX(i), z = -pos.getY(i);
        const h = ground(x,z);
        pos.setZ(i, h);
        groundColor(h,tint);
        const speck = .92+seeded(i*.37)*.16;
        colors[i*3]=tint.r*speck;
        colors[i*3+1]=tint.g*speck;
        colors[i*3+2]=tint.b*speck;
      }
      geo.setAttribute("color", new THREE.BufferAttribute(colors,3));
      geo.computeVertexNormals();
      const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: .97, metalness: 0
      }));
      terrain.rotation.x = -Math.PI/2;
      terrain.receiveShadow = true;
      scene.add(terrain);
    }

    function makeShoreDetail() {
      const rockMat = mat(0x5c5b52,.95);
      const darkRock = mat(0x43443f,.92);
      const addRock=(x,z,scale,y)=>{
        const rock=mesh(new THREE.IcosahedronGeometry(1,0),seeded(x*z)>.5?rockMat:darkRock,
          [x,y,z],[seeded(x)*3,seeded(z)*3,seeded(x+z)*3],true);
        rock.scale.set(scale*(.8+seeded(x+1)*.6),scale*(.55+seeded(z+2)*.5),scale*(.8+seeded(x-z)*.6));
        return rock;
      };
      for (let i=0;i<22;i++) {
        const x=-88+seeded(i*3+7)*176;
        const z=shoreLine(x)+(seeded(i*5+11)-.45)*9;
        addRock(x,z,.7+seeded(i+40)*1.6,ground(x,z)+.25);
      }
      for (let i=0;i<16;i++) {
        const x=-80+seeded(i*7+3)*160;
        const z=-44-seeded(i*11+5)*36;
        addRock(x,z,.4+seeded(i+70)*.7,ground(x,z)+.15);
      }
      [[-46,-14,3.4],[52,4,2.6],[-12,24,2.1]].forEach(([x,z,s],i)=>{
        const islet=new THREE.Group();
        islet.position.set(x,-1.4,z);
        scene.add(islet);
        for (let k=0;k<4;k++) {
          const chunk=addTo(islet,new THREE.IcosahedronGeometry(s,0),k?darkRock:rockMat,
            [(seeded(k+i*9)-.5)*s*1.3,seeded(k+i*4)*s*.7,(seeded(k+i*6)-.5)*s*1.3],
            [seeded(k)*3,seeded(k+1)*3,seeded(k+2)*3]);
          chunk.scale.set(1,.62+seeded(k+3)*.4,1);
        }
      });
    }

    function makeFoamTexture() {
      const c=document.createElement("canvas");
      c.width=c.height=128;
      const g=c.getContext("2d");
      for(let i=0;i<30;i++) {
        const r=9+seeded(i+3)*24;
        const x=r+seeded(i*2+1)*(128-2*r);
        const y=r+seeded(i*3+5)*(128-2*r);
        const blob=g.createRadialGradient(x,y,0,x,y,r);
        blob.addColorStop(0,"rgba(255,255,255,.9)");
        blob.addColorStop(.5,"rgba(255,255,255,.4)");
        blob.addColorStop(1,"rgba(255,255,255,0)");
        g.fillStyle=blob;
        g.beginPath();
        g.arc(x,y,r,0,6.2832);
        g.fill();
      }
      const edge=g.createRadialGradient(64,64,22,64,64,64);
      edge.addColorStop(0,"rgba(0,0,0,0)");
      edge.addColorStop(1,"rgba(0,0,0,1)");
      g.globalCompositeOperation="destination-out";
      g.fillStyle=edge;
      g.fillRect(0,0,128,128);
      const texture=new THREE.CanvasTexture(c);
      texture.colorSpace=THREE.SRGBColorSpace;
      return texture;
    }

    function makeWater() {
      waterMat = new THREE.MeshPhysicalMaterial({
        color: 0x2385a3,
        roughness: .18,
        metalness: .08,
        transmission: .18,
        transparent: true,
        opacity: .38,
        clearcoat: .5,
        side: THREE.DoubleSide
      });
      water = mesh(new THREE.PlaneGeometry(210, 190, 100, 80), waterMat, [0, 0, 6], [-Math.PI/2,0,0], false);
      seaWater=water;
      openSea = mesh(
        new THREE.PlaneGeometry(520,520,1,1),
        new THREE.MeshStandardMaterial({color:0x1c6c88, roughness:.24, metalness:.1, side:THREE.DoubleSide}),
        [0,-.12,0],
        [-Math.PI/2,0,0],
        false
      );
      openSea.renderOrder=-1;

      const foamMat = new THREE.MeshBasicMaterial({
        color:0xe6fbf7,
        map:makeFoamTexture(),
        transparent:true,
        opacity:.55,
        depthWrite:false,
        toneMapped:false
      });
      for (let i=0;i<26;i++) {
        const anchor=-84+seeded(i)*168;
        const foam = mesh(new THREE.PlaneGeometry(3.4+seeded(i+30)*5.6,1.1+seeded(i+61)*1.5), foamMat.clone(), [anchor,.16,0], [-Math.PI/2,0,0], false);
        foam.userData.anchor=anchor;
        foam.userData.phase = seeded(i+9)*6.28;
        foam.userData.reach = .6+seeded(i+17)*2.4;
        mixers.push(foam);
      }
      const surfMat=new THREE.LineBasicMaterial({color:0xf1fffb,transparent:true,opacity:.7});
      for (let line=0;line<3;line++) {
        const points=[];
        for (let i=0;i<=110;i++) {
          const x=-88+i*1.6;
          points.push(new THREE.Vector3(x,.2,shoreLine(x)));
        }
        const surf=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),surfMat.clone());
        surf.userData={phase:line*2.1,lag:line*1.35};
        scene.add(surf);
        surfLines.push(surf);
      }

      const waveMat=new THREE.LineBasicMaterial({color:0xdaf5f2,transparent:true,opacity:.58});
      for(let band=0;band<15;band++) {
        const points=[];
        for(let i=0;i<=64;i++) {
          const x=-86+i*2.7;
          const refracted=(shoreLine(x)-SHORE_BASE)*.55;
          points.push(new THREE.Vector3(x,.16,refracted+Math.sin(i*.42+band)*.6));
        }
        const wave=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),waveMat.clone());
        wave.userData={phase:band*.73};
        scene.add(wave);
        waveBands.push(wave);
      }
    }

    function makeTidalFarm() {
      const steel = mat(0x3b4548, .28, .72);
      const foundation=mat(0x5f6663,.72,.35);
      const positions=[
        [-25,-2],[-8,-2],[9,-2],[26,-2],
        [-20,16],[-3,16],[14,16],[31,16]
      ];
      const buoyMat=mat(0xf0b429,.5,.1);
      const buoyDark=mat(0x2c3336,.6,.2);
      const seabed=positions.map(([x,z])=>ground(x,z));
      positions.forEach((spot,index)=>{
        const [x,z]=spot;
        const bed=seabed[index];
        const hub=Math.max(-2.9, bed+4.2);
        const pileTop=hub-bed;
        const turbine=new THREE.Group();
        turbine.position.set(x,bed,z);
        scene.add(turbine);
        addTo(turbine,new THREE.CylinderGeometry(2.4,3.2,.7,20),foundation,[0,.35,0]);
        addTo(turbine,new THREE.CylinderGeometry(.42,.62,pileTop-.5,16),steel,[0,(pileTop+.5)/2,0]);
        addTo(turbine,new THREE.CylinderGeometry(.62,.78,3.3,18),steel,[0,pileTop,0],[Math.PI/2,0,0]);
        const rotor=new THREE.Group();
        rotor.position.set(0,pileTop,1.72);
        turbine.add(rotor);
        addTo(rotor,new THREE.CylinderGeometry(.25,.25,.48,16),steel,[0,0,.04],[Math.PI/2,0,0]);
        for(let blade=0;blade<3;blade++) {
          const angle=blade*Math.PI*2/3;
          const prop=addTo(rotor,new THREE.CapsuleGeometry(.28,2.3,5,10),mat(0xd2e4df,.2,.72));
          prop.position.set(Math.cos(angle)*1.02,Math.sin(angle)*1.02,.02);
          prop.rotation.z=angle-Math.PI/2;
          prop.scale.set(1,.76,.28);
        }
        turbineRotors.push(rotor);

        const buoy=new THREE.Group();
        buoy.position.set(x+2.6,0,z+1.4);
        scene.add(buoy);
        addTo(buoy,new THREE.CylinderGeometry(.42,.5,.5,12),buoyMat,[0,0,0]);
        addTo(buoy,new THREE.ConeGeometry(.34,.7,12),buoyMat,[0,.55,0]);
        addTo(buoy,new THREE.CylinderGeometry(.05,.05,.7,6),buoyDark,[0,1.2,0]);
        addTo(buoy,new THREE.SphereGeometry(.12,10,8),buoyDark,[0,1.6,0]);
        buoy.userData={phase:seeded(index+77)*6.28};
        buoys.push(buoy);
      });
      const collectorBed=ground(38,-20);
      const collector=new THREE.Group();
      collector.position.set(38,collectorBed+1.2,-20);
      scene.add(collector);
      addTo(collector,new THREE.BoxGeometry(4.8,2.4,4.2),foundation,[0,0,0]);
      addTo(collector,new THREE.CylinderGeometry(.24,.24,3.6,10),steel,[0,2.6,0]);
      positions.forEach(([x,z],index)=>{
        const midX=(x+38)/2, midZ=(z-20)/2;
        const cable=new THREE.CatmullRomCurve3([
          new THREE.Vector3(x,seabed[index]+.4,z),
          new THREE.Vector3(midX,ground(midX,midZ)+.3,midZ),
          new THREE.Vector3(38,collectorBed+.5,-20)
        ]);
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cable.getPoints(34)),new THREE.LineBasicMaterial({color:0x252d2f})));
      });
    }

    function makeHouse(x,z,scale=1,roofColor=0x754b3a) {
      const g = new THREE.Group();
      const base = ground(x,z)+.1;

      const glitterGeo=new THREE.PlaneGeometry(13,58,1,1);
      glitterGeo.rotateX(-Math.PI/2);
      sunGlitter=new THREE.Mesh(glitterGeo,new THREE.MeshBasicMaterial({
        map:glowTexture,transparent:true,opacity:0,
        blending:THREE.AdditiveBlending,depthWrite:false,fog:false,toneMapped:false
      }));
      sunGlitter.renderOrder=6;
      scene.add(sunGlitter);
      const starCanvas=document.createElement("canvas");
      starCanvas.width=32;
      starCanvas.height=32;
      const starContext=starCanvas.getContext("2d");
      const starGradient=starContext.createRadialGradient(16,16,0,16,16,15);
      starGradient.addColorStop(0,"rgba(255,255,255,.9)");
      starGradient.addColorStop(.18,"rgba(235,244,255,.72)");
      starGradient.addColorStop(1,"rgba(235,244,255,0)");
      starContext.fillStyle=starGradient;
      starContext.fillRect(0,0,32,32);
      const starTexture=new THREE.CanvasTexture(starCanvas);
      const starPositions=[];
      for(let i=0;i<440;i++) {
        const theta=seeded(i+500)*Math.PI*2;
        const radius=104+seeded(i+900)*46;
        const y=10+seeded(i+1300)*64;
        starPositions.push(Math.cos(theta)*radius,y,Math.sin(theta)*radius);
      }
      const starGeo=new THREE.BufferGeometry();
      starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
      stars=new THREE.Points(starGeo,new THREE.PointsMaterial({
        color:0xf2f6ff,
        map:starTexture,
        size:2.9,
        sizeAttenuation:false,
        alphaTest:.04,
        transparent:true,
        opacity:0,
        depthWrite:false,
        toneMapped:false,
        fog:false
      }));
      scene.add(stars);
    }

    function setCamera(pos,target) {
      touring=false; tourBtn.classList.remove("active");
      camera.position.copy(pos); cameraTarget.copy(target);
      controls.target.copy(target); controls.update();
      tourBtn.setAttribute("aria-label","Iniciar recorrido automático");
    }
    function setupUI() {
      tourBtn.addEventListener("click",()=>{
        touring=!touring; tourBtn.classList.toggle("active",touring);
        tourBtn.setAttribute("aria-label",touring?"Pausar recorrido automático":"Iniciar recorrido automático");
      });
      document.querySelector("#overviewBtn").addEventListener("click",()=>setCamera(new THREE.Vector3(62,38,62),new THREE.Vector3(0,-1,3)));
      document.querySelector("#barrageBtn").addEventListener("click",()=>setCamera(new THREE.Vector3(14,-3.1,30),new THREE.Vector3(0,-3.6,2)));
      document.querySelector("#circuitBtn").addEventListener("click",()=>setCamera(new THREE.Vector3(68,17,-23),new THREE.Vector3(42,3,-43)));
      document.querySelector("#villageBtn").addEventListener("click",()=>setCamera(new THREE.Vector3(57,18,-24),new THREE.Vector3(35,2,-46)));
      document.querySelector("#animalsBtn").addEventListener("click",()=>setCamera(new THREE.Vector3(-4,8,-31),new THREE.Vector3(0,1.5,-46)));
      document.querySelector("#soundBtn").addEventListener("click",toggleSound);
      ["pointerdown","wheel","touchstart"].forEach(type=>canvas.addEventListener(type,()=>{
        if(type!=="wheel") hint.classList.add("hidden");
        if(touring){ touring=false; tourBtn.classList.remove("active"); }
        lastInteraction=performance.now();
      },{passive:true}));
      setTimeout(()=>hint.classList.add("hidden"),6500);
    }

    function playBirdCall() {
      if(!audioOn||!audioContext||audioContext.state==="suspended") return;
      const now=audioContext.currentTime+.02;
      const chirps=2+Math.floor(Math.random()*3);
      const panValue=-.8+Math.random()*1.6;
      for(let i=0;i<chirps;i++) {
        const start=now+i*(.11+Math.random()*.06);
        const oscillator=audioContext.createOscillator();
        const envelope=audioContext.createGain();
        const panner=audioContext.createStereoPanner?audioContext.createStereoPanner():null;
        oscillator.type=i%2?"sine":"triangle";
        const base=1550+Math.random()*950;
        oscillator.frequency.setValueAtTime(base,start);
        oscillator.frequency.exponentialRampToValueAtTime(base*(1.35+Math.random()*.35),start+.085);
        envelope.gain.setValueAtTime(.0001,start);
        envelope.gain.exponentialRampToValueAtTime(.028+Math.random()*.018,start+.018);
        envelope.gain.exponentialRampToValueAtTime(.0001,start+.12);
        if(panner){
          panner.pan.value=panValue;
          oscillator.connect(envelope).connect(panner).connect(birdGain);
        } else {
          oscillator.connect(envelope).connect(birdGain);
        }
        oscillator.start(start);
        oscillator.stop(start+.14);
      }
    }

    function createAmbience() {
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
      ambienceMaster=audioContext.createGain();
      ambienceMaster.gain.value=0;
      ambienceMaster.connect(audioContext.destination);
      const noise=audioContext.createBuffer(1,audioContext.sampleRate*4,audioContext.sampleRate);
      const data=noise.getChannelData(0);
      let rolling=0;
      for(let i=0;i<data.length;i++) {
        rolling=rolling*.985+(Math.random()*2-1)*.015;
        data[i]=rolling*.9+(Math.random()*2-1)*.1;
      }
      const source=audioContext.createBufferSource();
      source.buffer=noise;
      source.loop=true;
      const filter=audioContext.createBiquadFilter();
      filter.type="lowpass";
      filter.frequency.value=920;
      filter.Q.value=.7;
      oceanGain=audioContext.createGain();
      oceanGain.gain.value=.075;
      const surfLfo=audioContext.createOscillator();
      const surfDepth=audioContext.createGain();
      surfLfo.frequency.value=.105;
      surfDepth.gain.value=.032;
      surfLfo.connect(surfDepth).connect(oceanGain.gain);
      source.connect(filter).connect(oceanGain).connect(ambienceMaster);
      source.start();
      surfLfo.start();
      birdGain=audioContext.createGain();
      birdGain.gain.value=.82;
      birdGain.connect(ambienceMaster);
      birdTimer=setInterval(()=>{
        if(audioOn){
          playBirdCall();
          if(Math.random()>.55) setTimeout(playBirdCall,500+Math.random()*900);
        }
      },2400);
    }

    function toggleSound() {
      const button=document.querySelector("#soundBtn");
      if(!audioContext) createAmbience();
      if(audioContext.state==="suspended") audioContext.resume();
      audioOn=!audioOn;
      ambienceMaster.gain.setTargetAtTime(audioOn?1:0,audioContext.currentTime,.28);
      if(audioOn) setTimeout(playBirdCall,450);
      button.classList.toggle("active",audioOn);
      button.setAttribute("aria-label",audioOn?"Desactivar ambiente sonoro":"Activar ambiente sonoro");
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
      tourTime+=dt;
      const day=(.35+t*.055)%1;
      const sunAngle=day*Math.PI*2-Math.PI/2;
      sun.position.set(Math.cos(sunAngle)*55,Math.sin(sunAngle)*42,-22);
      const daylight=clamp((sun.position.y+2)/29,0,1);
      sun.intensity=daylight*3.1;
      hemi.intensity=.08+daylight*1.18;
      const nightColor=new THREE.Color(0x061220);
      const twilightColor=new THREE.Color(0xc56d58);
      const dayColor=new THREE.Color(0x9fcddd);
      if(sun.position.y<=-6) {
        scene.background.copy(nightColor);
      } else if(sun.position.y<8) {
        scene.background.copy(nightColor).lerp(twilightColor,(sun.position.y+6)/14);
      } else {
        scene.background.copy(twilightColor).lerp(dayColor,clamp((sun.position.y-8)/20,0,1));
      }
      scene.fog.color.copy(scene.background);
      waterMat.color.setHSL(.53,.56,.18+daylight*.2);
      const skyRadius=96;
      sunDisc.position.copy(sun.position).normalize().multiplyScalar(skyRadius);
      const lowSun=clamp((11-sun.position.y)/17,0,1);
      sunDisc.material.color.setRGB(1,.82-lowSun*.26,.5-lowSun*.36);
      sunDisc.scale.setScalar(1+lowSun*.55);
      sunDisc.material.opacity=clamp((sunDisc.position.y+2.5)/7,0,1);
      sunGlow.position.copy(sunDisc.position);
      sunGlow.material.color.copy(sunDisc.material.color);
      sunGlow.material.opacity=sunDisc.material.opacity*(.3+lowSun*.55);
      sunGlow.scale.setScalar(25+lowSun*26);
      moonDisc.position.copy(sunDisc.position).multiplyScalar(-1);
      const darkness=clamp((-sun.position.y+4)/18,0,1);
      moonDisc.material.opacity=.28+darkness*.72;
      moonGlow.position.copy(moonDisc.position);
      moonGlow.material.opacity=moonDisc.material.opacity*.42;
      stars.material.opacity=darkness;
      timeIndicator.style.setProperty("--sun-angle",`${day*360}deg`);

      const tide=Math.sin(t*.06);
      const seaLevel=.05+tide*.55;
      water.position.y=seaLevel;
      openSea.position.y=seaLevel-.12;
      openSea.material.color.copy(waterMat.color).multiplyScalar(.78);
      const tideShift=seaLevel/BEACH_SLOPE;
      for(const surface of [water]) {
        const pos=surface.geometry.attributes.position;
        for(let i=0;i<pos.count;i++) {
          const x=pos.getX(i), y=pos.getY(i);
          pos.setZ(i,Math.sin(x*.28+t*1.25)*.1+Math.cos(y*.5+t)*.07+Math.sin(x*.07-y*.05+t*.4)*.16);
        }
        pos.needsUpdate=true;
        surface.geometry.computeVertexNormals();
      }
      const flow=Math.cos(t*.06);
      waveBands.forEach((wave,i)=>{
        wave.position.x=Math.sin(t*.32+wave.userData.phase)*.55;
        wave.position.z=72-((t*2.6+i*7.4)%111);
        wave.position.y=seaLevel+.16;
        const reachedShore=clamp((wave.position.z+28+tideShift)/9,0,1);
        wave.material.opacity=(.13+.19*Math.abs(Math.sin(t*.55+i*.4)))*reachedShore;
      });
      surfLines.forEach((surf,i)=>{
        const swash=.5+.5*Math.sin(t*.85-surf.userData.phase);
        surf.position.y=seaLevel+.12;
        surf.position.z=-tideShift-swash*1.6-surf.userData.lag;
        surf.material.opacity=.25+.5*swash;
      });
      mixers.forEach((foam,i)=>{
        const {anchor,phase,reach}=foam.userData;
        const swash=.5+.5*Math.sin(t*.85+phase);
        foam.position.x=anchor+Math.sin(t*.3+phase)*1.1;
        foam.position.z=shoreLine(anchor)-tideShift-swash*reach+.5;
        foam.position.y=seaLevel+.07;
        foam.material.opacity=(.12+.5*swash)*(.55+.45*Math.abs(flow));
      });
      turbineRotors.forEach((r,i)=>r.rotation.z-=dt*Math.abs(flow)*(2.5+i*.06)*Math.sign(flow||1));
      buoys.forEach(buoy=>{
        const bob=Math.sin(t*1.15+buoy.userData.phase);
        buoy.position.y=seaLevel-.18+bob*.12;
        buoy.rotation.z=bob*.09;
        buoy.rotation.x=Math.cos(t*.95+buoy.userData.phase)*.07;
      });
      powerWaves.forEach((electricWave,i)=>{
        const path=electricWave.userData.path;
        const progress=(t*electricWave.userData.speed+electricWave.userData.offset)%1;
        electricWave.position.copy(path.getPointAt(progress));
        const tangent=path.getTangentAt(progress).normalize();
        electricWave.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),tangent);
        const flare=electricWave.userData.baseScale*(.88+.18*Math.sin(t*5+i));
        electricWave.scale.setScalar(flare);
        electricWave.material.opacity=.68+.28*Math.sin(progress*Math.PI);
      });
      const villageGlow=clamp((.22-daylight)/.22,0,1)*4.5;
      villageLights.forEach(window=>window.material.emissiveIntensity=villageGlow);
      houseNightLights.forEach(light=>light.intensity=villageGlow*.42);
      birds.forEach((b,i)=>{
        const u=t*b.userData.speed+b.userData.phase;
        b.position.set(Math.cos(u)*b.userData.radius+3,b.userData.height+Math.sin(u*2)*1.1,Math.sin(u)*b.userData.radius);
        b.rotation.y=-u; b.scale.y=.75+Math.sin(t*5+i)*.2;
      });
      grazers.forEach((g,i)=>{
        const u=t*g.userData.speed+g.userData.phase;
        const radius=g.userData.radius;
        g.position.x=g.userData.home.x+Math.cos(u)*radius;
        g.position.z=g.userData.home.z+Math.sin(u*.82)*radius*.62;
        const dx=-Math.sin(u)*radius;
        const dz=Math.cos(u*.82)*radius*.508;
        g.rotation.y=Math.atan2(-dz,dx);
        const graze=.5+.5*Math.sin(t*.9+g.userData.phase);
        g.userData.head.rotation.z=-.08-graze*.52;
        g.userData.tail.rotation.z=Math.sin(t*2.2+i)*.22;
        g.userData.legs.forEach((leg,j)=>leg.rotation.z=Math.sin(t*1.7+i+j*Math.PI)*.07);
      });
      treeCanopies.forEach((c,i)=>{c.rotation.z=Math.sin(t*.5+i)*.018;});

      if(touring){
        const segmentDuration=10;
        const phase=tourTime/segmentDuration;
        const index=Math.floor(phase)%tourStops.length;
        const nextIndex=(index+1)%tourStops.length;
        const local=phase-Math.floor(phase);
        const move=THREE.MathUtils.smoothstep(clamp((local-.22)/.56,0,1),0,1);
        camera.position.lerpVectors(tourStops[index].position,tourStops[nextIndex].position,move);
        cameraTarget.lerpVectors(tourStops[index].target,tourStops[nextIndex].target,move);
        controls.target.copy(cameraTarget);
        camera.lookAt(controls.target);
      }
      controls.enabled=!touring;
      controls.update();
      const submerged=camera.position.y<seaLevel-.12;
      const glitterX=sunDisc.position.x-camera.position.x;
      const glitterZ=sunDisc.position.z-camera.position.z;
      const glitterLength=Math.hypot(glitterX,glitterZ)||1;
      const glitterDX=glitterX/glitterLength, glitterDZ=glitterZ/glitterLength;
      sunGlitter.position.set(
        camera.position.x+glitterDX*36,
        seaLevel+.07,
        camera.position.z+glitterDZ*36
      );
      sunGlitter.rotation.y=Math.atan2(-glitterDX,-glitterDZ);
      sunGlitter.material.opacity=submerged?0:clamp(1-Math.abs(sun.position.y)/20,0,1)*.5;
      if(submerged) {
        underwaterTint.setHSL(.51,.62,.1+daylight*.24);
        scene.background.lerp(underwaterTint,.92);
        scene.fog.color.copy(scene.background);
        scene.fog.density=.016;
      } else {
        scene.fog.density=.0072;
      }
      renderer.render(scene,camera);
    }

    function onResize() {
      const w=innerWidth,h=innerHeight;
      camera.aspect=w/h; camera.updateProjectionMatrix();
      renderer.setSize(w,h,false);
      renderer.setPixelRatio(Math.min(devicePixelRatio,w<700?1.45:1.8));
    }

    function init() {
      renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.05;
      renderer.shadowMap.enabled=true;
      renderer.shadowMap.type=THREE.PCFSoftShadowMap;
      scene=new THREE.Scene();
      scene.background=new THREE.Color(0x94bbc5);
      scene.fog=new THREE.FogExp2(0x94bbc5,.0072);
      camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,260);
      camera.position.set(54,34,54);
      controls=new OrbitControls(camera,canvas);
      controls.enableDamping=true; controls.dampingFactor=.055;
      controls.minDistance=10; controls.maxDistance=100;
      controls.maxPolarAngle=Math.PI*.62;
      controls.target.set(0,-1,4);
      clock=new THREE.Clock();
      makeLights(); makeTerrain(); makeShoreDetail(); makeWater(); makeTidalFarm(); makeVillage();
      makeVegetation(); makeAnimals(); makePowerLine(); setupUI(); onResize();
      addEventListener("resize",onResize,{passive:true});
      loading.classList.add("done");
      animate();
    }

    try { init(); } catch(error) {
      console.error(error);
      loading.classList.add("done");
      fatal.style.display="grid";
    }
  </script>
</body>
