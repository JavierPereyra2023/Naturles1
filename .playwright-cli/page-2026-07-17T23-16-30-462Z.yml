        - math [ref=f3e370]:
          - generic [ref=f3e371]:
            - generic [ref=f3e372]: E
            - generic [ref=f3e373]: m
          - generic [ref=f3e374]: =
          - generic [ref=f3e375]:
            - generic [ref=f3e376]: E
            - generic [ref=f3e377]: c
          - generic [ref=f3e378]: +
          - generic [ref=f3e379]:
            - generic [ref=f3e380]: E
            - generic [ref=f3e381]: p
      - generic [ref=f3e382]:
        - generic [ref=f3e383]: Idea clave
        - paragraph [ref=f3e384]: En un sistema ideal sin rozamiento, la energía mecánica se conserva. En la práctica, siempre hay algo de fricción que convierte parte de la energía en calor.
      - paragraph [ref=f3e385]:
        - text: En un sistema ideal sin rozamiento,
        - strong [ref=f3e386]: la energía mecánica total se conserva
        - text: . Esto significa que la energía cinética y la potencial pueden intercambiarse, pero la suma de ambas permanece constante.
      - paragraph [ref=f3e387]:
        - strong [ref=f3e388]: "Ejemplo: la montaña rusa."
        - text: "En la cima de la subida, el carrito tiene mucha energía potencial y poca cinética (está casi detenido). A medida que baja, la energía potencial se transforma en cinética y el carrito acelera. En el punto más bajo, la velocidad es máxima y la altura es mínima: casi toda la energía es cinética."
      - paragraph [ref=f3e389]:
        - text: Este intercambio entre E
        - subscript [ref=f3e390]: c
        - text: y E
        - subscript [ref=f3e391]: p
        - text: se repite en cada subida y bajada. Si no hubiera rozamiento, el carrito subiría y bajaría eternamente. En la realidad, la fricción convierte parte de la energía mecánica en calor, por eso la montaña rusa necesita un motor que empuje el carrito al inicio.
    - generic [ref=f3e395]:
      - generic [ref=f3e396]:
        - generic [ref=f3e397]: "4"
        - heading "Otras formas de energía" [level=2] [ref=f3e398]
      - paragraph [ref=f3e399]: Además de la cinética, la potencial y la mecánica, la energía se manifiesta de muchas otras formas. Acá te presentamos las más importantes.
      - generic [ref=f3e400]:
        - generic [ref=f3e401]:
          - heading "Energía Térmica" [level=3] [ref=f3e403]
          - paragraph [ref=f3e404]:
            - text: Es la energía asociada al
            - strong [ref=f3e405]: movimiento desordenado de las partículas
            - text: (átomos y moléculas) que componen un cuerpo. Cuanto mayor es la temperatura de un objeto, más rápido vibran o se mueven sus partículas y mayor es su energía térmica. Cuando tocamos algo caliente, sentimos esa energía transferirse a nuestra piel.
        - generic [ref=f3e406]:
          - heading "Energía Química" [level=3] [ref=f3e408]
          - paragraph [ref=f3e409]:
            - text: Es la energía
            - strong [ref=f3e410]: almacenada en los enlaces químicos
            - text: que unen a los átomos dentro de las moléculas. Está presente en los alimentos que comemos, en las pilas y baterías, en los combustibles como la nafta y el gas, y en la leña que se quema. Cuando ocurre una reacción química, parte de esa energía se libera.
        - generic [ref=f3e411]:
          - heading "Energía Eléctrica" [level=3] [ref=f3e415]
          - paragraph [ref=f3e416]:
            - text: Es la energía asociada al
            - strong [ref=f3e417]: movimiento de cargas eléctricas
            - text: "(electrones) a través de un conductor, como un cable de cobre. Es la forma de energía que más usamos en la vida cotidiana: alimenta las luces, los electrodomésticos, las computadoras y los celulares."
        - generic [ref=f3e418]:
          - heading "Energía Nuclear" [level=3] [ref=f3e420]
          - paragraph [ref=f3e421]:
            - text: Es la energía
            - strong [ref=f3e422]: almacenada en el núcleo de los átomos
            - text: . Se libera cuando los núcleos atómicos se dividen (fisión) o se unen (fusión). Es la energía que alimenta al Sol y a las estrellas, y la que se aprovecha en las centrales nucleares para generar electricidad.
        - generic [ref=f3e423]:
          - heading "Energía Radiante" [level=3] [ref=f3e425]
          - paragraph [ref=f3e426]:
            - text: Es la energía transportada por las
            - strong [ref=f3e427]: ondas electromagnéticas
            - text: ", como la luz visible, los rayos X, las microondas y las ondas de radio. La luz solar es la principal fuente de energía radiante que recibe la Tierra y es la base de casi toda la vida en el planeta."
    - generic [ref=f3e428]:
      - generic [ref=f3e429]: Sabías que...
      - paragraph [ref=f3e430]: "Un rayo puede liberar hasta 5 gigajoules de energía: suficiente para abastecer el consumo eléctrico de una casa promedio durante un mes entero."
    - generic [ref=f3e434]:
      - generic [ref=f3e435]:
        - generic [ref=f3e436]: "5"
        - heading "Preguntas para pensar" [level=2] [ref=f3e437]
      - paragraph [ref=f3e438]: Reflexioná sobre lo aprendido y respondé en tu carpeta.
      - generic [ref=f3e439]:
        - generic [ref=f3e441]:
          - generic [ref=f3e442]: "1."
          - generic [ref=f3e443]:
            - paragraph [ref=f3e444]: ¿Qué tipo de energía tiene un arquero justo antes de soltar la flecha? ¿Y la flecha en pleno vuelo?
            - paragraph [ref=f3e445]: Antes de soltar, el arco tensado almacena energía potencial elástica. Al soltar, esa energía se transforma en cinética de la flecha. Durante el vuelo, la flecha posee energía cinética y también una pequeña cantidad de potencial gravitatoria porque está a cierta altura del suelo.
        - generic [ref=f3e447]:
          - generic [ref=f3e448]: "2."
          - generic [ref=f3e449]:
            - paragraph [ref=f3e450]: ¿Por qué un martillo puede clavar un clavo pero tu mano no, aunque apliques la misma fuerza?
            - paragraph [ref=f3e451]: El martillo tiene masa y se mueve a cierta velocidad, por lo tanto posee energía cinética. Cuando golpea el clavo, esa energía se concentra en un área muy pequeña (la cabeza del clavo) y se transfiere al clavo, que penetra la madera. La mano no acumula la misma energía cinética porque se mueve más lento y tiene menos masa concentrada.
        - generic [ref=f3e453]:
          - generic [ref=f3e454]: "3."
          - generic [ref=f3e455]:
            - paragraph [ref=f3e456]: Si la Luna tiene menos gravedad que la Tierra, ¿un objeto a 10 m de altura en la Luna tiene más o menos energía potencial que en la Tierra?
            - paragraph [ref=f3e457]:
              - text: Tiene
              - strong [ref=f3e458]: menos
              - text: "energía potencial, porque la aceleración de la gravedad en la Luna es aproximadamente 1,6 m/s² (seis veces menor que en la Tierra). Con la misma masa y altura, la energía potencial es proporcional a g: E"
              - subscript [ref=f3e459]: p
              - text: = m × g × h. Si g es menor, E
              - subscript [ref=f3e460]: p
              - text: también lo es.
        - generic [ref=f3e462]:
          - generic [ref=f3e463]: "4."
          - generic [ref=f3e464]:
            - paragraph [ref=f3e465]: Nombra dos objetos de tu vida cotidiana que posean energía química y dos que posean energía eléctrica.
            - paragraph [ref=f3e466]: "Energía química: una pila, una barra de cereal. Energía eléctrica: un cargador enchufado, el cable de una lamparita conectada a la corriente. ¡Buscá tus propios ejemplos!"
