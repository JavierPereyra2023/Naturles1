        - generic [ref=f3e101]: Dato curioso
        - paragraph [ref=f3e102]: Una pelota de tenis sacada a 200 km/h tiene menos energía cinética que un camión a 5 km/h, porque la masa influye mucho más. ¡La masa de un camión puede ser 35000 veces mayor!
