    - generic [ref=f3e337]:
      - generic [ref=f3e338]:
        - generic [ref=f3e339]: "3"
        - heading "Energía Mecánica" [level=2] [ref=f3e340]
      - paragraph [ref=f3e342]:
        - text: La
        - strong [ref=f3e343]: energía mecánica
        - text: de un cuerpo es la suma de su energía cinética y su energía potencial. Es una de las formas más importantes para estudiar el movimiento de los objetos.
      - generic [ref=f3e345]:
        - generic [ref=f3e346]:
          - generic [ref=f3e347]:
