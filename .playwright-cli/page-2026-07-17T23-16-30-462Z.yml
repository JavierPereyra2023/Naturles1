    - heading "Formas de Energía" [level=1] [ref=f3e35]
    - paragraph [ref=f3e36]: La energía se presenta de muchas maneras en la naturaleza. Conocer sus formas nos ayuda a entender cómo funciona el universo, desde una pelota que cae hasta la luz de una estrella.
