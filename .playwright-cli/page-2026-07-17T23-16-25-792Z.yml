    - generic [ref=f8e149]:
      - heading "Mezclas heterogéneas" [level=2] [ref=f8e150]
      - paragraph [ref=f8e157]: "Se distinguen sus componentes a simple vista o con lupa. La composición no es uniforme: si tomamos muestras de distintas partes de la mezcla, su composición puede variar."
      - generic [ref=f8e158]:
        - generic [ref=f8e159]: Dato curioso
        - text: La leche es un coloide. Las partículas de grasa están dispersas en agua. Si la dejás reposar, la crema sube. Es una mezcla heterogénea aunque a simple vista parezca uniforme.
      - generic [ref=f8e160]:
        - generic [ref=f8e161]:
          - heading "Ejemplos" [level=4] [ref=f8e162]
          - list [ref=f8e163]:
            - listitem [ref=f8e164]:
              - generic [ref=f8e169]:
                - strong [ref=f8e170]: Arena y agua
                - text: ": la arena se deposita en el fondo."
            - listitem [ref=f8e171]:
              - generic [ref=f8e176]:
                - strong [ref=f8e177]: Ensalada
                - text: ": podemos distinguir cada ingrediente."
            - listitem [ref=f8e178]:
              - generic [ref=f8e183]:
                - strong [ref=f8e184]: Granito
                - text: ": mezcla sólida de cuarzo, feldespato y mica."
            - listitem [ref=f8e185]:
              - generic [ref=f8e190]:
                - strong [ref=f8e191]: Agua y aceite
                - text: ": dos líquidos que no se mezclan."
        - generic [ref=f8e192]:
          - heading "Suspensiones y coloides" [level=4] [ref=f8e193]
          - paragraph [ref=f8e194]: "Dentro de las mezclas heterogéneas encontramos dos tipos importantes:"
          - list [ref=f8e195]:
            - listitem [ref=f8e196]:
              - generic [ref=f8e200]:
                - strong [ref=f8e201]: Suspensiones
                - text: ": partículas sólidas visibles dispersas en un líquido que sedimentan con el tiempo. Ej: agua barrosa."
            - listitem [ref=f8e202]:
              - generic [ref=f8e206]:
                - strong [ref=f8e207]: Coloides
                - text: ": partículas muy pequeñas dispersas que no sedimentan. Ej: leche, gelatina, humo."
    - generic [ref=f8e208]:
      - heading "Efecto Tyndall" [level=2] [ref=f8e209]
      - paragraph [ref=f8e212]:
        - text: Un haz de luz que atraviesa un
        - strong [ref=f8e213]: coloide
        - text: o una
        - strong [ref=f8e214]: suspensión
        - text: se hace visible porque las partículas dispersan la luz. En una
        - strong [ref=f8e215]: solución verdadera
        - text: ", el haz de luz no se ve porque las partículas de soluto son demasiado pequeñas para dispersar la luz. Este fenómeno permite distinguir soluciones de coloides."
      - 'figure "Ilustración: Efecto Tyndall — Dispersión de luz en coloides El humo es un coloide: partículas sólidas dispersas en un gas." [ref=f8e216]':
