  - main [ref=f8e41]:
    - generic [ref=f8e42]:
      - heading "¿Qué son las mezclas?" [level=2] [ref=f8e43]
      - paragraph [ref=f8e46]:
        - text: En la naturaleza, casi nada es una sustancia pura. La mayoría de lo que nos rodea son
        - strong [ref=f8e47]: mezclas
        - text: . Cada componente conserva sus propiedades. A diferencia de las sustancias compuestas, las mezclas se pueden separar por métodos físicos.
      - generic [ref=f8e48]: «Una mezcla es la combinación física de dos o más sustancias. Cada componente conserva sus propiedades y puede separarse por métodos físicos.»
      - paragraph [ref=f8e49]:
        - text: Cuando mezclamos azúcar con agua, el azúcar sigue siendo azúcar (sigue teniendo sabor dulce) y el agua sigue siendo agua. No se ha formado ninguna sustancia nueva. Si evaporamos el agua, recuperamos el azúcar. Esto es lo que diferencia una
        - strong [ref=f8e50]: mezcla
        - text: de una
        - strong [ref=f8e51]: combinación química
        - text: ": en esta última sí se producen nuevas sustancias con propiedades diferentes."
      - 'figure "Ilustración: Mezcla de dos sustancias — cada una conserva sus propiedades." [ref=f8e52]':
        - 'img "Ilustración: Mezcla de dos sustancias — cada una conserva sus propiedades." [ref=f8e53]'
    - generic [ref=f8e55]:
      - heading "Mezclas homogéneas" [level=2] [ref=f8e56]
      - paragraph [ref=f8e61]:
        - text: También llamadas
        - strong [ref=f8e62]: soluciones
        - text: ". No se distinguen sus componentes a simple vista. Tienen una apariencia uniforme en toda su extensión: cualquier porción que tomemos tendrá la misma composición."
      - generic [ref=f8e63]:
        - generic [ref=f8e64]:
