  - generic [ref=f6e29]:
    - generic [ref=f6e30]: Química · Materia
    - heading "Sustancias" [level=1] [ref=f6e33]
    - paragraph [ref=f6e34]: Simples y compuestas. La tabla periódica, los elementos químicos y cómo se representan mediante fórmulas.
  - main [ref=f6e35]:
    - generic [ref=f6e36]:
      - heading "Sustancias simples" [level=2] [ref=f6e37]
      - generic [ref=f6e43]:
        - generic [ref=f6e44]: Dato clave
        - text: De los 118 elementos conocidos, la mayoría se encuentra en la naturaleza y otros fueron sintetizados en laboratorio. El oxígeno es el elemento más abundante en la corteza terrestre.
      - paragraph [ref=f6e45]:
        - text: Una
        - strong [ref=f6e46]: sustancia simple
        - text: está formada por un solo tipo de átomo. También se llaman
        - strong [ref=f6e47]: elementos químicos
        - text: . No se pueden descomponer en sustancias más simples por métodos químicos comunes. Cada elemento tiene un nombre y un
        - strong [ref=f6e48]: símbolo químico
        - text: (una o dos letras, la primera siempre mayúscula).
      - paragraph [ref=f6e49]: "Algunos elementos se presentan como átomos individuales (ej: el helio, He) y otros forman moléculas con átomos del mismo elemento (ej: el oxígeno del aire es O2, dos átomos de oxígeno unidos)."
      - table [ref=f6e51]:
        - rowgroup [ref=f6e52]:
          - row [ref=f6e53]:
            - columnheader "Elemento" [ref=f6e54]
            - columnheader "Símbolo" [ref=f6e55]
            - columnheader "Ejemplo de uso / Dónde se encuentra" [ref=f6e56]
        - rowgroup [ref=f6e57]:
          - row [ref=f6e58]:
            - cell "Oxígeno" [ref=f6e59]
            - cell "O (como O2)" [ref=f6e60]
            - cell "Respiración, combustión. 21% del aire." [ref=f6e61]
          - row [ref=f6e62]:
            - cell "Hierro" [ref=f6e63]
            - cell "Fe" [ref=f6e64]
            - cell "Construcción, herramientas, hemoglobina en sangre." [ref=f6e65]
          - row [ref=f6e66]:
            - cell "Oro" [ref=f6e67]
            - cell "Au" [ref=f6e68]
            - cell "Joyería, electrónica. No se oxida." [ref=f6e69]
          - row [ref=f6e70]:
            - cell "Carbono" [ref=f6e71]
            - cell "C" [ref=f6e72]
            - cell "Base de la vida. Diamante, grafito, carbono orgánico." [ref=f6e73]
          - row [ref=f6e74]:
            - cell "Aluminio" [ref=f6e75]
            - cell "Al" [ref=f6e76]
            - cell "Latas, aviones, papel aluminio. Liviano y resistente." [ref=f6e77]
          - row [ref=f6e78]:
            - cell "Nitrógeno" [ref=f6e79]
            - cell "N (como N2)" [ref=f6e80]
            - cell "78% del aire. Fertilizantes." [ref=f6e81]
          - row [ref=f6e82]:
            - cell "Mercurio" [ref=f6e83]
            - cell "Hg" [ref=f6e84]
            - cell "Único metal líquido a temperatura ambiente." [ref=f6e85]
      - 'figure "Ilustración: Tabla periódica de los elementos. Organiza los 118 elementos conocidos por número atómico creciente. Las columnas (grupos) comparten propiedades químicas." [ref=f6e86]':
        - 'img "Ilustración: Tabla periódica de los elementos. Organiza los 118 elementos conocidos por número atómico creciente. Las co"'
      - generic [ref=f6e88]: "\"La tabla periódica es como el mapa de un tesoro para los químicos. Cada elemento tiene su lugar y sus propiedades están relacionadas con su posición.\""
    - generic [ref=f6e89]:
      - heading "Sustancias compuestas" [level=2] [ref=f6e90]
      - paragraph [ref=f6e93]:
        - text: Una
        - strong [ref=f6e94]: sustancia compuesta
        - text: (o compuesto químico) está formada por
        - strong [ref=f6e95]: dos o más elementos diferentes
        - text: unidos químicamente en proporciones fijas. Los compuestos tienen propiedades distintas a las de los elementos que los forman.
      - generic [ref=f6e96]:
        - generic [ref=f6e97]:
          - heading "Agua (H2O)" [level=4] [ref=f6e98]
          - paragraph [ref=f6e99]: Dos átomos de hidrógeno + uno de oxígeno. Es líquida a temperatura ambiente, aunque el hidrógeno y el oxígeno son gases. Esencial para la vida.
        - generic [ref=f6e100]:
          - heading "Dióxido de carbono (CO2)" [level=4] [ref=f6e101]
          - paragraph [ref=f6e102]: Un átomo de carbono + dos de oxígeno. Las plantas lo usan para la fotosíntesis. Lo exhalamos al respirar. Gas de efecto invernadero.
        - generic [ref=f6e103]:
          - heading "Sal de mesa (NaCl)" [level=4] [ref=f6e104]
          - paragraph [ref=f6e105]: Sodio (un metal muy reactivo) + cloro (un gas tóxico). Juntos forman un compuesto estable, de uso alimentario en cantidades adecuadas y necesario para funciones del organismo.
        - generic [ref=f6e106]:
          - heading "Glucosa (C6H12O6)" [level=4] [ref=f6e107]
          - paragraph [ref=f6e108]: Seis carbonos + doce hidrógenos + seis oxígenos. Es el azúcar que usan las células como fuente de energía.
    - generic [ref=f6e109]:
      - heading "Diferencia con las mezclas" [level=2] [ref=f6e110]
      - paragraph [ref=f6e116]:
        - text: Es importante no confundir
        - strong [ref=f6e117]: sustancias
        - text: con
        - strong [ref=f6e118]: mezclas
        - text: ". Las diferencias principales son:"
      - table [ref=f6e120]:
        - rowgroup [ref=f6e121]:
          - row [ref=f6e122]:
            - columnheader "Característica" [ref=f6e123]
            - columnheader "Sustancia pura" [ref=f6e124]
            - columnheader "Mezcla" [ref=f6e125]
        - rowgroup [ref=f6e126]:
          - row [ref=f6e127]:
            - cell "Composición" [ref=f6e128]
            - cell "Fija y definida" [ref=f6e129]
            - cell "Variable (depende de las cantidades)" [ref=f6e130]
          - row [ref=f6e131]:
            - cell "Separación" [ref=f6e132]
            - cell "Solo por métodos químicos (electrólisis, descomposición)" [ref=f6e133]
            - cell "Por métodos físicos (filtración, decantación, evaporación)" [ref=f6e134]
          - row [ref=f6e135]:
            - cell "Propiedades" [ref=f6e136]
            - cell "Constantes (punto de fusión y ebullición fijos)" [ref=f6e137]
            - cell "Variables (dependen de la proporción)" [ref=f6e138]
          - row [ref=f6e139]:
            - cell "Ejemplos" [ref=f6e140]
            - cell "Agua destilada, oxígeno, sal pura, azúcar" [ref=f6e141]
            - cell "Agua de mar, aire, ensalada, granito" [ref=f6e142]
      - paragraph [ref=f6e143]:
        - text: El aire que respiramos es una
        - strong [ref=f6e144]: mezcla
        - text: de gases (nitrógeno, oxígeno, dióxido de carbono y otros), no una sustancia pura. El agua de mar es una mezcla de agua y sales. En cambio, el agua destilada (H2O pura) sí es una sustancia compuesta.
