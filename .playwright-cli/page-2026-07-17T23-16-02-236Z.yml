      - paragraph [ref=f6e234]:
        - text: En una fórmula química, los
        - strong [ref=f6e235]: subíndices
        - text: "indican cuántos átomos de cada elemento hay. Por ejemplo:"
      - list [ref=f6e236]:
        - listitem [ref=f6e237]:
          - generic [ref=f6e240]:
            - strong [ref=f6e241]: H2O
            - text: ": 2 átomos de hidrógeno (H) y 1 átomo de oxígeno (O). Cuando no hay subíndice, se sobreentiende que es 1."
        - listitem [ref=f6e242]:
          - generic [ref=f6e245]:
            - strong [ref=f6e246]: CO2
            - text: ": 1 átomo de carbono (C) y 2 átomos de oxígeno (O)."
        - listitem [ref=f6e247]:
          - generic [ref=f6e250]:
            - strong [ref=f6e251]: C6H12O6
            - text: ": 6 átomos de carbono, 12 de hidrógeno y 6 de oxígeno. Es la fórmula de la glucosa."
        - listitem [ref=f6e252]:
          - generic [ref=f6e255]:
            - strong [ref=f6e256]: H2SO4
            - text: ": 2 hidrógenos, 1 azufre (S) y 4 oxígenos. Es el ácido sulfúrico."
      - generic [ref=f6e257]:
        - heading "¿Cómo se leen las fórmulas?" [level=4] [ref=f6e258]
        - generic [ref=f6e259]:
          - generic [ref=f6e260]:
            - text: H2O
            - paragraph [ref=f6e261]: Se lee "hache-dos-o". Dos átomos de hidrógeno y uno de oxígeno.
          - generic [ref=f6e262]:
            - text: NaCl
            - paragraph [ref=f6e263]: Cloruro de sodio. Un átomo de sodio (Na) y uno de cloro (Cl).
          - generic [ref=f6e264]:
            - text: Fe2O3
            - paragraph [ref=f6e265]: Óxido de hierro (III). Dos átomos de hierro (Fe) y tres de oxígeno.
          - generic [ref=f6e266]:
            - text: CH4
            - paragraph [ref=f6e267]: Metano. Un átomo de carbono y cuatro de hidrógeno.
    - generic [ref=f6e268]:
      - heading "Preguntas para pensar" [level=2] [ref=f6e269]
      - generic [ref=f6e278]:
        - paragraph [ref=f6e279]: 1.¿Cuál es la diferencia entre una sustancia simple y una compuesta? Da dos ejemplos de cada una.
        - paragraph [ref=f6e280]: 2.¿Por qué el agua de mar no es una sustancia pura? ¿Cómo podrías obtener agua pura a partir de ella?
        - paragraph [ref=f6e281]: 3.Escribí la fórmula química del dióxido de carbono y explicá qué significa cada parte.
        - paragraph [ref=f6e282]: 4.El sodio (Na) es un metal que reacciona violentamente con el agua y el cloro (Cl) es un gas venenoso. Sin embargo, juntos forman la sal de mesa (NaCl) que consumimos a diario. ¿Qué nos enseña esto sobre los compuestos químicos?
