  - generic [ref=f10e31]:
    - generic [ref=f10e32]: Química · Mezclas
    - heading "Mezclas en la Naturaleza" [level=1] [ref=f10e35]
    - paragraph [ref=f10e36]: El planeta está hecho de mezclas. Desde el aire que respiramos hasta el suelo que pisamos.
    - generic [ref=f10e37]:
      - generic [ref=f10e38]: Aire
      - generic [ref=f10e39]: Agua de mar
      - generic [ref=f10e40]: Suelo
  - main [ref=f10e41]:
    - generic [ref=f10e42]:
      - heading "Mezclas que nos rodean" [level=2] [ref=f10e43]
      - paragraph [ref=f10e48]: "No necesitamos un laboratorio para encontrar mezclas: vivimos rodeados de ellas. Respirás una mezcla, bebés una mezcla, pisás una mezcla. El aire, el agua de los océanos, el suelo del jardín y hasta los alimentos que comemos son mezclas de distintas sustancias combinadas físicamente."
    - generic [ref=f10e49]:
      - heading "El aire" [level=2] [ref=f10e50]
      - paragraph [ref=f10e53]:
        - text: El aire es una
        - strong [ref=f10e54]: mezcla homogénea de gases
        - text: ". Sin el aire no habría vida. Sus componentes principales:"
      - generic [ref=f10e55]:
        - generic [ref=f10e56]:
          - generic [ref=f10e57]: 78%
          - text: Nitrógeno (N2)
        - generic [ref=f10e58]:
          - generic [ref=f10e59]: 21%
          - text: Oxígeno (O2)
        - generic [ref=f10e60]:
          - generic [ref=f10e61]: 0.93%
          - text: Argón (Ar)
        - generic [ref=f10e62]:
          - generic [ref=f10e63]: 0.04%
          - text: CO2 y otros
      - paragraph [ref=f10e64]: También contiene vapor de agua en proporción variable (humedad) y otros gases en cantidades muy pequeñas. Es una solución gaseosa que hace posible la vida.
    - generic [ref=f10e65]:
      - heading "El agua de mar" [level=2] [ref=f10e66]
      - generic [ref=f10e69]:
        - generic [ref=f10e70]: Dato clave
        - text: Si evaporamos 1 litro de agua de mar, quedan aproximadamente
        - strong [ref=f10e71]: 35 g de sal
        - text: ". Es una de las mezclas más abundantes del planeta: cubre el 71% de la superficie terrestre."
      - paragraph [ref=f10e72]:
        - text: El agua de mar es una
        - strong [ref=f10e73]: solución acuosa
        - text: . Contiene aproximadamente
        - strong [ref=f10e74]: 3.5% de sales disueltas
        - text: ". Su principal soluto es el cloruro de sodio (NaCl, sal común), pero contiene muchos otros iones disueltos:"
      - list [ref=f10e75]:
        - listitem [ref=f10e76]:
          - generic [ref=f10e81]: Cloruro (Cl?) — 55% de las sales
        - listitem [ref=f10e82]:
          - generic [ref=f10e87]: Sodio (Na?) — 30% de las sales
        - listitem [ref=f10e88]:
          - generic [ref=f10e93]: Sulfato (SO4²?), Magnesio (Mg²?), Calcio (Ca²?), Potasio (K?)
    - generic [ref=f10e94]:
      - heading "El suelo" [level=2] [ref=f10e95]
      - paragraph [ref=f10e98]:
        - text: El suelo es una de las mezclas más complejas de la naturaleza. Es una
        - strong [ref=f10e99]: mezcla heterogénea
        - text: donde conviven componentes sólidos, líquidos y gaseosos. Cada suelo es único.
      - generic [ref=f10e100]:
        - generic [ref=f10e101]:
          - heading "Componentes del suelo" [level=4] [ref=f10e102]
          - list [ref=f10e103]:
            - listitem [ref=f10e104]:
              - generic [ref=f10e107]:
                - strong [ref=f10e108]: Minerales
                - text: "(arena, limo, arcilla): fragmentos de rocas."
            - listitem [ref=f10e109]:
              - generic [ref=f10e114]:
                - strong [ref=f10e115]: Materia orgánica
                - text: "(humus): restos de seres vivos."
            - listitem [ref=f10e116]:
              - generic [ref=f10e121]:
                - strong [ref=f10e122]: Agua
                - text: ": con sales minerales disueltas."
            - listitem [ref=f10e123]:
              - generic [ref=f10e126]:
                - strong [ref=f10e127]: Aire
                - text: ": en los poros del suelo."
            - listitem [ref=f10e128]:
              - generic [ref=f10e131]:
                - strong [ref=f10e132]: Microorganismos
                - text: ": bacterias, hongos."
        - generic [ref=f10e133]:
          - 'figure "Perfil del suelo — Horizontes. Capas: O (orgánica), A (superficial), B (subsuelo), C (roca madre)." [ref=f10e134]':
            - img "Perfil del suelo - Horizontes" [ref=f10e135]
          - paragraph [ref=f10e137]: Una cucharadita de suelo fértil contiene más microorganismos que personas hay en todo el planeta.
    - generic [ref=f10e138]:
      - heading "El petróleo" [level=2] [ref=f10e139]
      - paragraph [ref=f10e142]:
        - text: El petróleo es una
        - strong [ref=f10e143]: mezcla líquida compleja
        - text: formada por cientos de hidrocarburos diferentes (compuestos de carbono e hidrógeno). Se formó hace millones de años a partir de restos de organismos marinos sepultados bajo capas de roca, sometidos a alta presión y temperatura.
      - generic [ref=f10e144]:
        - heading "Destilación fraccionada del petróleo" [level=4] [ref=f10e145]
        - paragraph [ref=f10e146]:
          - text: Como el petróleo es una mezcla de hidrocarburos con distintos puntos de ebullición, se lo separa por
          - strong [ref=f10e147]: destilación fraccionada
          - text: en una torre. Cada fracción se recoge a distinta altura.
        - table [ref=f10e149]:
          - rowgroup [ref=f10e150]:
            - row [ref=f10e151]:
              - columnheader "Fracción" [ref=f10e152]
              - columnheader "N° de carbonos" [ref=f10e153]
              - columnheader "Punto de ebullición" [ref=f10e154]
              - columnheader "Uso" [ref=f10e155]
          - rowgroup [ref=f10e156]:
            - row [ref=f10e157]:
