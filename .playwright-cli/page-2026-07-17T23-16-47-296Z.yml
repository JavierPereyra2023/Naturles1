              - cell "C5–C10" [ref=f10e164]
              - cell "20–200 °C" [ref=f10e165]
              - cell "Combustible de autos" [ref=f10e166]
            - row [ref=f10e167]:
              - cell "Querosén" [ref=f10e168]
              - cell "C10–C16" [ref=f10e169]
              - cell "175–275 °C" [ref=f10e170]
              - cell "Combustible de aviones" [ref=f10e171]
            - row [ref=f10e172]:
              - cell "Gasoil" [ref=f10e173]
              - cell "C15–C20" [ref=f10e174]
              - cell "250–350 °C" [ref=f10e175]
              - cell "Combustible de camiones" [ref=f10e176]
