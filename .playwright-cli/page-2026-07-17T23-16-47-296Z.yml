              - cell "> C20" [ref=f10e179]
              - cell "> 350 °C" [ref=f10e180]
              - cell "Pavimentación" [ref=f10e181]
      - 'figure "Ilustración: Torre de destilación fraccionada — Refinería de petróleo" [ref=f10e182]':
        - 'img "Ilustración: Torre de destilación fraccionada — Refinería de petróleo" [ref=f10e183]'
    - generic [ref=f10e185]:
      - 'heading "Contaminación: mezclas no deseadas" [level=2] [ref=f10e186]'
      - paragraph [ref=f10e189]: La contaminación es una mezcla de sustancias dañinas en el ambiente. Cuando introducimos materiales extraños en el aire, el agua o el suelo, creamos mezclas que alteran el equilibrio natural y pueden ser perjudiciales para los seres vivos.
      - generic [ref=f10e190]:
        - generic [ref=f10e191]:
          - heading "Smog (contaminación del aire)" [level=3] [ref=f10e192]
          - paragraph [ref=f10e193]: Mezcla de humo (smoke) y niebla (fog) que contiene óxidos de nitrógeno, dióxido de azufre, monóxido de carbono y partículas en suspensión. Se forma principalmente por la quema de combustibles fósiles en vehículos e industrias. Es una mezcla heterogénea de gases y partículas sólidas.
        - generic [ref=f10e194]:
          - heading "Aguas residuales" [level=3] [ref=f10e195]
          - paragraph [ref=f10e196]: "Mezcla de agua con desechos domésticos e industriales: detergentes, aceites, materia orgánica, metales pesados y microorganismos. Cuando llegan a ríos y lagos sin tratar, alteran la composición natural del agua y afectan la vida acuática."
        - generic [ref=f10e197]:
          - heading "Plásticos en el océano" [level=3] [ref=f10e198]
          - paragraph [ref=f10e199]:
            - text: Millones de toneladas de plásticos forman una mezcla heterogénea con el agua de mar. Se degradan en
            - strong [ref=f10e200]: microplásticos
            - text: (partículas menores a 5 mm) que los animales marinos ingieren y entran en la cadena alimentaria.
      - generic [ref=f10e201]: «La contaminación es lo que pasa cuando ponemos sustancias en el lugar equivocado.»
    - generic [ref=f10e202]:
      - heading "Preguntas para pensar" [level=2] [ref=f10e203]
