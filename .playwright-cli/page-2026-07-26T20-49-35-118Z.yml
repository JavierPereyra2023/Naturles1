      - generic [ref=f3e260]:
        - generic [ref=f3e261]:
          - generic [ref=f3e262]: "05"
          - heading "Preguntas para pensar" [level=2] [ref=f3e263]
        - generic [ref=f3e264]:
          - generic [ref=f3e266]:
            - generic [ref=f3e267]: "1."
            - generic [ref=f3e268]:
              - paragraph [ref=f3e269]: ¿Por qué se eligió queroseno y oxígeno líquido como combustible?
              - paragraph [ref=f3e270]:
                - text: Porque es una combinación
                - strong [ref=f3e271]: barata, eficiente y relativamente segura
                - text: . El queroseno (RP-1) es un derivado del petróleo, fácil de conseguir. El oxígeno líquido actúa como comburente. Juntos producen mucha más energía que un combustible sólido, y se pueden apagar y volver a encender los motores.
          - generic [ref=f3e273]:
            - generic [ref=f3e274]: "2."
            - generic [ref=f3e275]:
              - paragraph [ref=f3e276]: ¿Por qué la primera etapa se separa y la segunda no se reutiliza?
              - paragraph [ref=f3e277]:
                - text: La primera etapa es la
                - strong [ref=f3e278]: más cara de recuperar
                - text: porque es la más grande (50 m). La segunda etapa es más chica, pero queda en
                - strong [ref=f3e279]: una órbita tan alta
                - text: que no tiene combustible para volver. En el Falcon 9, recuperar la primera etapa ya ahorra suficiente dinero.
          - generic [ref=f3e281]:
            - generic [ref=f3e282]: "3."
            - generic [ref=f3e283]:
              - paragraph [ref=f3e284]: ¿Qué ventajas tiene lanzar un cohete desde Florida (Cabo Cañaveral)?
              - paragraph [ref=f3e285]:
                - text: Está en una
                - strong [ref=f3e286]: latitud cercana al ecuador
                - text: ", lo que aprovecha mejor la rotación terrestre para ganar velocidad. Además, los cohetes pueden caer al"
                - strong [ref=f3e287]: océano Atlántico
                - text: o al mar sin riesgo para la población.
