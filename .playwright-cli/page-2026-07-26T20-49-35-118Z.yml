    - main [ref=f3e83]:
      - generic [ref=f3e84]:
        - generic [ref=f3e85]:
          - generic [ref=f3e86]: "01"
          - heading "Características técnicas" [level=2] [ref=f3e87]
        - paragraph [ref=f3e89]:
          - text: El
          - strong [ref=f3e90]: Falcon 9
          - text: es un cohete orbital de
          - strong [ref=f3e91]: dos etapas
          - text: fabricado por la empresa estadounidense
          - strong [ref=f3e92]: SpaceX
          - text: (Space Exploration Technologies), fundada por el empresario Elon Musk en 2002. Su nombre viene del
          - strong [ref=f3e93]: "\"Halcón 9\""
          - text: y de los
          - strong [ref=f3e94]: nueve motores Merlin
          - text: que lleva la primera etapa. Desde su primer vuelo en 2010 se convirtió en el cohete más usado del mundo.
        - generic [ref=f3e95]:
          - generic [ref=f3e96]: ¿Qué es SpaceX?
          - paragraph [ref=f3e97]:
            - strong [ref=f3e98]: SpaceX
            - text: es una empresa aeroespacial privada fundada en 2002. Su objetivo declarado es
            - strong [ref=f3e99]: reducir el costo del acceso al espacio
            - text: y hacer posible la colonización de Marte. Diseña, fabrica y lanza sus propios cohetes.
        - heading "Ficha técnica" [level=3] [ref=f3e100]
        - generic [ref=f3e101]:
          - generic [ref=f3e102]:
            - generic [ref=f3e103]: Altura
            - paragraph [ref=f3e105]: 70 m
            - paragraph [ref=f3e106]: Más alto que un rascacielos de 20 pisos
          - generic [ref=f3e107]:
            - generic [ref=f3e108]: Masa al despegue
            - paragraph [ref=f3e110]: 549 t
            - paragraph [ref=f3e111]: 549.000 kg de cohete + combustible
          - generic [ref=f3e112]:
            - generic [ref=f3e113]: Carga útil a órbita baja
            - paragraph [ref=f3e115]: ~22,8 t
            - paragraph [ref=f3e116]: Más de 22.000 kg a 400 km de altura
          - generic [ref=f3e117]:
            - generic [ref=f3e118]: Motores 1ª etapa
            - paragraph [ref=f3e120]: 9 × Merlin 1D
            - paragraph [ref=f3e121]: "Empuje total: 7.600 kN"
          - generic [ref=f3e122]:
            - generic [ref=f3e123]: Motor 2ª etapa
            - paragraph [ref=f3e125]: 1 × Merlin 1D Vacuum
            - paragraph [ref=f3e126]: Optimizado para el vacío
          - generic [ref=f3e127]:
            - generic [ref=f3e128]: Propulsante
            - paragraph [ref=f3e130]: Queroseno RP-1
            - paragraph [ref=f3e131]: + oxígeno líquido (LOX)
        - heading "¿Cómo funciona un cohete de dos etapas?" [level=3] [ref=f3e132]
        - generic [ref=f3e133]:
          - heading "Etapa 1 + Etapa 2" [level=4] [ref=f3e135]
          - paragraph [ref=f3e136]:
            - text: El Falcon 9 se divide en dos partes que se encienden en momentos distintos. La
            - strong [ref=f3e137]: primera etapa
            - text: enciende sus 9 motores Merlin en el despegue y empuja al cohete durante los primeros
            - strong [ref=f3e138]: 2 minutos y 30 segundos
            - text: . Cuando se queda sin combustible, se separa y vuelve a la Tierra. La
            - strong [ref=f3e139]: segunda etapa
            - text: enciende su motor en el vacío y lleva la carga útil hasta la órbita, donde se apaga y queda flotando como basura espacial.
      - generic [ref=f3e141]:
        - generic [ref=f3e142]:
          - generic [ref=f3e143]: "02"
          - 'heading "Reutilización: la revolución" [level=2] [ref=f3e144]'
        - paragraph [ref=f3e146]:
          - text: Tradicionalmente, los cohetes se usaban
          - strong [ref=f3e147]: una sola vez
          - text: ": después de lanzar su carga útil, caían al mar o se destruían en la atmósfera. Eran máquinas de un solo uso, como si cada vuelo en avión implicara tirar el avión a la basura. SpaceX cambió esto radicalmente: la primera etapa del Falcon 9"
          - strong [ref=f3e148]: vuelve a la Tierra
          - text: ", aterriza de pie y se reutiliza en otro vuelo."
        - generic [ref=f3e149]:
          - text: “
          - paragraph [ref=f3e150]: "Reutilizar la primera etapa reduce el costo del lanzamiento hasta en un 70%. Esa es la verdadera innovación del Falcon 9: no fue un cohete más potente, sino un cohete más barato."
        - generic [ref=f3e151]:
          - generic [ref=f3e152]:
            - heading "Volver a la Tierra" [level=3] [ref=f3e154]
            - paragraph [ref=f3e155]:
              - text: Después de separarse, la primera etapa da vuelta con sus propios motores, atraviesa la atmósfera y aterriza de pie sobre una
              - strong [ref=f3e156]: plataforma flotante
              - text: en el océano (llamada "droneship") o sobre tierra firme.
          - generic [ref=f3e157]:
            - heading "El récord de reusos" [level=3] [ref=f3e159]
            - paragraph [ref=f3e160]:
              - text: Algunas primeras etapas ya han volado
              - strong [ref=f3e161]: más de 20 veces
              - text: . El récord actual es del booster
              - strong [ref=f3e162]: B1067
              - text: ", que superó las 30 misiones. Cada reutilización ahorra millones de dólares."
        - paragraph [ref=f3e166]:
          - strong [ref=f3e167]: ¿Por qué fue tan revolucionario?
          - text: Antes del Falcon 9, lanzar un satélite de 1.000 kg al espacio costaba alrededor de
          - strong [ref=f3e168]: 20.000 dólares por kilo
          - text: . Con la reutilización, SpaceX bajó ese costo a
          - strong [ref=f3e169]: menos de 3.000 dólares por kilo
          - text: . Eso volvió accesibles misiones que antes eran prohibitivas.
      - generic [ref=f3e171]:
        - generic [ref=f3e172]:
          - generic [ref=f3e173]: "03"
          - heading "¿Cómo aterriza una primera etapa?" [level=2] [ref=f3e174]
        - paragraph [ref=f3e176]:
          - text: Aterrizar un cohete de
          - strong [ref=f3e177]: 40 metros
          - text: que cae a más de
          - strong [ref=f3e178]: 2.000 km/h
          - text: es un prodigio de ingeniería. La maniobra se llama
          - strong [ref=f3e179]: "\"boostback burn\""
          - text: y dura unos minutos críticos. Cada paso es una maniobra supersónica precisa.
        - generic [ref=f3e180]:
          - generic [ref=f3e181]:
            - generic [ref=f3e182]: Paso 1
            - generic [ref=f3e183]:
              - heading "Separación" [level=4] [ref=f3e184]
              - paragraph [ref=f3e185]:
                - text: A los 2:30 minutos del despegue, la primera etapa se
                - strong [ref=f3e186]: separa de la segunda
                - text: usando pequeños explosivos. Ya ascendió unos 80 km de altura.
          - generic [ref=f3e187]:
            - generic [ref=f3e188]: Paso 2
            - generic [ref=f3e189]:
              - heading "\"Boostback\" (vuelta atrás)" [level=4] [ref=f3e190]
              - paragraph [ref=f3e191]:
                - text: Tres de los nueve motores Merlin se encienden durante
                - strong [ref=f3e192]: unos segundos
                - text: para frenar e invertir la dirección. La etapa cae "hacia atrás" apuntando al punto de aterrizaje.
          - generic [ref=f3e193]:
            - generic [ref=f3e194]: Paso 3
            - generic [ref=f3e195]:
              - heading "Reentrada atmosférica" [level=4] [ref=f3e196]
              - paragraph [ref=f3e197]:
                - text: La etapa entra a la atmósfera a
                - strong [ref=f3e198]: velocidades hipersónicas
                - text: . El rozamiento con el aire la calienta a más de 1.000 °C. Usa sus
                - strong [ref=f3e199]: aletas de rejilla
                - text: (grids fins) para maniobrar como un planeador.
          - generic [ref=f3e200]:
            - generic [ref=f3e201]: Paso 4
            - generic [ref=f3e202]:
              - heading "Aterrizaje" [level=4] [ref=f3e203]
              - paragraph [ref=f3e204]:
                - text: A unos
                - strong [ref=f3e205]: 900 m de altura
                - text: sobre el suelo, enciende el motor central para frenar. A
                - strong [ref=f3e206]: pocos metros del piso
                - text: se enciende el "landing burn" y baja la velocidad a casi cero. Las
                - strong [ref=f3e207]: patas de despliegue
                - text: se abren y se posa suavemente de pie.
        - generic [ref=f3e208]:
          - generic [ref=f3e209]: "\"Of Course I Still Love You\""
          - paragraph [ref=f3e210]:
            - text: Una de las plataformas de aterrizaje flottantes se llama así, en honor al libro de
            - strong [ref=f3e211]: Elusión a la realidad objetiva de Iain M. Banks
            - text: . La otra se llama "Just Read the Instructions". SpaceX les pone nombres literarios a sus droneships.
      - generic [ref=f3e213]:
        - generic [ref=f3e214]:
          - generic [ref=f3e215]: "04"
          - heading "Misiones emblemáticas" [level=2] [ref=f3e216]
        - generic [ref=f3e217]:
          - generic [ref=f3e218]:
            - heading "Crew Dragon" [level=3] [ref=f3e220]
            - paragraph [ref=f3e221]:
              - text: La cápsula donde viajan los astronautas. El Falcon 9 la lleva hasta la
              - strong [ref=f3e222]: Estación Espacial Internacional
              - text: . En 2020 transportó a los primeros astronautas de la NASA en una nave privada.
            - generic [ref=f3e223]:
              - generic [ref=f3e224]: Tripulada
              - generic [ref=f3e225]: NASA
              - generic [ref=f3e226]: ISS
          - generic [ref=f3e227]:
            - heading "Starlink" [level=3] [ref=f3e229]
            - paragraph [ref=f3e230]:
              - text: Constelación de
              - strong [ref=f3e231]: miles de satélites
              - text: que llevan internet a todo el planeta. El Falcon 9 lanza
              - strong [ref=f3e232]: 60 satélites por misión
              - text: y ya se transformó en su cliente más importante.
            - generic [ref=f3e233]:
              - generic [ref=f3e234]: Internet
              - generic [ref=f3e235]: Mega-constelación
          - generic [ref=f3e236]:
            - heading "Satélites de Earth observation" [level=3] [ref=f3e238]
            - paragraph [ref=f3e239]:
              - text: El Falcon 9 ha puesto en órbita satélites de
              - strong [ref=f3e240]: observación terrestre
              - text: ", GPS, comunicaciones y científicos. Entre ellos, los"
              - strong [ref=f3e241]: SAOCOM de la CONAE
              - text: (Argentina).
            - generic [ref=f3e242]:
              - generic [ref=f3e243]: Observación
              - generic [ref=f3e244]: CONAE
          - generic [ref=f3e245]:
            - heading "DM-2 — El vuelo histórico (2020)" [level=3] [ref=f3e252]
            - paragraph [ref=f3e253]:
              - text: El 30 de mayo de 2020, un Falcon 9 llevó a los astronautas
              - strong [ref=f3e254]: Doug Hurley y Bob Behnken
              - text: a la ISS. Fue el
              - strong [ref=f3e255]: primer vuelo tripulado en una nave privada
