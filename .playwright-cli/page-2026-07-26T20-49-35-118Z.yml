  - generic [ref=f3e36]:
    - generic [ref=f3e37]: SpaceX · Cohete orbital
    - heading "Falcon 9" [level=1] [ref=f3e40]
    - paragraph [ref=f3e41]: El cohete que cambió la industria espacial. Primera etapa reutilizable, más de 300 misiones y récords de vuelos con la misma booster. Pionero de los vuelos comerciales a la Estación Espacial Internacional.
    - generic [ref=f3e42]:
      - generic [ref=f3e43]: Reutilizable
      - generic [ref=f3e44]: Merlin 1D
      - generic [ref=f3e45]: Crew Dragon
      - generic [ref=f3e46]: Starlink
  - generic [ref=f3e47]:
    - generic [ref=f3e53]:
      - generic [ref=f3e54]: Modelo 3D interactivo
      - generic [ref=f3e57]:
        - text: 01 / 06 · Carga útil
        - heading "Cofia (Fairing)" [level=3] [ref=f3e58]
        - paragraph [ref=f3e59]: En la punta del cohete, una cápsula de dos piezas protege al satélite o la nave durante el ascenso por la atmósfera. Se desprende apenas el Falcon 9 sale del aire denso.
      - generic:
        - text: 02 / 06 · Motor Merlin Vacuum
        - heading "Segunda etapa" [level=3]
        - paragraph: Impulsada por un único motor Merlin 1D optimizado para el vacío. Enciende después de la separación y lleva la carga útil hasta la órbita final.
      - generic:
        - text: 03 / 06 · Conexión entre etapas
        - heading "Interetapa" [level=3]
        - paragraph: Una estructura rígida une la primera y la segunda etapa. Aloja los mecanismos que las separan con pequeños explosivos a los 2 minutos y 30 segundos de vuelo.
      - generic:
        - text: 04 / 06 · Tanques RP-1 / LOX + 9 Merlin
        - heading "Primera etapa" [level=3]
        - paragraph: La parte más grande del cohete. Sus tanques almacenan queroseno (RP-1) y oxígeno líquido (LOX) que alimentan los nueve motores Merlin 1D durante el despegue.
      - generic:
        - text: 05 / 06 · Grid fins
        - heading "Aletas de rejilla" [level=3]
        - paragraph: Cuatro aletas metálicas se despliegan durante la reentrada y maniobran la primera etapa como un planeador hipersónico, guiándola hacia el punto de aterrizaje.
      - generic:
        - text: 06 / 06 · Aterrizaje vertical
        - heading "Patas de aterrizaje" [level=3]
        - paragraph: Cerca del final del descenso, cuatro patas se despliegan desde el cuerpo del cohete. Absorben el impacto y permiten que la etapa se pose de pie, lista para volar de nuevo.
    - paragraph [ref=f3e60]: Desplazate para recorrer el cohete ↓
  - generic [ref=f3e62]:
    - generic [ref=f3e63]: Despegue real
