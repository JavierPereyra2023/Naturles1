      - generic [ref=f20e56]:
        - generic [ref=f20e57]:
          - generic [ref=f20e58]: "01"
          - heading "Proyecto MAPI" [level=2] [ref=f20e59]
        - paragraph [ref=f20e61]:
          - text: La
          - strong [ref=f20e62]: Maqueta Astronomica de Proporciones Interactiva (MAPI)
          - text: es el proyecto anual de Ciencias Naturales para 1° año. Consiste en construir un modelo a escala del Sistema Solar que nos permita entender las distancias y tamanos reales, imposibles de representar en un libro o en una lamina.
        - generic [ref=f20e63]:
          - text: “
          - paragraph [ref=f20e64]: La Maqueta Astronomica de Proporciones Interactiva (MAPI) es el proyecto anual de Ciencias Naturales. Construimos un modelo a escala del Sistema Solar.
        - paragraph [ref=f20e65]:
          - text: El Sistema Solar es tan inmenso que ninguna ilustracion de un libro de texto respeta las proporciones reales. Si dibujaramos el Sol de 1 cm, la Tierra seria un punto de 0,1 mm a 1 metro de distancia, y Neptuno estaria a 30 metros. En una hoja no entra. Con la maqueta, podemos representar
          - strong [ref=f20e66]: la relacion de tamanos
          - text: (con una escala) y
          - strong [ref=f20e67]: la relacion de distancias
          - text: (con otra escala diferente).
        - generic [ref=f20e68]:
          - generic [ref=f20e69]:
            - heading "Construccion" [level=4] [ref=f20e72]
            - paragraph [ref=f20e73]: Modelo a escala del Sistema Solar con materiales reciclables. Calculo de proporciones reales de tamaño y distancia.
          - generic [ref=f20e74]:
            - heading "Exposicion Oral" [level=4] [ref=f20e77]
            - paragraph [ref=f20e78]: Guion de exposicion y defensa conceptual ante la comunidad escolar. Comparacion con imagenes reales de sondas espaciales.
          - generic [ref=f20e79]:
            - heading "Trabajo en Equipo" [level=4] [ref=f20e84]
            - paragraph [ref=f20e85]: Formacion de grupos, asignacion de planetas y roles. Evaluacion con rubrica de precision conceptual, modelo, oralidad y creatividad.
      - generic [ref=f20e91]:
        - generic [ref=f20e92]:
          - generic [ref=f20e93]: "02"
          - heading "Escalas" [level=2] [ref=f20e94]
        - paragraph [ref=f20e96]:
          - text: Las distancias en el espacio son tan enormes que no podemos hacer una maqueta que respete
          - strong [ref=f20e97]: tamaño y distancia a la vez
          - text: . Elegimos una escala para representar los tamanos relativos de los planetas y otra para las distancias entre ellos.
        - generic [ref=f20e98]:
          - generic [ref=f20e99]: Para dimensionar
          - paragraph [ref=f20e100]:
            - text: Si el Sol fuera una pelota de futbol (22 cm), la Tierra seria una perlita de
            - strong [ref=f20e101]: 2 mm
            - text: a
            - strong [ref=f20e102]: 24 metros
            - text: de distancia. Neptuno estaria a
            - strong [ref=f20e103]: 700 metros
            - text: . ¡El espacio esta casi vacio!
        - paragraph [ref=f20e104]: Si el Sol fuera una pelota de futbol de 22 cm de diametro, la Tierra seria una perlita de 2 mm a 24 metros de distancia. Jupiter seria una naranja de 2,4 cm a 124 metros. Neptuno estaria a 700 metros, casi siete cuadras. Asi de inmensas son las distancias en el espacio.
