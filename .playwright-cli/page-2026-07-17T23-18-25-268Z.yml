        - paragraph [ref=f20e162]: "Escala de tamaños sugerida: 1 cm = 63.300 km aproximadamente. La escala de distancias es independiente y la define cada grupo segun el espacio disponible para la exposicion."
      - generic [ref=f20e168]:
        - generic [ref=f20e169]:
          - generic [ref=f20e170]: "03"
          - heading "Materiales y construccion" [level=2] [ref=f20e171]
        - paragraph [ref=f20e173]:
          - text: La MAPI se construye con
          - strong [ref=f20e174]: materiales accesibles y reciclables
          - text: . La creatividad y la precision conceptual valen mas que los materiales caros. Lo importante es entender que representa cada elemento y poder explicarlo.
        - generic [ref=f20e175]:
          - generic [ref=f20e176]:
            - heading "Materiales sugeridos" [level=3] [ref=f20e177]
            - list [ref=f20e178]:
              - listitem [ref=f20e179]:
                - generic [ref=f20e182]:
                  - strong [ref=f20e183]: Telgopor
                  - text: (esferas de distintos tamanos) para los planetas
              - listitem [ref=f20e184]:
                - generic [ref=f20e187]:
                  - strong [ref=f20e188]: Papel mache
                  - text: para planetas grandes (Jupiter, Saturno)
              - listitem [ref=f20e189]:
                - generic [ref=f20e192]:
                  - strong [ref=f20e193]: Alambre
                  - text: para las orbitas y estructuras de soporte
              - listitem [ref=f20e194]:
                - generic [ref=f20e197]:
                  - strong [ref=f20e198]: Pintura
                  - text: (acrilica o tempera) para los colores caracteristicos
              - listitem [ref=f20e199]:
                - generic [ref=f20e202]:
                  - strong [ref=f20e203]: Carton y madera
                  - text: para la base de la maqueta
              - listitem [ref=f20e204]:
                - generic [ref=f20e207]:
                  - strong [ref=f20e208]: Hilo o tanza
                  - text: para colgar los planetas (maqueta suspendida)
          - generic [ref=f20e209]:
            - heading "Pasos de construccion" [level=3] [ref=f20e210]
            - list [ref=f20e211]:
              - listitem [ref=f20e212]:
                - generic [ref=f20e213]: "1."
                - generic [ref=f20e214]:
                  - text: Calcular las
                  - strong [ref=f20e215]: proporciones
                  - text: de cada planeta segun la escala elegida.
              - listitem [ref=f20e216]:
                - generic [ref=f20e217]: "2."
                - generic [ref=f20e218]:
                  - text: Preparar las esferas de telgopor o papel mache con el
                  - strong [ref=f20e219]: tamano correcto
                  - text: .
              - listitem [ref=f20e220]:
                - generic [ref=f20e221]: "3."
                - generic [ref=f20e222]:
                  - text: Lijar y dar una base de pintura
                  - strong [ref=f20e223]: blanca
                  - text: a cada planeta.
              - listitem [ref=f20e224]:
                - generic [ref=f20e225]: "4."
                - generic [ref=f20e226]:
                  - text: Pintar con los
                  - strong [ref=f20e227]: colores caracteristicos
                  - text: (Marte rojo, Jupiter con bandas, etc.).
              - listitem [ref=f20e228]:
                - generic [ref=f20e229]: "5."
                - generic [ref=f20e230]:
                  - text: Armar la
                  - strong [ref=f20e231]: estructura de soporte
                  - text: con la base y los alambres de las orbitas.
              - listitem [ref=f20e232]:
                - generic [ref=f20e233]: "6."
                - generic [ref=f20e234]:
                  - text: Preparar
                  - strong [ref=f20e235]: carteles
                  - text: con el nombre, diametro real y distancia al Sol de cada planeta.
      - generic [ref=f20e241]:
        - generic [ref=f20e242]:
          - generic [ref=f20e243]: "04"
          - heading "Lo que aprendemos" [level=2] [ref=f20e244]
        - generic [ref=f20e245]:
          - generic [ref=f20e246]:
            - heading "Dimensiones reales" [level=4] [ref=f20e250]
            - paragraph [ref=f20e251]: Comprender las escalas reales del Sistema Solar. Entender por que en los libros no se pueden respetar las proporciones y por que necesitamos dos escalas diferentes para tamaño y distancia.
          - generic [ref=f20e252]:
            - heading "Trabajo en equipo" [level=4] [ref=f20e258]
            - paragraph [ref=f20e259]: "Aprender a organizarse en grupo, dividir tareas, coordinar esfuerzos y resolver problemas juntos. La ciencia no se hace en solitario: se construye colectivamente."
          - generic [ref=f20e260]:
            - heading "Investigacion" [level=4] [ref=f20e266]
            - paragraph [ref=f20e267]: Buscar informacion, comparar fuentes, seleccionar los datos relevantes y verificar que las proporciones sean correctas. Habilidades fundamentales para cualquier proyecto cientifico.
          - generic [ref=f20e268]:
            - heading "Creatividad" [level=4] [ref=f20e270]
            - paragraph [ref=f20e271]: "Resolver como representar algo tan grande con materiales limitados. La creatividad es parte del pensamiento cientifico: encontrar soluciones ingeniosas a problemas reales."
        - generic [ref=f20e272]:
          - text: “
          - paragraph [ref=f20e277]:
            - strong [ref=f20e278]: La ciencia tambien se aprende construyendo.
            - text: No se trata solo de leer y memorizar. Cuando armamos un modelo, tomamos decisiones, resolvemos problemas y entendemos de verdad como funcionan las cosas. La MAPI es ciencia en accion.
      - generic [ref=f20e284]:
        - generic [ref=f20e285]:
          - generic [ref=f20e286]: "05"
          - heading "Preguntas guia para el proyecto" [level=2] [ref=f20e287]
        - paragraph [ref=f20e288]: Estas preguntas te ayudan a preparar la exposicion oral y a verificar que comprendiste los conceptos fundamentales detras de la maqueta.
        - generic [ref=f20e289]:
          - generic [ref=f20e291]:
            - generic [ref=f20e292]: "1."
            - generic [ref=f20e293]:
              - paragraph [ref=f20e294]: ¿Por que no se puede hacer una maqueta del Sistema Solar con una sola escala?
              - paragraph [ref=f20e295]:
                - text: Porque los tamanos de los planetas son diminutos comparados con las distancias entre ellos. Si usamos una escala que haga visibles los planetas, las distancias serian enormes (cientos de metros). Si usamos una escala que quepa en el aula, los planetas serian invisibles. Por eso usamos
                - strong [ref=f20e296]: dos escalas separadas
                - text: ": una para tamanos y otra para distancias."
          - generic [ref=f20e298]:
            - generic [ref=f20e299]: "2."
            - generic [ref=f20e300]:
              - paragraph [ref=f20e301]: ¿Que planeta de tu maqueta fue el mas dificil de representar y por que?
              - paragraph [ref=f20e302]:
                - text: Respuesta personal de cada grupo. Algunos diran
                - strong [ref=f20e303]: Jupiter
                - text: por su tamaño (es el mas grande), otros
                - strong [ref=f20e304]: Saturno
                - text: por los anillos, otros
                - strong [ref=f20e305]: Mercurio
                - text: por lo pequeño. Lo importante es que puedas
                - strong [ref=f20e306]: explicar el desafio y como lo resolviste
                - text: .
          - generic [ref=f20e308]:
            - generic [ref=f20e309]: "3."
            - generic [ref=f20e310]:
              - paragraph [ref=f20e311]: Si tuvieras que explicarle el Sistema Solar a un nene de 6 años usando tu maqueta, ¿que le dirias?
              - paragraph [ref=f20e312]:
                - text: Esta pregunta evalua tu capacidad de
                - strong [ref=f20e313]: comunicar conceptos complejos de forma sencilla
                - text: ". No se trata de usar palabras dificiles, sino de encontrar la manera de que alguien sin conocimientos previos entienda lo esencial: que el Sol es una estrella enorme, que los planetas giran a su alrededor, y que las distancias son inmensas."
          - generic [ref=f20e315]:
            - generic [ref=f20e316]: "4."
            - generic [ref=f20e317]:
              - paragraph [ref=f20e318]: ¿Que fue lo que mas te sorprendio al armar la maqueta?
              - paragraph [ref=f20e319]:
                - text: Esta pregunta busca tu
                - strong [ref=f20e320]: reflexion personal
                - text: . La mayoria de los estudiantes se sorprenden al descubrir que el Sistema Solar es casi todo
                - strong [ref=f20e321]: espacio vacio
                - text: ", que los planetas gaseosos son enormes comparados con los rocosos, o que el Sol es inmensamente mas grande que todo lo demas junto. Conta tu experiencia."
          - generic [ref=f20e323]:
            - generic [ref=f20e324]: "5."
            - generic [ref=f20e325]:
              - paragraph [ref=f20e326]: ¿Como se organizaron como grupo? ¿Que harian distinto la proxima vez?
              - paragraph [ref=f20e327]:
                - text: Reflexion sobre el
                - strong [ref=f20e328]: proceso de trabajo
                - text: . ¿Se dividieron los planetas? ¿Alguien investigo, otro pinto, otro armo la estructura? ¿Que funciono bien y que mejorarian? La
                - strong [ref=f20e329]: autoevaluacion
                - text: es parte del aprendizaje.
