    - main [ref=f13e52]:
      - generic [ref=f13e53]:
        - generic [ref=f13e54]:
          - generic [ref=f13e55]: "01"
          - heading "Describir el movimiento" [level=2] [ref=f13e56]
        - paragraph [ref=f13e58]:
          - text: "Todo lo que se mueve —un auto, una pelota, un animal, un planeta— puede describirse usando tres conceptos fundamentales:"
          - strong [ref=f13e59]: posicion
          - text: ","
          - strong [ref=f13e60]: tiempo
          - text: "y"
          - strong [ref=f13e61]: velocidad
          - text: . Estos tres elementos forman la base de la cinematica, la rama de la fisica que estudia el movimiento sin preocuparse por las causas que lo producen.
        - generic [ref=f13e62]: Todo movimiento necesita un sistema de referencia. La posicion, el tiempo y la velocidad son los conceptos fundamentales para describirlo.
        - generic [ref=f13e63]:
          - paragraph [ref=f13e64]:
            - text: El
            - strong [ref=f13e65]: sistema de referencia
            - text: "es el punto desde el cual observamos el movimiento. Puede ser una esquina, un arbol, el piso del aula o incluso nosotros mismos. Sin un sistema de referencia, no podemos decir si algo se mueve o no: todo movimiento es"
            - emphasis [ref=f13e66]: relativo
            - text: al punto de observacion.
          - paragraph [ref=f13e67]:
            - text: La
            - strong [ref=f13e68]: posicion
            - text: (x) indica donde esta el objeto en cada instante. Se mide en metros (m) en el Sistema Internacional y puede representarse sobre una recta numerica donde elegimos un origen (el punto x = 0).
          - paragraph [ref=f13e69]:
            - text: El
            - strong [ref=f13e70]: tiempo
            - text: (t) nos dice cuando ocurre cada posicion. Se mide en segundos (s) y suele representarse en el eje horizontal de los graficos. Elegimos un instante inicial (t = 0) para empezar a medir.
          - paragraph [ref=f13e71]:
            - text: La
            - strong [ref=f13e72]: velocidad
            - text: (v) indica cuan rapido cambia la posicion. Se mide en metros por segundo (m/s) en el SI, aunque en la vida cotidiana usamos kilometros por hora (km/h). La velocidad nos dice cuantos metros recorre el objeto en cada segundo.
      - generic [ref=f13e78]:
        - generic [ref=f13e79]:
          - generic [ref=f13e80]: "02"
          - heading "MRU – Movimiento Rectilineo Uniforme" [level=2] [ref=f13e81]
        - paragraph [ref=f13e83]:
          - text: "El MRU es el movimiento mas simple:"
          - strong [ref=f13e84]: trayectoria recta y velocidad constante
          - text: (sin cambios). En un MRU, el objeto recorre la misma distancia en cada intervalo de tiempo. No acelera ni frena.
