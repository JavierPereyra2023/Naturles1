        - generic [ref=f13e184]:
          - paragraph [ref=f13e185]:
            - text: "La velocidad es constante, es decir:"
            - strong [ref=f13e186]: recorre distancias iguales en tiempos iguales
            - text: . Si un auto viaja a 100 km/h, en 1 hora recorre 100 km, en 2 horas recorre 200 km, en media hora recorre 50 km. La relacion entre distancia y tiempo es siempre la misma.
          - generic [ref=f13e187]: Un auto que viaja a 100 km/h por la ruta, sin acelerar ni frenar, describe un MRU.
          - paragraph [ref=f13e188]:
            - text: Es importante no confundir
            - strong [ref=f13e189]: velocidad
            - text: con
            - strong [ref=f13e190]: rapidez
            - text: ". La velocidad es una magnitud vectorial: ademas de un valor numerico, tiene direccion y sentido. La rapidez es solo el valor numerico. En el MRU, como la trayectoria es recta y no cambia el sentido, el modulo de la velocidad coincide con la rapidez."
      - generic [ref=f13e196]:
        - generic [ref=f13e197]:
          - generic [ref=f13e198]: "03"
          - heading "Graficos posicion-tiempo en MRU" [level=2] [ref=f13e199]
        - generic [ref=f13e200]:
          - paragraph [ref=f13e201]:
            - text: En un grafico x vs t (posicion en funcion del tiempo), el MRU se representa como
            - strong [ref=f13e202]: una linea recta
            - text: ". Esto tiene sentido: como la velocidad es constante, la posicion cambia de manera proporcional al tiempo."
          - paragraph [ref=f13e203]:
            - text: La
            - strong [ref=f13e204]: pendiente
            - text: "de la recta es la velocidad. Una recta mas inclinada indica una velocidad mayor; una recta menos inclinada indica una velocidad menor. Si la recta es horizontal (pendiente cero), el objeto esta detenido: su posicion no cambia."
          - generic [ref=f13e205]: La pendiente de la recta en un grafico x vs t es la velocidad. Cuanto mas inclinada la recta, mayor la velocidad.
