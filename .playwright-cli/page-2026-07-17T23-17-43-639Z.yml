      - generic [ref=f13e253]:
        - generic [ref=f13e254]:
          - generic [ref=f13e255]: "04"
          - heading "Ejemplo numerico" [level=2] [ref=f13e256]
        - generic [ref=f13e257]:
          - generic [ref=f13e258]: Dato curioso
          - paragraph [ref=f13e259]: "Para convertir de km/h a m/s dividi por 3,6. Para pasar de m/s a km/h, multiplica por 3,6. Este numero viene de: 1 km/h = 1000 m / 3600 s = 1/3,6 m/s."
        - generic [ref=f13e260]:
          - paragraph [ref=f13e261]: Veamos un ejemplo concreto para entender como se aplica la formula de velocidad.
          - paragraph [ref=f13e262]:
            - strong [ref=f13e263]: "Problema:"
            - text: Un ciclista recorre una ruta recta de 36 km en 2 horas, pedaleando siempre al mismo ritmo. ¿Cual es su velocidad?
          - generic [ref=f13e264]:
            - paragraph [ref=f13e265]:
              - strong [ref=f13e266]: "Paso 1:"
              - text: Identificamos los datos
            - paragraph [ref=f13e267]: "?x = 36 km (distancia recorrida)"
            - paragraph [ref=f13e268]: "?t = 2 h (tiempo empleado)"
            - paragraph [ref=f13e269]:
              - strong [ref=f13e270]: "Paso 2:"
              - text: Aplicamos la formula
            - paragraph [ref=f13e271]:
              - text: v = ?x / ?t = 36 km / 2 h =
              - strong [ref=f13e272]: 18 km/h
            - paragraph [ref=f13e273]:
              - strong [ref=f13e274]: "Paso 3:"
              - text: Convertimos a m/s
            - paragraph [ref=f13e275]:
              - text: 18 km/h ÷ 3,6 =
              - strong [ref=f13e276]: 5 m/s
          - paragraph [ref=f13e277]:
            - strong [ref=f13e278]: "Interpretacion:"
            - text: El ciclista viaja a 18 km/h, lo que significa que cada hora avanza 18 kilometros. En metros por segundo, avanza 5 metros cada segundo. Como el movimiento es uniforme, esta velocidad se mantiene constante durante todo el recorrido.
      - generic [ref=f13e284]:
        - generic [ref=f13e285]:
          - generic [ref=f13e286]: "05"
          - heading "Preguntas para pensar" [level=2] [ref=f13e287]
        - paragraph [ref=f13e288]: Estas preguntas te invitan a reflexionar y conectar lo aprendido con situaciones reales. Ideal para debatir en clase o responder en la carpeta.
        - generic [ref=f13e289]:
          - generic [ref=f13e291]:
            - generic [ref=f13e292]: "1."
            - generic [ref=f13e293]:
              - paragraph [ref=f13e294]: ¿Que significa que un movimiento sea "uniforme"?
              - paragraph [ref=f13e295]:
                - text: Significa que la velocidad se mantiene
                - strong [ref=f13e296]: constante
                - text: a lo largo del tiempo. El objeto recorre distancias iguales en intervalos de tiempo iguales. No acelera, no frena, no cambia de direccion. Es el tipo de movimiento mas predecible que existe en fisica.
          - generic [ref=f13e298]:
            - generic [ref=f13e299]: "2."
            - generic [ref=f13e300]:
              - paragraph [ref=f13e301]: Si un auto viaja a 60 km/h, ¿cuanto tarda en recorrer 180 km?
              - paragraph [ref=f13e302]:
                - text: "Usamos la formula de MRU: v = ?x / ?t, despejamos el tiempo: ?t = ?x / v = 180 km / 60 km/h ="
                - strong [ref=f13e303]: 3 horas
                - text: ". Como la velocidad es constante, la relacion es directa: a 60 km/h, cada 60 km se recorren en 1 hora. Si la distancia se triplica, el tiempo tambien se triplica."
          - generic [ref=f13e305]:
            - generic [ref=f13e306]: "3."
            - generic [ref=f13e307]:
              - paragraph [ref=f13e308]: ¿Por que en un grafico x vs t, una recta horizontal significa que el objeto esta detenido?
              - paragraph [ref=f13e309]:
                - text: Porque una recta horizontal indica que la
                - strong [ref=f13e310]: posicion no cambia
                - text: a medida que pasa el tiempo. Si x es siempre la misma, significa que el objeto no se movio de su lugar. La pendiente de una recta horizontal es cero, y como la pendiente representa la velocidad, una pendiente cero es velocidad cero.
