            - generic [ref=f7e165]: T
        - paragraph [ref=f7e166]: Q = calor (Joules o calorías) | m = masa (kg o g) | c = calor específico (J/kg·°C) | ?T = cambio de temperatura
      - paragraph [ref=f7e167]:
        - text: El
        - strong [ref=f7e168]: calor específico
        - text: es una propiedad de cada material que indica cuánta energía se necesita para elevar 1°C la temperatura de 1 kg de esa sustancia. Cuanto mayor es el calor específico, más energía se necesita para calentarlo.
      - paragraph [ref=f7e169]: "Veamos un ejemplo concreto: para calentar 1 kg de agua de 20°C a 100°C necesitamos:"
      - paragraph [ref=f7e171]: Q = 1 × 4180 × 80 = 334.400 J
      - paragraph [ref=f7e172]: El agua tiene un calor específico muy alto (4180 J/kg·°C). Por eso se usa para enfriar motores, tarda mucho en hervir y se enfría lentamente. Las zonas costeras tienen climas más estables que las zonas continentales precisamente porque el agua del mar absorbe y libera calor lentamente, regulando la temperatura.
      - paragraph [ref=f7e173]: En comparación, el hierro tiene un calor específico de solo 450 J/kg·°C. Esto significa que se calienta y se enfría casi diez veces más rápido que el agua. Por eso una cuchara de metal en una sopa caliente se vuelve intocable en segundos.
    - generic [ref=f7e175]:
      - generic [ref=f7e176]: Sabías que...
      - paragraph [ref=f7e177]: "El lugar más frío del universo conocido está en la Nebulosa Boomerang: -272°C, apenas un grado por encima del cero absoluto (-273.15°C). ¡Más frío que el congelador de tu casa, que está a solo -18°C!"
    - generic [ref=f7e178]:
      - generic [ref=f7e179]:
        - generic [ref=f7e180]: "04"
        - heading "Preguntas para pensar" [level=2] [ref=f7e181]
      - generic [ref=f7e182]:
        - paragraph [ref=f7e184]: 1. ¿Por qué la arena de la playa quema los pies al mediodía pero el agua del mar está fresca, si ambos reciben la misma radiación solar?
        - paragraph [ref=f7e186]: 2. Si en el espacio no hay aire, ¿cómo llega el calor del Sol a la Tierra? ¿Qué mecanismo de transferencia está actuando?
        - paragraph [ref=f7e188]: 3. Explicá con tus palabras por qué un termo mantiene el café caliente durante horas. ¿Qué mecanismos de transferencia está evitando?
