  - generic [ref=f7e29]:
    - generic [ref=f7e30]: Física · Calor y Sonido
    - heading "Calor y Temperatura" [level=1] [ref=f7e33]
    - paragraph [ref=f7e34]: Entendé la diferencia entre calor y temperatura, cómo se transfiere la energía térmica y cómo calcularla.
  - main [ref=f7e37]:
    - generic [ref=f7e38]:
      - generic [ref=f7e39]:
        - generic [ref=f7e40]: "01"
        - heading "¿Calor o temperatura?" [level=2] [ref=f7e41]
      - paragraph [ref=f7e43]: "Es muy común usar las palabras \"calor\" y \"temperatura\" como si fueran lo mismo, pero en física son conceptos muy distintos. La temperatura es una medida de la energía cinética promedio de las partículas de un cuerpo: nos dice qué tan rápido se mueven sus moléculas. El calor, en cambio, es la energía que se transfiere de un cuerpo a otro debido a una diferencia de temperatura."
      - paragraph [ref=f7e44]: Cuando tocás un vaso de vidrio y uno de metal que están a la misma temperatura, el metal se siente más frío. ¿Por qué? Porque el metal conduce el calor de tu mano más rápido. Tu mano no mide temperatura, mide la velocidad a la que pierde calor. Este simple experimento muestra que temperatura y calor no son lo mismo.
      - generic [ref=f7e45]: "\"La temperatura mide la agitación de las partículas. El calor es la energía que se transfiere entre cuerpos a diferente temperatura.\""
      - paragraph [ref=f7e46]: La temperatura se mide con un termómetro y sus unidades más comunes son los grados Celsius (°C), Fahrenheit (°F) y Kelvin (K). El calor se mide en joules (J) o en calorías (cal). Una caloría es la cantidad de calor necesaria para elevar 1°C la temperatura de 1 gramo de agua.
      - generic [ref=f7e47]:
        - generic [ref=f7e48]: Laboratorio visual · Cambiá la temperatura de cada cuerpo
        - img "Dos cuerpos con partículas que se agitan según su temperatura y el calor fluyendo del más caliente al más frío" [ref=f7e53]:
          - generic [ref=f7e56]: Cuerpo A · 20 °C
          - generic [ref=f7e57]: Cuerpo B · 80 °C
          - generic [ref=f7e100]: CALOR
          - generic [ref=f7e103]: el calor fluye siempre del cuerpo más caliente al más frío, hasta igualar las temperaturas (equilibrio térmico)
        - generic [ref=f7e104]:
          - generic [ref=f7e105]:
            - generic [ref=f7e106]: Temperatura A · 20 °C
            - slider "Temperatura A · 20 °C" [ref=f7e107]: "20"
          - generic [ref=f7e108]:
            - generic [ref=f7e109]: Temperatura B · 80 °C
            - slider "Temperatura B · 80 °C" [ref=f7e110]: "80"
        - paragraph [ref=f7e111]:
          - text: Las partículas de un cuerpo
          - strong [ref=f7e112]: más caliente se mueven más rápido
          - text: ": eso es la temperatura, una medida de la agitación promedio. Cuando dos cuerpos a distinta temperatura se ponen en contacto, la energía pasa del más caliente al más frío: ese flujo de energía es el"
          - strong [ref=f7e113]: calor
          - text: ". Igualá las dos temperaturas y mirá cómo la flecha desaparece: llegaste al equilibrio térmico."
    - generic [ref=f7e115]:
      - generic [ref=f7e116]:
        - generic [ref=f7e117]: "02"
        - heading "Mecanismos de transferencia" [level=2] [ref=f7e118]
      - paragraph [ref=f7e120]: "El calor siempre se transfiere del cuerpo de mayor temperatura al de menor temperatura. Existen tres mecanismos fundamentales mediante los cuales esto ocurre: conducción, convección y radiación. Cada uno funciona de manera diferente y está presente en situaciones cotidianas."
      - heading "Conducción" [level=3] [ref=f7e121]
      - paragraph [ref=f7e122]: El calor se transmite por contacto directo entre partículas, sin que haya desplazamiento de materia. Las partículas más energéticas chocan con las menos energéticas, transfiriéndoles energía. Los metales son buenos conductores térmicos; la madera y el plástico son aislantes. Por eso las ollas son de metal pero sus mangos suelen ser de plástico o madera.
      - heading "Convección" [level=3] [ref=f7e123]
      - paragraph [ref=f7e124]: El calor se transmite por el movimiento de fluidos (líquidos y gases). Cuando un fluido se calienta, se expande, se vuelve menos denso y asciende. El fluido más frío y denso desciende para ocupar su lugar. Este ciclo crea corrientes de convección. Así funcionan la calefacción en una habitación, el agua hirviendo en una olla y las brisas marinas.
      - generic [ref=f7e125]:
        - generic [ref=f7e126]: Dato curioso
        - text: El Sol está a 150 millones de km de la Tierra y en el espacio no hay materia. Su calor nos llega exclusivamente por radiación, atravesando el vacío en forma de ondas electromagnéticas.
      - heading "Radiación" [level=3] [ref=f7e127]
      - paragraph [ref=f7e128]: El calor se transmite por ondas electromagnéticas, sin necesidad de un medio material. Todos los cuerpos emiten radiación térmica. Cuanto mayor es la temperatura del cuerpo, mayor es la energía radiante que emite. Así nos llega el calor del Sol a través del espacio vacío, y así funciona un horno de microondas o una estufa eléctrica.
    - generic [ref=f7e130]:
      - generic [ref=f7e131]:
        - generic [ref=f7e132]: "03"
        - heading "La ecuación del calor" [level=2] [ref=f7e133]
      - paragraph [ref=f7e135]: Para calcular la cantidad de calor que gana o pierde un cuerpo cuando cambia su temperatura, usamos una ecuación que relaciona la masa, el tipo de material y la variación de temperatura. Esta ecuación es fundamental en calorimetría y nos permite hacer predicciones cuantitativas.
      - generic [ref=f7e136]:
        - paragraph [ref=f7e137]: "Ecuación fundamental del calor:"
        - generic [ref=f7e138]:
          - generic [ref=f7e139]:
            - generic [ref=f7e140]: Q
            - generic [ref=f7e142]: =
            - generic [ref=f7e144]: m
