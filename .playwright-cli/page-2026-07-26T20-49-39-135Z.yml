        - paragraph [ref=f4e290]:
          - strong [ref=f4e291]: El precio de bajar a la Tierra.
          - text: Reutilizar un cohete reduce los costos enormemente, pero también requiere motores más complejos y misiones más limitadas. El Falcon Heavy todavía pierde los boosters laterales en algunas misiones (no siempre se recuperan). El objetivo final de SpaceX es un cohete 100% reutilizable, y el Starship es su apuesta.
      - generic [ref=f4e297]:
        - generic [ref=f4e298]:
          - generic [ref=f4e299]: "05"
          - heading "Preguntas para pensar" [level=2] [ref=f4e300]
        - generic [ref=f4e301]:
          - generic [ref=f4e303]:
            - generic [ref=f4e304]: "1."
            - generic [ref=f4e305]:
              - paragraph [ref=f4e306]: ¿Por qué 27 motores en lugar de uno más grande?
              - paragraph [ref=f4e307]:
                - text: En cohetería se usa lo que se llama "ley de los motores". Un motor más grande es
                - strong [ref=f4e308]: más difícil de diseñar, probar y fabricar
                - text: . Muchos motores más chicos permiten mayor
                - strong [ref=f4e309]: redundancia
                - text: ": si uno falla, los otros pueden compensar."
          - generic [ref=f4e311]:
            - generic [ref=f4e312]: "2."
            - generic [ref=f4e313]:
              - paragraph [ref=f4e314]: ¿Por qué los boosters laterales se separan tan rápido?
              - paragraph [ref=f4e315]:
                - text: Para ahorrar peso. Llevar boosters vacíos consume combustible. Se separan a los
                - strong [ref=f4e316]: 2:30 minutos
                - text: del despegue, cuando ya cumplieron su función de empujar al cohete a través de la atmósfera más densa.
          - generic [ref=f4e318]:
            - generic [ref=f4e319]: "3."
            - generic [ref=f4e320]:
              - paragraph [ref=f4e321]: ¿Por qué se descontinúa el Falcon Heavy?
              - paragraph [ref=f4e322]:
                - text: "Porque el Starship hace todo lo que hace el Falcon Heavy pero mejor:"
                - strong [ref=f4e323]: más carga, totalmente reutilizable y más barato
                - text: . SpaceX prefiere concentrar recursos en el cohete que viene en lugar de mantener dos líneas de producto.
