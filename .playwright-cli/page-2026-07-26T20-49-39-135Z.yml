    - generic [ref=f4e37]: SpaceX · Supercohete
    - heading "Falcon Heavy" [level=1] [ref=f4e40]
    - paragraph [ref=f4e41]: Tres núcleos Falcon 9 juntos formando el cohete más potente del mundo en su momento. Capaz de levantar el doble de carga que cualquier cohete operativo, y de mandar un automóvil al espacio profundo.
    - generic [ref=f4e42]:
      - generic [ref=f4e43]: 27 motores
      - generic [ref=f4e44]: Carga pesada
      - generic [ref=f4e45]: Tesla Roadster
      - generic [ref=f4e46]: GOES-U
  - generic [ref=f4e47]:
    - generic [ref=f4e53]:
      - generic [ref=f4e54]: Modelo 3D interactivo
      - generic [ref=f4e57]:
        - text: 01 / 06 · Carga útil
        - heading "Cofia (Fairing)" [level=3] [ref=f4e58]
        - paragraph [ref=f4e59]:
          - text: "Es la misma cofia del Falcon 9:"
          - strong [ref=f4e60]: 5,2 m de ancho y 13 m de alto
          - text: ", en dos mitades que se abren y se sueltan al salir del aire denso. Va siempre arriba del núcleo central, nunca de los laterales."
      - generic:
        - text: 02 / 06 · Motor Merlin Vacuum
        - heading "Segunda etapa" [level=3]
        - paragraph:
          - text: Un solo motor Merlin 1D adaptado al vacío. Puede
          - strong: encenderse y apagarse varias veces
          - text: durante horas, algo imprescindible para dejar cargas en órbitas muy altas o mandarlas al espacio profundo.
      - generic:
        - text: 03 / 06 · Dos Falcon 9 a los costados
        - heading "Núcleos laterales" [level=3]
        - paragraph:
          - text: Son primeras etapas de Falcon 9, pero en lugar de interetapa llevan una
          - strong: punta cónica
          - text: . Aportan 18 de los 27 motores y se sueltan a los
          - strong: 2 minutos y 30 segundos
          - text: ", cuando el cohete todavía va cargado."
      - generic:
        - text: 04 / 06 · Estructura reforzada
        - heading "Núcleo central" [level=3]
        - paragraph:
          - text: "Parece un Falcon 9 común pero no lo es: lleva"
          - strong: estructura y anclajes reforzados
          - text: para aguantar el empuje que le transmiten los laterales. Durante el ascenso baja la potencia de sus motores para ahorrar combustible y sigue solo después de la separación.
      - generic:
        - text: 05 / 06 · 3 × 9 Merlin 1D
        - heading "27 motores" [level=3]
        - paragraph:
          - text: "Nueve motores por núcleo, en formación \"octaweb\": uno al centro y ocho alrededor. Los 27 encienden juntos en el despegue y entregan"
          - strong: 22.800 kN
          - text: ", el equivalente a unos 18 aviones Boeing 747 a plena potencia."
      - generic:
        - text: 06 / 06 · Aterrizaje triple
        - heading "Rejillas y patas" [level=3]
        - paragraph:
          - text: Los tres núcleos llevan aletas de rejilla y patas plegables. Los dos laterales vuelven
          - strong: casi al mismo tiempo
          - text: a las plataformas de Cabo Cañaveral; el central, que va más rápido y más lejos, apunta a una plataforma en el mar.
    - paragraph [ref=f4e61]: Desplazate para recorrer el cohete ↓
