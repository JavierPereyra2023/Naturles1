          - generic [ref=f4e87]: "01"
          - 'heading "El diseño: tres Falcon 9 juntos" [level=2] [ref=f4e88]'
        - paragraph [ref=f4e90]:
          - text: "Construir un cohete gigantesco desde cero es carísimo y arriesgado. SpaceX tomó otra decisión:"
          - strong [ref=f4e91]: tomar tres núcleos Falcon 9 ya probados
          - text: y unirlos en la base. El resultado es el
          - strong [ref=f4e92]: Falcon Heavy
          - text: ": dos cohetes \"laterales\" (boosters) que se desprenden poco después del despegue, y un núcleo central que sigue hasta órbita."
        - generic [ref=f4e93]:
          - text: “
          - paragraph [ref=f4e94]: Es como juntar tres locomotoras para mover un tren más pesado. La ventaja es que cada locomotora ya existía, ya estaba probada y ya se sabía aterrizarla.
