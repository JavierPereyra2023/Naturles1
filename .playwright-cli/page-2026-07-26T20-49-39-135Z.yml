      - generic [ref=f4e245]:
        - generic [ref=f4e246]:
          - generic [ref=f4e247]: "04"
          - heading "El Falcon Heavy en contexto" [level=2] [ref=f4e248]
        - paragraph [ref=f4e250]:
          - text: Aunque cuando se lanzó el Falcon Heavy era el cohete más potente del mundo, su papel actual es de
          - strong [ref=f4e251]: puente
          - text: . SpaceX ya está retirada su producción para reemplazarlo por el
          - strong [ref=f4e252]: Starship
          - text: ", que es completamente reutilizable y todavía más grande. Mientras tanto, sigue siendo una opción confiable para misiones pesadas."
