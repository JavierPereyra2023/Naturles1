        - generic [ref=f4e144]:
          - generic [ref=f4e145]: El récord por un rato
          - paragraph [ref=f4e146]:
            - text: Cuando debutó en 2018, el Falcon Heavy era el
            - strong [ref=f4e147]: cohete más potente del mundo en operación
            - text: ", solo superado por el Saturno V (que llevó astronautas a la Luna en los 60 y 70). Multiplicó por dos la capacidad de carga del siguiente cohete disponible."
      - generic [ref=f4e153]:
        - generic [ref=f4e154]:
          - generic [ref=f4e155]: "02"
          - 'heading "El primer vuelo (2018): un Tesla en el espacio" [level=2] [ref=f4e156]'
        - paragraph [ref=f4e158]:
          - text: El
          - strong [ref=f4e159]: 6 de febrero de 2018
          - text: ", el Falcon Heavy realizó su vuelo inaugural desde la plataforma 39A del Centro Espacial Kennedy — la misma plataforma desde donde partieron las misiones Apollo a la Luna. Para probar que el cohete podía poner cosas en el espacio profundo, Elon Musk decidió que la carga útil sería un"
          - strong [ref=f4e160]: automóvil Tesla Roadster rojo cereza
          - text: con un maniquí vestido de astronauta al volante.
        - generic [ref=f4e161]:
          - generic [ref=f4e162]:
            - heading "Despegue perfecto" [level=3] [ref=f4e169]
            - paragraph [ref=f4e170]:
              - text: Los 27 motores Merlin se encendieron en simultáneo, generando un empuje equivalente a casi
              - strong [ref=f4e171]: 20 aviones jumbo
              - text: . El temblor se sintió a kilómetros de distancia.
          - generic [ref=f4e172]:
            - heading "Aterrizaje doble" [level=3] [ref=f4e174]
            - paragraph [ref=f4e175]:
              - text: Los dos
              - strong [ref=f4e176]: boosters laterales
              - text: se separaron a los +2 minutos y regresaron sincronizados a la Tierra, aterrizando en dos plataformas diferentes. Una imagen icónica de la ingeniería.
          - generic [ref=f4e177]:
            - heading "El Tesla en órbita" [level=3] [ref=f4e179]
            - paragraph [ref=f4e180]:
              - text: El Roadster y su conductor ("
              - strong [ref=f4e181]: Starman
              - text: "\") entraron en una órbita que se cruza con la de Marte. El auto sigue dando vueltas al Sol y se espera que"
              - strong [ref=f4e182]: orbite por millones de años
              - text: .
          - generic [ref=f4e183]:
            - heading "El último mensaje" [level=3] [ref=f4e185]
            - paragraph [ref=f4e186]:
              - text: La canción
              - strong [ref=f4e187]: "\"Space Oddity\" de David Bowie"
              - text: sonaba en los parlantes del Tesla. Es probablemente el único auto que ha viajado a la velocidad de escape de la Tierra mientras suena Bowie.
        - paragraph [ref=f4e193]:
          - strong [ref=f4e194]: ¿Por qué gastar un cohete en un auto?
          - text: El Falcon Heavy necesitaba demostrar que podía lanzar carga al espacio profundo. Como
          - strong [ref=f4e195]: no había un cliente real
          - text: para el primer vuelo, Musk usó su propio Tesla. Era una forma creativa y muy publicitada de validar el cohete sin riesgo comercial.
