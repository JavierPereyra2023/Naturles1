  - generic [ref=f8e29]:
    - generic [ref=f8e30]: Física · Calor y Sonido
    - heading "Luz y Materiales" [level=1] [ref=f8e33]
    - paragraph [ref=f8e34]: ¿Por qué vemos a través del vidrio pero no de la madera? Cómo la luz interactúa con distintos materiales y por qué vemos colores.
  - main [ref=f8e37]:
    - generic [ref=f8e38]:
      - generic [ref=f8e39]:
        - generic [ref=f8e40]: "01"
        - heading "La luz y los materiales" [level=2] [ref=f8e41]
      - paragraph [ref=f8e43]: "Cuando la luz incide sobre un objeto, pueden ocurrir varias cosas: puede atravesarlo, puede ser reflejada, puede ser absorbida o una combinación de estas. Según cómo se comporte la luz al interactuar con ellos, los materiales se clasifican en tres grandes categorías. Esta clasificación nos ayuda a entender desde por qué podemos ver a través de una ventana hasta por qué nos vestimos de colores claros en verano."
      - generic [ref=f8e44]: "\"Según cómo interactúan con la luz, los materiales se clasifican en opacos, translúcidos y transparentes.\""
      - paragraph [ref=f8e45]: No todos los materiales se comportan igual frente a la luz. Algunos la bloquean completamente, otros la dejan pasar parcialmente y otros son prácticamente invisibles a ella. Esta propiedad depende de la estructura interna del material y de cómo sus átomos y moléculas interactúan con las ondas electromagnéticas.
    - generic [ref=f8e47]:
      - generic [ref=f8e48]:
        - generic [ref=f8e49]: "02"
        - heading "Clasificación de materiales" [level=2] [ref=f8e50]
      - paragraph [ref=f8e52]: Cada tipo de material interactúa con la luz de manera particular. La clasificación se basa en qué tanta luz pueden transmitir y con qué nitidez se ven los objetos a través de ellos. Esta propiedad tiene aplicaciones prácticas en nuestra vida diaria, desde la construcción hasta la tecnología.
      - generic [ref=f8e53]:
        - heading "Materiales opacos" [level=3] [ref=f8e54]
        - paragraph [ref=f8e57]: No dejan pasar la luz. Cuando la luz incide sobre ellos, es absorbida o reflejada, pero no los atraviesa. No se puede ver a través de ellos.
        - paragraph [ref=f8e58]: "Ejemplos: madera, metal, cartón, piedra, pared, libro."
      - generic [ref=f8e59]:
        - heading "Materiales translúcidos" [level=3] [ref=f8e60]
        - paragraph [ref=f8e63]: Dejan pasar algo de luz, pero la dispersan en múltiples direcciones. Los objetos no se ven nítidos a través de ellos; se ven borrosos o solo como siluetas. La luz los atraviesa pero de manera desordenada.
        - paragraph [ref=f8e64]: "Ejemplos: vidrio esmerilado, papel manteca, algunos plásticos, tela fina, nubes."
      - generic [ref=f8e65]:
        - heading "Materiales transparentes" [level=3] [ref=f8e66]
        - paragraph [ref=f8e71]: Dejan pasar la luz prácticamente sin alterarla. Se puede ver a través de ellos con nitidez, distinguiendo formas y colores. La luz los atraviesa de manera ordenada.
        - paragraph [ref=f8e72]: "Ejemplos: vidrio común, agua limpia, aire, algunos plásticos como el acrílico."
    - generic [ref=f8e74]:
      - generic [ref=f8e75]:
        - generic [ref=f8e76]: "03"
        - heading "Fenómenos luminosos" [level=2] [ref=f8e77]
      - paragraph [ref=f8e79]: "Cuando la luz interactúa con la materia se producen tres fenómenos principales: reflexión, refracción y absorción. Estos fenómenos explican desde por qué vemos nuestra imagen en un espejo hasta por qué un lápiz parece quebrado dentro de un vaso de agua."
      - heading "Reflexión" [level=3] [ref=f8e80]
      - paragraph [ref=f8e81]: La luz rebota en una superficie y cambia de dirección. La reflexión puede ser especular (como en un espejo, donde los rayos rebotan ordenadamente y se forma una imagen nítida) o difusa (como en una pared blanca, donde los rayos rebotan en muchas direcciones y no se forma imagen).
      - paragraph [ref=f8e82]: La ley de la reflexión establece que el ángulo de incidencia es igual al ángulo de reflexión. Ambos ángulos se miden respecto a la normal, una línea imaginaria perpendicular a la superficie en el punto donde incide la luz.
      - paragraph [ref=f8e84]:
        - text: Ángulo de incidencia = Ángulo de reflexión (?
        - subscript [ref=f8e85]: i
        - text: = ?
        - subscript [ref=f8e86]: r
        - text: )
      - heading "Refracción" [level=3] [ref=f8e87]
      - paragraph [ref=f8e88]: La luz cambia de dirección (y de velocidad) al pasar de un medio transparente a otro con distinta densidad. Un lápiz en un vaso de agua parece quebrado en la superficie; esto es refracción. La luz viaja más lento en el agua que en el aire, y al cambiar de velocidad cambia de dirección.
      - paragraph [ref=f8e89]: "Este fenómeno es el que permite que las lentes (anteojos, lupas, microscopios) funcionen: curvan la luz para enfocar imágenes. También explica la formación del arcoíris: las gotas de agua refractan y reflejan la luz del sol, separándola en colores."
      - generic [ref=f8e90]:
        - generic [ref=f8e91]: Espejismos
        - text: Los espejismos en la ruta en días calurosos se producen por refracción. El aire cerca del asfalto está mucho más caliente (y es menos denso) que el aire más arriba. La luz se curva al atravesar capas de aire de distinta densidad, creando la ilusión de agua sobre el pavimento.
      - heading "Absorción" [level=3] [ref=f8e92]
      - paragraph [ref=f8e93]: La luz es absorbida por el material y su energía se transforma en calor. Una remera negra al sol se calienta más que una blanca precisamente porque el color negro absorbe más luz (todos los colores) mientras que el blanco refleja la mayoría.
      - 'figure "FIGURA 1: Esquema comparativo de reflexión, refracción y absorción de la luz al incidir sobre distintos materiales" [ref=f8e94]':
        - 'img ": Esquema comparativo de reflexión, refracción y absorción de la luz al incidir sobre distintos materiales"'
    - generic [ref=f8e97]:
      - generic [ref=f8e98]:
        - generic [ref=f8e99]: "04"
        - heading "¿Por qué vemos colores?" [level=2] [ref=f8e100]
      - paragraph [ref=f8e102]: La luz blanca del Sol está compuesta por todos los colores del arcoíris (rojo, naranja, amarillo, verde, azul, añil y violeta). Cuando esta luz blanca incide sobre un objeto, el objeto absorbe algunos colores y refleja otros. El color que vemos es precisamente el color (o los colores) que el objeto refleja.
      - paragraph [ref=f8e103]:
        - text: Una manzana se ve roja porque su piel absorbe todos los colores de la luz blanca
        - strong [ref=f8e104]: excepto el rojo
        - text: ", que es reflejado hacia nuestros ojos. Una hoja se ve verde porque refleja el verde y absorbe el resto. Si ilumináramos una manzana roja con luz azul pura, la veríamos negra, porque no habría luz roja para reflejar."
      - paragraph [ref=f8e105]: "El negro absorbe todos los colores y no refleja ninguno. El blanco refleja todos los colores y no absorbe ninguno. Por eso en verano conviene usar ropa clara: refleja más luz solar (y por lo tanto más energía) y nos mantenemos más frescos. Una remera negra absorbe toda la luz y la convierte en calor."
      - paragraph [ref=f8e107]: «Un objeto se ve de un color porque refleja ese color y absorbe los demás. El negro absorbe todos los colores. El blanco los refleja todos.»
      - paragraph [ref=f8e108]: "Este principio tiene aplicaciones muy prácticas. Los paneles solares térmicos son de color negro para absorber la máxima cantidad de energía del sol. Los techos de las casas en zonas cálidas se pintan de blanco para reflejar la luz y mantener el interior fresco. La naturaleza también lo aprovecha: muchos animales del desierto tienen pelaje claro para reflejar el sol, mientras que los animales polares tienen pelaje oscuro bajo el pelaje blanco para absorber y retener el calor."
    - generic [ref=f8e110]:
      - generic [ref=f8e111]:
        - generic [ref=f8e112]: "05"
        - heading "Preguntas para pensar" [level=2] [ref=f8e113]
      - generic [ref=f8e114]:
        - paragraph [ref=f8e116]: 1. ¿Por qué en una habitación a oscuras no podemos ver los colores de los objetos? ¿Qué le falta a la escena para que exista color?
        - paragraph [ref=f8e118]: 2. ¿Qué tipo de material es una cortina de baño semitransparente? ¿Y el agua con barro? Justificá tu respuesta usando los tres tipos.
        - paragraph [ref=f8e120]: 3. Imaginá que estás en una pileta y ves una moneda en el fondo. ¿Está realmente donde la ves? Explicá qué fenómeno luminoso está actuando.
