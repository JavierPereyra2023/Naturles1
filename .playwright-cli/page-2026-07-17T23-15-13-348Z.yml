      - paragraph [ref=f3e149]: "Otras propiedades físicas importantes:"
      - list [ref=f3e150]:
        - listitem [ref=f3e151]:
          - generic [ref=f3e154]:
            - strong [ref=f3e155]: Punto de fusión
            - text: ": temperatura a la que un sólido pasa a líquido."
        - listitem [ref=f3e156]:
          - generic [ref=f3e159]:
            - strong [ref=f3e160]: Punto de ebullición
            - text: ": temperatura a la que un líquido pasa a gas."
        - listitem [ref=f3e161]:
          - generic [ref=f3e164]:
            - strong [ref=f3e165]: Conductividad
            - text: ": capacidad de transmitir calor o electricidad."
        - listitem [ref=f3e166]:
          - generic [ref=f3e169]:
            - strong [ref=f3e170]: Dureza
            - text: ": resistencia a ser rayado."
        - listitem [ref=f3e171]:
          - generic [ref=f3e174]:
            - strong [ref=f3e175]: Solubilidad
            - text: ": capacidad de disolverse en otra sustancia."
    - generic [ref=f3e176]:
      - heading "Propiedades químicas" [level=2] [ref=f3e177]
      - paragraph [ref=f3e180]:
        - text: Describen la
        - strong [ref=f3e181]: capacidad de una sustancia para transformarse
        - text: en otra diferente. Se manifiestan durante una reacción química, cuando cambia la composición del material.
      - paragraph [ref=f3e182]:
        - text: La diferencia clave entre un
        - strong [ref=f3e183]: cambio físico
        - text: y un
        - strong [ref=f3e184]: cambio químico
        - text: ": en el cambio físico la sustancia sigue siendo la misma (ej: el agua que se congela sigue siendo H2O); en el cambio químico aparece una sustancia nueva (ej: el hierro que se oxida se convierte en óxido de hierro)."
      - generic [ref=f3e185]:
        - generic [ref=f3e186]:
          - heading "Combustión" [level=4] [ref=f3e189]
          - paragraph [ref=f3e190]: "Reacción con oxígeno que libera energía. Ej: madera quemándose, vela encendida."
        - generic [ref=f3e191]:
          - heading "Oxidación" [level=4] [ref=f3e194]
          - paragraph [ref=f3e195]: "Combinación lenta con oxígeno. Ej: hierro oxidándose, manzana oscureciéndose."
        - generic [ref=f3e196]:
          - heading "Reactividad" [level=4] [ref=f3e199]
          - paragraph [ref=f3e200]: "Reacción con ácidos, bases u otras sustancias. Ej: zinc + ácido clorhídrico."
