  - generic [ref=f3e29]:
    - generic [ref=f3e30]: Química · Materia
    - heading "Propiedades de la Materia" [level=1] [ref=f3e33]
    - paragraph [ref=f3e34]: Cada material tiene características que lo hacen único. Aprendé a identificarlas y clasificarlas.
  - main [ref=f3e35]:
    - generic [ref=f3e36]:
      - heading "Propiedades organolépticas" [level=2] [ref=f3e37]
      - paragraph [ref=f3e42]:
        - text: Son aquellas que podemos percibir directamente con nuestros
        - strong [ref=f3e43]: sentidos
        - text: ": color, olor, sabor, textura, brillo, sonido. No necesitamos instrumentos para detectarlas, aunque sí debemos ser cuidadosos: no todo lo que brilla es oro, y no todo líquido transparente es agua."
      - generic [ref=f3e44]:
        - generic [ref=f3e45]:
          - paragraph [ref=f3e53]: Color
          - paragraph [ref=f3e54]: Vista
        - generic [ref=f3e55]:
          - paragraph [ref=f3e56]: Olor
          - paragraph [ref=f3e57]: Olfato
        - generic [ref=f3e58]:
          - paragraph [ref=f3e63]: Textura
          - paragraph [ref=f3e64]: Tacto
        - generic [ref=f3e65]:
          - paragraph [ref=f3e68]: Sabor
          - paragraph [ref=f3e69]: Gusto
      - generic [ref=f3e70]:
        - generic [ref=f3e71]: Precaución
        - text: En el laboratorio
        - strong [ref=f3e72]: nunca
        - text: se prueba ni se huele directamente una sustancia desconocida. Las propiedades organolépticas se observan con cuidado y técnicas seguras.
      - paragraph [ref=f3e73]:
        - text: Si bien son útiles en la vida cotidiana, las propiedades organolépticas tienen
        - strong [ref=f3e74]: limitaciones
        - text: ": son subjetivas (cada persona percibe distinto) y no permiten identificar con certeza una sustancia. Para eso necesitamos las propiedades físicas y químicas."
    - generic [ref=f3e75]:
      - heading "Propiedades físicas" [level=2] [ref=f3e76]
      - paragraph [ref=f3e79]:
        - text: Son aquellas que se pueden
        - strong [ref=f3e80]: medir u observar
        - text: "sin cambiar la composición química de la sustancia. Se dividen en dos tipos:"
      - generic [ref=f3e81]:
        - generic [ref=f3e82]:
          - heading "Intensivas" [level=4] [ref=f3e83]
          - paragraph [ref=f3e84]:
            - text: "No dependen de la cantidad de materia. Ejemplos: densidad, punto de fusión, punto de ebullición, color, dureza, conductividad. Son"
            - strong [ref=f3e85]: útiles para identificar sustancias
            - text: .
        - generic [ref=f3e86]:
          - heading "Extensivas" [level=4] [ref=f3e87]
          - paragraph [ref=f3e88]:
            - text: "Dependen de la cantidad de materia. Ejemplos: masa, volumen, longitud, peso. Se"
            - strong [ref=f3e89]: suman
            - text: cuando se juntan dos cuerpos.
      - generic [ref=f3e90]: "\"La densidad es una de las propiedades físicas más importantes. Dos objetos del mismo tamaño pueden tener masas muy diferentes si sus densidades son distintas.\""
