        - paragraph [ref=f9e308]:
          - text: A la izquierda viajan
          - strong [ref=f9e309]: ondas planas
          - text: (como olas rectas que se acercan a la costa). Al pasar por la rendija, la onda se
          - strong [ref=f9e310]: curva
          - text: "y se abre en frentes circulares: eso es la"
          - strong [ref=f9e311]: difracción
