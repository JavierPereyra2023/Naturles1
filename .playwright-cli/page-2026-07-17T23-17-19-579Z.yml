    - generic [ref=f9e314]:
      - generic [ref=f9e315]:
        - generic [ref=f9e316]: "06"
        - heading "Preguntas para pensar" [level=2] [ref=f9e317]
      - generic [ref=f9e318]:
        - paragraph [ref=f9e320]: 1. Si el sonido no viaja en el vacío, ¿por qué en las películas de ciencia ficción se escuchan explosiones en el espacio?
        - paragraph [ref=f9e322]: 2. Un músico toca una nota de 880 Hz. ¿Cuál es su longitud de onda en el aire? (v = 340 m/s). Usá la ecuación v = ? · f.
        - paragraph [ref=f9e324]: 3. ¿Por qué una radio FM y un control remoto de TV no interfieren entre sí si ambos usan ondas electromagnéticas?
        - paragraph [ref=f9e326]: 4. Los auriculares con cancelación de ruido generan una onda "anti-sonido" para silenciar el ruido externo. ¿Qué tipo de interferencia usan y por qué funciona?
        - paragraph [ref=f9e328]: 5. Podés escuchar a alguien hablar desde la otra habitación aunque no lo veas, pero no podés verlo. ¿Qué fenómeno de las ondas explica esta diferencia entre el sonido y la luz?
