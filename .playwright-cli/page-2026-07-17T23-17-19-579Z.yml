      - generic [ref=f9e200]: "\"Por eso vemos el relámpago antes de escuchar el trueno: la luz viaja casi un millón de veces más rápido que el sonido.\""
      - paragraph [ref=f9e201]: Durante una tormenta, la luz del relámpago viaja a 300.000 km/s y llega a nuestros ojos casi instantáneamente. El sonido del trueno, en cambio, viaja a solo 340 m/s. Si la tormenta está a 3,4 km de distancia, el trueno tarda 10 segundos en llegar. Contar los segundos entre el relámpago y el trueno y dividir por 3 da aproximadamente la distancia en kilómetros.
