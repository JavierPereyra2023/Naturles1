  - generic [ref=f9e29]:
    - generic [ref=f9e30]: Física · Calor y Sonido
    - heading "Ondas" [level=1] [ref=f9e33]
    - paragraph [ref=f9e34]: Una onda transporta energía sin transportar materia. Acá vas a ver qué es una onda, cómo se mide y cómo se comporta. Después, el sonido y la luz son dos casos especiales que estudiamos por separado.
  - main [ref=f9e37]:
    - generic [ref=f9e38]:
      - generic [ref=f9e39]:
        - generic [ref=f9e40]: "01"
        - heading "¿Qué es una onda?" [level=2] [ref=f9e41]
      - paragraph [ref=f9e43]: "Una onda es una perturbación que se propaga a través del espacio, transmitiendo energía sin transportar materia. Tirá una piedra a un estanque: las ondas viajan hacia afuera, pero el agua no se desplaza con ellas, solo sube y baja. Así funcionan todas las ondas: transportan energía, no materia."
      - generic [ref=f9e44]: "\"Una onda es una perturbación que transmite energía sin transportar materia.\""
      - paragraph [ref=f9e45]: "Las ondas se clasifican en dos grandes grupos según si necesitan o no un medio material para propagarse:"
      - generic [ref=f9e46]:
        - heading "Ondas mecánicas" [level=3] [ref=f9e47]
        - paragraph [ref=f9e48]: Necesitan un medio material para propagarse. El sonido, las olas del mar y las ondas sísmicas son ejemplos. No pueden viajar en el vacío. Si estuvieras en el espacio, no podrías escuchar nada.
      - generic [ref=f9e49]:
        - heading "Ondas electromagnéticas" [level=3] [ref=f9e50]
        - paragraph [ref=f9e51]: NO necesitan un medio material. Pueden viajar en el vacío. La luz visible, los rayos X, las ondas de radio y los rayos ultravioleta son ondas electromagnéticas. Todas viajan a 300.000 km/s en el vacío.
    - generic [ref=f9e53]:
      - generic [ref=f9e54]:
        - generic [ref=f9e55]: "02"
        - heading "Propiedades de las ondas" [level=2] [ref=f9e56]
      - paragraph [ref=f9e58]: Para describir una onda usamos cinco magnitudes fundamentales. Conocerlas nos permite comparar ondas diferentes y entender fenómenos como la música, los colores o las comunicaciones. Cada propiedad mide un aspecto distinto de la onda.
      - generic [ref=f9e59]:
        - heading "Frecuencia (f)" [level=3] [ref=f9e60]
        - paragraph [ref=f9e61]: Es el número de ciclos (oscilaciones completas) que ocurren en un segundo. Se mide en Hertz (Hz). 1 Hz = 1 ciclo por segundo. El oído humano puede escuchar sonidos entre 20 Hz y 20.000 Hz. La nota La estándar tiene una frecuencia de 440 Hz.
      - generic [ref=f9e62]:
        - heading "Período (T)" [level=3] [ref=f9e63]
        - paragraph [ref=f9e64]: "Es el tiempo que tarda en completarse un ciclo completo. Se mide en segundos. El período y la frecuencia son inversos: T = 1/f. Si una onda tiene frecuencia de 440 Hz, su período es T = 1/440 ˜ 0,0023 segundos."
      - generic [ref=f9e65]:
        - heading "Amplitud (A)" [level=3] [ref=f9e66]
        - paragraph [ref=f9e67]: Es la máxima distancia que alcanza una partícula del medio respecto de su posición de equilibrio. En el sonido, la amplitud determina el volumen (sonidos fuertes o suaves). En la luz, la amplitud determina la intensidad o brillo.
      - generic [ref=f9e68]:
        - heading "Longitud de onda (?)" [level=3] [ref=f9e69]
        - paragraph [ref=f9e70]: Es la distancia entre dos puntos consecutivos que están en la misma fase de la onda, por ejemplo, entre dos crestas consecutivas. Se mide en metros. Las ondas de radio pueden tener longitudes de onda de kilómetros; los rayos gamma, del tamaño del núcleo atómico.
      - generic [ref=f9e71]:
        - heading "Velocidad de propagación (v)" [level=3] [ref=f9e72]
        - paragraph [ref=f9e73]: Es la rapidez con que la onda viaja a través del medio. Depende exclusivamente de las propiedades del medio, no de la frecuencia ni de la amplitud. En el aire a 20°C, el sonido viaja a 340 m/s; en el agua, a 1.500 m/s; y en el acero, a más de 5.000 m/s.
      - generic [ref=f9e74]:
        - generic [ref=f9e75]: Laboratorio visual · Mové los controles
        - img "Onda transversal animada con amplitud y longitud de onda" [ref=f9e80]:
          - generic [ref=f9e81]: posición de equilibrio
          - generic [ref=f9e82]: λ longitud de onda
          - generic [ref=f9e84]: A
          - generic [ref=f9e88]: "la partícula del medio solo sube y baja: la que viaja es la energía"
