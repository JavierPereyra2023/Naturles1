      - paragraph [ref=f9e274]:
        - text: La
        - strong [ref=f9e275]: interferencia
        - text: ocurre cuando dos ondas se superponen. Si llegan
        - emphasis [ref=f9e276]: en fase
        - text: "(cresta con cresta) se refuerzan: interferencia"
        - strong [ref=f9e277]: constructiva
        - text: . Si llegan
        - emphasis [ref=f9e278]: en oposición
        - text: "(cresta con valle) se anulan: interferencia"
        - strong [ref=f9e279]: destructiva
        - text: . Este principio explica los auriculares con cancelación de ruido, los colores de las burbujas de jabón y los patrones de luz en los experimentos de física.
      - generic [ref=f9e280]:
        - generic [ref=f9e281]: Laboratorio visual · Difracción · Cambiá el ancho de la rendija
        - img "Difracción de ondas planas al atravesar una rendija" [ref=f9e286]:
