        - generic [ref=f9e96]: "Así viaja el sonido: onda longitudinal"
        - 'img "Onda longitudinal animada: compresiones y rarefacciones del aire" [ref=f9e101]':
          - generic [ref=f9e103]: compresión (aire apretado)
          - generic [ref=f9e104]: rarefacción (aire estirado)
        - paragraph [ref=f9e105]:
          - text: "Arriba: una"
          - strong [ref=f9e106]: onda transversal
          - text: "(como la luz o las olas), donde el medio vibra perpendicular a la dirección en que viaja la onda. Subí la frecuencia y mirá cómo la longitud de onda se achica: ¡es la ecuación v = λ · f en acción! Abajo: una"
          - strong [ref=f9e107]: onda longitudinal
          - text: (como el sonido), donde las partículas del aire se aprietan y se separan en la misma dirección en que viaja la onda.
    - generic [ref=f9e109]:
      - generic [ref=f9e110]:
        - generic [ref=f9e111]: "03"
        - heading "La ecuación fundamental" [level=2] [ref=f9e112]
      - paragraph [ref=f9e114]: La relación entre velocidad, longitud de onda y frecuencia es una de las ecuaciones más importantes en el estudio de las ondas. Esta ecuación se aplica tanto a ondas mecánicas como electromagnéticas y es la base para entender desde la música hasta las telecomunicaciones.
      - generic [ref=f9e115]:
        - paragraph [ref=f9e116]: "Ecuación fundamental de las ondas:"
        - generic [ref=f9e117]:
          - generic [ref=f9e118]:
            - generic [ref=f9e119]: v
            - generic [ref=f9e121]: =
            - generic [ref=f9e123]: λ
            - generic [ref=f9e125]: ⋅
            - generic [ref=f9e127]: f
          - math [ref=f9e130]:
            - generic [ref=f9e131]: v
            - generic [ref=f9e132]: =
            - generic [ref=f9e133]: λ
            - generic [ref=f9e134]: ⋅
            - generic [ref=f9e135]: f
        - paragraph [ref=f9e136]: v = velocidad de propagación | ? = longitud de onda | f = frecuencia
      - paragraph [ref=f9e137]: La velocidad de una onda es igual al producto de su longitud de onda por su frecuencia. Esto significa que, para una velocidad fija, si la frecuencia aumenta, la longitud de onda disminuye, y viceversa.
      - paragraph [ref=f9e138]: "Veamos un ejemplo concreto con el sonido. Una onda sonora correspondiente a la nota La (440 Hz) viaja a 340 m/s en el aire. Su longitud de onda será:"
      - paragraph [ref=f9e140]: "? = v / f = 340 / 440 ˜ 0,77 m"
      - generic [ref=f9e141]:
        - generic [ref=f9e142]: Velocidad del sonido
        - text: El sonido viaja más rápido en sólidos que en líquidos, y más rápido en líquidos que en gases. En el aire viaja a 340 m/s, pero en el acero supera los 5.000 m/s. ¡Por eso en las películas del oeste apoyaban la oreja en las vías para saber si venía el tren!
      - paragraph [ref=f9e143]: Si la misma nota (440 Hz) se tocara dentro del agua, donde el sonido viaja a 1.500 m/s, su longitud de onda sería ? = 1500/440 ˜ 3,41 m. La frecuencia es la misma —seguimos escuchando un La— pero la longitud de onda cambió porque la velocidad del medio es diferente.
    - generic [ref=f9e145]:
      - generic [ref=f9e146]:
        - generic [ref=f9e147]: "04"
        - 'heading "Dos casos: el sonido y la luz" [level=2] [ref=f9e148]'
      - paragraph [ref=f9e150]: El sonido y la luz son las dos ondas con las que más interactuamos a diario, pero son fundamentalmente diferentes. Las dos comparten las propiedades que ya vimos (frecuencia, amplitud, longitud de onda), pero cada una tiene su propio análisis. Acá las comparamos; en sus páginas las estudiamos a fondo.
