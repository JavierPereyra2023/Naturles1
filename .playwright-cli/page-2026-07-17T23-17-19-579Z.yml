    - generic [ref=f9e224]:
      - generic [ref=f9e225]: Sabías que...
      - paragraph [ref=f9e226]: "El sonido no puede viajar por el espacio porque no hay aire ni medio material que lo transmita. Por eso las explosiones en Star Wars no deberían escucharse: en el vacío nadie puede oírte gritar."
    - generic [ref=f9e227]:
      - generic [ref=f9e228]:
        - generic [ref=f9e229]: "05"
        - heading "Cuando las ondas se encuentran" [level=2] [ref=f9e230]
      - paragraph [ref=f9e232]:
        - text: "Las ondas no chocan como las pelotas: se atraviesan y se"
        - strong [ref=f9e233]: superponen
        - text: . Cuando dos ondas coinciden en el mismo lugar, sus efectos se suman punto por punto. Según cómo lleguen, pueden reforzarse o cancelarse. Y cuando una onda encuentra un obstáculo o una abertura, es capaz de
        - strong [ref=f9e234]: rodearlo
        - text: . Estos dos fenómenos —interferencia y difracción— son la firma inconfundible de todo lo que es onda.
      - generic [ref=f9e235]:
        - generic [ref=f9e236]: Laboratorio visual · Interferencia constructiva
        - img "Dos pulsos hacia arriba viajan en sentidos opuestos, se encuentran y se suman al doble de altura" [ref=f9e243]:
