          - generic [ref=f9e245]: ← viaja · Pulso B
          - generic [ref=f9e249]: ¡el doble de amplitud!
        - paragraph [ref=f9e250]:
          - text: Dos pulsos llegan por lados opuestos,
          - strong [ref=f9e251]: los dos hacia arriba
          - text: ". Al cruzarse en el centro se suman: por un instante forman un pulso del"
          - strong [ref=f9e252]: doble de altura
          - text: . Después siguen su camino intactos. En sonido se escucharía
          - strong [ref=f9e253]: más fuerte
          - text: ; en luz,
          - strong [ref=f9e254]: más brillante
          - text: .
      - generic [ref=f9e255]:
        - generic [ref=f9e256]: Laboratorio visual · Interferencia destructiva
        - img "Un pulso hacia arriba y otro hacia abajo viajan en sentidos opuestos, se encuentran y se cancelan" [ref=f9e262]:
          - generic [ref=f9e263]: Pulso A (arriba) · viaja →
          - generic [ref=f9e264]: ← viaja · Pulso B (abajo)
          - generic [ref=f9e268]: "¡se cancelan: cuerda plana!"
        - paragraph [ref=f9e269]:
          - text: Ahora un pulso va
          - strong [ref=f9e270]: hacia arriba
          - text: y el otro
          - strong [ref=f9e271]: hacia abajo
          - text: . Cuando se encuentran en el centro, la cresta de uno tapa el valle del otro y
          - strong [ref=f9e272]: se cancelan
          - text: ": la cuerda queda plana por un instante. Luego reaparecen y continúan. Así funcionan los"
          - strong [ref=f9e273]: auriculares con cancelación de ruido
