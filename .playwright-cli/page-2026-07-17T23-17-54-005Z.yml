    - main [ref=f15e52]:
      - generic [ref=f15e53]:
        - generic [ref=f15e54]:
          - generic [ref=f15e55]: "01"
          - heading "Leer un grafico" [level=2] [ref=f15e56]
        - paragraph [ref=f15e58]:
          - text: "Los graficos son una herramienta poderosa en fisica: nos permiten"
          - strong [ref=f15e59]: visualizar el movimiento
          - text: "de un solo vistazo. Saber interpretarlos es tan importante como saber calcular con formulas. Un buen grafico cuenta la historia completa del movimiento: donde estaba el objeto, a que velocidad iba, si aceleraba o frenaba."
        - generic [ref=f15e60]: Los graficos nos permiten visualizar el movimiento. Saber interpretarlos es tan importante como saber calcular.
        - generic [ref=f15e61]:
          - paragraph [ref=f15e62]:
            - text: En los graficos de movimiento, por convencion, siempre representamos el
            - strong [ref=f15e63]: tiempo
            - text: en el
            - strong [ref=f15e64]: eje horizontal
            - text: (eje x) y la magnitud que queremos estudiar —posicion o velocidad— en el
            - strong [ref=f15e65]: eje vertical
            - text: (eje y). Esta convencion es universal y facilita la lectura.
          - paragraph [ref=f15e66]: "Hay dos tipos principales de graficos que vamos a trabajar:"
          - list [ref=f15e67]:
            - listitem [ref=f15e68]:
              - strong [ref=f15e69]: "Grafico posicion-tiempo (x vs t):"
              - text: muestra como cambia la posicion del objeto a medida que pasa el tiempo. La pendiente de la curva es la velocidad.
            - listitem [ref=f15e70]:
              - strong [ref=f15e71]: "Grafico velocidad-tiempo (v vs t):"
              - text: muestra como cambia la velocidad del objeto a lo largo del tiempo. La pendiente de la curva es la aceleracion. El area bajo la curva es la distancia recorrida.
          - paragraph [ref=f15e72]: "Ambos graficos estan relacionados: el grafico v vs t es la \"derivada\" del grafico x vs t. Pero no necesitas saber calculo avanzado para interpretarlos: con entender las formas basicas y lo que significan es suficiente."
      - generic [ref=f15e78]:
        - generic [ref=f15e79]:
          - generic [ref=f15e80]: "02"
          - heading "Graficos posicion-tiempo" [level=2] [ref=f15e81]
        - paragraph [ref=f15e83]: "En un grafico x vs t, la forma de la curva nos dice que tipo de movimiento describe el objeto. Hay tres casos fundamentales:"
        - generic [ref=f15e84]:
          - generic [ref=f15e85]:
            - heading "Recta horizontal" [level=4] [ref=f15e87]
            - paragraph [ref=f15e88]:
              - text: El objeto esta
              - strong [ref=f15e89]: detenido
              - text: (reposo). Su posicion no cambia a lo largo del tiempo. La pendiente es cero, por lo tanto la velocidad es cero.
          - generic [ref=f15e90]:
            - heading "Recta inclinada" [level=4] [ref=f15e92]
            - paragraph [ref=f15e93]:
              - text: El objeto describe un
              - strong [ref=f15e94]: MRU
              - text: . La velocidad es constante y es igual a la pendiente de la recta. Cuanto mas inclinada, mayor la velocidad.
          - generic [ref=f15e95]:
            - heading "Curva (parabola)" [level=4] [ref=f15e97]
            - paragraph [ref=f15e98]:
              - text: El objeto describe un
              - strong [ref=f15e99]: MRUV
              - text: . La velocidad cambia constantemente (hay aceleracion). La pendiente de la tangente en cada punto es la velocidad instantanea.
        - generic [ref=f15e100]:
          - generic [ref=f15e101]: La pendiente de la recta tangente en cada punto indica la velocidad instantanea.
          - paragraph [ref=f15e102]:
            - text: Un concepto util es la
            - strong [ref=f15e103]: velocidad instantanea
            - text: ": si en un grafico x vs t trazamos una recta tangente a la curva en un punto determinado, la pendiente de esa recta tangente es la velocidad exacta en ese instante. En el MRU, la velocidad instantanea coincide con la velocidad media (porque es constante). En el MRUV, la velocidad instantanea cambia punto a punto."
          - paragraph [ref=f15e104]:
            - text: Tambien podemos identificar el
            - strong [ref=f15e105]: sentido del movimiento
            - text: ": si la curva sube (pendiente positiva), el objeto se aleja del origen. Si la curva baja (pendiente negativa), el objeto se acerca al origen o retrocede. Si la curva es horizontal, el objeto esta quieto."
        - 'figure "Figura 1 — Grafico posicion-tiempo Comparacion de tres casos: recta horizontal (reposo), recta inclinada (MRU), y parabola (MRUV). La pendiente en cada punto es la velocidad." [ref=f15e106]':
          - 'img "Grafico posicion-tiempo Comparacion de tres casos: recta horizontal (reposo), recta inclinada (MRU), y parabola (MRUV)."'
      - generic [ref=f15e113]:
        - generic [ref=f15e114]:
          - generic [ref=f15e115]: "03"
          - heading "Graficos velocidad-tiempo" [level=2] [ref=f15e116]
        - paragraph [ref=f15e118]:
          - text: "El grafico v vs t es complementario al grafico x vs t y nos da informacion que no podemos ver directamente en el otro: la"
          - strong [ref=f15e119]: aceleracion
          - text: y la
          - strong [ref=f15e120]: distancia recorrida
          - text: .
        - generic [ref=f15e121]:
          - generic [ref=f15e122]:
            - heading "Recta horizontal (v = cte)" [level=4] [ref=f15e124]
            - paragraph [ref=f15e125]:
              - text: "Velocidad constante: el objeto describe un"
              - strong [ref=f15e126]: MRU
              - text: . La aceleracion es cero porque la pendiente de la recta es cero. El area del rectangulo bajo la recta da la distancia recorrida (?x = v · ?t).
          - generic [ref=f15e127]:
            - heading "Recta inclinada (v variable)" [level=4] [ref=f15e129]
            - paragraph [ref=f15e130]:
              - text: "Velocidad que cambia linealmente: el objeto describe un"
              - strong [ref=f15e131]: MRUV
              - text: . La pendiente de la recta es la aceleracion (constante). El area del trapecio bajo la recta da la distancia recorrida.
        - generic [ref=f15e132]:
          - generic [ref=f15e133]: El area bajo la curva de un grafico v vs t representa la distancia recorrida.
          - paragraph [ref=f15e134]:
            - text: "Esta es una de las ideas mas importantes de la cinematica grafica: en un grafico v vs t, si calculamos el"
            - strong [ref=f15e135]: area
            - text: entre la curva y el eje del tiempo, entre dos instantes determinados, obtenemos la
            - strong [ref=f15e136]: distancia recorrida
            - text: "en ese intervalo. No es magia: es geometria aplicada a la fisica."
        - generic [ref=f15e137]:
          - paragraph [ref=f15e138]: Ejemplo practico
          - paragraph [ref=f15e139]: "Un auto viaja a 20 m/s durante 5 segundos (MRU). En el grafico v vs t aparece una recta horizontal a la altura 20 m/s entre t = 0 y t = 5. El area bajo esa recta es un rectangulo de base 5 s y altura 20 m/s:"
          - paragraph [ref=f15e140]:
            - text: Distancia = Area = base × altura = 5 s × 20 m/s =
            - strong [ref=f15e141]: 100 metros
      - generic [ref=f15e147]:
        - generic [ref=f15e148]:
          - generic [ref=f15e149]: "04"
          - heading "Construccion de graficos" [level=2] [ref=f15e150]
        - paragraph [ref=f15e152]: Construir un grafico a partir de una tabla de valores es una habilidad fundamental. Veamos el proceso paso a paso.
        - generic [ref=f15e153]:
          - generic [ref=f15e155]:
            - generic [ref=f15e156]: 1°
            - generic [ref=f15e157]:
              - paragraph [ref=f15e158]: Organizar los datos en una tabla
              - paragraph [ref=f15e159]: "Armar dos columnas: tiempo (t) en la primera y posicion (x) o velocidad (v) en la segunda. Los datos pueden venir de un experimento, de una simulacion o de un problema."
          - generic [ref=f15e161]:
            - generic [ref=f15e162]: 2°
            - generic [ref=f15e163]:
              - paragraph [ref=f15e164]: Elegir escalas adecuadas
              - paragraph [ref=f15e165]: Mirar los valores maximos y minimos de cada variable. Elegir una escala que permita que todos los puntos quepan en el grafico y que el dibujo ocupe la mayor parte del espacio disponible. Las escalas no tienen por que ser iguales en ambos ejes.
          - generic [ref=f15e167]:
            - generic [ref=f15e168]: 3°
            - generic [ref=f15e169]:
              - paragraph [ref=f15e170]: Dibujar los ejes y rotular
              - paragraph [ref=f15e171]: "Trazar el eje x (horizontal) para el tiempo y el eje y (vertical) para la posicion o velocidad. Rotular cada eje con el nombre de la magnitud y la unidad entre parentesis: t (s), x (m), v (m/s). Marcar las divisiones de acuerdo a la escala elegida."
          - generic [ref=f15e173]:
            - generic [ref=f15e174]: 4°
            - generic [ref=f15e175]:
              - paragraph [ref=f15e176]: Marcar los puntos y unir
              - paragraph [ref=f15e177]: Ubicar cada par (t, x) o (t, v) en el grafico con un punto bien visible. Luego unir los puntos. Si es MRU, los puntos formaran una recta. Si es MRUV, formaran una parabola (en x vs t) o una recta inclinada (en v vs t). Si los puntos no quedan perfectamente alineados por errores de medicion, se traza la recta que mejor los aproxime.
          - generic [ref=f15e179]:
            - generic [ref=f15e180]: 5°
            - generic [ref=f15e181]:
              - paragraph [ref=f15e182]: Titulo y analisis
              - paragraph [ref=f15e183]: "Poner un titulo descriptivo (ej: \"Posicion en funcion del tiempo para un movil con MRU\"). Luego interpretar: ¿que tipo de movimiento es? ¿cual es la velocidad? ¿hay aceleracion? ¿en que instante paso por determinada posicion?"
      - generic [ref=f15e189]:
        - generic [ref=f15e190]:
          - generic [ref=f15e191]: "05"
          - heading "Preguntas para pensar" [level=2] [ref=f15e192]
        - paragraph [ref=f15e193]: Estas preguntas te invitan a reflexionar y conectar lo aprendido con situaciones reales. Ideal para debatir en clase o responder en la carpeta.
        - generic [ref=f15e194]:
          - generic [ref=f15e196]:
            - generic [ref=f15e197]: "1."
            - generic [ref=f15e198]:
              - paragraph [ref=f15e199]: ¿Como distingo un MRU de un MRUV mirando solo el grafico x vs t?
              - paragraph [ref=f15e200]:
                - text: "En el grafico x vs t: si ves una"
                - strong [ref=f15e201]: linea recta
                - text: (inclinada) es MRU (velocidad constante). Si ves una
                - strong [ref=f15e202]: curva
                - text: (parabola) es MRUV (velocidad cambiante, aceleracion constante). Si la recta es horizontal, el objeto esta en reposo. Cuanto mas pronunciada sea la curva, mayor es la aceleracion.
          - generic [ref=f15e204]:
            - generic [ref=f15e205]: "2."
            - generic [ref=f15e206]:
              - paragraph [ref=f15e207]: ¿Que informacion me da el grafico v vs t que no me da el grafico x vs t?
              - paragraph [ref=f15e208]:
                - text: El grafico v vs t muestra directamente la
                - strong [ref=f15e209]: velocidad
                - text: en cada instante y, a traves de la pendiente, la
                - strong [ref=f15e210]: aceleracion
                - text: . Ademas, el
                - strong [ref=f15e211]: area bajo la curva
                - text: "representa la distancia recorrida, algo que en el grafico x vs t hay que obtener midiendo la diferencia de alturas. Son graficos complementarios: uno enfoca en la posicion, el otro en la velocidad."
          - generic [ref=f15e213]:
            - generic [ref=f15e214]: "3."
            - generic [ref=f15e215]:
              - paragraph [ref=f15e216]: Si te dan una tabla con valores de tiempo y posicion, ¿como sabes si el movimiento es MRU?
              - paragraph [ref=f15e217]:
                - text: "Calcula la velocidad entre cada par de puntos consecutivos: v = ?x / ?t. Si la velocidad es"
                - strong [ref=f15e218]: siempre la misma
                - text: (o muy parecida, si hay pequenos errores de medicion), el movimiento es MRU. Al graficar, los puntos deberian alinearse sobre una recta. Si la velocidad calculada va cambiando, podria tratarse de un MRUV u otro tipo de movimiento mas complejo.
