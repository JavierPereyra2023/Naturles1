      - generic [ref=f4e161]:
        - generic [ref=f4e162]: Dato curioso
        - text: El vidrio no es un sólido cristalino, es un
        - strong [ref=f4e163]: sólido amorfo
        - text: ". Sus partículas no están ordenadas en una estructura regular. Fluye muy lentamente con el tiempo: los vidrios de las catedrales antiguas son más gruesos en la base que en la parte superior."
      - paragraph [ref=f4e164]:
        - text: La
        - strong [ref=f4e165]: elección del material
        - text: adecuado para cada uso depende de sus propiedades. Para hacer un cable eléctrico necesitamos un metal conductor como el cobre; para el mango de una sartén necesitamos un material aislante térmico como la madera o el plástico; para una botella de agua necesitamos algo impermeable y liviano como el plástico o el vidrio.
    - generic [ref=f4e166]:
      - heading "Preguntas para pensar" [level=2] [ref=f4e167]
      - generic [ref=f4e176]:
        - paragraph [ref=f4e177]: "1.Clasificá estos materiales según su origen (natural, artificial, sintético): cuero, acero, plástico, lana, papel, nailon, piedra."
        - paragraph [ref=f4e178]: 2.¿Por qué los cables eléctricos se hacen de cobre y no de plástico? ¿Qué propiedad es determinante?
        - paragraph [ref=f4e179]: 3.Nombra tres objetos de tu casa e identifica de qué material están hechos y por qué se eligió ese material.
        - paragraph [ref=f4e180]: 4.¿Qué ventajas y desventajas tiene usar plásticos en lugar de vidrio para envases de bebidas?
