  - generic [ref=f4e29]:
    - generic [ref=f4e30]: Química · Materia
    - heading "Tipos de Materiales" [level=1] [ref=f4e33]
    - paragraph [ref=f4e34]: Desde la madera de los árboles hasta los plásticos modernos. Clasificamos los materiales por su origen y composición.
  - main [ref=f4e35]:
    - generic [ref=f4e36]:
      - heading "Clasificación por origen" [level=2] [ref=f4e37]
      - paragraph [ref=f4e40]:
        - text: Los materiales que usamos a diario provienen de distintas fuentes. Según su
        - strong [ref=f4e41]: origen
        - text: ", los clasificamos en tres grandes grupos:"
      - generic [ref=f4e42]:
        - generic [ref=f4e43]:
          - heading "Naturales" [level=4] [ref=f4e48]
          - paragraph [ref=f4e49]: Se obtienen directamente de la naturaleza sin transformación química profunda. Incluyen materiales de origen vegetal, animal y mineral.
          - generic [ref=f4e50]:
            - generic [ref=f4e51]: Madera
            - generic [ref=f4e52]: Algodón
            - generic [ref=f4e53]: Lana
            - generic [ref=f4e54]: Piedra
            - generic [ref=f4e55]: Cuero
        - generic [ref=f4e56]:
          - heading "Artificiales" [level=4] [ref=f4e59]
          - paragraph [ref=f4e60]: Se fabrican transformando materiales naturales mediante procesos físicos (no cambian su composición química).
          - generic [ref=f4e61]:
            - generic [ref=f4e62]: Papel
            - generic [ref=f4e63]: Vidrio
            - generic [ref=f4e64]: Acero
            - generic [ref=f4e65]: Bronce
            - generic [ref=f4e66]: Cerámica
        - generic [ref=f4e67]:
          - heading "Sintéticos" [level=4] [ref=f4e70]
          - paragraph [ref=f4e71]: Se fabrican mediante reacciones químicas a partir de otras sustancias. No existen en la naturaleza tal cual.
          - generic [ref=f4e72]:
            - generic [ref=f4e73]: Plástico
            - generic [ref=f4e74]: Nailon
            - generic [ref=f4e75]: Poliéster
            - generic [ref=f4e76]: Silicona
      - generic [ref=f4e77]: "\"No todos los materiales 'artificiales' son malos, ni todos los 'naturales' son buenos. Lo importante es entender su origen y su impacto en el ambiente.\""
      - paragraph [ref=f4e78]:
        - text: "Una pregunta frecuente: ¿el papel es natural o artificial? La madera es natural, pero el papel se obtiene transformándola mecánica y físicamente, por eso se considera"
        - strong [ref=f4e79]: artificial
        - text: ". El nailon, en cambio, se sintetiza a partir del petróleo mediante reacciones químicas: es"
        - strong [ref=f4e80]: sintético
        - text: .
    - generic [ref=f4e81]:
      - heading "Clasificación por composición" [level=2] [ref=f4e82]
      - paragraph [ref=f4e85]:
        - text: Otra forma de clasificar los materiales es según su
        - strong [ref=f4e86]: composición química y estructura interna
        - text: ":"
      - generic [ref=f4e87]:
        - generic [ref=f4e88]:
          - heading "Metales" [level=4] [ref=f4e89]
          - paragraph [ref=f4e92]: "Buenos conductores de calor y electricidad. Dúctiles (se pueden hacer hilos) y maleables (se pueden hacer láminas). Ejemplos: hierro, aluminio, cobre, oro, plata. La mayoría son sólidos a temperatura ambiente (excepto el mercurio, que es líquido)."
        - generic [ref=f4e93]:
          - heading "Cerámicos" [level=4] [ref=f4e94]
          - paragraph [ref=f4e99]: "Duros, frágiles y resistentes al calor. Malos conductores eléctricos (aislantes). Se obtienen calentando arcillas y otros minerales. Ejemplos: ladrillo, porcelana, vidrio, cemento, loza."
        - generic [ref=f4e100]:
          - heading "Polímeros" [level=4] [ref=f4e101]
          - paragraph [ref=f4e106]: "Formados por moléculas muy largas (macromoléculas) hechas de unidades que se repiten. Livianos, flexibles y aislantes. Ejemplos: polietileno (bolsas), PVC (caños), nailon (telas), teflón (sartenes). Pueden ser naturales (celulosa, caucho) o sintéticos (plásticos)."
        - generic [ref=f4e107]:
          - heading "Materiales compuestos" [level=4] [ref=f4e108]
          - paragraph [ref=f4e114]: "Combinan dos o más materiales para obtener propiedades superiores. Ejemplos: hormigón armado (cemento + acero), fibra de vidrio (vidrio + plástico), fibra de carbono, madera contrachapada."
    - generic [ref=f4e115]:
      - heading "Usos cotidianos" [level=2] [ref=f4e116]
      - paragraph [ref=f4e121]: "Cada tipo de material tiene aplicaciones según sus propiedades. Veamos algunos ejemplos de la vida diaria:"
