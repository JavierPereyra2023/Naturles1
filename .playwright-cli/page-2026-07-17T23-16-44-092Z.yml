      - paragraph [ref=f5e133]:
        - text: Esto quiere decir que si medimos toda la energía presente antes de una transformación y toda la energía presente después, la suma total es
        - strong [ref=f5e134]: exactamente la misma
        - text: . Lo que cambia es la forma en que esa energía se manifiesta.
      - paragraph [ref=f5e135]:
        - strong [ref=f5e136]: "Ejemplo:"
        - text: "cuando encendemos una estufa eléctrica, la energía eléctrica que entra por el cable es igual a la suma de la energía térmica que calienta la habitación más la energía luminosa del resplandor rojo del calefactor, más la pequeña cantidad de energía sonora del zumbido. La cuenta cierra: nada se perdió."
      - 'figure "FIGURA 1 · La conservación de la energía: la suma total nunca cambia" [ref=f5e137]':
        - 'img "· La conservación de la energía: la suma total nunca cambia"'
    - generic [ref=f5e142]:
      - generic [ref=f5e143]:
        - generic [ref=f5e144]: "3"
        - heading "Degradación de la energía" [level=2] [ref=f5e145]
      - paragraph [ref=f5e147]:
        - text: Aunque la energía total se conserva,
        - strong [ref=f5e148]: no toda la energía se transforma en trabajo útil
        - text: . En cada transformación, una parte se disipa inevitablemente en forma de calor que se dispersa en el ambiente y ya no puede ser aprovechada. Este fenómeno se llama
        - strong [ref=f5e149]: degradación de la energía
        - text: .
      - paragraph [ref=f5e150]:
        - text: La degradación está relacionada con el concepto de
        - strong [ref=f5e151]: entropía
        - text: ": en cada proceso, la energía tiende a distribuirse de manera más desordenada. Es como cuando dejás caer un vaso de vidrio: la energía que usaste para levantarlo se \"ordenó\" al ponerlo en la mesa, pero cuando se rompe, esa misma energía se \"desordena\" y no podés volver a juntar los pedazos sin gastar más energía."
      - generic [ref=f5e152]:
        - generic [ref=f5e153]: Analogía
        - paragraph [ref=f5e154]:
          - text: "Imaginá una taza de café caliente sobre la mesa. Con el tiempo se enfría. La energía térmica no desapareció: se transfirió al aire. La cantidad total de energía es la misma, pero ahora está tan dispersa que ya no sirve para calentar nada. Esa energía"
          - strong [ref=f5e155]: se degradó
          - text: .
      - paragraph [ref=f5e156]:
        - text: Para medir qué tan eficiente es una transformación, usamos el concepto de
        - strong [ref=f5e157]: rendimiento
        - text: ":"
