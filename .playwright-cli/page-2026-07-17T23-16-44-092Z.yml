      - paragraph [ref=f5e241]: ¡La lamparita LED es ocho veces más eficiente! Por eso, aunque cuesta más comprarla, a la larga ahorra mucha energía eléctrica.
    - generic [ref=f5e242]:
      - generic [ref=f5e243]: Sabías que...
      - paragraph [ref=f5e244]: Cuando te frotás las manos para calentarlas, estás transformando energía cinética (movimiento) en energía térmica (calor) por fricción. Es la misma idea detrás de encender fuego con dos palitos.
    - generic [ref=f5e248]:
      - generic [ref=f5e249]:
        - generic [ref=f5e250]: "4"
        - heading "Preguntas para pensar" [level=2] [ref=f5e251]
      - paragraph [ref=f5e252]: Reflexioná sobre lo aprendido y respondé en tu carpeta.
      - generic [ref=f5e253]:
        - generic [ref=f5e255]:
          - generic [ref=f5e256]: "1."
          - generic [ref=f5e257]:
            - paragraph [ref=f5e258]: ¿Qué transformaciones de energía ocurren cuando pedaleás una bicicleta?
            - paragraph [ref=f5e259]: La energía química de los alimentos que consumiste se transformó en energía química almacenada en tus músculos. Al pedalear, esa energía química se convierte en energía cinética (el movimiento de tus piernas y de la bici). También se genera energía térmica (tu cuerpo se calienta) y energía sonora (el ruido de la cadena y las ruedas).
        - generic [ref=f5e261]:
          - generic [ref=f5e262]: "2."
          - generic [ref=f5e263]:
            - paragraph [ref=f5e264]: Si la energía no se crea ni se destruye, ¿por qué se "gasta" la pila de un control remoto?
            - paragraph [ref=f5e265]: "La energía de la pila no desaparece: se transforma en energía eléctrica, luego en luz infrarroja (el LED del control) y una pequeña cantidad de calor. Cuando decimos que la pila \"se gastó\", en realidad queremos decir que las sustancias químicas de su interior ya reaccionaron completamente y no pueden liberar más energía útil. La energía que contenían ya se transformó y se dispersó en el ambiente."
        - generic [ref=f5e267]:
          - generic [ref=f5e268]: "3."
          - generic [ref=f5e269]:
            - paragraph [ref=f5e270]: Un auto consume 100 J de energía del combustible pero solo 25 J se convierten en movimiento. ¿Cuál es el rendimiento? ¿A dónde fue el resto?
            - paragraph [ref=f5e271]:
              - text: "Rendimiento: ? = (25 J / 100 J) × 100% ="
              - strong [ref=f5e272]: 25%
              - text: ". El 75% restante (75 J) se degradó principalmente como calor: los gases de escape calientes, el rozamiento de las piezas del motor, la fricción de los neumáticos con el asfalto y el calentamiento de los frenos. ¡Los autos a nafta son bastante ineficientes!"
        - generic [ref=f5e274]:
          - generic [ref=f5e275]: "4."
          - generic [ref=f5e276]:
            - paragraph [ref=f5e277]: ¿Cuál es la ventaja de usar un panel solar en vez de quemar carbón para obtener electricidad?
            - paragraph [ref=f5e278]: "El panel solar aprovecha una fuente renovable e inagotable (el Sol) sin emitir gases contaminantes. El carbón, en cambio, es un recurso no renovable que al quemarse libera dióxido de carbono (CO2) y otros contaminantes. Sin embargo, el panel solar también tiene limitaciones: no genera energía de noche y su fabricación consume recursos."
