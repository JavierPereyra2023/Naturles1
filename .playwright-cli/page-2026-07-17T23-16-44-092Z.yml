  - generic [ref=f5e31]:
    - generic [ref=f5e32]: Física · La Energía
    - heading "Transformaciones de la Energía" [level=1] [ref=f5e35]
    - paragraph [ref=f5e36]: La energía no se crea ni se destruye, solo se transforma. Este principio rige todos los fenómenos del universo. Pero no toda la energía que se transforma puede aprovecharse.
  - main [ref=f5e37]:
    - generic [ref=f5e38]:
      - generic [ref=f5e39]:
        - generic [ref=f5e40]: "1"
        - heading "La energía se transforma" [level=2] [ref=f5e41]
      - paragraph [ref=f5e43]:
        - text: La energía no se crea ni se destruye, solo se transforma. Este es el
        - strong [ref=f5e44]: principio de conservación de la energía
        - text: ", una de las leyes más fundamentales de la física. En cada proceso natural o tecnológico, la energía cambia de una forma a otra, pero la cantidad total siempre es la misma."
      - generic [ref=f5e45]: En cada transformación, parte de la energía se degrada en forma de calor que no se puede aprovechar completamente.
      - paragraph [ref=f5e46]: "Veamos algunos ejemplos cotidianos de cadenas de transformación energética:"
      - generic [ref=f5e47]:
        - generic [ref=f5e48]:
          - heading "Linterna a pilas" [level=3] [ref=f5e50]
          - paragraph [ref=f5e51]: Las pilas contienen sustancias químicas que reaccionan entre sí liberando electrones. Esa corriente eléctrica llega al foco, que se calienta y emite luz.
          - generic [ref=f5e52]:
