        - heading "Conservación de la energía" [level=2] [ref=f5e90]
      - paragraph [ref=f5e92]: El principio de conservación afirma que, en un sistema aislado, la cantidad total de energía permanece constante. La energía puede cambiar de forma —de cinética a potencial, de química a eléctrica, de eléctrica a luminosa— pero nunca aparece de la nada ni desaparece sin dejar rastro.
