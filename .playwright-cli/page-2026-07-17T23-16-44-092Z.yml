        - generic [ref=f5e60]:
          - heading "Automóvil a nafta" [level=3] [ref=f5e62]
          - paragraph [ref=f5e63]: La nafta contiene energía química. Al explotar dentro del motor, se transforma en energía térmica (gases calientes que se expanden) y esa expansión empuja los pistones, generando movimiento.
          - generic [ref=f5e64]:
