          - heading "Panel solar" [level=3] [ref=f5e78]
          - paragraph [ref=f5e79]: Las celdas fotovoltaicas del panel capturan la energía de la luz solar y la convierten directamente en electricidad mediante un fenómeno llamado efecto fotoeléctrico.
