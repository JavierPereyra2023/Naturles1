  - generic [ref=f4e31]:
    - generic [ref=f4e32]: Física · La Energía
    - heading "Fuentes de Energía" [level=1] [ref=f4e35]
    - paragraph [ref=f4e36]: ¿De dónde obtenemos la energía que usamos a diario? Algunas fuentes son ilimitadas y limpias, otras son finitas y contaminan. Conocerlas nos ayuda a tomar mejores decisiones.
  - main [ref=f4e37]:
    - generic [ref=f4e38]:
      - generic [ref=f4e39]:
        - generic [ref=f4e40]: "1"
        - heading "Fuentes renovables" [level=2] [ref=f4e41]
      - paragraph [ref=f4e43]:
        - text: Las
        - strong [ref=f4e44]: fuentes renovables
        - text: son aquellas que se reponen naturalmente en un período corto de tiempo. La naturaleza las regenera tan rápido o más rápido de lo que las consumimos. Son virtualmente inagotables y, en general, tienen un bajo impacto ambiental.
      - generic [ref=f4e45]: Las energías renovables se obtienen de fuentes que la naturaleza repone continuamente.
      - generic [ref=f4e46]:
        - generic [ref=f4e47]:
          - heading "Energía Solar" [level=3] [ref=f4e53]
          - paragraph [ref=f4e54]:
            - text: Proviene de la radiación del
            - strong [ref=f4e55]: Sol
            - text: ". Se captura con paneles fotovoltaicos (que generan electricidad) o con colectores térmicos (que calientan agua). Es la fuente de energía más abundante: en una hora, la Tierra recibe del Sol más energía de la que toda la humanidad consume en un año. Argentina tiene zonas con excelente radiación solar, especialmente en el Noroeste y Cuyo."
        - generic [ref=f4e56]:
          - heading "Energía Eólica" [level=3] [ref=f4e58]
          - paragraph [ref=f4e59]:
            - text: Aprovecha la fuerza del
            - strong [ref=f4e60]: viento
            - text: para mover grandes turbinas (molinos de viento modernos) que generan electricidad. Las zonas ventosas, como la Patagonia argentina, tienen un enorme potencial eólico. Es una de las fuentes renovables que más creció en el mundo en los últimos años.
        - generic [ref=f4e61]:
          - heading "Energía Hidroeléctrica" [level=3] [ref=f4e63]
          - paragraph [ref=f4e64]:
            - text: Utiliza la energía potencial del
            - strong [ref=f4e65]: agua
            - text: "acumulada en represas. Al liberar el agua, esta cae desde una gran altura y mueve turbinas que generan electricidad. Es la principal fuente de energía renovable en Argentina: represas como Yacyretá, Salto Grande y El Chocón abastecen a millones de hogares."
        - generic [ref=f4e66]:
          - heading "Biomasa" [level=3] [ref=f4e68]
          - paragraph [ref=f4e69]:
            - text: Se obtiene de
            - strong [ref=f4e70]: materia orgánica
            - text: ": restos de plantas, residuos agrícolas, estiércol, madera. Al quemarse o descomponerse, libera energía química almacenada. Se puede usar para generar electricidad, calor o biocombustibles como el biodiesel y el bioetanol. Es renovable porque las plantas vuelven a crecer."
        - generic [ref=f4e71]:
          - heading "Energía Geotérmica" [level=3] [ref=f4e73]
          - paragraph [ref=f4e74]:
            - text: Aprovecha el
            - strong [ref=f4e75]: calor del interior de la Tierra
            - text: . En zonas volcánicas, el agua subterránea se calienta naturalmente y puede usarse para generar electricidad o calefacción. En Argentina hay potencial geotérmico en la región de la Cordillera de los Andes.
    - generic [ref=f4e79]:
      - generic [ref=f4e80]:
        - generic [ref=f4e81]: "2"
        - heading "Fuentes no renovables" [level=2] [ref=f4e82]
      - paragraph [ref=f4e84]:
        - text: Las
        - strong [ref=f4e85]: fuentes no renovables
        - text: existen en cantidades limitadas en la naturaleza. Se formaron hace millones de años mediante procesos geológicos y biológicos, y las estamos consumiendo mucho más rápido de lo que la naturaleza tarda en producirlas. Son la principal causa de emisiones de gases de efecto invernadero.
      - paragraph [ref=f4e86]:
        - text: Se las llama también
        - strong [ref=f4e87]: combustibles fósiles
        - text: porque provienen de restos de organismos vivos (plantas y animales) que quedaron enterrados y sometidos a altas presiones y temperaturas durante millones de años.
      - generic [ref=f4e88]:
        - generic [ref=f4e89]:
          - heading "Petróleo" [level=3] [ref=f4e91]
          - paragraph [ref=f4e92]:
            - text: Líquido oscuro que se extrae de yacimientos subterráneos. De él se obtienen la
            - strong [ref=f4e93]: nafta
            - text: ", el gasoil, el queroseno y muchos plásticos. Es la fuente de energía más usada en el transporte mundial. Argentina tiene importantes yacimientos en Vaca Muerta (Neuquén). Su combustión libera grandes cantidades de CO2."
        - generic [ref=f4e94]:
          - heading "Carbón" [level=3] [ref=f4e96]
          - paragraph [ref=f4e97]:
            - text: Roca sedimentaria negra formada a partir de restos vegetales prehistóricos. Se quema en
            - strong [ref=f4e98]: centrales termoeléctricas
            - text: "para generar electricidad. Es el combustible fósil más abundante pero también el más contaminante: libera más CO2 por unidad de energía que el petróleo o el gas. Su extracción en minas es peligrosa."
        - generic [ref=f4e99]:
          - heading "Gas Natural" [level=3] [ref=f4e101]
          - paragraph [ref=f4e102]:
            - text: Compuesto principalmente por
            - strong [ref=f4e103]: metano
            - text: (CH4). Se usa para calefacción, cocinas y generación de electricidad. Es el combustible fósil más limpio (emite menos CO2 que el carbón y el petróleo). En Argentina es la principal fuente de energía para calefacción hogareña gracias a los yacimientos de la Cuenca Neuquina.
        - generic [ref=f4e104]:
          - heading "Energía Nuclear (Uranio)" [level=3] [ref=f4e111]
          - paragraph [ref=f4e112]:
            - text: Se obtiene de la
            - strong [ref=f4e113]: fisión
            - text: "de átomos de uranio en reactores nucleares. El calor generado se usa para producir vapor que mueve turbinas eléctricas. No emite CO2, pero genera residuos radiactivos peligrosos que deben almacenarse por miles de años. Argentina tiene tres centrales nucleares: Atucha I, Atucha II y Embalse."
    - generic [ref=f4e117]:
      - generic [ref=f4e118]:
        - generic [ref=f4e119]: "3"
        - 'heading "Comparación: renovables vs. no renovables" [level=2] [ref=f4e120]'
      - generic [ref=f4e121]:
        - generic [ref=f4e122]: Argentina en datos
        - paragraph [ref=f4e123]:
          - text: Según datos de 2023, aproximadamente el
          - strong [ref=f4e124]: 60%
          - text: de la electricidad argentina proviene de fuentes térmicas (gas y petróleo), el
          - strong [ref=f4e125]: 22%
          - text: de hidroeléctrica, el
          - strong [ref=f4e126]: 7%
          - text: de nuclear y el
          - strong [ref=f4e127]: 11%
          - text: de renovables (eólica y solar).
      - paragraph [ref=f4e129]: Ninguna fuente de energía es perfecta. Cada una tiene sus ventajas y desventajas. Entenderlas nos permite hacer un uso más responsable y pensar en el futuro energético que queremos.
      - table [ref=f4e131]:
        - rowgroup [ref=f4e132]:
          - row [ref=f4e133]:
            - columnheader "Característica" [ref=f4e134]
            - columnheader "Renovables" [ref=f4e135]
            - columnheader "No renovables" [ref=f4e136]
        - rowgroup [ref=f4e137]:
          - row [ref=f4e138]:
            - cell "Disponibilidad" [ref=f4e139]
            - cell "Inagotables a escala humana" [ref=f4e140]
            - cell "Limitadas, se agotarán" [ref=f4e141]
          - row [ref=f4e142]:
            - cell "Emisiones de CO2" [ref=f4e143]
            - cell "Muy bajas o nulas" [ref=f4e144]
            - cell "Altas (principal causa del cambio climático)" [ref=f4e145]
          - row [ref=f4e146]:
            - cell "Residuos" [ref=f4e147]
            - cell "Mínimos" [ref=f4e148]
            - cell "Contaminantes (cenizas, residuos radiactivos, derrames)" [ref=f4e149]
          - row [ref=f4e150]:
            - cell "Costo a largo plazo" [ref=f4e151]
            - cell "Bajo (el \"combustible\" es gratis)" [ref=f4e152]
            - cell "Creciente (el recurso se agota y es más caro extraerlo)" [ref=f4e153]
          - row [ref=f4e154]:
            - cell "Confiabilidad" [ref=f4e155]
            - cell "Variable (depende del sol, viento, agua)" [ref=f4e156]
            - cell "Constante (disponible 24/7)" [ref=f4e157]
          - row [ref=f4e158]:
            - cell "Instalación inicial" [ref=f4e159]
            - cell "Cara (paneles, molinos, represas)" [ref=f4e160]
            - cell "Infraestructura ya existente en muchos países" [ref=f4e161]
      - paragraph [ref=f4e162]:
        - strong [ref=f4e163]: El desafío del siglo XXI
        - text: es hacer la transición hacia una matriz energética más limpia y sostenible, combinando distintas fuentes renovables para superar sus limitaciones y reduciendo progresivamente nuestra dependencia de los combustibles fósiles.
      - paragraph [ref=f4e164]: Esto no solo es importante para frenar el cambio climático, sino también para garantizar que las futuras generaciones tengan acceso a la energía que necesitan para vivir.
    - generic [ref=f4e168]:
      - generic [ref=f4e169]:
        - generic [ref=f4e170]: "4"
        - heading "Preguntas para pensar" [level=2] [ref=f4e171]
      - paragraph [ref=f4e172]: Reflexioná sobre lo aprendido y respondé en tu carpeta.
      - generic [ref=f4e173]:
        - generic [ref=f4e175]:
          - generic [ref=f4e176]: "1."
          - generic [ref=f4e177]:
            - paragraph [ref=f4e178]: ¿Por qué el petróleo, el carbón y el gas se consideran no renovables si la Tierra sigue produciéndolos?
            - paragraph [ref=f4e179]:
              - text: Porque la Tierra tarda
              - strong [ref=f4e180]: millones de años
              - text: en formar nuevos depósitos de combustibles fósiles. Los estamos consumiendo en apenas décadas, a un ritmo muchísimo más rápido del que la naturaleza puede reponerlos. A escala humana, son recursos finitos que se agotarán.
        - generic [ref=f4e182]:
          - generic [ref=f4e183]: "2."
          - generic [ref=f4e184]:
            - paragraph [ref=f4e185]: ¿Cuál es la principal desventaja de la energía solar y la eólica frente a las centrales térmicas?
            - paragraph [ref=f4e186]:
              - text: Su
              - strong [ref=f4e187]: intermitencia
              - text: ": no hay sol de noche ni en días nublados, y el viento no siempre sopla. Las centrales térmicas, en cambio, funcionan de manera continua. Por eso se necesitan sistemas de almacenamiento (como baterías) o combinar distintas fuentes renovables para garantizar el suministro eléctrico todo el tiempo."
        - generic [ref=f4e189]:
          - generic [ref=f4e190]: "3."
          - generic [ref=f4e191]:
            - paragraph [ref=f4e192]: ¿Qué ventaja tiene la energía nuclear frente a los combustibles fósiles? ¿Y qué desventaja?
            - paragraph [ref=f4e193]:
              - strong [ref=f4e194]: "Ventaja:"
              - text: no emite CO2 ni otros gases de efecto invernadero durante su funcionamiento, y con muy poco uranio se genera muchísima energía.
              - strong [ref=f4e195]: "Desventaja:"
              - text: produce residuos radiactivos que permanecen peligrosos durante miles de años y requieren un almacenamiento extremadamente seguro. Además, un accidente nuclear puede tener consecuencias graves.
        - generic [ref=f4e197]:
          - generic [ref=f4e198]: "4."
          - generic [ref=f4e199]:
            - paragraph [ref=f4e200]: ¿Qué pequeñas acciones podés hacer vos y tu familia para consumir menos energía de fuentes no renovables?
            - paragraph [ref=f4e201]: Apagar las luces al salir de una habitación, desenchufar los aparatos que no se usan, usar lamparitas LED, aprovechar la luz natural durante el día, caminar o usar la bici en vez del auto para trayectos cortos, y regular el termostato de la calefacción y el aire acondicionado. ¡Pequeños gestos que suman!
