      - generic [ref=f14e53]:
        - generic [ref=f14e54]:
          - generic [ref=f14e55]: "01"
          - heading "Cuando la velocidad cambia" [level=2] [ref=f14e56]
        - paragraph [ref=f14e58]:
          - text: En el MRU la velocidad es constante. Pero en la mayoria de los movimientos que vemos a diario —un auto que arranca, una pelota que cae, un ascensor que frena— la velocidad
          - strong [ref=f14e59]: cambia
          - text: . Cuando la velocidad de un objeto aumenta, decimos que acelera. Cuando disminuye, decimos que desacelera (o frena).
        - generic [ref=f14e60]: Si un movil cambia su velocidad, decimos que esta acelerando. La aceleracion mide ese cambio.
        - generic [ref=f14e61]:
          - paragraph [ref=f14e62]:
            - text: El
            - strong [ref=f14e63]: MRUV
            - text: (Movimiento Rectilineo Uniformemente Variado) es el tipo de movimiento donde la
            - strong [ref=f14e64]: aceleracion es constante
            - text: ". Esto significa que la velocidad cambia de manera uniforme: en cada segundo que pasa, la velocidad aumenta (o disminuye) siempre la misma cantidad."
          - paragraph [ref=f14e65]: A diferencia del MRU, donde la posicion cambia linealmente con el tiempo, en el MRUV la velocidad cambia linealmente y la posicion cambia de forma parabolica. Esto tiene consecuencias importantes a la hora de graficar y de calcular distancias recorridas.
          - paragraph [ref=f14e66]: "Pensemos en un ejemplo cotidiano: cuando un colectivo arranca despues de un semaforo, su velocidad va aumentando gradualmente desde 0 km/h hasta la velocidad de circulacion. Ese aumento controlado es aceleracion en accion. Si el colectivero aprieta el acelerador siempre de la misma manera, la aceleracion es constante y estamos ante un MRUV."
      - generic [ref=f14e72]:
