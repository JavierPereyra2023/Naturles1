      - generic [ref=f14e265]:
        - generic [ref=f14e266]:
          - generic [ref=f14e267]: "03"
          - heading "Caida libre" [level=2] [ref=f14e268]
        - generic [ref=f14e269]:
          - generic [ref=f14e270]: Dato curioso
          - paragraph [ref=f14e271]: En la Luna, donde no hay aire, un martillo y una pluma caen al mismo tiempo. El astronauta David Scott lo demostro en la mision Apolo 15, en 1971, dejando caer ambos objetos simultaneamente ante las camaras. ¡Llegaron al suelo lunar exactamente juntos!
        - generic [ref=f14e272]:
          - paragraph [ref=f14e273]:
            - text: La caida libre es un caso especial (y muy importante) de MRUV. Cuando soltamos un objeto cerca de la superficie de la Tierra, este cae con una aceleracion constante llamada
            - strong [ref=f14e274]: aceleracion de la gravedad
            - text: ", que se representa con la letra g."
          - paragraph [ref=f14e275]:
            - text: "En la Tierra, el valor de la gravedad es aproximadamente:"
            - strong [ref=f14e276]: g = 9,8 m/s²
            - text: . Esto significa que un objeto en caida libre aumenta su velocidad en 9,8 metros por segundo cada segundo que pasa. Es decir, al primer segundo viaja a 9,8 m/s, al segundo a 19,6 m/s, al tercero a 29,4 m/s, y asi en adelante.
          - paragraph [ref=f14e277]:
            - text: En la Tierra,
            - strong [ref=f14e278]: todos los cuerpos caen con la misma aceleracion
            - text: "si no hay resistencia del aire. Esto fue demostrado por Galileo hace mas de 400 años: una pluma y una piedra, en el vacio, caen a la misma velocidad. Lo que ocurre en la vida cotidiana es que el aire frena mas a la pluma por su forma y superficie, no porque \"pese menos\"."
