      - generic [ref=f14e359]:
        - generic [ref=f14e360]:
          - generic [ref=f14e361]: "04"
          - heading "Preguntas para pensar" [level=2] [ref=f14e362]
        - paragraph [ref=f14e363]: Estas preguntas te invitan a reflexionar y conectar lo aprendido con situaciones reales. Ideal para debatir en clase o responder en la carpeta.
        - generic [ref=f14e364]:
          - generic [ref=f14e366]:
            - generic [ref=f14e367]: "1."
            - generic [ref=f14e368]:
              - paragraph [ref=f14e369]: ¿Cual es la diferencia principal entre MRU y MRUV?
              - paragraph [ref=f14e370]:
                - text: En el MRU la
                - strong [ref=f14e371]: velocidad es constante
                - text: y la aceleracion es cero. En el MRUV la
                - strong [ref=f14e372]: aceleracion es constante
                - text: (distinta de cero) y la velocidad cambia de manera uniforme. En el MRU, la distancia recorrida crece linealmente con el tiempo; en el MRUV, la distancia crece de forma parabolica porque la velocidad va aumentando.
          - generic [ref=f14e374]:
            - generic [ref=f14e375]: "2."
            - generic [ref=f14e376]:
              - paragraph [ref=f14e377]: ¿Por que una pluma y una piedra no caen al mismo tiempo en el aire?
              - paragraph [ref=f14e378]:
                - text: Por la
                - strong [ref=f14e379]: resistencia del aire
                - text: . La pluma tiene una superficie grande y poco peso, por lo que el aire la frena mucho. La piedra, mas compacta y pesada, atraviesa el aire con mucha menos resistencia. Sin embargo, en el vacio (sin aire), ambas caerian exactamente juntas, como lo comprobo Galileo hace siglos y lo confirmo el astronauta David Scott en la Luna.
          - generic [ref=f14e381]:
            - generic [ref=f14e382]: "3."
            - generic [ref=f14e383]:
              - paragraph [ref=f14e384]: Si un auto frena, ¿su aceleracion es positiva o negativa?
              - paragraph [ref=f14e385]:
                - text: Es
                - strong [ref=f14e386]: negativa
                - text: "(tambien llamada desaceleracion). Si el auto va hacia adelante (velocidad positiva) y frena, la aceleracion es negativa porque la velocidad final es menor que la inicial. Matematicamente: a = (vf - vi) / ?t. Si vf < vi, el resultado es negativo. Sin embargo, el auto sigue estando en MRUV: su velocidad cambia de manera uniforme, solo que hacia valores menores."
