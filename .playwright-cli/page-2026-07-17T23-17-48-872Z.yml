          - paragraph [ref=f14e182]:
            - strong [ref=f14e183]: "Interpretacion:"
            - text: Una aceleracion de 2 m/s² significa que la velocidad aumenta
            - strong [ref=f14e184]: 2 metros por segundo cada segundo
            - text: . Si un objeto parte del reposo (vi = 0), despues de 1 segundo su velocidad sera 2 m/s, despues de 2 segundos sera 4 m/s, despues de 3 segundos sera 6 m/s, y asi sucesivamente.
          - generic [ref=f14e185]: Un auto acelera de 0 a 100 km/h (27,8 m/s) en 10 segundos. Su aceleracion es a = 27,8 / 10 = 2,78 m/s².
          - paragraph [ref=f14e186]:
            - text: La aceleracion puede ser
            - strong [ref=f14e187]: positiva
            - text: (el objeto aumenta su velocidad) o
            - strong [ref=f14e188]: negativa
            - text: (el objeto disminuye su velocidad, es decir, frena). En la vida cotidiana, cuando decimos "acelerar" normalmente nos referimos a aumentar la velocidad, pero en fisica el termino abarca cualquier cambio de velocidad, incluida la desaceleracion.
