  - generic [ref=f10e29]:
    - generic [ref=f10e30]: Física · Calor y Sonido
    - heading "El Sonido" [level=1] [ref=f10e33]
    - paragraph [ref=f10e34]: "El sonido es un caso especial de onda: una onda mecánica que nace de una vibración y necesita un medio material para viajar. Veamos cómo se produce, cómo se propaga y por qué lo escuchamos como lo escuchamos."
  - main [ref=f10e37]:
    - generic [ref=f10e38]:
      - generic [ref=f10e39]:
        - generic [ref=f10e40]: "01"
        - heading "¿Qué es el sonido?" [level=2] [ref=f10e41]
      - paragraph [ref=f10e43]:
        - text: El sonido es una
        - strong [ref=f10e44]: onda mecánica
        - text: ": se origina cuando un objeto vibra y hace vibrar al medio que lo rodea (casi siempre el aire). Esa vibración se transmite de partícula en partícula hasta llegar a nuestro oído. Como toda onda mecánica, el sonido"
        - strong [ref=f10e45]: necesita un medio material
        - text: "para propagarse: por eso no puede viajar en el vacío del espacio."
      - generic [ref=f10e46]: "\"Todo sonido empieza con una vibración: las cuerdas vocales, la cuerda de una guitarra, el parche de un tambor.\""
      - generic [ref=f10e47]:
        - generic [ref=f10e48]:
          - heading "Mecánica" [level=3] [ref=f10e49]
          - paragraph [ref=f10e50]: Necesita materia (aire, agua, sólidos). En el vacío no hay sonido.
        - generic [ref=f10e51]:
          - heading "Longitudinal" [level=3] [ref=f10e52]
          - paragraph [ref=f10e53]:
            - text: Las partículas vibran en la
            - strong [ref=f10e54]: misma dirección
            - text: en que viaja la onda.
        - generic [ref=f10e55]:
          - heading "Nace de una vibración" [level=3] [ref=f10e56]
          - paragraph [ref=f10e57]: Un objeto que vibra empuja el aire y crea la onda sonora.
    - generic [ref=f10e59]:
      - generic [ref=f10e60]:
        - generic [ref=f10e61]: "02"
        - heading "¿Cómo se propaga?" [level=2] [ref=f10e62]
      - paragraph [ref=f10e64]:
        - text: Cuando un objeto vibra, empuja las partículas de aire que tiene al lado, que se amontonan formando una
        - strong [ref=f10e65]: compresión
        - text: . Luego el objeto vuelve atrás y esas partículas se separan, formando una
        - strong [ref=f10e66]: rarefacción
        - text: ". Este patrón de aire apretado y estirado viaja por el aire: eso es el sonido moviéndose. Las partículas no viajan con la onda, solo van y vienen en su lugar."
      - generic [ref=f10e67]:
        - generic [ref=f10e68]: Onda longitudinal · compresiones y rarefacciones
        - 'img "Onda longitudinal: las partículas del aire se comprimen y se separan en la dirección de avance" [ref=f10e73]':
          - generic [ref=f10e75]: compresión (aire apretado)
          - generic [ref=f10e76]: rarefacción (aire estirado)
          - generic [ref=f10e77]: la onda viaja →, pero cada partícula solo va y vuelve en su lugar
        - paragraph [ref=f10e78]:
          - text: Donde las líneas se juntan hay una
          - strong [ref=f10e79]: compresión
          - text: (más presión); donde se separan, una
          - strong [ref=f10e80]: rarefacción
          - text: (menos presión). Esa alternancia de presión es lo que tu tímpano detecta y tu cerebro interpreta como sonido.
    - generic [ref=f10e82]:
      - generic [ref=f10e83]:
        - generic [ref=f10e84]: "03"
        - heading "La velocidad del sonido" [level=2] [ref=f10e85]
      - paragraph [ref=f10e87]:
        - text: ¿Sabías que el sonido viaja más rápido en el agua que en el aire, y todavía más rápido en los sólidos? La velocidad del sonido depende del
        - strong [ref=f10e88]: medio
        - text: ": cuanto más juntas y unidas están las partículas, más rápido se pasan la vibración. Por eso viaja mejor en el acero que en el aire."
      - generic [ref=f10e89]:
        - generic [ref=f10e90]: Velocidad del sonido según el medio
        - img "Comparación de la velocidad del sonido en aire, agua y acero" [ref=f10e95]:
          - generic [ref=f10e96]: Aire (20°C) · 340 m/s
          - generic [ref=f10e98]: Agua · 1.500 m/s
          - generic [ref=f10e100]: Acero · ~5.100 m/s
          - generic [ref=f10e102]: más partículas juntas = el sonido viaja más rápido →
      - generic [ref=f10e103]:
        - generic [ref=f10e104]: El truco del tren
        - text: "En las películas del oeste, apoyaban la oreja en las vías para oír si venía el tren: el sonido viaja por el acero a más de 5.000 m/s, mucho antes de que llegue por el aire."
      - paragraph [ref=f10e105]:
        - text: "Ojo: la velocidad"
        - strong [ref=f10e106]: "no"
        - text: depende de si el sonido es fuerte o agudo. Un susurro y un grito viajan a la misma velocidad por el aire. Lo único que cambia la velocidad es el medio (y su temperatura).
    - generic [ref=f10e108]:
      - generic [ref=f10e109]:
        - generic [ref=f10e110]: "04"
        - heading "Las cualidades del sonido" [level=2] [ref=f10e111]
      - paragraph [ref=f10e113]: "No todos los sonidos son iguales: distinguimos un grave de un agudo, un susurro de un grito, y la voz de un amigo de la de un cantante. Eso se debe a tres cualidades del sonido, y cada una se relaciona con una propiedad de la onda."
      - generic [ref=f10e114]:
        - generic [ref=f10e115]:
          - generic [ref=f10e116]: Altura = frecuencia
          - img "Onda grave de baja frecuencia y onda aguda de alta frecuencia" [ref=f10e117]:
            - generic [ref=f10e118]: Grave (pocos ciclos)
            - generic [ref=f10e120]: Agudo (muchos ciclos)
          - paragraph [ref=f10e122]:
            - text: Más frecuencia → sonido más
            - strong [ref=f10e123]: agudo
            - text: . Menos frecuencia → más
            - strong [ref=f10e124]: grave
            - text: .
        - generic [ref=f10e125]:
          - generic [ref=f10e126]: Intensidad = amplitud
          - img "Onda suave de baja amplitud y onda fuerte de alta amplitud" [ref=f10e127]:
            - generic [ref=f10e128]: Suave (poca amplitud)
            - generic [ref=f10e130]: Fuerte (mucha amplitud)
          - paragraph [ref=f10e132]:
            - text: Más amplitud → sonido más
            - strong [ref=f10e133]: fuerte
            - text: . Menos amplitud → más
            - strong [ref=f10e134]: suave
            - text: .
      - generic [ref=f10e135]:
        - heading "Timbre = la \"huella\" del sonido" [level=3] [ref=f10e136]
        - paragraph [ref=f10e142]: "Es lo que nos permite distinguir dos instrumentos que tocan la misma nota con el mismo volumen: un piano y una guitarra suenan distinto por su timbre. El timbre depende de la forma de la onda, propia de cada fuente sonora. Por eso reconocés la voz de alguien con solo escucharla."
    - generic [ref=f10e144]:
      - generic [ref=f10e145]:
        - generic [ref=f10e146]: "05"
        - heading "El oído y el rango audible" [level=2] [ref=f10e147]
      - paragraph [ref=f10e149]:
        - text: "El oído humano no escucha todas las frecuencias: solo las que están entre los"
        - strong [ref=f10e150]: 20 Hz y los 20.000 Hz
        - text: . Por debajo y por encima de ese rango existen sonidos reales que nosotros no podemos oír, pero otros animales sí.
      - generic [ref=f10e151]:
        - generic [ref=f10e152]:
          - heading "Infrasonido" [level=3] [ref=f10e153]
          - paragraph [ref=f10e154]:
            - text: Menos de
            - strong [ref=f10e155]: 20 Hz
            - text: . Los elefantes y las ballenas se comunican a grandes distancias con infrasonidos.
        - generic [ref=f10e156]:
          - heading "Sonido audible" [level=3] [ref=f10e157]
          - paragraph [ref=f10e158]:
            - text: Entre
            - strong [ref=f10e159]: 20 y 20.000 Hz
            - text: . Es todo lo que podemos escuchar las personas.
        - generic [ref=f10e160]:
          - heading "Ultrasonido" [level=3] [ref=f10e161]
          - paragraph [ref=f10e162]:
            - text: Más de
            - strong [ref=f10e163]: 20.000 Hz
            - text: . Los murciélagos lo usan para orientarse y se usa en las ecografías.
      - generic [ref=f10e164]:
        - generic [ref=f10e165]: Sabías que...
        - paragraph [ref=f10e166]: "Los murciélagos \"ven\" con sonido: emiten ultrasonidos y escuchan el eco que rebota para ubicar insectos en plena oscuridad. Se llama ecolocalización. Las ecografías que ves del cuerpo humano usan el mismo principio."
    - generic [ref=f10e168]:
      - generic [ref=f10e169]:
        - generic [ref=f10e170]: "06"
        - heading "El eco" [level=2] [ref=f10e171]
      - paragraph [ref=f10e173]:
        - text: Cuando gritás frente a una montaña o en un lugar grande y vacío, el sonido choca contra una superficie y
        - strong [ref=f10e174]: rebota
        - text: "hacia vos: eso es el eco. Como el sonido tarda en ir y volver, escuchás tu propia voz un instante después. Es la misma idea que usan el sonar de los barcos y la ecolocalización de los murciélagos."
      - paragraph [ref=f10e175]:
        - text: "Con el eco se puede medir distancias. Si gritás y el eco vuelve en 2 segundos, el sonido recorrió ida y vuelta en ese tiempo. A 340 m/s: 340 × 2 = 680 m en total, así que la pared está a la mitad:"
        - strong [ref=f10e176]: 340 metros
        - text: .
    - generic [ref=f10e178]:
      - generic [ref=f10e179]:
        - generic [ref=f10e180]: "07"
        - heading "Preguntas para pensar" [level=2] [ref=f10e181]
      - generic [ref=f10e182]:
        - paragraph [ref=f10e184]: 1. Si el sonido no viaja en el vacío, ¿por qué en las películas de ciencia ficción se escuchan explosiones en el espacio?
        - paragraph [ref=f10e186]: 2. Un músico toca una nota de 880 Hz. ¿Cuál es su longitud de onda en el aire? (v = 340 m/s). Usá la ecuación v = λ · f.
        - paragraph [ref=f10e188]: 3. ¿Qué cualidad del sonido cambia cuando subís el volumen de la música? ¿Y cuál cambia entre una nota grave y una aguda?
        - paragraph [ref=f10e190]: 4. Gritás en un cañón y el eco vuelve en 3 segundos. ¿A qué distancia está la pared que lo refleja? (v = 340 m/s).
