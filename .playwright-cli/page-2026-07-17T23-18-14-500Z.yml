        - generic [ref=f18e344]:
          - generic [ref=f18e345]:
            - heading "Eclipse lunar" [level=3] [ref=f18e347]
            - paragraph [ref=f18e348]:
              - text: Un eclipse lunar ocurre cuando la
              - strong [ref=f18e349]: Tierra se interpone
              - text: entre el Sol y la Luna. Al interponerse, nuestro planeta bloquea los rayos de luz solar directa e introduce a la Luna Llena dentro de su gigantesco cono de sombra.
            - paragraph [ref=f18e350]:
              - text: Durante la totalidad, la Luna no se vuelve completamente invisible. En su lugar, se tiñe de un color rojizo cobrizo muy particular, conocido como la
              - strong [ref=f18e351]: "\"Luna de sangre\""
              - text: . Esto ocurre porque la atmósfera terrestre actúa como una lente, refractando los rayos de luz solar de color rojo (los de mayor longitud de onda) hacia el interior de la sombra y proyectándolos sobre la superficie de la Luna.
            - paragraph [ref=f18e352]: "* A diferencia del solar, el eclipse lunar es completamente seguro de observar a simple vista y se puede ver desde cualquier lugar de la Tierra donde sea de noche."
          - generic [ref=f18e355]:
