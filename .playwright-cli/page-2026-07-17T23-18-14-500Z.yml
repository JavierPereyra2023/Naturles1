            - heading "Eclipse solar" [level=3] [ref=f18e285]
            - paragraph [ref=f18e286]:
              - text: Un eclipse solar ocurre cuando la
              - strong [ref=f18e287]: Luna se interpone
              - text: exactamente entre el Sol y la Tierra. Al alinearse, el pequeño cuerpo lunar bloquea la inmensa luz del disco solar y proyecta su cono de sombra sobre una franja muy estrecha de la superficie terrestre.
            - paragraph [ref=f18e288]:
              - text: En las zonas bajo la
              - strong [ref=f18e289]: umbra
              - text: (sombra total), el día se hace de noche por unos minutos, la temperatura desciende súbitamente y la atmósfera externa del Sol (la corona) brilla de manera espectacular. Fuera de esta franja, en la
              - strong [ref=f18e290]: penumbra
              - text: ", el eclipse se observa solo como parcial."
            - generic [ref=f18e291]:
              - strong [ref=f18e292]: ⚠️ ¡IMPORTANTE PARA LA OBSERVACIÓN!
              - text: Nunca mires directamente al Sol durante un eclipse solar sin lentes con filtro especial (ISO 12312-2) o filtros de soldador número 14 o superior. Los anteojos de sol normales no protegen tus retinas.
