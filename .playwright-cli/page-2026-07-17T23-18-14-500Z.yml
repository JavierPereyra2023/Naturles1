    - generic [ref=f18e34]: Eje 3 · La Tierra y la Luna
    - heading "La Tierra y la Luna" [level=1] [ref=f18e37]
    - paragraph [ref=f18e38]: "La Tierra no esta quieta: gira sobre si misma y alrededor del Sol. Su compañera, la Luna, tambien se mueve y nos regala fases y eclipses. Entendamos estos movimientos que definen nuestros dias, noches y estaciones."
