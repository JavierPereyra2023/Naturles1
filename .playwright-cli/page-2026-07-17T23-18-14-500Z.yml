              - paragraph [ref=f18e130]:
                - text: El hemisferio sur alcanza su maxima inclinacion hacia el Sol. Es el
                - strong [ref=f18e131]: dia mas largo
                - text: del año. Los rayos solares caen directamente sobre el Tropico de Capricornio.
            - generic [ref=f18e132]:
              - paragraph [ref=f18e133]: Solsticio de invierno (jun)
              - paragraph [ref=f18e134]:
                - text: El hemisferio sur esta inclinado lejos del Sol. Es el
                - strong [ref=f18e135]: dia mas corto
                - text: . Los rayos caen sobre el Tropico de Cancer (hemisferio norte).
            - generic [ref=f18e136]:
              - paragraph [ref=f18e137]: Equinoccio de otoño (mar)
              - paragraph [ref=f18e138]:
                - text: El Sol ilumina por igual ambos hemisferios. El dia y la noche duran aproximadamente
                - strong [ref=f18e139]: 12 horas cada uno
                - text: en todo el planeta.
            - generic [ref=f18e140]:
              - paragraph [ref=f18e141]: Equinoccio de primavera (sep)
              - paragraph [ref=f18e142]: "Igual que el de otoño: ambos hemisferios reciben la misma cantidad de luz. Dia y noche de igual duracion."
