        - generic [ref=f18e412]:
          - heading "¿Por qué no hay eclipses todos los meses si la Luna orbita la Tierra cada 29.5 días?" [level=4] [ref=f18e413]
          - paragraph [ref=f18e414]:
            - text: La órbita de la Luna alrededor de la Tierra no está perfectamente alineada con la órbita de la Tierra alrededor del Sol (plano de la eclíptica). Está inclinada aproximadamente
            - strong [ref=f18e415]: 5°
            - text: .
          - paragraph [ref=f18e416]:
            - text: Debido a esta inclinación, la mayoría de las veces la Luna pasa "por arriba" o "por abajo" de la sombra terrestre (en Luna Llena) o de la línea visual del Sol (en Luna Nueva). Solo cuando la Luna nueva o llena coincide exactamente con los puntos de cruce entre ambos planos orbitales (llamados
            - strong [ref=f18e417]: nodos orbitales
            - text: ), se produce la alineación perfecta necesaria para un eclipse. Puedes comprobar este fenómeno variando el control de
            - strong [ref=f18e418]: "\"Inclinación de Órbita\""
            - text: en el simulador lunar de arriba.
        - generic [ref=f18e419]:
          - generic [ref=f18e420]: Dato curioso
          - paragraph [ref=f18e421]:
            - text: Los eclipses solares totales son raros en un mismo lugar. El proximo visible en Argentina sera en
            - strong [ref=f18e422]: "2027"
            - text: . ¡Anotalo en el calendario!
      - generic [ref=f18e423]:
        - generic [ref=f18e424]: Sabías que...
        - paragraph [ref=f18e425]: La Luna se aleja de la Tierra 3.8 centímetros por año, aproximadamente lo que crecen tus uñas. Dentro de millones de años será tan pequeña en el cielo que ya no habrá eclipses totales de Sol.
      - generic [ref=f18e431]:
        - generic [ref=f18e432]:
          - generic [ref=f18e433]: "05"
          - heading "Preguntas para pensar" [level=2] [ref=f18e434]
        - generic [ref=f18e435]:
          - generic [ref=f18e437]:
            - generic [ref=f18e438]: "1."
            - generic [ref=f18e439]:
              - paragraph [ref=f18e440]: Si la Tierra gira a 1.670 km/h, ¿por que no salimos volando?
              - paragraph [ref=f18e441]:
                - text: La
                - strong [ref=f18e442]: gravedad
                - text: nos mantiene pegados al suelo. La fuerza centrifuga generada por la rotacion terrestre existe, pero es muy debil comparada con la atraccion gravitatoria (en el ecuador, la gravedad es solo un 0,3% menor que en los polos). Ademas, la atmosfera gira con la Tierra, asi que no sentimos un "viento" de 1.670 km/h.
          - generic [ref=f18e444]:
            - generic [ref=f18e445]: "2."
            - generic [ref=f18e446]:
              - paragraph [ref=f18e447]: ¿Por que hace mas calor en verano si la Tierra esta mas lejos del Sol?
              - paragraph [ref=f18e448]:
                - text: Porque las estaciones dependen de la
                - strong [ref=f18e449]: inclinacion del eje terrestre
                - text: ", no de la distancia al Sol. En verano, tu hemisferio esta inclinado hacia el Sol: los rayos llegan mas"
                - strong [ref=f18e450]: directos
                - text: (menos filtrados por la atmosfera) y el dia dura
                - strong [ref=f18e451]: mas horas
                - text: ", acumulando mas calor. En invierno, los rayos llegan oblicuos y el dia es mas corto."
          - generic [ref=f18e453]:
            - generic [ref=f18e454]: "3."
            - generic [ref=f18e455]:
              - paragraph [ref=f18e456]: ¿Por que siempre vemos la misma cara de la Luna?
              - paragraph [ref=f18e457]:
                - text: Por la
                - strong [ref=f18e458]: rotacion sincronica
                - text: ": la Luna tarda lo mismo en girar sobre si misma (27,3 dias) que en dar una vuelta completa a la Tierra. Es un efecto de las fuerzas de marea entre ambos cuerpos a lo largo de millones de años. No es casualidad: es un fenomeno comun en el universo (muchas lunas de Jupiter y Saturno tambien lo muestran)."
          - generic [ref=f18e460]:
            - generic [ref=f18e461]: "4."
            - generic [ref=f18e462]:
              - paragraph [ref=f18e463]: ¿En que se diferencia un eclipse solar de uno lunar?
              - paragraph [ref=f18e464]:
                - text: "Tres diferencias clave: (1) En el solar, la"
                - strong [ref=f18e465]: Luna tapa al Sol
                - text: ; en el lunar, la
                - strong [ref=f18e466]: Tierra tapa a la Luna
                - text: . (2) El solar solo se ve en una
                - strong [ref=f18e467]: franja estrecha
                - text: ; el lunar se ve desde
                - strong [ref=f18e468]: todo el hemisferio nocturno
                - text: . (3) El solar requiere proteccion ocular para mirarlo; el lunar se puede mirar a simple vista sin peligro.
