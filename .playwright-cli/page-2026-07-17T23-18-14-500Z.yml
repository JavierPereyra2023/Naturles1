      - generic [ref=f18e202]:
        - generic [ref=f18e203]:
          - generic [ref=f18e204]: "03"
          - heading "La Luna" [level=2] [ref=f18e205]
        - paragraph [ref=f18e207]:
          - text: La Luna es el
          - strong [ref=f18e208]: unico satelite natural
          - text: "de la Tierra. No tiene luz propia: la vemos brillante porque"
          - strong [ref=f18e209]: refleja la luz del Sol
          - text: . Su diametro es de aproximadamente 3.474 km, casi un cuarto del diametro terrestre. Es el quinto satelite mas grande del Sistema Solar.
        - paragraph [ref=f18e210]:
          - text: "Un dato fascinante: la"
          - strong [ref=f18e211]: cara visible de la Luna es siempre la misma
          - text: porque su periodo de rotacion esta sincronizado con su periodo orbital alrededor de la Tierra (ambos duran unos 27,3 dias). Este fenomeno se llama
          - strong [ref=f18e212]: rotacion sincronica
          - text: "o acoplamiento de marea. La \"cara oculta\" de la Luna no es oscura: recibe tanta luz solar como la visible, pero nunca la vemos desde la Tierra."
