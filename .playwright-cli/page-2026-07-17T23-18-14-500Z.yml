            - heading "Luna nueva" [level=4] [ref=f18e255]
            - paragraph [ref=f18e256]:
              - text: La Luna esta entre la Tierra y el Sol. Su cara iluminada mira hacia el Sol, no hacia nosotros.
              - strong [ref=f18e257]: No se ve
              - text: desde la Tierra.
          - generic [ref=f18e258]:
            - heading "Cuarto creciente" [level=4] [ref=f18e260]
