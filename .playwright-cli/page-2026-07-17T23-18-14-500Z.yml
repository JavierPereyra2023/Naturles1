              - text: Vemos la mitad derecha iluminada. La porcion visible
              - strong [ref=f18e262]: crece
              - text: dia a dia. Visible en el cielo de la tarde.
          - generic [ref=f18e263]:
            - heading "Luna llena" [level=4] [ref=f18e265]
