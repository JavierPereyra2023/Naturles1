    - main [ref=f18e55]:
      - generic [ref=f18e56]:
        - generic [ref=f18e57]:
          - generic [ref=f18e58]: "01"
          - 'heading "Rotacion: el dia y la noche" [level=2] [ref=f18e59]'
        - paragraph [ref=f18e61]:
          - text: La Tierra gira sobre su propio eje una vez cada
          - strong [ref=f18e62]: 24 horas
          - text: . Este movimiento se llama
          - strong [ref=f18e63]: rotacion
          - text: ". Es el responsable directo de la sucesion del dia y la noche: la mitad del planeta que mira al Sol esta iluminada (de dia), mientras que la otra mitad queda en sombra (de noche)."
        - paragraph [ref=f18e64]:
          - text: La linea que separa la parte iluminada de la parte en sombra se llama
          - strong [ref=f18e65]: terminador
          - text: . A medida que la Tierra gira, el terminador se va desplazando sobre la superficie y produce el amanecer y el atardecer en cada lugar.
        - generic [ref=f18e66]:
          - text: “
          - generic [ref=f18e68]:
            - paragraph [ref=f18e69]: Idea clave
            - paragraph [ref=f18e70]:
              - text: El eje de rotacion de la Tierra esta inclinado
              - strong [ref=f18e71]: 23,5°
              - text: respecto al plano de su orbita. Esta inclinacion es la causa de las estaciones del año, no la distancia al Sol.
        - generic [ref=f18e72]:
          - generic [ref=f18e73]:
            - heading "Duracion" [level=4] [ref=f18e74]
            - paragraph [ref=f18e75]:
              - text: 1 rotacion completa =
              - strong [ref=f18e76]: 24 horas
          - generic [ref=f18e77]:
            - heading "Velocidad en el ecuador" [level=4] [ref=f18e78]
            - paragraph [ref=f18e79]:
              - text: Aprox.
              - strong [ref=f18e80]: 1.670 km/h
        - paragraph [ref=f18e81]: Aunque no lo sintamos, en el ecuador nos movemos a mas de 1.600 km/h solo por la rotacion terrestre. No lo percibimos porque todo a nuestro alrededor —el suelo, el aire, nosotros mismos— se mueve a la misma velocidad, como cuando viajamos en un avion en vuelo estable.
      - generic [ref=f18e87]:
        - generic [ref=f18e88]:
          - generic [ref=f18e89]: "02"
          - 'heading "Traslacion: el año y las estaciones" [level=2] [ref=f18e90]'
        - paragraph [ref=f18e92]:
          - text: La Tierra orbita alrededor del Sol una vez cada
          - strong [ref=f18e93]: 365 dias y 6 horas
          - text: . Este movimiento se llama
          - strong [ref=f18e94]: traslacion
          - text: . Esas 6 horas extra son la razon de que cada 4 años tengamos un año bisiesto (29 de febrero), para compensar el desfase acumulado.
        - generic [ref=f18e95]:
          - generic [ref=f18e96]: Dato curioso
          - paragraph [ref=f18e97]:
            - text: En el hemisferio sur, la Tierra esta mas cerca del Sol (perihelio) en
            - strong [ref=f18e98]: enero
            - text: ", ¡pleno verano argentino! La distancia al Sol NO causa las estaciones. Lo que las causa es la"
            - strong [ref=f18e99]: inclinacion del eje
            - text: .
        - paragraph [ref=f18e100]:
          - text: Las estaciones
          - strong [ref=f18e101]: NO se producen por la distancia de la Tierra al Sol
          - text: ", sino por la"
          - strong [ref=f18e102]: inclinacion del eje terrestre
          - text: "(23,5°). Cuando el hemisferio sur esta inclinado hacia el Sol, los rayos llegan mas directos y los dias son mas largos: es"
          - strong [ref=f18e103]: verano en Argentina
          - text: . Seis meses despues, cuando el hemisferio norte se inclina hacia el Sol, aca es invierno.
        - generic [ref=f18e104]:
