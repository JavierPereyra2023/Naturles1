      - generic [ref=f9e198]: Sabías que...
      - paragraph [ref=f9e199]: La destilación se usa para separar el alcohol del agua. Como el alcohol hierve a 78°C y el agua a 100°C, se evaporan por separado. Este método permite producir bebidas destiladas y combustibles.
