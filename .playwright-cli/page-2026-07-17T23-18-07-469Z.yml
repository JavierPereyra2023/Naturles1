              - strong [ref=f17e212]: planeta enano
              - text: "en 2006 por la Union Astronomica Internacional. No cumple con uno de los tres criterios para ser planeta: no ha \"limpiado\" su orbita de otros objetos. Ahora pertenece a la categoria de planetas enanos junto con Ceres, Eris, Makemake y Haumea."
