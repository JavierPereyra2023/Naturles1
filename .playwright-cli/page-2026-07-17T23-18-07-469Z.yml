      - generic [ref=f17e274]:
        - generic [ref=f17e275]:
          - generic [ref=f17e276]: "03"
          - heading "Movimientos planetarios" [level=2] [ref=f17e277]
        - paragraph [ref=f17e279]:
          - text: Los planetas no se mueven en circulos perfectos. Gracias al trabajo de
          - strong [ref=f17e280]: Johannes Kepler
          - text: (1609-1619), hoy sabemos que describen
          - strong [ref=f17e281]: orbitas elipticas
          - text: "alrededor del Sol. La elipse es una figura geometrica parecida a un circulo achatado: el Sol ocupa uno de sus focos, no el centro exacto."
        - generic [ref=f17e282]:
          - generic [ref=f17e283]:
            - heading "Las Leyes de Kepler" [level=3] [ref=f17e289]
            - list [ref=f17e290]:
              - listitem [ref=f17e291]:
                - generic [ref=f17e292]: 1ª
                - generic [ref=f17e293]:
                  - strong [ref=f17e294]: "Ley de las orbitas:"
                  - text: Los planetas se mueven en elipses, con el Sol en uno de los focos.
              - listitem [ref=f17e295]:
                - generic [ref=f17e296]: 2ª
                - generic [ref=f17e297]:
                  - strong [ref=f17e298]: "Ley de las areas:"
                  - text: Un planeta barre areas iguales en tiempos iguales. Cuando esta mas cerca del Sol, se mueve mas rapido.
              - listitem [ref=f17e299]:
                - generic [ref=f17e300]: 3ª
                - generic [ref=f17e301]:
                  - strong [ref=f17e302]: "Ley de los periodos:"
                  - text: El cuadrado del periodo orbital es proporcional al cubo de la distancia media al Sol.
          - generic [ref=f17e303]:
            - heading "El plano de la ecliptica" [level=3] [ref=f17e311]
            - paragraph [ref=f17e312]:
              - text: "Todos los planetas orbitan aproximadamente en el mismo plano: el"
              - strong [ref=f17e313]: plano de la ecliptica
              - text: . Y todos lo hacen en el
              - strong [ref=f17e314]: mismo sentido
              - text: "(antihorario visto desde el norte). Esto no es casualidad: es una herencia de la forma en que se formo el Sistema Solar a partir de un disco giratorio de gas y polvo hace 4.600 millones de anos."
