    - main [ref=f17e54]:
      - generic [ref=f17e55]:
        - generic [ref=f17e56]:
          - generic [ref=f17e57]: "01"
          - heading "El Sol, nuestra estrella" [level=2] [ref=f17e58]
        - paragraph [ref=f17e60]:
          - text: El
          - strong [ref=f17e61]: Sol
          - text: es una estrella de tipo espectral G2, tambien conocida como "enana amarilla". Contiene el
          - strong [ref=f17e62]: 99,8% de la masa total
          - text: "del Sistema Solar. Todo lo demas —planetas, lunas, asteroides, cometas— representa apenas el 0,2% restante. El Sol no es un planeta ni una roca: es una enorme esfera de plasma donde ocurre la fusion nuclear."
        - generic [ref=f17e63]:
          - text: “
          - paragraph [ref=f17e64]: El Sol es una estrella de tipo espectral G2. Contiene el 99,8% de la masa total del Sistema Solar.
        - generic [ref=f17e65]:
          - generic [ref=f17e66]:
            - heading "Edad" [level=4] [ref=f17e71]
            - paragraph [ref=f17e72]:
              - strong [ref=f17e73]: 4.600 millones
              - text: de años
          - generic [ref=f17e74]:
            - heading "Temperatura superficial" [level=4] [ref=f17e77]
            - paragraph [ref=f17e78]:
              - text: Aprox.
              - strong [ref=f17e79]: 5.500°C
          - generic [ref=f17e80]:
            - heading "Temperatura del nucleo" [level=4] [ref=f17e83]
            - paragraph [ref=f17e84]:
              - strong [ref=f17e85]: 15 millones °C
        - generic [ref=f17e86]:
          - generic [ref=f17e87]: Dato curioso
          - paragraph [ref=f17e88]:
            - text: La luz del Sol tarda
            - strong [ref=f17e89]: 8 minutos y 20 segundos
            - text: en llegar a la Tierra. Si el Sol se apagara, no lo sabriamos hasta 8 minutos despues.
        - paragraph [ref=f17e90]:
          - text: La energia del Sol proviene de la
          - strong [ref=f17e91]: fusion nuclear
          - text: ": en su nucleo, los atomos de hidrogeno se fusionan para formar helio, liberando enormes cantidades de energia en forma de luz y calor. Cada segundo, el Sol convierte aproximadamente 600 millones de toneladas de hidrogeno en helio. Se estima que le queda combustible para otros"
          - strong [ref=f17e92]: 5.000 millones de años
          - text: mas.
        - paragraph [ref=f17e93]: Sin el Sol, la Tierra seria un lugar oscuro, helado y sin vida. La fotosintesis de las plantas, el ciclo del agua, los vientos y hasta los combustibles fosiles que usamos —todos dependen directa o indirectamente de la energia solar. El Sol es, literalmente, la fuente de casi toda la energia que usamos.
      - generic [ref=f17e99]:
        - generic [ref=f17e100]:
          - generic [ref=f17e101]: "02"
          - heading "Los 8 planetas" [level=2] [ref=f17e102]
        - paragraph [ref=f17e103]:
          - text: El Sistema Solar tiene
          - strong [ref=f17e104]: 8 planetas
          - text: (Pluton fue reclasificado como planeta enano en 2006 por la Union Astronomica Internacional). Se dividen en dos grupos bien diferenciados.
        - heading [level=3] [ref=f17e105]
        - generic [ref=f17e111]:
          - generic [ref=f17e112]:
            - heading "Mercurio" [level=4] [ref=f17e116]
            - paragraph [ref=f17e117]:
              - text: El mas pequeño y cercano al Sol. Sin atmosfera. Temperaturas extremas de
              - strong [ref=f17e118]: "-180°C a 430°C"
              - text: .
            - generic [ref=f17e119]:
              - generic [ref=f17e120]: 0,39 UA
              - generic [ref=f17e121]: 88 dias/ano
          - generic [ref=f17e122]:
            - heading "Venus" [level=4] [ref=f17e126]
            - paragraph [ref=f17e127]:
              - text: Similar en tamaño a la Tierra.
              - strong [ref=f17e128]: Efecto invernadero extremo
              - text: . Gira al reves (rotacion retrograda).
            - generic [ref=f17e129]:
              - generic [ref=f17e130]: 462°C
              - generic [ref=f17e131]: 0,72 UA
          - generic [ref=f17e132]:
            - heading "Tierra" [level=4] [ref=f17e136]
            - paragraph [ref=f17e137]:
              - text: El unico con
              - strong [ref=f17e138]: agua liquida
              - text: "y vida confirmada. Un satelite natural: la"
              - strong [ref=f17e139]: Luna
              - text: .
            - generic [ref=f17e140]:
              - generic [ref=f17e141]: 1 UA
              - generic [ref=f17e142]: 365 dias
          - generic [ref=f17e143]:
            - heading "Marte" [level=4] [ref=f17e147]
            - paragraph [ref=f17e148]:
              - text: El
              - strong [ref=f17e149]: "\"planeta rojo\""
              - text: ". Monte Olimpo: el volcan mas alto del Sistema Solar. Color por oxido de hierro."
            - generic [ref=f17e150]:
              - generic [ref=f17e151]: 1,5 UA
              - generic [ref=f17e152]: 687 dias
        - generic [ref=f17e157]:
          - heading "Cinturon de asteroides" [level=4] [ref=f17e158]
          - paragraph [ref=f17e159]: Ubicado entre Marte y Jupiter. Restos de la formacion del Sistema Solar que nunca llegaron a formar un planeta por la influencia gravitatoria de Jupiter.
        - heading [level=3] [ref=f17e160]
        - generic [ref=f17e166]:
          - generic [ref=f17e167]:
            - heading "Jupiter" [level=4] [ref=f17e169]
            - paragraph [ref=f17e170]:
              - text: El mas grande del Sistema Solar.
              - strong [ref=f17e171]: Gran Mancha Roja
              - text: ": tormenta activa por siglos. Tiene"
              - strong [ref=f17e172]: 95 lunas
              - text: conocidas.
            - generic [ref=f17e173]:
              - generic [ref=f17e174]: 5,2 UA
              - generic [ref=f17e175]: 12 años
          - generic [ref=f17e176]:
            - heading "Saturno" [level=4] [ref=f17e180]
            - paragraph [ref=f17e181]:
              - text: Anillos espectaculares de hielo y roca. Su densidad es
              - strong [ref=f17e182]: menor que la del agua
              - text: ": flotaria en una piscina gigante."
            - generic [ref=f17e183]:
              - generic [ref=f17e184]: 9,5 UA
              - generic [ref=f17e185]: Densidad < agua
          - generic [ref=f17e186]:
            - heading "Urano" [level=4] [ref=f17e189]
            - paragraph [ref=f17e190]:
              - text: Gira
              - strong [ref=f17e191]: "\"acostado\""
              - text: ": su eje esta inclinado 98°. Color azul verdoso por el metano en su atmosfera."
            - generic [ref=f17e192]:
              - generic [ref=f17e193]: 19 UA
              - generic [ref=f17e194]: Eje 98°
          - generic [ref=f17e195]:
            - heading "Neptuno" [level=4] [ref=f17e199]
            - paragraph [ref=f17e200]:
              - text: "Vientos mas rapidos del Sistema Solar:"
              - strong [ref=f17e201]: 2.000 km/h
              - text: . Ultimo planeta. Color azul intenso por metano.
            - generic [ref=f17e202]:
              - generic [ref=f17e203]: 30 UA
              - generic [ref=f17e204]: Vientos 2000 km/h
