    - generic [ref=f17e34]: Eje 3 · El Sol y los Planetas
    - heading "El Sol y los Planetas" [level=1] [ref=f17e37]
    - paragraph [ref=f17e38]: El Sol es el centro de nuestro sistema. A su alrededor orbitan 8 planetas con características asombrosas y muy diferentes entre sí. Conozcamos nuestra vecindad cósmica.
