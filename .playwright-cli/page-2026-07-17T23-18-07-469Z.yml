      - generic [ref=f17e358]:
        - generic [ref=f17e359]: Sabías que...
        - paragraph [ref=f17e360]: En Júpiter cabrían más de 1300 Tierras. Su Gran Mancha Roja es una tormenta del tamaño de la Tierra que lleva activa más de 350 años.
      - generic [ref=f17e366]:
        - generic [ref=f17e367]:
          - generic [ref=f17e368]: "04"
          - heading "Preguntas para pensar" [level=2] [ref=f17e369]
        - generic [ref=f17e370]:
          - generic [ref=f17e372]:
            - generic [ref=f17e373]: "1."
            - generic [ref=f17e374]:
              - paragraph [ref=f17e375]: ¿Por que los planetas no se caen ni se escapan del Sistema Solar?
              - paragraph [ref=f17e376]:
                - text: "Por el equilibrio entre dos fuerzas: la"
                - strong [ref=f17e377]: gravedad del Sol
                - text: ", que los atrae hacia el centro, y la"
                - strong [ref=f17e378]: inercia
                - text: del movimiento de cada planeta, que tiende a seguir en linea recta. La combinacion de ambas hace que los planetas sigan una orbita curva alrededor del Sol sin caerse ni escaparse.
          - generic [ref=f17e380]:
            - generic [ref=f17e381]: "2."
            - generic [ref=f17e382]:
              - paragraph [ref=f17e383]: ¿Por que los planetas rocosos estan cerca del Sol y los gaseosos lejos?
              - paragraph [ref=f17e384]: Durante la formacion del Sistema Solar, la radiacion solar barrio los gases livianos de las zonas cercanas al Sol. Cerca, solo quedaron los materiales rocosos y metalicos (que resisten el calor). Lejos, donde hacia mas frio, el hielo y los gases pudieron acumularse y formar los gigantes gaseosos.
          - generic [ref=f17e386]:
            - generic [ref=f17e387]: "3."
            - generic [ref=f17e388]:
              - paragraph [ref=f17e389]: Si Jupiter es el mas grande, ¿por que no es una estrella?
              - paragraph [ref=f17e390]:
                - text: Porque no tiene suficiente masa. Para que se active la
                - strong [ref=f17e391]: fusion nuclear
                - text: y un objeto se convierta en estrella, necesita al menos
                - strong [ref=f17e392]: 80 veces la masa de Jupiter
                - text: . A veces se dice que Jupiter es una "estrella fallida", pero en realidad le falta muchisimo para serlo.
          - generic [ref=f17e394]:
            - generic [ref=f17e395]: "4."
            - generic [ref=f17e396]:
              - paragraph [ref=f17e397]: ¿Por que la Tierra es el unico planeta con vida (que conozcamos)?
              - paragraph [ref=f17e398]:
                - text: "Por una combinacion de factores:"
                - strong [ref=f17e399]: distancia ideal al Sol
                - text: (zona habitable, donde el agua puede ser liquida), una atmosfera que regula la temperatura, un campo magnetico que nos protege de la radiacion solar, y agua en los tres estados. Ningun otro planeta del Sistema Solar reune todas estas condiciones al mismo tiempo.
