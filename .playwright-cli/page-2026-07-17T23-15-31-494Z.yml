    - generic [ref=f5e177]:
      - heading "Error y precisión" [level=2] [ref=f5e178]
      - paragraph [ref=f5e184]:
        - text: En ciencia,
        - strong [ref=f5e185]: no existe la medición perfecta
        - text: ". Siempre hay un margen de error que depende del instrumento que usamos, de quién mide y de las condiciones del entorno. Por eso los científicos:"
      - list [ref=f5e186]:
        - listitem [ref=f5e187]:
          - generic [ref=f5e192]:
            - strong [ref=f5e193]: Repiten las mediciones
            - text: varias veces y calculan un promedio.
        - listitem [ref=f5e194]:
          - generic [ref=f5e199]:
            - strong [ref=f5e200]: Usan el instrumento adecuado
            - text: para cada magnitud y rango.
        - listitem [ref=f5e201]:
          - generic [ref=f5e206]:
            - strong [ref=f5e207]: Registran la incertidumbre
            - text: "de la medición (por ejemplo: 5,0 ± 0,1 cm)."
        - listitem [ref=f5e208]:
          - generic [ref=f5e213]:
            - strong [ref=f5e214]: Calibran los instrumentos
            - text: antes de usarlos para asegurar su fiabilidad.
      - generic [ref=f5e215]:
        - heading "Tipos de errores" [level=4] [ref=f5e216]
        - generic [ref=f5e217]:
          - generic [ref=f5e218]:
            - text: Error sistemático
            - paragraph [ref=f5e219]: "Siempre en la misma dirección. Ej: balanza mal calibrada que siempre marca 2 g de más."
          - generic [ref=f5e220]:
            - text: Error aleatorio
            - paragraph [ref=f5e221]: "Varía en cada medición. Ej: al medir el tiempo con un cronómetro, la reacción humana varía."
    - generic [ref=f5e222]:
      - heading "Preguntas para pensar" [level=2] [ref=f5e223]
      - generic [ref=f5e232]:
        - paragraph [ref=f5e233]: 1.¿Qué instrumento usarías para medir el volumen exacto de 50 mL de agua? ¿Y la masa de una manzana?
        - paragraph [ref=f5e234]: "2.Convertí: 2,5 kg a gramos, 4500 mL a litros, 120 cm a metros."
        - paragraph [ref=f5e235]: 3.Un bloque de metal tiene 50 g de masa y ocupa 25 cm³. ¿Cuál es su densidad? ¿Flotaría en agua?
        - paragraph [ref=f5e236]: 4.¿Por qué es importante repetir las mediciones en un experimento científico?
