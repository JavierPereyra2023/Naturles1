            - cell "cd" [ref=f5e118]
      - paragraph [ref=f5e119]:
        - text: También existen
        - strong [ref=f5e120]: múltiplos y submúltiplos
        - text: "que nos ayudan a expresar cantidades muy grandes o muy pequeñas:"
      - generic [ref=f5e121]:
        - generic [ref=f5e122]: kilo (k) = 1000
        - generic [ref=f5e123]: centi (c) = 0,01
        - generic [ref=f5e124]: mili (m) = 0,001
        - generic [ref=f5e125]: micro (µ) = 0,000001
      - paragraph [ref=f5e126]:
        - text: En química usamos frecuentemente el
        - strong [ref=f5e127]: gramo (g)
        - text: ", el"
        - strong [ref=f5e128]: litro (L)
        - text: y el
        - strong [ref=f5e129]: grado Celsius (°C)
        - text: ", que son unidades derivadas o aceptadas junto al SI."
