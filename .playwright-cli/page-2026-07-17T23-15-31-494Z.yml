  - generic [ref=f5e29]:
    - generic [ref=f5e30]: Química · Materia
    - heading "Medición Científica" [level=1] [ref=f5e33]
    - paragraph [ref=f5e34]: Medir es comparar. La ciencia necesita mediciones precisas para describir el mundo que nos rodea.
  - main [ref=f5e35]:
    - generic [ref=f5e36]:
      - heading "Medir en ciencia" [level=2] [ref=f5e37]
      - generic [ref=f5e40]:
        - generic [ref=f5e41]: Dato histórico
        - text: Antes del Sistema Internacional, cada país usaba sus propias unidades (pulgadas, libras, leguas). Esto generaba mucha confusión. En 1960 se unificaron las unidades a nivel mundial.
      - paragraph [ref=f5e42]:
        - text: Medir es
        - strong [ref=f5e43]: comparar una magnitud con una unidad de referencia
        - text: . En el laboratorio y en la vida cotidiana necesitamos instrumentos adecuados para cada tipo de medición. No es lo mismo medir la masa de un grano de arroz que la de un elefante.
      - paragraph [ref=f5e44]:
        - text: Cada magnitud tiene su
        - strong [ref=f5e45]: instrumento de medición
        - text: "apropiado:"
      - generic [ref=f5e46]:
        - generic [ref=f5e47]:
          - paragraph [ref=f5e52]: Balanza
          - paragraph [ref=f5e53]: Mide la masa
          - paragraph [ref=f5e54]: gramos, kilogramos
        - generic [ref=f5e55]:
          - paragraph [ref=f5e60]: Probeta
          - paragraph [ref=f5e61]: Mide el volumen
          - paragraph [ref=f5e62]: mililitros, litros
        - generic [ref=f5e63]:
          - paragraph [ref=f5e66]: Termómetro
          - paragraph [ref=f5e67]: Mide la temperatura
          - paragraph [ref=f5e68]: grados Celsius, Kelvin
        - generic [ref=f5e69]:
          - paragraph [ref=f5e70]: Cinta métrica
          - paragraph [ref=f5e71]: Mide la longitud
          - paragraph [ref=f5e72]: centímetros, metros
      - generic [ref=f5e73]: "\"En ciencia, un número sin unidad no significa nada. Decir que algo mide '5' no nos dice si son 5 metros, 5 gramos o 5 segundos.\""
    - generic [ref=f5e74]:
      - heading "Sistema Internacional (SI)" [level=2] [ref=f5e75]
      - paragraph [ref=f5e80]:
        - text: El
        - strong [ref=f5e81]: Sistema Internacional de Unidades
        - text: (SI) es el conjunto de unidades de medida que usan los científicos en todo el mundo. Tiene
        - strong [ref=f5e82]: siete magnitudes fundamentales
        - text: ":"
      - table [ref=f5e84]:
        - rowgroup [ref=f5e85]:
