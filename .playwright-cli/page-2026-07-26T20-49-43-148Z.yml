      - generic [ref=f5e86]:
        - generic [ref=f5e87]:
          - generic [ref=f5e88]: "01"
          - heading "Una arquitectura completamente nueva" [level=2] [ref=f5e89]
        - paragraph [ref=f5e91]:
          - text: Hasta el Falcon Heavy, los cohetes tenían
          - strong [ref=f5e92]: una pieza "de usar y tirar"
          - text: "arriba (la segunda etapa o la cápsula). El Starship cambia eso:"
          - strong [ref=f5e93]: ambas piezas
          - text: —el propulsor y la nave— son
          - strong [ref=f5e94]: totalmente reutilizables
          - text: . Vuelven a la Tierra, aterrizan, se reabastecen y vuelven a volar.
        - generic [ref=f5e95]:
          - text: “
          - paragraph [ref=f5e96]: "El objetivo es construir un sistema de transporte espacial parecido a un avión: cargar combustible, embarcar, despegar, aterrizar, y repetir. Miles de veces."
        - generic [ref=f5e97]:
          - heading "Dos etapas apiladas" [level=3] [ref=f5e104]
          - generic [ref=f5e105]:
            - generic [ref=f5e106]:
              - paragraph [ref=f5e107]: Super Heavy (1ª etapa)
              - paragraph [ref=f5e108]:
                - text: El propulsor gigante de
                - strong [ref=f5e109]: 70 m
                - text: . Enciende sus
                - strong [ref=f5e110]: 33 motores Raptor
                - text: en el despegue. Se separa a los ~3 minutos y vuelve a la plataforma de lanzamiento.
            - generic [ref=f5e111]:
              - paragraph [ref=f5e112]: Starship (2ª etapa / nave)
              - paragraph [ref=f5e113]:
                - text: La nave de
                - strong [ref=f5e114]: 50 m
                - text: que sigue hasta órbita. Tiene 6 motores Raptor y espacio para
                - strong [ref=f5e115]: 100 personas o 100 toneladas
                - text: de carga.
        - generic [ref=f5e116]:
          - generic [ref=f5e117]: El sistema completo
          - paragraph [ref=f5e118]:
            - text: Apilados, el cohete mide
            - strong [ref=f5e119]: 121 metros
            - text: ": más alto que el Saturno V que llevó al hombre a la Luna. Es el cohete más alto y más potente jamás construido."
      - generic [ref=f5e125]:
        - generic [ref=f5e126]:
          - generic [ref=f5e127]: "02"
          - 'heading "Super Heavy: el propulsor gigante" [level=2] [ref=f5e128]'
        - paragraph [ref=f5e130]:
          - text: El
          - strong [ref=f5e131]: Super Heavy
          - text: es la primera etapa del Starship. Es básicamente un depósito gigantesco de combustible con motores en la base. Su función es levantar al Starship fuera de la atmósfera más densa y luego
          - strong [ref=f5e132]: regresar para ser reutilizado
          - text: .
        - heading "Ficha técnica" [level=3] [ref=f5e133]
        - generic [ref=f5e134]:
          - generic [ref=f5e135]:
            - generic [ref=f5e136]: Altura
            - paragraph [ref=f5e140]: 71 m
            - paragraph [ref=f5e141]: Un edificio de 23 pisos
          - generic [ref=f5e142]:
            - generic [ref=f5e143]: Motores
            - paragraph [ref=f5e147]: 33 × Raptor
            - paragraph [ref=f5e148]: El récord de motores en un cohete
          - generic [ref=f5e149]:
            - generic [ref=f5e150]: Empuje total
            - paragraph [ref=f5e154]: 74.000 kN
            - paragraph [ref=f5e155]: Más que el Saturno V
          - generic [ref=f5e156]:
            - generic [ref=f5e157]: Masa total
            - paragraph [ref=f5e163]: ~3.600 t
            - paragraph [ref=f5e164]: Cargado de propelente
          - generic [ref=f5e165]:
            - generic [ref=f5e166]: Propelente
            - paragraph [ref=f5e170]: CH₄ + LOX
            - paragraph [ref=f5e171]: Metano y oxígeno líquido
          - generic [ref=f5e172]:
            - generic [ref=f5e173]: Aterrizaje
            - paragraph [ref=f5e179]: "\"Mechazilla\""
            - paragraph [ref=f5e180]: Brazos que lo atrapan
        - paragraph [ref=f5e186]:
          - strong [ref=f5e187]: ¿Por qué tantos motores?
          - text: "Tener 33 motores le da a SpaceX dos ventajas enormes:"
          - strong [ref=f5e188]: (1)
          - text: Si uno o dos motores fallan, los demás pueden compensar y la misión sigue (como pasó en algunos vuelos de prueba).
          - strong [ref=f5e189]: (2)
          - text: Cada motor individual es más chico y más fácil de fabricar en serie.
      - generic [ref=f5e195]:
        - generic [ref=f5e196]:
          - generic [ref=f5e197]: "03"
          - 'heading "Starship: la nave" [level=2] [ref=f5e198]'
        - paragraph [ref=f5e200]:
          - text: La pieza de arriba se llama simplemente
          - strong [ref=f5e201]: "\"Starship\""
          - text: o nave. Es donde van los pasajeros, la carga o el satélite. Tiene forma de bala con aletas y
          - strong [ref=f5e202]: aletas tipo "delantal"
          - text: en la base que sirven para controlar la caída en la atmósfera.
        - generic [ref=f5e203]:
          - generic [ref=f5e204]:
            - heading "Capacidad humana" [level=3] [ref=f5e206]
            - paragraph [ref=f5e207]:
              - text: Hasta
              - strong [ref=f5e208]: 100 personas
              - text: en vuelos largos. Para la Luna con Artemisa, transportará astronautas de la NASA.
          - generic [ref=f5e209]:
            - heading "Capacidad de carga" [level=3] [ref=f5e215]
            - paragraph [ref=f5e216]:
              - text: Hasta
              - strong [ref=f5e217]: 100-150 toneladas
              - text: en órbita baja. Es el doble que el Falcon Heavy.
          - generic [ref=f5e218]:
            - heading "Escudo térmico" [level=3] [ref=f5e220]
            - paragraph [ref=f5e221]:
              - text: Cubierto con
              - strong [ref=f5e222]: ~1.200 baldosas cerámicas
              - text: que resisten el calor brutal de la reentrada (~1.600 °C). Es lo que protege a la nave de quemarse al volver.
          - generic [ref=f5e223]:
            - heading "Aterrizaje" [level=3] [ref=f5e229]
            - paragraph [ref=f5e230]:
              - text: Vuelve a la Tierra y aterriza en posición
              - strong [ref=f5e231]: vertical
              - text: ", igual que el Falcon 9 pero en una escala mucho mayor."
        - generic [ref=f5e232]:
          - generic [ref=f5e233]: El "Mechazilla"
          - paragraph [ref=f5e234]:
            - text: La torre de lanzamiento del Starship tiene unos
            - strong [ref=f5e235]: enormes brazos mecánicos
            - text: ("Mechazilla") que sostienen al cohete antes del despegue. En el futuro, intentarán que esos mismos brazos
            - strong [ref=f5e236]: atrapen al Super Heavy
            - text: cuando regrese, evitando que tenga patas.
      - generic [ref=f5e242]:
        - generic [ref=f5e243]:
          - generic [ref=f5e244]: "04"
          - 'heading "El motor Raptor: un salto cuántico" [level=2] [ref=f5e245]'
        - paragraph [ref=f5e247]:
          - text: El
          - strong [ref=f5e248]: Raptor
          - text: es el corazón del Starship. Es un motor de
          - strong [ref=f5e249]: ciclo de combustión stage-combustion
          - text: alimentado por
          - strong [ref=f5e250]: metano y oxígeno líquido
          - text: . Es el primer motor de este tipo en volar en un cohete orbital.
        - generic [ref=f5e251]:
          - generic [ref=f5e252]:
            - heading "¿Por qué metano?" [level=3] [ref=f5e256]
            - paragraph [ref=f5e257]:
              - text: Mars tiene agua y CO₂. Con un poco de química, podríamos
              - strong [ref=f5e258]: fabricar metano en el propio Marte
              - text: para cargar el Starship de regreso. Es el combustible "marciano" por excelencia.
          - generic [ref=f5e259]:
            - heading "Versiones del Raptor" [level=3] [ref=f5e263]
            - paragraph [ref=f5e264]:
              - text: "Hay dos versiones:"
              - strong [ref=f5e265]: Raptor 2
              - text: para Super Heavy (más empuje) y
              - strong [ref=f5e266]: Raptor Vacuum
              - text: optimizada para el espacio (con boquilla más grande).
        - paragraph [ref=f5e272]:
          - strong [ref=f5e273]: Comparación de empuje.
          - text: "Un solo Raptor 2 produce ~2.300 kN de empuje, más que el motor de un Boeing 747. Ahora multiplicá eso por 33: el Super Heavy tiene más empuje que"
          - strong [ref=f5e274]: 24 Boeings 747 funcionando al máximo
          - text: .
      - generic [ref=f5e280]:
        - generic [ref=f5e281]:
          - generic [ref=f5e282]: "05"
          - heading "Rumbo a la Luna y a Marte" [level=2] [ref=f5e283]
        - paragraph [ref=f5e285]:
          - text: "El Starship no es solo un cohete: es un"
          - strong [ref=f5e286]: sistema de transporte interplanetario
          - text: . Entre sus misiones previstas están
          - strong [ref=f5e287]: Artemis III
          - text: "(volver a la Luna en 2027), varias misiones lunares con Japón, y la gran apuesta:"
          - strong [ref=f5e288]: colonizar Marte
          - text: .
        - generic [ref=f5e289]:
          - generic [ref=f5e290]:
            - heading "HLS — Artemis III" [level=3] [ref=f5e292]
            - paragraph [ref=f5e293]:
              - text: Una versión del Starship será el
              - strong [ref=f5e294]: módulo de alunizaje
              - text: de la NASA. Llevará astronautas desde la órbita lunar hasta la superficie de la Luna en la misión
              - strong [ref=f5e295]: Artemis III
              - text: .
            - generic [ref=f5e296]:
              - generic [ref=f5e297]: NASA
              - generic [ref=f5e298]: Luna
          - generic [ref=f5e299]:
            - heading "Starlink Segunda Generación (V3)" [level=3] [ref=f5e305]
            - paragraph [ref=f5e306]:
              - text: Una nueva generación de satélites Starlink se lanzará con Starship. Cada vuelo podrá llevar
              - strong [ref=f5e307]: más de 60 satélites
              - text: mucho más grandes, con más capacidad.
            - generic [ref=f5e308]:
              - generic [ref=f5e309]: Internet
              - generic [ref=f5e310]: Starlink
          - generic [ref=f5e311]:
            - heading "Vuelos de prueba (IFT)" [level=3] [ref=f5e318]
            - paragraph [ref=f5e319]:
              - text: SpaceX está probando el Starship en vuelos suborbitales desde 2023. Ha realizado
              - strong [ref=f5e320]: varios IFT
              - text: (Integrated Flight Test), algunos exitosos y otros con problemas. Es parte del proceso de desarrollo.
            - generic [ref=f5e321]:
              - generic [ref=f5e322]: Pruebas
              - generic [ref=f5e323]: Boca Chica
          - generic [ref=f5e324]:
            - heading "La apuesta por Marte" [level=3] [ref=f5e330]
            - paragraph [ref=f5e331]:
              - text: Elon Musk afirma que el objetivo final es
              - strong [ref=f5e332]: hacer a la humanidad multiplanetaria
              - text: . Una colonia en Marte actuaría como "seguro" para la especie ante eventuales catastrophes en la Tierra.
            - generic [ref=f5e333]:
              - generic [ref=f5e334]: Marte
              - generic [ref=f5e335]: Futuro
      - generic [ref=f5e341]:
        - generic [ref=f5e342]:
          - generic [ref=f5e343]: "06"
          - heading "Preguntas para pensar" [level=2] [ref=f5e344]
        - generic [ref=f5e345]:
          - generic [ref=f5e347]:
            - generic [ref=f5e348]: "1."
            - generic [ref=f5e349]:
              - paragraph [ref=f5e350]: ¿Por qué usar metano en lugar de queroseno?
              - paragraph [ref=f5e351]:
                - text: El queroseno deja
                - strong [ref=f5e352]: residuos de coque
                - text: en los motores que complican la reutilización. El metano es
                - strong [ref=f5e353]: "\"más limpio\""
                - text: y se puede producir en Marte. Es como elegir nafta premium en vez de diesel para un auto que querés usar muchas veces.
          - generic [ref=f5e355]:
            - generic [ref=f5e356]: "2."
            - generic [ref=f5e357]:
              - paragraph [ref=f5e358]: ¿Por qué las pruebas fallan tanto?
              - paragraph [ref=f5e359]:
                - text: SpaceX vuela con la filosofía de
                - strong [ref=f5e360]: "\"fallar rápido, aprender rápido\""
                - text: . Lanzar un Starship es relativamente barato comparado con otros cohetes. Prefieren
                - strong [ref=f5e361]: perder varias plataformas
                - text: en pruebas y aprender, que hacer 10 años de ensayos en tierra.
          - generic [ref=f5e363]:
            - generic [ref=f5e364]: "3."
            - generic [ref=f5e365]:
              - paragraph [ref=f5e366]: ¿Es realmente posible colonizar Marte?
              - paragraph [ref=f5e367]:
                - text: "Hay enormes desafíos:"
                - strong [ref=f5e368]: radiación cósmica, baja gravedad, atmósfera irrespirable, temperaturas extremas
                - text: . Marte no es "una segunda Tierra" sino un ambiente hostil. Algunos científicos creen que es posible a largo plazo; otros piensan que es ciencia ficción.
