  - generic [ref=f5e47]:
    - generic [ref=f5e53]:
      - generic [ref=f5e54]: Modelo 3D interactivo
      - generic [ref=f5e57]:
        - text: 01 / 06 · Bahía de carga
        - heading "Nariz de la nave" [level=3] [ref=f5e58]
        - paragraph [ref=f5e59]:
          - text: "A diferencia del Falcon 9, el Starship no tiene cofia desechable: la punta es parte de la nave y vuelve entera. Adentro hay una bahía de"
          - strong [ref=f5e60]: 1.000 m³
          - text: para satélites, carga o hasta 100 pasajeros. Una compuerta lateral se abre en órbita y se vuelve a cerrar.
      - generic:
        - text: 02 / 06 · Control aerodinámico
        - heading "Cuatro aletas" [level=3]
        - paragraph:
          - text: Dos aletas delanteras y dos traseras, más grandes. Al volver de órbita la nave cae
          - strong: de panza
          - text: ", como un paracaidista, y mueve las aletas para frenar y mantener el equilibrio. Recién a último momento gira y se pone vertical para aterrizar."
      - generic:
        - text: 03 / 06 · Tanques CH₄ / LOX + escudo
        - heading "Cuerpo de la nave" [level=3]
        - paragraph:
          - text: Un cilindro de
          - strong: 9 metros de diámetro
          - text: hecho de acero inoxidable. Adentro lleva metano líquido y oxígeno líquido separados por una mampara. Toda la cara que mira hacia abajo en la reentrada está cubierta por unas
          - strong: 18.000 baldosas cerámicas
          - text: negras.
      - generic:
        - text: 04 / 06 · 3 Raptor + 3 Raptor Vacuum
        - heading "Motores de la nave" [level=3]
        - paragraph:
          - text: "Seis motores en la base: tres"
          - strong: Raptor normales
          - text: ", que pueden inclinarse para dirigir la nave y encenderse al aterrizar, y tres"
          - strong: Raptor Vacuum
          - text: con campanas mucho más anchas, fijas, que sólo rinden bien en el vacío del espacio.
      - generic:
        - text: 05 / 06 · Primera etapa
        - heading "Super Heavy" [level=3]
        - paragraph:
          - text: El propulsor de
          - strong: 71 metros
          - text: que sostiene todo. Arriba tiene el
          - strong: anillo de hot-staging
          - text: ", que deja escapar los gases cuando la nave enciende sus motores todavía acoplada. Cuatro aletas de rejilla lo guían en el descenso y dos pivotes laterales quedan apoyados sobre los brazos de la torre."
      - generic:
        - text: 06 / 06 · 33 motores Raptor
        - heading "La base del propulsor" [level=3]
        - paragraph:
          - text: "Treinta y tres motores repartidos en tres anillos:"
          - strong: 3 en el centro
          - text: que se inclinan para dirigir el cohete, 10 en el anillo del medio y 20 en el exterior. Juntos entregan
          - strong: 74.000 kN
          - text: de empuje, el doble que el Saturno V.
    - paragraph [ref=f5e61]: Desplazate para recorrer el cohete ↓
