    - generic [ref=f5e37]: SpaceX · El cohete más grande
    - heading "Starship + Super Heavy" [level=1] [ref=f5e40]
    - paragraph [ref=f5e41]: El cohete más grande y poderoso jamás construido. Completamente reutilizable, con 33 motores Raptor en su primera etapa. Diseñado para volver a la Luna y, eventualmente, llevar humanos a Marte.
