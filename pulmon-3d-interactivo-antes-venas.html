<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>Laboratorio Pulmonar 3D</title>
  <style>
    :root{
      --bg:oklch(14% .012 245);--surface:oklch(20% .014 245);
      --fg:oklch(94% .008 70);--muted:oklch(70% .018 245);
      --border:oklch(34% .018 245);--accent:oklch(66% .16 28);
      --success:oklch(72% .14 155);--warn:oklch(78% .14 78);
      --font-display:"Aptos Display","Segoe UI",sans-serif;
      --font-body:"Aptos","Segoe UI",sans-serif;
      --font-mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
      --header-h:64px;--panel-w:326px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg)}
    body{font-family:var(--font-body);font-size:16px;line-height:1.5}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
    .app{height:100%;display:block}
    .topbar{
      position:relative;z-index:20;display:flex;align-items:center;gap:24px;
      padding:0 20px;border-bottom:1px solid var(--border);
      background:color-mix(in oklch,var(--surface) 90%,transparent);
      backdrop-filter:blur(18px)
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:max-content}
    .brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border)}
    .brand-mark svg{width:20px;height:20px}
    .brand-copy{display:flex;flex-direction:column;line-height:1.1}
    .brand-copy strong{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em}
    .brand-copy span{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .top-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
    .course{
      font-size:12px;color:var(--muted);letter-spacing:.02em;
      border-right:1px solid var(--border);padding-right:14px
    }
    .status{display:flex;align-items:center;gap:7px;font-size:12px}
    .status-dot{width:7px;height:7px;background:var(--success);border-radius:50%;box-shadow:0 0 10px color-mix(in oklch,var(--success) 55%,transparent)}
    .workspace{position:relative;min-height:0;display:grid;grid-template-columns:var(--panel-w) 1fr}
    .panel{
      position:relative;z-index:12;min-height:0;display:flex;flex-direction:column;
      border-right:1px solid var(--border);background:var(--surface)
    }
    .panel-head{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
    .eyebrow{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:0;font-family:var(--font-display);font-size:28px;line-height:1.05;letter-spacing:-.02em;font-weight:600}
    .lede{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    .panel-scroll{min-height:0;overflow:auto;padding:16px 20px 20px}
    .section-title{
      margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted)
    }
    .preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
    .preset,.utility,.structure-btn{
      min-height:44px;border:1px solid var(--border);background:transparent;
      cursor:pointer;transition:background .18s,border-color .18s,transform .1s;letter-spacing:.02em
    }
    .preset:hover,.utility:hover,.structure-btn:hover{background:color-mix(in oklch,var(--fg) 6%,transparent);border-color:var(--muted)}
    .preset:active,.utility:active,.structure-btn:active{transform:translateY(1px)}
    .preset.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
    .divider{height:1px;background:var(--border);margin:18px 0}
    .structure-list{display:grid;gap:6px}
    .structure-btn{
      width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;
      min-height:48px
    }
    .structure-btn.active{background:color-mix(in oklch,var(--accent) 13%,transparent);border-color:color-mix(in oklch,var(--accent) 55%,var(--border))}
    .swatch{width:9px;height:9px;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 3px color-mix(in oklch,var(--swatch) 18%,transparent)}
    .structure-text{display:flex;flex:1;flex-direction:column}
    .structure-text strong{font-size:13px;font-weight:550}
    .structure-text small{font-size:11px;color:var(--muted);letter-spacing:.01em}
    .chevron{color:var(--muted);font-family:var(--font-mono)}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
    .toggle-copy{display:flex;flex-direction:column}
    .toggle-copy strong{font-size:13px;font-weight:550}
    .toggle-copy small{font-size:11px;color:var(--muted)}
    .switch{
      position:relative;width:46px;height:26px;border:1px solid var(--border);
      border-radius:20px;background:var(--bg);cursor:pointer
    }
    .switch::after{
      content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;
      background:var(--muted);transition:transform .2s,background .2s
    }
    .switch.on::after{transform:translateX(19px);background:var(--accent)}
    .viewport{position:relative;width:100%;height:100%;min-width:0;min-height:0;background:var(--bg)}
    #scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
    .viewport::before{
      content:"";position:absolute;z-index:1;inset:0;pointer-events:none;
      background:radial-gradient(circle at 50% 43%,transparent 0 28%,color-mix(in oklch,var(--bg) 72%,transparent) 80%)
    }
    .view-label{
      position:absolute;z-index:4;top:18px;left:20px;font-family:var(--font-mono);
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)
    }
    .axis{position:absolute;z-index:4;right:18px;top:18px;width:62px;height:62px}
    .axis-line{position:absolute;left:30px;top:30px;transform-origin:0 50%;height:1px;width:23px;background:var(--muted)}
    .axis-line::after{position:absolute;right:-13px;top:-8px;font:10px var(--font-mono)}
    .axis-x{transform:rotate(0deg);background:oklch(65% .18 25)}.axis-x::after{content:"X"}
    .axis-y{transform:rotate(-90deg);background:oklch(72% .15 145)}.axis-y::after{content:"Y";transform:rotate(90deg)}
    .axis-z{transform:rotate(135deg);background:oklch(70% .12 245)}.axis-z::after{content:"Z";transform:rotate(-135deg)}
    .toolbar{
      position:absolute;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);
      display:flex;align-items:center;gap:4px;padding:5px;border:1px solid var(--border);
      background:color-mix(in oklch,var(--surface) 88%,transparent);backdrop-filter:blur(14px);
      box-shadow:0 16px 50px color-mix(in oklch,var(--bg) 70%,transparent)
    }
    .utility{
      min-width:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:7px;
      font-size:12px;border-color:transparent
    }
    .utility svg{width:17px;height:17px;stroke-width:1.7}
    .toolbar-sep{width:1px;height:25px;background:var(--border);margin:0 3px}
    .hint{
      position:absolute;z-index:5;right:18px;bottom:18px;max-width:215px;padding:10px 12px;
      border:1px solid var(--border);background:color-mix(in oklch,var(--surface) 90%,transparent);
      color:var(--muted);font-size:11px;line-height:1.5;backdrop-filter:blur(12px)
    }
    kbd{font-family:var(--font-mono);font-size:10px;color:var(--fg);border:1px solid var(--border);padding:2px 5px;background:var(--bg)}
    .hotspot{
      position:absolute;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:auto;
      transform:translate(-50%,-50%);transition:opacity .2s;cursor:pointer
    }
    .hotspot-dot{
      width:12px;height:12px;border:2px solid var(--fg);border-radius:50%;
      background:var(--accent);box-shadow:0 0 0 5px color-mix(in oklch,var(--accent) 20%,transparent)
    }
    .hotspot-label{
      padding:5px 8px;border:1px solid var(--border);
      background:color-mix(in oklch,var(--surface) 91%,transparent);
      font-size:11px;letter-spacing:.02em;white-space:nowrap;backdrop-filter:blur(10px)
    }
    .info-card{
      position:absolute;z-index:9;right:18px;top:96px;width:min(310px,calc(100% - 36px));
      padding:18px;border:1px solid var(--border);background:color-mix(in oklch,var(--surface) 95%,transparent);
      box-shadow:0 24px 70px color-mix(in oklch,var(--bg) 70%,transparent);
      backdrop-filter:blur(18px);display:none
    }
    .info-card.show{display:block}
    .info-top{display:flex;justify-content:space-between;gap:16px}
    .info-card h2{margin:0;font-family:var(--font-display);font-size:22px;letter-spacing:-.01em;font-weight:600}
    .close-info{width:44px;height:44px;margin:-10px -10px 0 0;border:0;background:transparent;cursor:pointer;font-size:21px;color:var(--muted)}
    .info-card p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
    .fact{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px}
    .fact strong{display:block;margin-bottom:4px;color:var(--fg);font-weight:550}
    .histology-card{
      position:absolute;z-index:8;left:18px;bottom:82px;width:300px;overflow:hidden;
      border:1px solid var(--border);background:color-mix(in oklch,var(--surface) 94%,transparent);
      box-shadow:0 20px 60px color-mix(in oklch,var(--bg) 72%,transparent);
      backdrop-filter:blur(16px);transition:opacity .2s,transform .2s
    }
    .histology-card.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
    .histology-visual{position:relative;height:154px;background:var(--bg)}
    .histology-visual canvas{display:block;width:100%;height:100%}
    .scale-tag{
      position:absolute;left:10px;bottom:9px;padding:3px 6px;background:color-mix(in oklch,var(--bg) 86%,transparent);
      font:10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase
    }
    .histology-copy{padding:12px 14px 14px}
    .histology-copy strong{display:block;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em}
    .histology-copy p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
    .loading{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .35s}
    .loading.hidden{opacity:0;pointer-events:none}
    .loader-copy{text-align:center}
    .loader-line{width:160px;height:2px;margin:14px auto;background:var(--border);overflow:hidden}
    .loader-line::after{content:"";display:block;width:45%;height:100%;background:var(--accent);animation:load 1.15s ease-in-out infinite alternate}
    .loader-copy strong{font-family:var(--font-display);font-size:18px;font-weight:600}
    .loader-copy span{display:block;color:var(--muted);font:11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
    @keyframes load{to{transform:translateX(125%)}}
    .mobile-menu{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--border);background:transparent}
    @media(max-width:760px){
      :root{--header-h:58px}
      .topbar{padding:0 12px}.course,.status{display:none}.mobile-menu{display:grid;place-items:center}
      .workspace{display:block}.panel{
        position:absolute;z-index:20;left:0;top:0;bottom:0;width:min(88vw,340px);
        transform:translateX(-101%);transition:transform .25s;box-shadow:18px 0 60px var(--bg)
      }
      .panel.open{transform:translateX(0)}
      .viewport{height:100%}.view-label{left:14px;top:12px}.axis{right:10px;top:8px}
      .toolbar{left:12px;right:12px;bottom:12px;transform:none;justify-content:center}
      .utility{flex:1;padding:0 6px}.utility span{display:none}
      .hint{display:none}.info-card{top:78px;right:12px;width:calc(100% - 24px)}
      .histology-card{left:12px;bottom:70px;width:min(270px,calc(100% - 24px))}
      .histology-visual{height:128px}
      .hotspot-label{display:none}.hotspot-dot{width:15px;height:15px}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

<body>
  <main class="app" data-od-id="visor-pulmonar-embebible">
    <section class="viewport" id="viewport" data-od-id="espacio-3d">
      <canvas id="scene" aria-label="Modelo tridimensional interactivo de los pulmones"></canvas>
      <div class="loading" id="loading">
        <div class="loader-copy"><strong>Preparando anatomía 3D</strong><span>Generando tejido pulmonar</span><div class="loader-line"></div></div>
      </div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas=document.querySelector("#scene"),viewport=document.querySelector("#viewport");
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:"high-performance"});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x14171b,1);
    const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x14171b,.026);
    const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,.4,13.5);
    const controls=new OrbitControls(camera,canvas);
    controls.enableDamping=true;controls.dampingFactor=.075;controls.minDistance=6.8;controls.maxDistance=20;
    controls.target.set(0,.4,0);controls.enablePan=true;controls.screenSpacePanning=true;

    scene.add(new THREE.HemisphereLight(0xdce6ef,0x321813,1.35));
    const key=new THREE.DirectionalLight(0xffe5d9,4.2);key.position.set(-5,7,8);key.castShadow=true;scene.add(key);
    const rim=new THREE.DirectionalLight(0x7caec7,2.4);rim.position.set(6,3,-5);scene.add(rim);
    const low=new THREE.PointLight(0xffb29f,5,16);low.position.set(0,-4.5,4);scene.add(low);

    function tissueTexture(seed){
      const size=512,c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
      let s=seed==="right"?4931:7183;
      const rnd=()=>((s=Math.imul(48271,s)%2147483647)&2147483647)/2147483647;
      const img=x.createImageData(size,size),data=img.data;
      for(let py=0;py<size;py++)for(let px=0;px<size;px++){
        const i=(py*size+px)*4;
        const broad=Math.sin(px*.031)+Math.sin(py*.027)+Math.sin((px+py)*.013);
        const fine=(rnd()-.5)*1.5;
        const n=broad*2.2+fine*7;
        data[i]=188+n;data[i+1]=116+n*.52;data[i+2]=105+n*.46;data[i+3]=255;
      }
      x.putImageData(img,0,0);
      const wash=x.createRadialGradient(190,160,15,250,260,360);
      wash.addColorStop(0,"rgba(255,224,207,.3)");wash.addColorStop(.55,"rgba(161,77,72,.06)");wash.addColorStop(1,"rgba(58,27,31,.24)");
      x.fillStyle=wash;x.fillRect(0,0,size,size);
      for(let i=0;i<170;i++){
        const px=rnd()*size,py=rnd()*size,r=7+rnd()*32;
        const spot=x.createRadialGradient(px,py,0,px,py,r);
        const light=rnd()>.48;
        spot.addColorStop(0,light?`rgba(255,206,190,${.025+rnd()*.07})`:`rgba(83,37,43,${.025+rnd()*.065})`);
        spot.addColorStop(1,"rgba(0,0,0,0)");
        x.fillStyle=spot;x.fillRect(px-r,py-r,r*2,r*2)
      }
      x.lineCap="round";
      for(let i=0;i<1500;i++){
        const px=rnd()*size,py=rnd()*size,r=1.5+rnd()*5.5,a=.018+rnd()*.035;
        x.strokeStyle=`rgba(255,214,199,${a})`;x.lineWidth=.4+rnd()*.8;
        x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.stroke();
      }
      for(let i=0;i<34;i++){
        let px=rnd()*size,py=rnd()*size;
        x.strokeStyle=`rgba(86,25,34,${.08+rnd()*.08})`;x.lineWidth=.6+rnd()*1.4;
        x.beginPath();x.moveTo(px,py);
        for(let n=0;n<10;n++){px+=(rnd()-.5)*36;py+=14+rnd()*20;x.quadraticCurveTo(px+(rnd()-.5)*12,py-10,px,py)}
        x.stroke();
      }
      for(let i=0;i<22;i++){
        let px=rnd()*size,py=size+rnd()*50;
        x.strokeStyle=`rgba(255,218,204,${.08+rnd()*.08})`;x.lineWidth=.45+rnd()*.8;
        x.beginPath();x.moveTo(px,py);
        for(let n=0;n<13;n++){px+=(rnd()-.5)*28;py-=17+rnd()*16;x.quadraticCurveTo(px+(rnd()-.5)*10,py+8,px,py)}
        x.stroke();
      }
      const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1.05,1.15);
      tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();return tex;
    }
    function makeLungGeometry(side){
      const radial=96,rings=72,positions=[],uvs=[],colors=[],indices=[];
      const isRight=side==="right";
      const totalHeight=isRight?5.98:6.05;
      const baseWidth=isRight?1.84:1.78;
      const baseDepth=isRight?1.35:1.32;
      for(let iy=0;iy<=rings;iy++){
        const t=iy/rings,y=-3.12+t*totalHeight;
        const profileExponent=.28+.18*THREE.MathUtils.smoothstep(t,0,.24);
        const depthExponent=.34+.2*THREE.MathUtils.smoothstep(t,0,.22);
        const dome=Math.pow(Math.sin(Math.PI*t),profileExponent);
        const lowerFullness=.94+.18*Math.pow(1-t,1.4);
        const apexTaper=.75+.25*Math.pow(1-t,.62);
        for(let ix=0;ix<=radial;ix++){
          const a=ix/radial*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
          let width=baseWidth*dome*lowerFullness*apexTaper;
          let depth=baseDepth*Math.pow(Math.sin(Math.PI*t),depthExponent)*(1-.09*t);
          const medialAngle=side==="left"?Math.PI:0;
          const angleDelta=Math.atan2(Math.sin(a-medialAngle),Math.cos(a-medialAngle));
          const medial=Math.exp(-Math.pow(angleDelta/.72,2));
          depth*=1-.2*medial;
          const hilum=.16*Math.exp(-Math.pow((t-.56)/.13,2))*Math.exp(-Math.pow(angleDelta/.42,2));
          let cardiacNotch=0,lingula=0;
          if(side==="left"){
            cardiacNotch=.28*Math.exp(-Math.pow((t-.61)/.12,2))*Math.exp(-Math.pow(angleDelta/.44,2));
            lingula=.1*Math.exp(-Math.pow((t-.43)/.07,2))*Math.exp(-Math.pow(angleDelta/.36,2));
          }
          width*=1-hilum-cardiacNotch+lingula;
          let x=ca*width,z=sa*depth;
          const medialSide=side==="left"?x<0:x>0;
          if(medialSide)x*=.82;
          const outwardShift=(isRight?-.04:.04)*(1-Math.pow(2*t-1,2));
          x+=outwardShift;
          const lowerDome=Math.max(0,.13-t)/.13;
          const baseLift=.25*lowerDome*(1-Math.min(1,(x*x)/(baseWidth*baseWidth)));
          const organic=.004*Math.sin(a*7+t*19)+.003*Math.sin(a*13-t*11);
          x*=1+organic;z*=1+organic;
          const obliqueY=isRight?-.88+.58*x:-.88-.58*x;
          const frontFactor=Math.pow(Math.max(0,z)/baseDepth,1.4);
          let groove=Math.exp(-Math.pow((y-obliqueY)/.11,2));
          if(isRight)groove=Math.max(groove,.72*Math.exp(-Math.pow((y-(.08+.025*x))/.105,2)));
          z-=groove*.055*frontFactor;
          let lobeShade;
          if(isRight)lobeShade=y>.08?1.035:(y>obliqueY?.995:.955);
          else lobeShade=y>obliqueY?1.025:.96;
          positions.push(x,y+baseLift,z);uvs.push(ix/radial,t);
          colors.push(lobeShade,lobeShade*.985,lobeShade*.975);
        }
      }
      for(let iy=0;iy<rings;iy++)for(let ix=0;ix<radial;ix++){
        const a=iy*(radial+1)+ix,b=a+radial+1;
        indices.push(a,b,a+1,b,b+1,a+1);
      }
      const geo=new THREE.BufferGeometry();
      geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
      geo.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
      geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);
      geo.computeVertexNormals();return geo;
    }
    const organ=new THREE.Group();organ.rotation.x=-.04;scene.add(organ);
    const tissueR=tissueTexture("right"),tissueL=tissueTexture("left");
    const lungMatR=new THREE.MeshPhysicalMaterial({
      map:tissueR,bumpMap:tissueR,bumpScale:.052,vertexColors:true,color:0xffe0da,roughness:.5,metalness:0,
      clearcoat:.3,clearcoatRoughness:.52,sheen:.8,sheenColor:new THREE.Color(0x8b4c50),
      transmission:.018,thickness:.42
    });
    const lungMatL=lungMatR.clone();lungMatL.map=tissueL;lungMatL.bumpMap=tissueL;lungMatL.color.set(0xffddd8);
    const rightLung=new THREE.Mesh(makeLungGeometry("right"),lungMatR);rightLung.position.x=-1.66;rightLung.rotation.z=-.015;rightLung.castShadow=true;rightLung.receiveShadow=true;organ.add(rightLung);
    const leftLung=new THREE.Mesh(makeLungGeometry("left"),lungMatL);leftLung.position.x=1.66;leftLung.rotation.z=.015;leftLung.castShadow=true;leftLung.receiveShadow=true;organ.add(leftLung);
    rightLung.userData.part="rightLung";leftLung.userData.part="leftLung";

    const airwayMat=new THREE.MeshPhysicalMaterial({color:0xe2baa8,roughness:.62,clearcoat:.16});
    const ringMat=new THREE.MeshStandardMaterial({color:0xb87a6a,roughness:.7});
    const trachea=new THREE.Group();organ.add(trachea);
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(.43,.54,4.25,32,20),airwayMat);
    tube.position.y=4.35;tube.castShadow=true;trachea.add(tube);
    for(let i=0;i<14;i++){
      const y=2.45+i*.29,r=.49-i*.004;
      const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.055,10,36),ringMat);ring.rotation.x=Math.PI/2;ring.position.y=y;trachea.add(ring)
    }
    function curveTube(points,radius,material){
      const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
      const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,36,radius,14,false),material);
      mesh.castShadow=true;return mesh;
    }
    const bronchi=new THREE.Group();organ.add(bronchi);
    function addRingedAirway(points,radius,ringCount){
      const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
      bronchi.add(curveTube(points,radius,airwayMat));
      const zAxis=new THREE.Vector3(0,0,1);
      for(let i=1;i<=ringCount;i++){
        const t=.32+i/(ringCount+1)*.62;
        const ring=new THREE.Mesh(new THREE.TorusGeometry(radius*1.015,.025,9,28),ringMat);
        ring.position.copy(curve.getPoint(t));
        ring.quaternion.setFromUnitVectors(zAxis,curve.getTangent(t).normalize());
        ring.castShadow=true;bronchi.add(ring)
      }
    }
    addRingedAirway([[0,2.35,0],[-.25,1.9,0],[-1.3,1.35,.05],[-1.85,.65,.1]],.34,6);
    addRingedAirway([[0,2.35,0],[.25,1.9,0],[1.25,1.4,.05],[1.82,.75,.12]],.34,6);
    const branches=[
      [[-1.7,.8,.1],[-2.25,.25,.18],[-2.65,-.65,.12]], [[-1.62,.78,.1],[-1.25,.05,.3],[-1.15,-1.2,.2]],
      [[1.7,.9,.1],[2.25,.25,.16],[2.58,-.7,.06]], [[1.62,.85,.1],[1.3,.05,.28],[1.18,-1.2,.16]]
    ];
    branches.forEach(p=>bronchi.add(curveTube(p,.16,airwayMat)));
    trachea.userData.part="trachea";bronchi.userData.part="bronchi";

    const vesselMat=new THREE.MeshPhysicalMaterial({color:0xd3a195,roughness:.55,clearcoat:.18});
    function addVessels(sign){
      const group=new THREE.Group();organ.add(group);
      const paths=[
        [[sign*1.35,.7,1.45],[sign*1.75,-.1,1.48],[sign*1.9,-1.25,1.36],[sign*1.65,-2.2,1.18]],
        [[sign*1.75,-.15,1.45],[sign*2.35,-.65,1.18],[sign*2.55,-1.45,.94]],
        [[sign*1.88,-1.1,1.3],[sign*2.25,-1.85,.86],[sign*2.15,-2.65,.52]],
        [[sign*1.48,.35,1.38],[sign*1.82,.95,1.18],[sign*2.08,1.65,.72]],
        [[sign*1.72,-.75,1.34],[sign*1.35,-1.45,1.18],[sign*1.18,-2.25,.7]]
      ];
      paths.forEach((p,i)=>{
        const vessel=curveTube(p,Math.max(.008,.018-i*.0023),vesselMat);vessel.castShadow=false;group.add(vessel)
      })
    }
    addVessels(-1);addVessels(1);

    const ground=new THREE.Mesh(new THREE.CircleGeometry(6.4,64),new THREE.MeshStandardMaterial({color:0x14171b,roughness:1,transparent:true,opacity:.55}));
    ground.rotation.x=-Math.PI/2;ground.position.y=-4.18;ground.receiveShadow=true;scene.add(ground);
    const grid=new THREE.GridHelper(18,18,0x343a42,0x242a30);grid.position.y=-4.16;grid.material.transparent=true;grid.material.opacity=.32;scene.add(grid);

    let breathing=true;
    controls.saveState();
    canvas.addEventListener("dblclick",()=>controls.reset());
    window.addEventListener("keydown",event=>{if(event.key.toLowerCase()==="r")controls.reset()});

    function resize(){
      const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix()
    }
    new ResizeObserver(resize).observe(viewport);resize();
    const clock=new THREE.Clock();
    function animate(now){
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime(),breath=breathing?1+Math.sin(t*1.35)*.018:1;
      rightLung.scale.set(breath,breath,breath);leftLung.scale.set(breath,breath,breath);
      controls.update();
      renderer.render(scene,camera)
    }
    animate(performance.now());
    setTimeout(()=>document.querySelector("#loading").classList.add("hidden"),650);
  </script>
</body>
</html>
