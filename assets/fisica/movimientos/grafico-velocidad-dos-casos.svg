<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="380" fill="#0E1410"/>

  <!-- Global title -->
  <text x="600" y="28" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Velocidad vs tiempo — dos casos</text>

  <!-- Panel separator -->
  <line x1="600" y1="60" x2="600" y2="350" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ========== PANEL 1: MRU ========== -->
  <text x="300" y="55" fill="#A8B5AD" font-size="13" font-weight="700" text-anchor="middle">MRU</text>
  <text x="300" y="72" fill="#5A6B60" font-size="10" text-anchor="middle">v = constante · a = 0</text>

  <!-- Grid: plot x=60 to 560, y=90 to 300 -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="60" y1="90" x2="560" y2="90"/>
    <line x1="60" y1="145" x2="560" y2="145"/>
    <line x1="60" y1="200" x2="560" y2="200"/>
    <line x1="60" y1="255" x2="560" y2="255"/>
    <line x1="60" y1="300" x2="560" y2="300"/>
    <line x1="60" y1="90" x2="60" y2="300"/>
    <line x1="185" y1="90" x2="185" y2="300"/>
    <line x1="310" y1="90" x2="310" y2="300"/>
    <line x1="435" y1="90" x2="435" y2="300"/>
    <line x1="560" y1="90" x2="560" y2="300"/>
  </g>
  <line x1="60" y1="90" x2="60" y2="300" stroke="#A8B5AD" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="560" y2="300" stroke="#A8B5AD" stroke-width="1.5"/>
  <g fill="#A8B5AD" font-size="9" text-anchor="middle">
    <text x="60" y="316">0</text>
    <text x="310" y="316">t</text>
    <text x="560" y="316">→</text>
  </g>
  <text x="22" y="200" fill="#A8B5AD" font-size="10" text-anchor="middle" transform="rotate(-90 22 200)">v</text>

  <!-- Shaded area (rectangle = distance) -->
  <rect x="60" y="160" width="500" height="140" fill="rgba(59,130,246,0.15)"/>
  <!-- Horizontal line at v=cte (e.g. v=140) -->
  <line x1="60" y1="160" x2="560" y2="160" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="160" r="4" fill="#3B82F6"/>
  <circle cx="560" cy="160" r="4" fill="#3B82F6"/>
  <text x="310" y="240" fill="#C8D4CC" font-size="10" text-anchor="middle" font-style="italic">área = distancia recorrida</text>

  <!-- ========== PANEL 2: MRUV ========== -->
  <text x="900" y="55" fill="#A8B5AD" font-size="13" font-weight="700" text-anchor="middle">MRUV</text>
  <text x="900" y="72" fill="#5A6B60" font-size="10" text-anchor="middle">a = constante · v cambia linealmente</text>

  <!-- Grid: plot x=640 to 1140, y=90 to 300 -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="640" y1="90" x2="1140" y2="90"/>
    <line x1="640" y1="145" x2="1140" y2="145"/>
    <line x1="640" y1="200" x2="1140" y2="200"/>
    <line x1="640" y1="255" x2="1140" y2="255"/>
    <line x1="640" y1="300" x2="1140" y2="300"/>
    <line x1="640" y1="90" x2="640" y2="300"/>
    <line x1="765" y1="90" x2="765" y2="300"/>
    <line x1="890" y1="90" x2="890" y2="300"/>
    <line x1="1015" y1="90" x2="1015" y2="300"/>
    <line x1="1140" y1="90" x2="1140" y2="300"/>
  </g>
  <line x1="640" y1="90" x2="640" y2="300" stroke="#A8B5AD" stroke-width="1.5"/>
  <line x1="640" y1="300" x2="1140" y2="300" stroke="#A8B5AD" stroke-width="1.5"/>
  <g fill="#A8B5AD" font-size="9" text-anchor="middle">
    <text x="640" y="316">0</text>
    <text x="890" y="316">t</text>
    <text x="1140" y="316">→</text>
  </g>
  <text x="602" y="200" fill="#A8B5AD" font-size="10" text-anchor="middle" transform="rotate(-90 602 200)">v</text>

  <!-- Shaded area (trapezoid under inclined line) -->
  <path d="M 640 300 L 1140 100 L 1140 300 Z" fill="rgba(59,130,246,0.15)"/>
  <!-- Inclined line (v = a·t) from (0,0) to max -->
  <line x1="640" y1="300" x2="1140" y2="100" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="640" cy="300" r="4" fill="#3B82F6"/>
  <circle cx="1140" cy="100" r="4" fill="#3B82F6"/>
  <text x="900" y="240" fill="#C8D4CC" font-size="10" text-anchor="middle" font-style="italic">área = distancia recorrida</text>
  <!-- Slope label -->
  <text x="900" y="125" fill="#3B82F6" font-size="11" font-weight="700" text-anchor="middle">pendiente = a</text>

  <!-- Bottom note -->
  <text x="600" y="350" fill="#5A6B60" font-size="10" text-anchor="middle" font-style="italic">el área bajo la curva siempre representa la distancia recorrida</text>
</svg>
