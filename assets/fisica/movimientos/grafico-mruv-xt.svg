<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0E1410"/>

  <!-- Title -->
  <text x="400" y="38" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Posición vs tiempo — MRUV</text>
  <text x="400" y="60" fill="#5A6B60" font-size="12" text-anchor="middle">Movimiento Rectilíneo Uniformemente Variado · a = 2 m/s² · v₀ = 0</text>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- horizontal -->
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="148" x2="720" y2="148"/>
    <line x1="80" y1="216" x2="720" y2="216"/>
    <line x1="80" y1="284" x2="720" y2="284"/>
    <line x1="80" y1="352" x2="720" y2="352"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
    <!-- vertical -->
    <line x1="80" y1="80" x2="80" y2="420"/>
    <line x1="208" y1="80" x2="208" y2="420"/>
    <line x1="336" y1="80" x2="336" y2="420"/>
    <line x1="464" y1="80" x2="464" y2="420"/>
    <line x1="592" y1="80" x2="592" y2="420"/>
    <line x1="720" y1="80" x2="720" y2="420"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#A8B5AD" stroke-width="2"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#A8B5AD" stroke-width="2"/>

  <!-- X axis tick marks -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="80" y1="420" x2="80" y2="428"/>
    <line x1="208" y1="420" x2="208" y2="428"/>
    <line x1="336" y1="420" x2="336" y2="428"/>
    <line x1="464" y1="420" x2="464" y2="428"/>
    <line x1="592" y1="420" x2="592" y2="428"/>
    <line x1="720" y1="420" x2="720" y2="428"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="middle">
    <text x="80" y="446">0</text>
    <text x="208" y="446">2</text>
    <text x="336" y="446">4</text>
    <text x="464" y="446">6</text>
    <text x="592" y="446">8</text>
    <text x="720" y="446">10</text>
  </g>
  <text x="400" y="478" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600">t (s)</text>

  <!-- Y axis tick marks -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="72" y1="420" x2="80" y2="420"/>
    <line x1="72" y1="352" x2="80" y2="352"/>
    <line x1="72" y1="284" x2="80" y2="284"/>
    <line x1="72" y1="216" x2="80" y2="216"/>
    <line x1="72" y1="148" x2="80" y2="148"/>
    <line x1="72" y1="80" x2="80" y2="80"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="end">
    <text x="64" y="424">0</text>
    <text x="64" y="356">20</text>
    <text x="64" y="288">40</text>
    <text x="64" y="220">60</text>
    <text x="64" y="152">80</text>
    <text x="64" y="84">100</text>
  </g>
  <text x="28" y="250" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600" transform="rotate(-90 28 250)">x (m)</text>

  <!-- Parabola: a=2, x = t². Mapped to plot coords: t→x=80+64t, x_val→y=420-3.4·x -->
  <!-- Smooth polyline through 21 points (every 0.5s) -->
  <path d="M 80 420 L 112 419 L 144 417 L 176 412 L 208 406 L 240 399 L 272 389 L 304 378 L 336 366 L 368 351 L 400 335 L 432 317 L 464 298 L 496 276 L 528 253 L 560 229 L 592 202 L 624 174 L 656 145 L 688 113 L 720 80" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Markers at the 6 main data points (t=0,2,4,6,8,10) -->
  <g fill="#0E1410" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="80" cy="420" r="5.5"/>
    <circle cx="208" cy="406" r="5.5"/>
    <circle cx="336" cy="366" r="5.5"/>
    <circle cx="464" cy="298" r="5.5"/>
    <circle cx="592" cy="202" r="5.5"/>
    <circle cx="720" cy="80" r="5.5"/>
  </g>

  <!-- Data point labels (subtle silver) -->
  <g fill="#A8B5AD" font-size="10" text-anchor="middle">
    <text x="208" y="424">(2, 4)</text>
    <text x="336" y="384">(4, 16)</text>
    <text x="464" y="316">(6, 36)</text>
    <text x="592" y="220">(8, 64)</text>
    <text x="720" y="68">(10, 100)</text>
  </g>

  <!-- Annotation box with formula -->
  <rect x="510" y="100" width="200" height="60" fill="rgba(14,20,16,0.9)" stroke="#3B82F6" stroke-width="1.2" rx="4"/>
  <text x="610" y="126" fill="#3B82F6" font-size="17" font-weight="700" text-anchor="middle">x = ½·a·t²</text>
  <text x="610" y="148" fill="#A8B5AD" font-size="11" text-anchor="middle">parábola característica del MRUV</text>
</svg>
