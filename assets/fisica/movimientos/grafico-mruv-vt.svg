<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0E1410"/>

  <!-- Title -->
  <text x="400" y="38" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Velocidad vs tiempo — MRUV</text>
  <text x="400" y="60" fill="#5A6B60" font-size="12" text-anchor="middle">Movimiento Rectilíneo Uniformemente Variado · a = 4 m/s² · v₀ = 0</text>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- horizontal: y for v = 0, 10, 20, 30, 40 -->
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="165" x2="720" y2="165"/>
    <line x1="80" y1="250" x2="720" y2="250"/>
    <line x1="80" y1="335" x2="720" y2="335"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
    <!-- vertical: t = 0, 2, 4, 6, 8, 10 -->
    <line x1="80" y1="80" x2="80" y2="420"/>
    <line x1="208" y1="80" x2="208" y2="420"/>
    <line x1="336" y1="80" x2="336" y2="420"/>
    <line x1="464" y1="80" x2="464" y2="420"/>
    <line x1="592" y1="80" x2="592" y2="420"/>
    <line x1="720" y1="80" x2="720" y2="420"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#A8B5AD" stroke-width="2"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#A8B5AD" stroke-width="2"/>

  <!-- X axis tick marks -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="80" y1="420" x2="80" y2="428"/>
    <line x1="208" y1="420" x2="208" y2="428"/>
    <line x1="336" y1="420" x2="336" y2="428"/>
    <line x1="464" y1="420" x2="464" y2="428"/>
    <line x1="592" y1="420" x2="592" y2="428"/>
    <line x1="720" y1="420" x2="720" y2="428"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="middle">
    <text x="80" y="446">0</text>
    <text x="208" y="446">2</text>
    <text x="336" y="446">4</text>
    <text x="464" y="446">6</text>
    <text x="592" y="446">8</text>
    <text x="720" y="446">10</text>
  </g>
  <text x="400" y="478" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600">t (s)</text>

  <!-- Y axis tick marks: v = 0, 10, 20, 30, 40 → y_plot = 420, 335, 250, 165, 80 -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="72" y1="420" x2="80" y2="420"/>
    <line x1="72" y1="335" x2="80" y2="335"/>
    <line x1="72" y1="250" x2="80" y2="250"/>
    <line x1="72" y1="165" x2="80" y2="165"/>
    <line x1="72" y1="80" x2="80" y2="80"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="end">
    <text x="64" y="424">0</text>
    <text x="64" y="339">10</text>
    <text x="64" y="254">20</text>
    <text x="64" y="169">30</text>
    <text x="64" y="84">40</text>
  </g>
  <text x="28" y="250" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600" transform="rotate(-90 28 250)">v (m/s)</text>

  <!-- Shaded area under the line (representing distance) -->
  <path d="M 80 420 L 720 80 L 720 420 Z" fill="rgba(59,130,246,0.15)" stroke="none"/>

  <!-- Straight line: v = 4t. From (0,0)→(80,420) to (10,40)→(720,80) -->
  <line x1="80" y1="420" x2="720" y2="80" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Markers at data points: (0,0), (2,8), (4,16), (6,24), (8,32), (10,40) -->
  <!-- plot coords: t→x=80+64t, v→y=420-8.5·v -->
  <g fill="#0E1410" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="80" cy="420" r="5.5"/>
    <circle cx="208" cy="352" r="5.5"/>
    <circle cx="336" cy="284" r="5.5"/>
    <circle cx="464" cy="216" r="5.5"/>
    <circle cx="592" cy="148" r="5.5"/>
    <circle cx="720" cy="80" r="5.5"/>
  </g>

  <!-- Data point labels (subtle) -->
  <g fill="#A8B5AD" font-size="10" text-anchor="middle">
    <text x="208" y="370">(2, 8)</text>
    <text x="336" y="302">(4, 16)</text>
    <text x="464" y="234">(6, 24)</text>
    <text x="592" y="166">(8, 32)</text>
    <text x="720" y="70">(10, 40)</text>
  </g>

  <!-- Annotation: line equation -->
  <rect x="490" y="100" width="220" height="58" fill="rgba(14,20,16,0.9)" stroke="#3B82F6" stroke-width="1.2" rx="4"/>
  <text x="600" y="125" fill="#3B82F6" font-size="16" font-weight="700" text-anchor="middle">v = v₀ + a·t</text>
  <text x="600" y="146" fill="#A8B5AD" font-size="11" text-anchor="middle">pendiente = aceleración</text>

  <!-- Annotation: shaded area = distance -->
  <text x="430" y="305" fill="#C8D4CC" font-size="12" font-style="italic" text-anchor="middle">área = distancia recorrida</text>
</svg>
