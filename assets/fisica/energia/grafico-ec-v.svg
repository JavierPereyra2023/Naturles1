<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0E1410"/>

  <!-- Title -->
  <text x="400" y="38" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Energía cinética vs velocidad</text>
  <text x="400" y="60" fill="#5A6B60" font-size="12" text-anchor="middle">Para un cuerpo de masa m = 10 kg</text>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- horizontal: Ec = 0, 500, 1000, 1500, 2000 → y_plot = 420, 335, 250, 165, 80 -->
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="165" x2="720" y2="165"/>
    <line x1="80" y1="250" x2="720" y2="250"/>
    <line x1="80" y1="335" x2="720" y2="335"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
    <!-- vertical: v = 0, 5, 10, 15, 20 → x_plot = 80, 240, 400, 560, 720 -->
    <line x1="80" y1="80" x2="80" y2="420"/>
    <line x1="240" y1="80" x2="240" y2="420"/>
    <line x1="400" y1="80" x2="400" y2="420"/>
    <line x1="560" y1="80" x2="560" y2="420"/>
    <line x1="720" y1="80" x2="720" y2="420"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#A8B5AD" stroke-width="2"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#A8B5AD" stroke-width="2"/>

  <!-- X axis tick marks: v = 0, 5, 10, 15, 20 -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="80" y1="420" x2="80" y2="428"/>
    <line x1="240" y1="420" x2="240" y2="428"/>
    <line x1="400" y1="420" x2="400" y2="428"/>
    <line x1="560" y1="420" x2="560" y2="428"/>
    <line x1="720" y1="420" x2="720" y2="428"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="middle">
    <text x="80" y="446">0</text>
    <text x="240" y="446">5</text>
    <text x="400" y="446">10</text>
    <text x="560" y="446">15</text>
    <text x="720" y="446">20</text>
  </g>
  <text x="400" y="478" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600">v (m/s)</text>

  <!-- Y axis tick marks: Ec = 0, 500, 1000, 1500, 2000 -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="72" y1="420" x2="80" y2="420"/>
    <line x1="72" y1="335" x2="80" y2="335"/>
    <line x1="72" y1="250" x2="80" y2="250"/>
    <line x1="72" y1="165" x2="80" y2="165"/>
    <line x1="72" y1="80" x2="80" y2="80"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="end">
    <text x="64" y="424">0</text>
    <text x="64" y="339">500</text>
    <text x="64" y="254">1000</text>
    <text x="64" y="169">1500</text>
    <text x="64" y="84">2000</text>
  </g>
  <text x="28" y="250" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600" transform="rotate(-90 28 250)">Ec (J)</text>

  <!-- Parabola: Ec = 5v² at v=0,5,10,15,20 → Ec=0,125,500,1125,2000 -->
  <!-- Smooth curve through 21 points (v=0 to 20 step 1) -->
  <!-- plot: v→x=80+32v, Ec→y=420-0.17·Ec -->
  <path d="M 80 420 L 112 419 L 144 416 L 176 412 L 208 405 L 240 397 L 272 386 L 304 374 L 336 359 L 368 343 L 400 325 L 432 305 L 464 283 L 496 260 L 528 234 L 560 207 L 592 178 L 624 147 L 656 115 L 688 99 L 720 80" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Markers at 5 main data points -->
  <g fill="#0E1410" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="80" cy="420" r="5.5"/>
    <circle cx="240" cy="399" r="5.5"/>
    <circle cx="400" cy="335" r="5.5"/>
    <circle cx="560" cy="229" r="5.5"/>
    <circle cx="720" cy="80" r="5.5"/>
  </g>

  <!-- Data point labels (subtle) -->
  <g fill="#A8B5AD" font-size="10" text-anchor="middle">
    <text x="240" y="418">(5, 125)</text>
    <text x="400" y="354">(10, 500)</text>
    <text x="560" y="248">(15, 1125)</text>
    <text x="720" y="68">(20, 2000)</text>
  </g>

  <!-- Annotation: formula -->
  <rect x="500" y="100" width="200" height="58" fill="rgba(14,20,16,0.9)" stroke="#3B82F6" stroke-width="1.2" rx="4"/>
  <text x="600" y="125" fill="#3B82F6" font-size="17" font-weight="700" text-anchor="middle">Ec = ½·m·v²</text>
  <text x="600" y="146" fill="#A8B5AD" font-size="11" text-anchor="middle">depende del cuadrado de v</text>

  <!-- Key insight -->
  <text x="400" y="160" fill="#C8D4CC" font-size="12" font-style="italic" text-anchor="middle">al duplicar v, Ec se cuadruplica</text>
</svg>
