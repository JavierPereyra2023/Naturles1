<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0E1410"/>

  <!-- Title -->
  <text x="400" y="38" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Energía potencial gravitatoria vs altura</text>
  <text x="400" y="60" fill="#5A6B60" font-size="12" text-anchor="middle">Para un cuerpo de masa m = 2 kg · g = 9,8 m/s²</text>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- horizontal: Ep = 0, 100, 200, 300, 400 → y_plot = 420, 335, 250, 165, 80 -->
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="165" x2="720" y2="165"/>
    <line x1="80" y1="250" x2="720" y2="250"/>
    <line x1="80" y1="335" x2="720" y2="335"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
    <!-- vertical: h = 0, 5, 10, 15, 20 → x_plot = 80, 240, 400, 560, 720 -->
    <line x1="80" y1="80" x2="80" y2="420"/>
    <line x1="240" y1="80" x2="240" y2="420"/>
    <line x1="400" y1="80" x2="400" y2="420"/>
    <line x1="560" y1="80" x2="560" y2="420"/>
    <line x1="720" y1="80" x2="720" y2="420"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#A8B5AD" stroke-width="2"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#A8B5AD" stroke-width="2"/>

  <!-- X axis tick marks: h = 0, 5, 10, 15, 20 -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="80" y1="420" x2="80" y2="428"/>
    <line x1="240" y1="420" x2="240" y2="428"/>
    <line x1="400" y1="420" x2="400" y2="428"/>
    <line x1="560" y1="420" x2="560" y2="428"/>
    <line x1="720" y1="420" x2="720" y2="428"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="middle">
    <text x="80" y="446">0</text>
    <text x="240" y="446">5</text>
    <text x="400" y="446">10</text>
    <text x="560" y="446">15</text>
    <text x="720" y="446">20</text>
  </g>
  <text x="400" y="478" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600">h (m)</text>

  <!-- Y axis tick marks: Ep = 0, 100, 200, 300, 400 -->
  <g stroke="#A8B5AD" stroke-width="1.5">
    <line x1="72" y1="420" x2="80" y2="420"/>
    <line x1="72" y1="335" x2="80" y2="335"/>
    <line x1="72" y1="250" x2="80" y2="250"/>
    <line x1="72" y1="165" x2="80" y2="165"/>
    <line x1="72" y1="80" x2="80" y2="80"/>
  </g>
  <g fill="#C8D4CC" font-size="13" text-anchor="end">
    <text x="64" y="424">0</text>
    <text x="64" y="339">100</text>
    <text x="64" y="254">200</text>
    <text x="64" y="169">300</text>
    <text x="64" y="84">400</text>
  </g>
  <text x="28" y="250" fill="#A8B5AD" font-size="14" text-anchor="middle" font-weight="600" transform="rotate(-90 28 250)">Ep (J)</text>

  <!-- Straight line: Ep = 19.6·h, slope 19.6 J/m -->
  <!-- plot: h→x=80+32h, Ep→y=420-0.85·Ep -->
  <!-- h=0 → (80, 420), h=5 → Ep=98 → y=336.7, h=10 → Ep=196 → y=253.4, h=15 → Ep=294 → y=170.1, h=20 → Ep=392 → y=86.8 -->
  <line x1="80" y1="420" x2="720" y2="86.8" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Markers at data points -->
  <g fill="#0E1410" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="80" cy="420" r="5.5"/>
    <circle cx="240" cy="337" r="5.5"/>
    <circle cx="400" cy="253" r="5.5"/>
    <circle cx="560" cy="170" r="5.5"/>
    <circle cx="720" cy="87" r="5.5"/>
  </g>

  <!-- Data point labels (subtle) -->
  <g fill="#A8B5AD" font-size="10" text-anchor="middle">
    <text x="240" y="356">(5, 98)</text>
    <text x="400" y="272">(10, 196)</text>
    <text x="560" y="189">(15, 294)</text>
    <text x="720" y="68">(20, 392)</text>
  </g>

  <!-- Annotation: formula -->
  <rect x="500" y="350" width="200" height="58" fill="rgba(14,20,16,0.9)" stroke="#3B82F6" stroke-width="1.2" rx="4"/>
  <text x="600" y="375" fill="#3B82F6" font-size="17" font-weight="700" text-anchor="middle">Ep = m·g·h</text>
  <text x="600" y="396" fill="#A8B5AD" font-size="11" text-anchor="middle">crece linealmente con h</text>
</svg>
