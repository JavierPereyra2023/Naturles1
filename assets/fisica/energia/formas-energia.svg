<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Formas de energía en situaciones cotidianas</title>
  <desc id="d">Una pelota en movimiento, una roca elevada, una olla caliente y una lámpara conectada representan energía cinética, potencial, térmica y eléctrica.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102d46"/><stop offset="1" stop-color="#08131e"/></linearGradient>
    <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#2d5b4f"/><stop offset="1" stop-color="#102d29"/></linearGradient>
    <linearGradient id="steel"><stop stop-color="#e2e8f0"/><stop offset=".45" stop-color="#64748b"/><stop offset=".72" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <radialGradient id="bulb"><stop stop-color="#fffbd1"/><stop offset=".38" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="scene"><rect x="18" y="54" width="764" height="344" rx="20"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="#070d13"/>
  <text x="400" y="32" text-anchor="middle" fill="#e6f4ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">LA ENERGÍA APARECE DE DISTINTAS FORMAS</text>
  <g clip-path="url(#scene)">
    <rect x="18" y="54" width="764" height="344" fill="url(#sky)"/>
    <path d="M18 260C120 220 182 268 273 232C350 201 412 209 492 240C580 274 655 221 782 245V398H18Z" fill="url(#hill)"/>
    <path d="M18 340C180 318 330 350 498 327C605 312 697 318 782 330V398H18Z" fill="#162226"/>

    <!-- Cinética: pelota rodando -->
    <g>
      <ellipse cx="152" cy="334" rx="62" ry="10" fill="#000" opacity=".38"/>
      <g>
        <circle cx="152" cy="301" r="33" fill="#f4f4f2" stroke="#cbd5e1" stroke-width="2"/>
        <path d="M152 283l17 12-6 20h-22l-7-20z" fill="#18212d"/>
        <path d="M134 295l-19-9M169 295l18-10M141 315l-10 17M163 315l11 17" stroke="#18212d" stroke-width="5"/>
        <animateTransform attributeName="transform" type="translate" values="-35 0;35 0;-35 0" dur="3.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="rotate" values="0 152 301;360 152 301" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <g stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity=".65">
        <path d="M69 285h32"><animate attributeName="opacity" values="0;.9;0" dur="1.1s" repeatCount="indefinite"/></path>
        <path d="M57 304h42"><animate attributeName="opacity" values=".9;0;.9" dur="1.3s" repeatCount="indefinite"/></path>
      </g>
      <rect x="64" y="361" width="176" height="29" rx="14" fill="#07131e" opacity=".88"/>
      <text x="152" y="381" text-anchor="middle" fill="#bae6fd" font-family="Arial,sans-serif" font-size="17" font-weight="700">CINÉTICA · MOVIMIENTO</text>
    </g>

    <!-- Potencial: roca elevada -->
    <g filter="url(#shadow)">
      <path d="M286 312l32-157 80-42 56 199z" fill="#334b47"/>
      <path d="M318 155l80-42 17 61-93 49z" fill="#54756c"/>
      <path d="M338 121l25-17 27 9 10 25-22 17-35-4z" fill="#8d8478" stroke="#b8aa97" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M421 283V142" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M412 153l9-14 9 14" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <text x="435" y="216" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="16">altura h</text>
    <rect x="290" y="361" width="176" height="29" rx="14" fill="#161123" opacity=".9"/>
    <text x="378" y="381" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="17" font-weight="700">POTENCIAL · ALTURA</text>

    <!-- Térmica: recipiente real -->
    <g filter="url(#shadow)">
      <ellipse cx="568" cy="306" rx="56" ry="13" fill="#0b0f13"/>
      <path d="M518 230h100l-11 73c-2 15-12 24-28 24h-24c-16 0-26-9-28-24z" fill="url(#steel)" stroke="#d7e0e8" stroke-width="2"/>
      <ellipse cx="568" cy="231" rx="50" ry="10" fill="#111827" stroke="#94a3b8" stroke-width="3"/>
      <path d="M618 248c45-3 45 48 2 47" fill="none" stroke="#94a3b8" stroke-width="9"/>
      <path d="M534 220h68" stroke="#d8dee7" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
      <path d="M544 215c-23-26 18-35-2-70"><animate attributeName="d" values="M544 215c-23-26 18-35-2-70;M544 215c22-26-18-35 2-70;M544 215c-23-26 18-35-2-70" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M576 215c-23-26 18-35-2-70"><animate attributeName="d" values="M576 215c22-26-18-35 2-70;M576 215c-23-26 18-35-2-70;M576 215c22-26-18-35 2-70" dur="2.1s" repeatCount="indefinite"/></path>
    </g>
    <rect x="480" y="361" width="176" height="29" rx="14" fill="#26140d" opacity=".9"/>
    <text x="568" y="381" text-anchor="middle" fill="#fed7aa" font-family="Arial,sans-serif" font-size="17" font-weight="700">TÉRMICA · CALOR</text>

    <!-- Eléctrica: lámpara -->
    <g>
      <path d="M694 340V249M664 340h60M678 249h32" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
      <path d="M694 249l-36-52h72z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="694" cy="220" r="17" fill="url(#bulb)" filter="url(#glow)">
        <animate attributeName="opacity" values=".72;1;.72" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <path d="M694 340c0 20 34 15 47 37" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 7">
        <animate attributeName="stroke-dashoffset" values="0;-30" dur="1s" repeatCount="indefinite"/>
      </path>
      <rect x="662" y="361" width="120" height="29" rx="14" fill="#0e281f" opacity=".92"/>
      <text x="722" y="381" text-anchor="middle" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="17" font-weight="700">ELÉCTRICA</text>
    </g>
  </g>
</svg>
