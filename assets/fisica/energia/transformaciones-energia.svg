<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Transformación de energía en una lámpara</title>
  <desc id="d">Una lámpara de mesa conectada transforma energía eléctrica en luz y calor.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#0f2738"/><stop offset=".7" stop-color="#09141d"/><stop offset="1" stop-color="#060b10"/></linearGradient>
    <linearGradient id="metal"><stop stop-color="#d4dce5"/><stop offset=".35" stop-color="#596779"/><stop offset=".65" stop-color="#b8c4d0"/><stop offset="1" stop-color="#303b49"/></linearGradient>
    <radialGradient id="light" cx="50%" cy="16%"><stop stop-color="#fffbd8" stop-opacity=".9"/><stop offset=".35" stop-color="#fde68a" stop-opacity=".38"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".7"/></filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#wall)"/>
  <path d="M0 365H800V450H0Z" fill="#15191d"/>
  <path d="M0 365H800" stroke="#46515d" stroke-width="3"/>
  <!-- tomacorriente y corriente -->
  <g filter="url(#shadow)">
    <rect x="50" y="186" width="95" height="125" rx="10" fill="#e5e7eb" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="83" cy="235" r="8" fill="#334155"/><circle cx="113" cy="235" r="8" fill="#334155"/>
    <path d="M98 264v12" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path id="cable" d="M98 312C112 383 270 383 394 354" fill="none" stroke="#18202a" stroke-width="13" stroke-linecap="round"/>
  <path d="M98 312C112 383 270 383 394 354" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 14">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur=".8s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#a5f3fc" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#cable"/></animateMotion>
  </circle>

  <!-- lámpara de escritorio -->
  <ellipse cx="440" cy="378" rx="95" ry="16" fill="#000" opacity=".5"/>
  <g filter="url(#shadow)">
    <path d="M390 362h100c15 0 25 12 25 21H365c0-9 10-21 25-21z" fill="url(#metal)" stroke="#aab5c1" stroke-width="2"/>
    <path d="M440 362l12-154" stroke="url(#metal)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="452" cy="208" r="14" fill="#27313c" stroke="#c1ccd6" stroke-width="3"/>
    <path d="M452 208l87-75" stroke="url(#metal)" stroke-width="17" stroke-linecap="round"/>
    <path d="M506 111h108l31 92H474z" fill="#304457" stroke="#aab8c4" stroke-width="3"/>
    <ellipse cx="560" cy="202" rx="85" ry="15" fill="#1c2935" stroke="#8192a1" stroke-width="3"/>
    <circle cx="560" cy="195" r="22" fill="#fde047" filter="url(#glow)">
      <animate attributeName="r" values="20;24;20" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- cono luminoso -->
  <path d="M487 205L366 365H752L632 205Z" fill="url(#light)" opacity=".82">
    <animate attributeName="opacity" values=".68;.9;.68" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M511 229l-65 75"/><path d="M560 233v91"/><path d="M610 229l64 75"/>
  </g>

  <!-- calor que asciende -->
  <g fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round">
    <path d="M535 174c-18-22 15-32-2-60"><animate attributeName="d" values="M535 174c-18-22 15-32-2-60;M535 174c18-22-15-32 2-60;M535 174c-18-22 15-32-2-60" dur="2.1s" repeatCount="indefinite"/></path>
    <path d="M566 170c-18-22 15-32-2-60"><animate attributeName="d" values="M566 170c18-22-15-32 2-60;M566 170c-18-22 15-32-2-60;M566 170c18-22-15-32 2-60" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M595 175c-18-22 15-32-2-60"><animate attributeName="d" values="M595 175c-18-22 15-32-2-60;M595 175c18-22-15-32 2-60;M595 175c-18-22 15-32-2-60" dur="2.2s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
    <rect x="40" y="57" width="190" height="44" rx="22" fill="#0d2e46" stroke="#38bdf8"/>
    <text x="135" y="85" fill="#bae6fd" font-size="18">ENERGÍA ELÉCTRICA</text>
    <rect x="545" y="322" width="180" height="38" rx="19" fill="#3b3012" stroke="#fde047"/>
    <text x="635" y="347" fill="#fef3c7" font-size="17">ENERGÍA LUMINOSA</text>
    <rect x="581" y="57" width="145" height="38" rx="19" fill="#3b1e12" stroke="#fb923c"/>
    <text x="653" y="82" fill="#fed7aa" font-size="17">ENERGÍA TÉRMICA</text>
  </g>
</svg>
