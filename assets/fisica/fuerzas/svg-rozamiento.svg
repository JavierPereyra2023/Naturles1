<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Diagrama de la fuerza de rozamiento">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <pattern id="gridR" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowRMov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/>
    </marker>
    <marker id="arrowRN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>
  <rect width="800" height="500" fill="url(#gridR)"/>

  <!-- Title -->
  <text x="40" y="50" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3">FUERZA COTIDIANA · 05</text>
  <text x="40" y="86" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="800">Rozamiento</text>
  <text x="40" y="112" fill="#5A6B60" font-family="Inter, sans-serif" font-size="12">La fuerza que frena todo lo que se mueve por contacto</text>

  <!-- Surface (rough) -->
  <g transform="translate(0, 320)">
    <!-- Ground line (with bumps) -->
    <path d="M 60 0 L 80 -3 L 100 0 L 120 -4 L 140 0 L 160 -2 L 180 -5 L 200 -3 L 220 0 L 240 -4 L 260 0 L 280 -3 L 300 0 L 320 -5 L 340 -2 L 360 0 L 380 -3 L 400 0 L 420 -4 L 440 -1 L 460 0 L 480 -3 L 500 0 L 520 -5 L 540 -2 L 560 0 L 580 -3 L 600 0 L 620 -4 L 640 -1 L 660 0 L 680 -3 L 700 0 L 720 -2 L 740 0" fill="none" stroke="#5A6B60" stroke-width="2"/>

    <!-- Underground hatch -->
    <g stroke="#5A6B60" stroke-width="1" opacity="0.5">
      <line x1="60" y1="6" x2="68" y2="20"/>
      <line x1="100" y1="6" x2="108" y2="20"/>
      <line x1="140" y1="6" x2="148" y2="20"/>
      <line x1="180" y1="6" x2="188" y2="20"/>
      <line x1="220" y1="6" x2="228" y2="20"/>
      <line x1="260" y1="6" x2="268" y2="20"/>
      <line x1="300" y1="6" x2="308" y2="20"/>
      <line x1="340" y1="6" x2="348" y2="20"/>
      <line x1="380" y1="6" x2="388" y2="20"/>
      <line x1="420" y1="6" x2="428" y2="20"/>
      <line x1="460" y1="6" x2="468" y2="20"/>
      <line x1="500" y1="6" x2="508" y2="20"/>
      <line x1="540" y1="6" x2="548" y2="20"/>
      <line x1="580" y1="6" x2="588" y2="20"/>
      <line x1="620" y1="6" x2="628" y2="20"/>
      <line x1="660" y1="6" x2="668" y2="20"/>
      <line x1="700" y1="6" x2="708" y2="20"/>
      <line x1="740" y1="6" x2="748" y2="20"/>
    </g>
  </g>

  <!-- Box sliding -->
  <g transform="translate(380, 240)">
    <rect x="-50" y="-30" width="100" height="80" fill="rgba(245,158,11,0.18)" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="14" text-anchor="middle" fill="#F59E0B" font-family="Inter, sans-serif" font-size="18" font-weight="800">m</text>
    <text x="0" y="-40" text-anchor="middle" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="10" font-weight="600">cuerpo</text>
  </g>

  <!-- Velocity arrow (movement) -->
  <line x1="430" y1="180" x2="600" y2="180" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrowRMov)"/>
  <text x="515" y="170" text-anchor="middle" fill="#22C55E" font-family="Inter, sans-serif" font-size="11" font-weight="700">v (movimiento)</text>

  <!-- Friction arrow (opposite to movement) -->
  <line x1="380" y1="320" x2="280" y2="320" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowR)"/>
<text x="320" y="345" text-anchor="middle" fill="#F59E0B" font-family="Inter, sans-serif" font-size="13" font-weight="700">f_r (rozamiento)</text>
  <text x="320" y="360" text-anchor="middle" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="10">opuesta al movimiento</text>

  <!-- Normal arrow (up) -->
  <line x1="380" y1="240" x2="380" y2="160" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arrowRN)"/>
  <text x="400" y="200" fill="#60A5FA" font-family="Inter, sans-serif" font-size="12" font-weight="700">N (normal)</text>
  <text x="400" y="216" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="10">perpendicular a la superficie</text>

  <!-- Weight arrow (down) -->
  <line x1="380" y1="280" x2="380" y2="365" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="402" y="335" fill="#EF4444" font-family="Inter, sans-serif" font-size="12" font-weight="700">P (peso)</text>
  <text x="402" y="351" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="10">hacia el centro de la Tierra</text>

  <!-- Micro-rubbing zoom callout -->
  <g transform="translate(620, 200)">
    <text x="0" y="0" fill="#F59E0B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">SUPERFICIES REALES</text>
    <!-- Two rough surfaces interlocking -->
    <g transform="translate(0, 20)">
      <path d="M 0 0 L 6 8 L 12 2 L 18 9 L 24 3 L 30 8 L 36 2 L 42 9 L 48 3 L 54 8 L 60 2 L 66 9 L 72 3 L 78 8 L 84 0" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
      <path d="M 0 30 L 6 25 L 12 32 L 18 24 L 24 33 L 30 25 L 36 32 L 42 24 L 48 33 L 54 25 L 60 32 L 66 24 L 72 33 L 78 25 L 84 30" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
      <line x1="0" y1="14" x2="84" y2="14" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
      <text x="0" y="50" fill="#5A6B60" font-family="Inter, sans-serif" font-size="8" font-style="italic">asperezas se traban</text>
    </g>
  </g>

  <!-- Bottom: formula -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="720" height="28" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)"/>
    <text x="14" y="18" fill="#F59E0B" font-family="Inter, sans-serif" font-size="12" font-weight="700">f_r = μ · N</text>
    <text x="180" y="18" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="10">μ = coeficiente de rozamiento (estático μₑ o cinético μ_c) · N = fuerza normal</text>
    <text x="700" y="18" fill="#5A6B60" font-family="Inter, sans-serif" font-size="9" text-anchor="end">no es fundamental: emerge de la interacción electromagnética entre átomos</text>
  </g>
</svg>
