<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Diagrama de la fuerza nuclear fuerte">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C2D12" stop-opacity="0.15"/>
    </radialGradient>
    <pattern id="gridNF" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect width="800" height="500" fill="url(#gridNF)"/>

  <!-- Title -->
  <text x="40" y="50" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3">FUERZA FUNDAMENTAL · 03</text>
  <text x="40" y="86" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="800">Fuerza Nuclear Fuerte</text>
  <text x="40" y="112" fill="#5A6B60" font-family="Inter, sans-serif" font-size="12">Mantiene unidos los quarks y el núcleo atómico</text>

  <!-- Atom container (left half) -->
  <g transform="translate(220, 290)">
    <!-- Electron orbits -->
    <g fill="none" stroke="rgba(96,165,250,0.25)" stroke-width="1">
      <ellipse cx="0" cy="0" rx="200" ry="80" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="200" ry="80" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="200" ry="80" transform="rotate(120)"/>
    </g>

    <!-- Nucleus (big) -->
    <circle r="55" fill="url(#nucleusGrad)" stroke="#FB923C" stroke-width="2"/>

    <!-- Inside nucleus: 4 protons and 3 neutrons -->
    <g>
      <circle cx="-22" cy="-15" r="11" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
      <text x="-22" y="-12" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">p⁺</text>

      <circle cx="10" cy="-22" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
      <text x="10" y="-19" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">n</text>

      <circle cx="22" cy="10" r="11" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
      <text x="22" y="13" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">p⁺</text>

      <circle cx="-12" cy="20" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
      <text x="-12" y="23" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">n</text>

      <circle cx="5" cy="0" r="11" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
      <text x="5" y="3" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">p⁺</text>

      <circle cx="-30" cy="0" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
      <text x="-30" y="3" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">n</text>

      <circle cx="20" cy="-5" r="11" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
      <text x="20" y="-2" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="800">p⁺</text>
    </g>

    <!-- Electrons on orbit -->
    <circle cx="200" cy="0" r="6" fill="#60A5FA" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="-100" cy="-69" r="6" fill="#60A5FA" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="-100" cy="69" r="6" fill="#60A5FA" stroke="#3B82F6" stroke-width="1"/>

    <text x="0" y="240" text-anchor="middle" fill="#FB923C" font-family="Inter, sans-serif" font-size="12" font-weight="700">ÁTOMO (litio-7)</text>
    <text x="0" y="258" text-anchor="middle" fill="#5A6B60" font-family="Inter, sans-serif" font-size="10">3 protones · 4 neutrones · 3 electrones</text>
  </g>

  <!-- Gluon "springs" (zoomed nucleus) -->
  <g transform="translate(620, 290)">
    <text x="-60" y="-180" fill="#FCD34D" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ZOOM · NÚCLEO</text>

    <!-- Force lines (gluons) -->
    <g stroke="#FB923C" stroke-width="1.8" fill="none" opacity="0.9">
      <path d="M -38 -36 Q -10 -20 24 -38" stroke-dasharray="3,2"/>
      <path d="M 24 -38 Q 30 0 48 22" stroke-dasharray="3,2"/>
      <path d="M 48 22 Q 20 30 -16 40" stroke-dasharray="3,2"/>
      <path d="M -16 40 Q -45 20 -38 -36" stroke-dasharray="3,2"/>
      <path d="M -38 -36 Q 5 0 24 -38" stroke-dasharray="3,2"/>
      <path d="M -16 40 Q 5 0 48 22" stroke-dasharray="3,2"/>
    </g>

    <!-- Nucleons -->
    <circle cx="-38" cy="-36" r="14" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
    <text x="-38" y="-32" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="800">p</text>

    <circle cx="24" cy="-38" r="14" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="24" y="-34" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="800">n</text>

    <circle cx="48" cy="22" r="14" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
    <text x="48" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="800">p</text>

    <circle cx="-16" cy="40" r="14" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="-16" y="44" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="800">n</text>

    <!-- g label -->
    <g transform="translate(-5, -10)">
      <circle r="9" fill="#FB923C"/>
      <text y="3" text-anchor="middle" fill="#0E1410" font-family="Inter, sans-serif" font-size="9" font-weight="800">g</text>
    </g>

    <text x="0" y="100" text-anchor="middle" fill="#FB923C" font-family="Inter, sans-serif" font-size="11" font-weight="600">gluones (g)</text>
    <text x="0" y="118" text-anchor="middle" fill="#5A6B60" font-family="Inter, sans-serif" font-size="9">pegan quarks entre sí</text>
  </g>

  <!-- Bottom info -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="720" height="28" fill="rgba(251,146,60,0.08)" stroke="rgba(251,146,60,0.2)"/>
    <text x="14" y="18" fill="#FB923C" font-family="Inter, sans-serif" font-size="11" font-weight="600">Alcance: 10⁻¹⁵ m (1 femtómetro)</text>
    <text x="320" y="18" fill="#5A6B60" font-family="Inter, sans-serif" font-size="10">La más fuerte de las 4 fuerzas fundamentales · venciendo la repulsión eléctrica entre protones</text>
  </g>
</svg>
