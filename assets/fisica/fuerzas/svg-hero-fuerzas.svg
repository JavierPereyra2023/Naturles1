<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Patrón de fondo con las 4 fuerzas fundamentales">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="rg1" cx="0.2" cy="0.3">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="0.85" cy="0.7">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg3" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridH" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bgH)"/>
  <rect width="1200" height="400" fill="url(#gridH)"/>
  <rect width="1200" height="400" fill="url(#rg1)"/>
  <rect width="1200" height="400" fill="url(#rg2)"/>
  <rect width="1200" height="400" fill="url(#rg3)"/>

  <!-- Floating orbital rings suggesting forces at scale -->
  <g opacity="0.4" fill="none" stroke-width="1.2">
    <!-- Gravity ring (círculo grande) -->
    <circle cx="200" cy="120" r="80" stroke="#3B82F6" stroke-dasharray="3,4"/>
    <circle cx="200" cy="120" r="130" stroke="#3B82F6" stroke-dasharray="3,4" opacity="0.5"/>
    <circle cx="200" cy="120" r="180" stroke="#3B82F6" stroke-dasharray="3,4" opacity="0.3"/>

    <!-- Electromagnetismo (líneas curvas) -->
    <g stroke="#A78BFA" opacity="0.5">
      <path d="M 850 80 Q 950 100 1050 80 Q 1100 150 1050 220"/>
      <path d="M 850 80 Q 950 110 1050 80 Q 1080 150 1050 220" opacity="0.7"/>
      <path d="M 850 80 Q 950 90 1050 80 Q 1090 150 1050 220" opacity="0.4"/>
    </g>
    <!-- N/S imán -->
    <rect x="820" y="60" width="14" height="40" fill="#EF4444" stroke="#DC2626" opacity="0.7"/>
    <rect x="820" y="100" width="14" height="40" fill="#3B82F6" stroke="#1E40AF" opacity="0.7"/>

    <!-- Nuclear fuerte (átomo estilizado, centro) -->
    <g transform="translate(600, 200)" stroke="#FB923C" opacity="0.5">
      <ellipse cx="0" cy="0" rx="120" ry="40"/>
      <ellipse cx="0" cy="0" rx="120" ry="40" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="120" ry="40" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="20" fill="#FB923C" opacity="0.6"/>
    </g>

    <!-- Nuclear débil (onda de decaimiento, abajo izquierda) -->
    <g transform="translate(280, 320)" stroke="#FBBF24" opacity="0.5">
      <path d="M -60 0 Q -30 -10 0 0 T 60 0"/>
      <path d="M -60 0 Q -30 -16 0 0 T 60 0" opacity="0.7"/>
      <circle cx="0" cy="0" r="6" fill="#FBBF24" opacity="0.7"/>
      <circle cx="50" cy="-2" r="3" fill="#22C55E" opacity="0.7"/>
    </g>
  </g>

  <!-- Texto sutil de fondo -->
  <text x="600" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="120" font-weight="900" fill="rgba(255,255,255,0.02)" letter-spacing="20">FUNDAMENTALES</text>
</svg>
