<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Diagrama de la fuerza de gravedad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="apple" cx="0.35" cy="0.35">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7F1D1D" stop-opacity="0.85"/>
    </radialGradient>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/>
    </marker>
    <pattern id="gridG" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#gridG)"/>

  <!-- Title -->
  <text x="40" y="50" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3">FUERZA FUNDAMENTAL · 01</text>
  <text x="40" y="86" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="800">Gravedad</text>
  <text x="40" y="112" fill="#5A6B60" font-family="Inter, sans-serif" font-size="12">Atracción entre todas las masas del universo</text>

  <!-- Earth -->
  <circle cx="240" cy="330" r="78" fill="url(#earth)" stroke="#60A5FA" stroke-width="2"/>
  <text x="240" y="430" text-anchor="middle" fill="#60A5FA" font-family="Inter, sans-serif" font-size="13" font-weight="600">Tierra</text>
  <text x="240" y="448" text-anchor="middle" fill="#5A6B60" font-family="Inter, sans-serif" font-size="10">M = 5,97 × 10²⁴ kg</text>

  <!-- Earth surface reference line -->
  <line x1="155" y1="252" x2="325" y2="252" stroke="rgba(96,165,250,0.3)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Apple falling -->
  <g>
    <circle cx="540" cy="200" r="22" fill="url(#apple)" stroke="#FCA5A5" stroke-width="1.5"/>
    <path d="M 540 178 Q 545 168 552 168" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 552 168 L 558 165 L 553 170 Z" fill="#16A34A"/>
  </g>

  <!-- Trajectory dots (parabolic feel) -->
  <g fill="#3B82F6" opacity="0.5">
    <circle cx="460" cy="195" r="2"/>
    <circle cx="478" cy="200" r="2"/>
    <circle cx="498" cy="208" r="2"/>
    <circle cx="518" cy="220" r="2"/>
  </g>
  <path d="M 455 180 Q 500 200 540 200" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Gravity vector arrow -->
  <line x1="540" y1="225" x2="540" y2="320" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="558" y="280" fill="#3B82F6" font-family="Inter, sans-serif" font-size="14" font-weight="700">F = m·g</text>
  <text x="558" y="300" fill="#60A5FA" font-family="Inter, sans-serif" font-size="11">g = 9,8 m/s²</text>

  <!-- Attraction line between Earth and Apple -->
  <line x1="262" y1="305" x2="520" y2="210" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2,4" opacity="0.45"/>
  <text x="350" y="245" fill="#60A5FA" font-family="Inter, sans-serif" font-size="10" font-style="italic">atracción mutua</text>

  <!-- Sun (right side, hint cosmic scale) -->
  <g opacity="0.7">
    <circle cx="720" cy="120" r="36" fill="#FBBF24" opacity="0.4"/>
    <circle cx="720" cy="120" r="22" fill="#FBBF24"/>
    <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round">
      <line x1="720" y1="60" x2="720" y2="70"/>
      <line x1="720" y1="170" x2="720" y2="180"/>
      <line x1="660" y1="120" x2="670" y2="120"/>
      <line x1="770" y1="120" x2="780" y2="120"/>
      <line x1="680" y1="80" x2="687" y2="87"/>
      <line x1="753" y1="153" x2="760" y2="160"/>
      <line x1="760" y1="80" x2="753" y2="87"/>
      <line x1="687" y1="153" x2="680" y2="160"/>
    </g>
    <text x="720" y="190" text-anchor="middle" fill="#FBBF24" font-family="Inter, sans-serif" font-size="10">Sol</text>
  </g>

  <!-- Orbit hint (curved line) -->
  <ellipse cx="720" cy="120" rx="120" ry="60" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="2,3" opacity="0.4" transform="rotate(15 720 120)"/>

  <!-- Bottom info bar -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="720" height="28" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <text x="14" y="18" fill="#60A5FA" font-family="Inter, sans-serif" font-size="11" font-weight="600">F = G·m₁·m₂ / r²</text>
    <text x="200" y="18" fill="#5A6B60" font-family="Inter, sans-serif" font-size="10">Ley de Gravitación Universal · Newton 1687</text>
    <text x="700" y="18" fill="#5A6B60" font-family="Inter, sans-serif" font-size="10" text-anchor="end">Rango: infinito</text>
  </g>
</svg>
