<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="La Respiración podcast">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="glow13" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots13" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg13)"/>
  <rect width="600" height="400" fill="url(#dots13)"/>
  <rect width="600" height="400" fill="url(#glow13)"/>
  <!-- Badge episodio -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="76" height="24" rx="2" fill="#DC2626" opacity="0.15"/>
    <text x="38" y="16" text-anchor="middle" fill="#DC2626" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2">EP 13</text>
  </g>
  <!-- Decoration bottom -->
  <g transform="translate(28, 360)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#DC2626" stroke-width="2" opacity="0.6"/>
  </g>
  
  <g transform="translate(300, 200)">
    <text x="0" y="-140" text-anchor="middle" fill="white" font-family="Playfair Display, serif" font-size="28" font-weight="800">La Respiración</text>

    <!-- Pulmones estilizados -->
    <g transform="translate(0, 0)">
      <!-- Tráquea -->
      <line x1="0" y1="-90" x2="0" y2="-30" stroke="#DC2626" stroke-width="3"/>
      <line x1="-6" y1="-90" x2="-6" y2="-30" stroke="#DC2626" stroke-width="1"/>
      <line x1="6" y1="-90" x2="6" y2="-30" stroke="#DC2626" stroke-width="1"/>

      <!-- Pulmón izquierdo -->
      <ellipse cx="-50" cy="20" rx="38" ry="55" fill="rgba(220,38,38,0.12)" stroke="#DC2626" stroke-width="2.5"/>
      <!-- Pulmón derecho -->
      <ellipse cx="50" cy="20" rx="38" ry="55" fill="rgba(220,38,38,0.12)" stroke="#DC2626" stroke-width="2.5"/>

      <!-- Alvéolos abstractos -->
      <circle cx="-65" cy="0" r="4" fill="#DC2626" opacity="0.5"/>
      <circle cx="-50" cy="40" r="4" fill="#DC2626" opacity="0.5"/>
      <circle cx="-30" cy="60" r="4" fill="#DC2626" opacity="0.5"/>
      <circle cx="65" cy="0" r="4" fill="#DC2626" opacity="0.5"/>
      <circle cx="50" cy="40" r="4" fill="#DC2626" opacity="0.5"/>
      <circle cx="30" cy="60" r="4" fill="#DC2626" opacity="0.5"/>

      <!-- O2 entrando, CO2 saliendo -->
      <text x="-90" y="-50" fill="#3B82F6" font-family="Inter, sans-serif" font-size="11" font-weight="800">O₂</text>
      <text x="78" y="-50" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="11" font-weight="800">CO₂</text>
    </g>
  </g>
</svg>