<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="La Circulación podcast">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="glow12" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots12" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg12)"/>
  <rect width="600" height="400" fill="url(#dots12)"/>
  <rect width="600" height="400" fill="url(#glow12)"/>
  <!-- Badge episodio -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="76" height="24" rx="2" fill="#DC2626" opacity="0.15"/>
    <text x="38" y="16" text-anchor="middle" fill="#DC2626" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2">EP 12</text>
  </g>
  <!-- Decoration bottom -->
  <g transform="translate(28, 360)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#DC2626" stroke-width="2" opacity="0.6"/>
  </g>
  
  <g transform="translate(300, 200)">
    <text x="0" y="-140" text-anchor="middle" fill="white" font-family="Playfair Display, serif" font-size="28" font-weight="800">La Circulación</text>

    <!-- Corazón estilizado -->
    <g transform="translate(0, 0)">
      <path d="M 0 30
               C -20 0 -60 -20 -60 -50
               C -60 -75 -40 -85 -25 -75
               C -15 -68 -5 -55 0 -45
               C 5 -55 15 -68 25 -75
               C 40 -85 60 -75 60 -50
               C 60 -20 20 0 0 30 Z"
            fill="rgba(220,38,38,0.25)" stroke="#DC2626" stroke-width="2.5"/>
      <!-- Arterias -->
      <line x1="-50" y1="-50" x2="-100" y2="-80" stroke="#DC2626" stroke-width="2"/>
      <line x1="50" y1="-50" x2="100" y2="-80" stroke="#DC2626" stroke-width="2"/>
      <!-- Venas -->
      <line x1="-40" y1="0" x2="-90" y2="40" stroke="#3B82F6" stroke-width="2"/>
      <line x1="40" y1="0" x2="90" y2="40" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="-100" cy="-80" r="3" fill="#DC2626"/>
      <circle cx="100" cy="-80" r="3" fill="#DC2626"/>
      <circle cx="-90" cy="40" r="3" fill="#3B82F6"/>
      <circle cx="90" cy="40" r="3" fill="#3B82F6"/>
    </g>
    <text x="0" y="100" text-anchor="middle" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="9" letter-spacing="2">ARTERIAS · VENAS · SANGRE</text>
  </g>
</svg>