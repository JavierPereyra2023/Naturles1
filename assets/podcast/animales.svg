<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Los Animales podcast">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1410"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <radialGradient id="glow10" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots10" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg10)"/>
  <rect width="600" height="400" fill="url(#dots10)"/>
  <rect width="600" height="400" fill="url(#glow10)"/>
  <!-- Badge episodio -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="76" height="24" rx="2" fill="#DC2626" opacity="0.15"/>
    <text x="38" y="16" text-anchor="middle" fill="#DC2626" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2">EP 10</text>
  </g>
  <!-- Decoration bottom -->
  <g transform="translate(28, 360)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#DC2626" stroke-width="2" opacity="0.6"/>
  </g>
  
  <g transform="translate(300, 200)">
    <text x="0" y="-140" text-anchor="middle" fill="white" font-family="Playfair Display, serif" font-size="28" font-weight="800">Los Animales</text>

    <!-- Huella estilizada -->
    <g transform="translate(0, 0)">
      <ellipse cx="0" cy="20" rx="50" ry="36" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="2.5"/>
      <ellipse cx="-40" cy="-20" rx="14" ry="18" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="2"/>
      <ellipse cx="-15" cy="-40" rx="14" ry="18" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="2"/>
      <ellipse cx="15" cy="-40" rx="14" ry="18" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="2"/>
      <ellipse cx="40" cy="-20" rx="14" ry="18" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="2"/>
    </g>
    <text x="0" y="100" text-anchor="middle" fill="#A8B5AD" font-family="Inter, sans-serif" font-size="9" letter-spacing="2">VERTEBRADOS · INVERTEBRADOS</text>
  </g>
</svg>