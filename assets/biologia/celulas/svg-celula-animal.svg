      <path d="M-7 -16 q7 8 0 16 q-7 8 0 16"/>
      <path d="M7 -16 q7 8 0 16 q-7 8 0 16"/>
      <path d="M21 -16 q7 8 0 16 q-7 8 0 16"/>
    </g>
    <ellipse cx="-9" cy="-6" rx="12" ry="4.5" fill="#ffe6c9" opacity=".55" transform="rotate(-14)"/>
  </g>
  <g id="lysoA">
    <circle r="10" fill="url(#lysoG)" stroke="#a03d7c" stroke-width="1.6"/>
    <circle cx="-3" cy="-3.5" r="2.4" fill="#fff" opacity=".75"/>
  </g>
</defs>

<rect width="700" height="560" rx="28" fill="url(#bgA)"/>
<rect width="700" height="560" rx="28" fill="url(#vigA)"/>
<g transform="translate(350 280) scale(1.18) translate(-350 -280)">
<ellipse cx="185" cy="70" rx="190" ry="95" fill="#ffffff" opacity=".5" filter="url(#soft12)"/>
<ellipse cx="350" cy="482" rx="240" ry="26" fill="#3f2a3a" opacity=".16" filter="url(#soft6)"/>
<ellipse cx="350" cy="478" rx="165" ry="15" fill="#3f2a3a" opacity=".18" filter="url(#soft2)"/>

<g>
