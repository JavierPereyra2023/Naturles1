    <use href="#mitoA" transform="translate(520 352) rotate(18) scale(1.05)"/>
    <use href="#mitoA" transform="translate(430 398) rotate(-8) scale(.9)"/>
    <use href="#mitoA" transform="translate(300 412) rotate(30) scale(.8)"/>

    <!-- lisosomas, peroxisoma, vesículas -->
