  <path d="M76 94 L88 108" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="252" y="172">Núcleo</text>
  <path d="M254 178 L208 246" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="44" y="452">Soma (cuerpo celular)</text>
  <path d="M96 446 L128 372" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="470" y="172">Vaina de mielina</text>
  <path d="M500 178 L522 254" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="340" y="452">Axón</text>
  <path d="M352 444 L390 300" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="508" y="452">Nódulo de Ranvier</text>
