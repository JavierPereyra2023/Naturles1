  </g>
</g>

<!-- axón (bajo la mielina) -->
<path d="M270 280 H700" fill="none" stroke="#7b8fc4" stroke-width="24" stroke-linecap="round"/>
<path d="M270 280 H700" fill="none" stroke="#a9bcdf" stroke-width="17" stroke-linecap="round"/>

<!-- cono de emergencia + soma -->
<path d="M246 258 C262 266 278 270 298 272 L298 288 C278 290 262 294 248 302 Z" fill="#9db3e0" stroke="#7b8fc4" stroke-width="2"/>
<g filter="url(#dsN)">
  <path d="M118 262 C112 232 128 205 160 197 C190 190 225 196 245 218 C262 237 266 268 258 296 C250 326 228 348 196 354 C164 360 134 348 120 322 C110 302 112 282 118 262 Z" fill="url(#somaN)" stroke="#6f86bc" stroke-width="3"/>
</g>
<g clip-path="url(#somaClipN)">
  <path d="M118 262 C112 232 128 205 160 197 C190 190 225 196 245 218 C262 237 266 268 258 296 C250 326 228 348 196 354 C164 360 134 348 120 322 C110 302 112 282 118 262 Z" fill="#2a3a5c" filter="url(#grainN)" opacity=".07"/>
  <!-- cuerpos de Nissl (RER) -->
  <g fill="#5b8fc9" opacity=".85">
    <rect x="208" y="296" width="16" height="5" rx="2.5" transform="rotate(18 216 298)"/>
    <rect x="146" y="316" width="16" height="5" rx="2.5" transform="rotate(-14 154 318)"/>
    <rect x="130" y="238" width="16" height="5" rx="2.5" transform="rotate(24 138 240)"/>
    <rect x="212" y="230" width="16" height="5" rx="2.5" transform="rotate(-20 220 232)"/>
    <rect x="152" y="222" width="14" height="5" rx="2.5" transform="rotate(8 159 224)"/>
    <rect x="222" y="318" width="14" height="5" rx="2.5" transform="rotate(-30 229 320)"/>
  </g>
  <use href="#mitoN" transform="translate(228 330) rotate(-20) scale(.55)"/>
  <use href="#mitoN" transform="translate(136 296) rotate(35) scale(.5)"/>
</g>

<!-- núcleo -->
<circle cx="180" cy="268" r="32" fill="url(#nucN)" stroke="#5e2a8c" stroke-width="2"/>
<circle cx="180" cy="268" r="31" fill="none" stroke="#f6e6ff" stroke-width="2.2" opacity=".9"/>
<g fill="#53227e">
  <circle cx="207" cy="268" r="1.6"/><circle cx="199.1" cy="287.1" r="1.6"/><circle cx="180" cy="295" r="1.6"/>
  <circle cx="160.9" cy="287.1" r="1.6"/><circle cx="153" cy="268" r="1.6"/><circle cx="160.9" cy="248.9" r="1.6"/>
