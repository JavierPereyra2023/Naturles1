    <path d="M690 280 C726 282 752 283 778 283"/>
    <path d="M690 280 C718 292 738 314 756 336"/>
    <path d="M748 326 C760 336 766 344 772 352" stroke-width="4.5"/>
  </g>
</g>
<use href="#boutN" transform="translate(764 230)"/>
<use href="#boutN" transform="translate(782 283)"/>
<use href="#boutN" transform="translate(758 338)"/>
<use href="#boutN" transform="translate(774 354) scale(.7)"/>
<g fill="#7a58b4" opacity=".7">
  <circle cx="800" cy="292" r="2.5"/><circle cx="808" cy="300" r="2"/><circle cx="804" cy="284" r="2"/>
</g>

<!-- etiquetas -->
<g font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569">
