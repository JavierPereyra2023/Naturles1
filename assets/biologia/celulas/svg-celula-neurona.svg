</g>

<!-- terminales sinápticas -->
<g fill="none" stroke-linecap="round">
  <g stroke="#7b8fc4" stroke-width="13">
    <path d="M690 280 C722 272 744 252 762 232"/>
    <path d="M690 280 C726 282 752 283 778 283"/>
    <path d="M690 280 C718 292 738 314 756 336"/>
    <path d="M748 326 C760 336 766 344 772 352" stroke-width="8"/>
