<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Modelo de la membrana plasmática: mosaico fluido</title>
<desc id="d">Bicapa de fosfolípidos con colesterol, proteína de canal, bomba de transporte activo, glucoproteína con glucocálix y proteína periférica. Se muestran difusión simple, difusión facilitada y transporte activo.</desc>
<defs>
  <radialGradient id="bgM" cx=".42" cy=".28" r="1.05">
    <stop offset="0" stop-color="#fbfaf4"/><stop offset=".55" stop-color="#f0eee2"/><stop offset="1" stop-color="#dcdcca"/>
  </radialGradient>
  <radialGradient id="vigM" cx=".5" cy=".46" r=".78">
    <stop offset=".62" stop-color="#4a5c52" stop-opacity="0"/><stop offset="1" stop-color="#4a5c52" stop-opacity=".14"/>
  </radialGradient>
  <radialGradient id="headM" fx=".35" fy=".3">
    <stop offset="0" stop-color="#dcf8f4"/><stop offset=".6" stop-color="#6fd0c6"/><stop offset="1" stop-color="#3ba79c"/>
  </radialGradient>
  <linearGradient id="protM" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7cf7e"/><stop offset=".55" stop-color="#e8a34e"/><stop offset="1" stop-color="#c97a24"/>
  </linearGradient>
  <linearGradient id="pumpM" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0a7c0"/><stop offset=".55" stop-color="#d66795"/><stop offset="1" stop-color="#b84577"/>
  </linearGradient>
  <linearGradient id="glyM" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9b3ec"/><stop offset=".55" stop-color="#9a7bd0"/><stop offset="1" stop-color="#7a58b4"/>
  </linearGradient>
  <filter id="soft2M"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="soft8M"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="dsM" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="1.5" dy="4" stdDeviation="3.5" flood-color="#4a3b2a" flood-opacity=".3"/>
  </filter>
  <marker id="arrAm" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
    <path d="M0 0l9 4-9 4z" fill="#d18a2e"/>
  </marker>
  <marker id="arrTe" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
    <path d="M0 0l9 4-9 4z" fill="#2e8f88"/>
  </marker>
  <marker id="arrPk" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
    <path d="M0 0l9 4-9 4z" fill="#b84577"/>
  </marker>
  <g id="plM">
    <path d="M-4.5 9 C-8 28 -2 44 -6 62 C-8 74 -4 82 -6 90" fill="none" stroke="#39a99e" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M4.5 9 C8 26 2 46 6 62 C9 76 3 84 5 92" fill="none" stroke="#2e9388" stroke-width="3.6" stroke-linecap="round"/>
    <circle r="11" fill="url(#headM)" stroke="#2e8f88" stroke-width="1.6"/>
    <circle cx="-3.5" cy="-4" r="2.6" fill="#eafffc" opacity=".8"/>
  </g>
  <g id="cholM">
    <rect x="-4" y="-7.5" width="8" height="15" rx="3.5" fill="#f2b04e" stroke="#cf8322" stroke-width="1.6"/>
    <path d="M0 7.5 L0 13" stroke="#cf8322" stroke-width="2" stroke-linecap="round"/>
  </g>
</defs>

<rect width="900" height="560" rx="28" fill="url(#bgM)"/>
<rect width="900" height="560" rx="28" fill="url(#vigM)"/>
<ellipse cx="220" cy="60" rx="230" ry="90" fill="#ffffff" opacity=".45" filter="url(#soft8M)"/>

<!-- zonas -->
<rect x="28" y="72" width="844" height="118" rx="20" fill="#bfe3dc" opacity=".22"/>
<rect x="28" y="372" width="844" height="118" rx="20" fill="#e8dcc2" opacity=".25"/>

<!-- flechas de transporte (detrás de la bicapa) -->
<g fill="none" stroke-width="4" stroke-linecap="round">
