<!-- glucoproteína con glucocálix -->
<g filter="url(#dsM)">
  <rect x="112" y="196" width="36" height="170" rx="16" fill="url(#glyM)" stroke="#644399" stroke-width="3"/>
</g>
<g stroke="#5f9c44" stroke-width="2" fill="#8fce6e">
