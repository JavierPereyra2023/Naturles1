  <path d="M300 112 V428" stroke="#2e8f88" marker-end="url(#arrTe)"/>
  <path d="M640 425 V148" stroke="#b84577" marker-end="url(#arrPk)"/>
</g>

<!-- núcleo hidrofóbico -->
<path d="M60 262 Q450 222 840 262 L840 298 Q450 338 60 298 Z" fill="#ddefea" opacity=".85"/>

