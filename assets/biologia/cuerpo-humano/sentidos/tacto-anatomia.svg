<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="tactoT tactoD">
  <title id="tactoT">Receptores de la piel</title>
  <desc id="tactoD">Corte de la piel con sus tres capas —epidermis, dermis e hipodermis— y los cinco receptores del tacto: terminaciones nerviosas libres para dolor y temperatura, discos de Merkel para presión suave y textura, corpúsculo de Meissner para el tacto ligero, corpúsculo de Ruffini para el estiramiento y corpúsculo de Pacini para la presión profunda y la vibración. Todas las fibras se reúnen en un nervio que lleva la información al sistema nervioso central.</desc>
  <style>
    .lbl{font:600 15px Inter,"Helvetica Neue",Arial,sans-serif;fill:#C8D4CC;letter-spacing:.05em}
    .sub{font:400 12px Inter,Arial,sans-serif;fill:#7E9188;letter-spacing:.02em}
    .cap{font:700 11px Inter,Arial,sans-serif;fill:#55675C;letter-spacing:.2em}
    .ldr{stroke:#4E6058;stroke-width:1.3;fill:none}
    .dot{fill:#93A99D}
  </style>

  <text x="28" y="34" class="cap">PIEL · CORTE TRANSVERSAL</text>

  <!-- HIPODERMIS -->
  <rect x="60" y="372" width="600" height="98" fill="#3F3324"/>
  <g fill="none" stroke="#7C6B49" stroke-width="1.6" opacity=".65">
    <circle cx="108" cy="404" r="20"/><circle cx="156" cy="432" r="18"/><circle cx="204" cy="400" r="21"/>
    <circle cx="256" cy="432" r="17"/><circle cx="308" cy="402" r="19"/><circle cx="360" cy="434" r="18"/>
    <circle cx="410" cy="400" r="20"/><circle cx="462" cy="432" r="17"/><circle cx="512" cy="402" r="19"/>
    <circle cx="638" cy="432" r="18"/>
  </g>

  <!-- DERMIS -->
  <path d="M60 196 Q90 176 120 196 Q150 176 180 196 Q210 176 240 196 Q270 176 300 196 Q330 176 360 196 Q390 176 420 196 Q450 176 480 196 Q510 176 540 196 Q570 176 600 196 Q630 176 660 196 L660 372 L60 372 Z" fill="#5C3238"/>

  <!-- EPIDERMIS -->
  <path d="M60 130 H660 L660 196 Q630 176 600 196 Q570 176 540 196 Q510 176 480 196 Q450 176 420 196 Q390 176 360 196 Q330 176 300 196 Q270 176 240 196 Q210 176 180 196 Q150 176 120 196 Q90 176 60 196 Z" fill="#8A5A52"/>
  <path d="M60 130 H660" fill="none" stroke="#E7BDB2" stroke-width="3"/>
  <path d="M60 145 H660" fill="none" stroke="#B98276" stroke-width="1.2" opacity=".7"/>

  <!-- Contorno general -->
  <rect x="60" y="130" width="600" height="340" fill="none" stroke="#8E9C93" stroke-width="1.6" opacity=".45"/>
  <g stroke="#8E9C93" stroke-width="1" stroke-dasharray="5 6" opacity=".35">
    <path d="M60 372 H660"/>
  </g>

  <!-- ===== RECEPTORES ===== -->
  <!-- 1. Terminaciones nerviosas libres -->
  <g stroke="#FBBF24" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M130 200 V172"/>
    <path d="M130 176 C118 166 112 158 110 148"/>
    <path d="M130 176 C142 166 148 158 150 148"/>
    <path d="M130 186 C120 180 114 172 112 164"/>
    <path d="M130 186 C140 180 146 172 148 164"/>
  </g>

  <!-- 2. Discos de Merkel -->
  <g fill="#FBBF24">
    <ellipse cx="232" cy="190" rx="10" ry="5"/>
    <ellipse cx="252" cy="184" rx="10" ry="5"/>
    <ellipse cx="272" cy="190" rx="10" ry="5"/>
  </g>
  <g stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M232 195 L250 210"/><path d="M252 189 L250 210"/><path d="M272 195 L250 210"/>
  </g>

  <!-- 3. Corpúsculo de Meissner -->
  <ellipse cx="390" cy="198" rx="14" ry="22" fill="rgba(251,191,36,.18)" stroke="#FBBF24" stroke-width="2.4"/>
  <g stroke="#FDE08A" stroke-width="1.6" fill="none">
    <path d="M378 190 Q390 184 402 190"/><path d="M378 198 Q390 192 402 198"/>
    <path d="M378 206 Q390 200 402 206"/><path d="M378 212 Q390 206 402 212"/>
  </g>

  <!-- 4. Corpúsculo de Ruffini -->
  <path d="M446 296 C454 280 512 280 520 296 C512 312 454 312 446 296 Z" fill="rgba(251,191,36,.14)" stroke="#FBBF24" stroke-width="2.4"/>
  <g stroke="#FDE08A" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M462 296 L480 288 M462 296 L480 296 M462 296 L480 304 M480 288 L502 292 M480 304 L502 300"/>
  </g>

  <!-- 5. Corpúsculo de Pacini -->
  <g fill="none" stroke="#FBBF24" stroke-width="2">
    <ellipse cx="586" cy="410" rx="36" ry="28"/>
    <ellipse cx="586" cy="410" rx="28" ry="21" opacity=".8"/>
    <ellipse cx="586" cy="410" rx="20" ry="14" opacity=".65"/>
    <ellipse cx="586" cy="410" rx="12" ry="8" opacity=".5"/>
  </g>
  <path d="M550 410 H580" fill="none" stroke="#FDE08A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ===== FIBRAS NERVIOSAS ===== -->
  <g stroke="#C8B77E" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M130 200 V448"/>
    <path d="M250 210 V448"/>
    <path d="M390 220 V448"/>
    <path d="M483 310 V448"/>
    <path d="M586 438 V448"/>
  </g>
  <path d="M110 448 H692" fill="none" stroke="#C8B77E" stroke-width="12" stroke-linecap="round" opacity=".38"/>
  <path d="M110 448 H692" fill="none" stroke="#E8DCAC" stroke-width="2" stroke-dasharray="7 7"/>
  <polygon points="708,448 690,439 690,457" fill="#E8DCAC"/>

  <!-- ===== CAPAS ===== -->
  <g stroke="#5E6F66" stroke-width="1.4" fill="none">
    <path d="M666 134 H676 V192 H666"/>
    <path d="M666 200 H676 V368 H666"/>
    <path d="M666 376 H676 V466 H666"/>
  </g>
  <text x="684" y="158" class="lbl">EPIDERMIS</text>
  <text x="684" y="175" class="sub">capa más externa</text>
  <text x="684" y="278" class="lbl">DERMIS</text>
  <text x="684" y="295" class="sub">vasos y nervios</text>
  <text x="684" y="418" class="lbl">HIPODERMIS</text>
  <text x="684" y="435" class="sub">tejido graso</text>

  <!-- LÍNEAS GUÍA -->
  <g class="ldr">
    <path d="M130 158 L118 90"/>
    <path d="M252 184 L292 122"/>
    <path d="M390 178 L452 92"/>
    <path d="M470 306 L358 494"/>
    <path d="M580 438 L600 494"/>
  </g>
  <g class="dot">
    <circle cx="130" cy="158" r="3"/><circle cx="252" cy="184" r="3"/><circle cx="390" cy="178" r="3"/>
    <circle cx="470" cy="306" r="3"/><circle cx="580" cy="438" r="3"/>
  </g>

  <!-- ETIQUETAS -->
  <text x="110" y="66" class="lbl" text-anchor="middle">TERMINACIONES LIBRES</text>
  <text x="110" y="83" class="sub" text-anchor="middle">dolor y temperatura</text>

  <text x="300" y="98" class="lbl" text-anchor="middle">DISCOS DE MERKEL</text>
  <text x="300" y="115" class="sub" text-anchor="middle">presión suave y textura</text>

  <text x="474" y="66" class="lbl" text-anchor="middle">CORPÚSCULO DE MEISSNER</text>
  <text x="474" y="83" class="sub" text-anchor="middle">tacto ligero y roce</text>

  <text x="330" y="512" class="lbl" text-anchor="middle">CORPÚSCULO DE RUFFINI</text>
  <text x="330" y="529" class="sub" text-anchor="middle">estiramiento de la piel</text>

  <text x="600" y="512" class="lbl" text-anchor="middle">CORPÚSCULO DE PACINI</text>
  <text x="600" y="529" class="sub" text-anchor="middle">presión profunda y vibración</text>

  <text x="716" y="466" class="lbl">NERVIO</text>
  <text x="716" y="483" class="sub">al sistema</text>
  <text x="716" y="498" class="sub">nervioso central</text>
</svg>
