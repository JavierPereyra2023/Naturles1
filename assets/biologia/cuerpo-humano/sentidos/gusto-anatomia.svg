<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="gustoT gustoD">
  <title id="gustoT">Lengua y botón gustativo</title>
  <desc id="gustoD">Vista superior de la lengua con papilas caliciformes en V, fungiformes repartidas por toda la superficie y foliadas en los bordes. Una ampliación muestra un botón gustativo dentro de una papila: el poro gustativo por donde entran las moléculas disueltas en saliva, las células gustativas y la fibra nerviosa que sale hacia el cerebro. Toda la lengua detecta las cinco cualidades: dulce, salado, ácido, amargo y umami.</desc>
  <style>
    .lbl{font:600 15px Inter,"Helvetica Neue",Arial,sans-serif;fill:#C8D4CC;letter-spacing:.05em}
    .sub{font:400 12px Inter,Arial,sans-serif;fill:#7E9188;letter-spacing:.02em}
    .cap{font:700 11px Inter,Arial,sans-serif;fill:#55675C;letter-spacing:.2em}
    .chip{font:700 11px Inter,Arial,sans-serif;fill:#FDA4AF;letter-spacing:.1em}
    .ldr{stroke:#4E6058;stroke-width:1.3;fill:none}
    .dot{fill:#93A99D}
  </style>

  <text x="28" y="34" class="cap">LENGUA · VISTA SUPERIOR</text>
  <text x="560" y="34" class="cap">BOTÓN GUSTATIVO · AMPLIACIÓN</text>

  <!-- Cono de ampliación -->
  <path d="M352 278 L520 258 L520 470 L352 322 Z" fill="rgba(251,113,133,.045)" stroke="#5C3742" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- LENGUA -->
  <path d="M228 128 C300 130 356 168 366 236 C376 306 350 384 300 428 C272 452 248 462 228 462 C208 462 184 452 156 428 C106 384 80 306 90 236 C100 168 156 130 228 128 Z"
        fill="#783644" stroke="#FDA4AF" stroke-width="3"/>
  <path d="M228 176 V440" fill="none" stroke="#A85566" stroke-width="2"/>

  <!-- Papilas foliadas (bordes) -->
  <g stroke="#F9A8B4" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M96 244 h20"/><path d="M94 262 h20"/><path d="M95 280 h20"/><path d="M99 298 h20"/>
    <path d="M340 244 h20"/><path d="M342 262 h20"/><path d="M341 280 h20"/><path d="M337 298 h20"/>
  </g>

  <!-- Papilas fungiformes -->
  <g fill="#FDA4AF" opacity=".92">
    <circle cx="160" cy="262" r="5"/><circle cx="196" cy="248" r="4.5"/><circle cx="262" cy="252" r="4.5"/>
    <circle cx="298" cy="266" r="5"/><circle cx="142" cy="308" r="5"/><circle cx="182" cy="300" r="4.5"/>
    <circle cx="228" cy="292" r="4.5"/><circle cx="276" cy="304" r="4.5"/><circle cx="316" cy="312" r="5"/>
    <circle cx="152" cy="352" r="4.5"/><circle cx="196" cy="346" r="4.5"/><circle cx="256" cy="348" r="4.5"/>
    <circle cx="300" cy="356" r="4.5"/><circle cx="178" cy="392" r="4.5"/><circle cx="228" cy="386" r="4.5"/>
    <circle cx="278" cy="394" r="4.5"/><circle cx="206" cy="428" r="4.5"/><circle cx="252" cy="428" r="4.5"/>
  </g>

  <!-- Papilas caliciformes en V -->
  <path d="M144 190 L228 224 L312 190" fill="none" stroke="#A85566" stroke-width="2"/>
  <g fill="#FBCFE8" stroke="#E879A0" stroke-width="2">
    <circle cx="148" cy="192" r="9"/><circle cx="176" cy="204" r="9"/><circle cx="204" cy="214" r="9"/>
    <circle cx="228" cy="222" r="9"/><circle cx="252" cy="214" r="9"/><circle cx="280" cy="204" r="9"/>
    <circle cx="308" cy="192" r="9"/>
  </g>

  <!-- Papila ampliada (origen del zoom) -->
  <circle cx="330" cy="300" r="26" fill="none" stroke="#FB7185" stroke-width="2"/>

  <!-- ===== AMPLIACIÓN ===== -->
  <!-- Epitelio de la papila -->
  <path d="M520 470 V266 C562 236 622 222 700 222 C778 222 838 236 880 266 V470 Z" fill="#4E2B34" stroke="#C87A88" stroke-width="2.5"/>
  <!-- Saliva con moléculas disueltas -->
  <path d="M520 266 C562 236 622 222 700 222 C778 222 838 236 880 266" fill="none" stroke="#FBBF24" stroke-width="2" opacity=".5"/>
  <g fill="#FBBF24">
    <circle cx="664" cy="176" r="5"/><circle cx="700" cy="158" r="6"/><circle cx="738" cy="180" r="5"/>
    <circle cx="700" cy="196" r="5"/><circle cx="608" cy="190" r="4"/><circle cx="792" cy="192" r="4"/>
  </g>
  <path d="M700 168 V206" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="700,216 693,203 707,203" fill="#FBBF24"/>

  <!-- Poro gustativo -->
  <path d="M684 224 L692 250 L708 250 L716 224" fill="#150C10" stroke="#FDA4AF" stroke-width="2"/>

  <!-- Botón gustativo -->
  <ellipse cx="700" cy="318" rx="54" ry="72" fill="#67323F" stroke="#FDA4AF" stroke-width="3"/>
  <g fill="#F7C3CB" opacity=".95">
    <ellipse cx="664" cy="322" rx="9" ry="54" transform="rotate(-13 664 322)"/>
    <ellipse cx="682" cy="318" rx="9" ry="58" transform="rotate(-6 682 318)"/>
    <ellipse cx="700" cy="316" rx="9" ry="60"/>
    <ellipse cx="718" cy="318" rx="9" ry="58" transform="rotate(6 718 318)"/>
    <ellipse cx="736" cy="322" rx="9" ry="54" transform="rotate(13 736 322)"/>
  </g>
  <!-- Microvellosidades hacia el poro -->
  <g stroke="#FFF1F2" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M690 258 V248"/><path d="M698 258 V246"/><path d="M706 258 V248"/>
  </g>

  <!-- Fibra nerviosa -->
  <path d="M700 390 V468" fill="none" stroke="#C8B77E" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <path d="M700 392 V466 M700 424 L664 460 M700 424 L736 460" fill="none" stroke="#E8DCAC" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="700,478 692,462 708,462" fill="#E8DCAC" opacity=".8"/>
  <text x="716" y="486" class="sub" fill="#B9A87C">al cerebro</text>

  <!-- ===== CINCO CUALIDADES ===== -->
  <text x="40" y="490" class="sub">LAS CINCO CUALIDADES · toda la lengua puede detectarlas</text>
  <g fill="none" stroke="rgba(251,113,133,.4)">
    <rect x="40" y="500" width="66" height="28" rx="4"/>
    <rect x="114" y="500" width="72" height="28" rx="4"/>
    <rect x="194" y="500" width="62" height="28" rx="4"/>
    <rect x="264" y="500" width="76" height="28" rx="4"/>
    <rect x="348" y="500" width="66" height="28" rx="4"/>
  </g>
  <g class="chip" text-anchor="middle">
    <text x="73" y="519">DULCE</text>
    <text x="150" y="519">SALADO</text>
    <text x="225" y="519">ÁCIDO</text>
    <text x="302" y="519">AMARGO</text>
    <text x="381" y="519">UMAMI</text>
  </g>

  <!-- LÍNEAS GUÍA -->
  <g class="ldr">
    <path d="M280 204 L216 118"/>
    <path d="M182 300 L60 366"/>
    <path d="M100 262 L44 214"/>
    <path d="M700 236 L586 158"/>
    <path d="M740 318 L830 262"/>
    <path d="M596 276 L520 216"/>
    <path d="M700 432 L748 444"/>
  </g>
  <g class="dot">
    <circle cx="280" cy="204" r="3"/><circle cx="182" cy="300" r="3"/><circle cx="100" cy="262" r="3"/>
    <circle cx="700" cy="236" r="3"/><circle cx="740" cy="318" r="3"/><circle cx="596" cy="276" r="3"/>
    <circle cx="700" cy="432" r="3"/>
  </g>

  <!-- ETIQUETAS -->
  <text x="24" y="112" class="lbl">PAPILAS CALICIFORMES</text>
  <text x="24" y="129" class="sub">las más grandes, en forma de V</text>
  <text x="54" y="382" class="lbl">PAPILAS FUNGIFORMES</text>
  <text x="38" y="206" class="lbl">PAPILAS FOLIADAS</text>
  <text x="580" y="150" class="lbl" text-anchor="end">PORO GUSTATIVO</text>
  <text x="580" y="167" class="sub" text-anchor="end">entran las moléculas disueltas</text>
  <text x="884" y="256" class="lbl" text-anchor="end">CÉLULAS</text>
  <text x="884" y="273" class="lbl" text-anchor="end">GUSTATIVAS</text>
  <text x="516" y="208" class="lbl" text-anchor="end">EPITELIO</text>
  <text x="884" y="448" class="lbl" text-anchor="end">FIBRA NERVIOSA</text>
</svg>
