<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="ojoT ojoD">
  <title id="ojoT">Anatomía del ojo humano — corte sagital</title>
  <desc id="ojoD">Corte del ojo con córnea, humor acuoso, iris, pupila, cristalino, músculo ciliar, humor vítreo, retina, coroides, esclerótica, fóvea, punto ciego y nervio óptico. Tres rayos de luz entran por la córnea, se refractan en el cristalino y convergen sobre la fóvea, en el fondo del ojo.</desc>
  <style>
    .lbl{font:600 15px Inter,"Helvetica Neue",Arial,sans-serif;fill:#C8D4CC;letter-spacing:.05em}
    .sub{font:400 12px Inter,Arial,sans-serif;fill:#7E9188;letter-spacing:.02em}
    .cap{font:700 11px Inter,Arial,sans-serif;fill:#55675C;letter-spacing:.2em}
    .ldr{stroke:#4E6058;stroke-width:1.3;fill:none}
    .dot{fill:#93A99D}
  </style>

  <text x="28" y="38" class="cap">OJO HUMANO · CORTE SAGITAL</text>

  <!-- NERVIO ÓPTICO (detrás del globo ocular) -->
  <path d="M540 306 C604 330 662 362 716 402" fill="none" stroke="#C8B77E" stroke-width="30" stroke-linecap="round" opacity=".32"/>
  <path d="M540 306 C604 330 662 362 716 402" fill="none" stroke="#E8DCAC" stroke-width="1.6" stroke-dasharray="7 8" opacity=".65"/>

  <!-- GLOBO OCULAR: esclerótica (cuerpo) -->
  <path d="M285.8 212.5 A155 155 0 1 1 285.8 367.5" fill="#18231F"/>
  <!-- coroides -->
  <path d="M292.7 216.5 A147 147 0 1 1 292.7 363.5" fill="none" stroke="#8E4048" stroke-width="7" opacity=".75"/>
  <!-- retina -->
  <path d="M298.8 220 A140 140 0 1 1 298.8 360" fill="none" stroke="#D9A44E" stroke-width="5"/>
  <!-- humor vítreo -->
  <path d="M298.8 220 A140 140 0 1 1 298.8 360 Z" fill="#10262C" opacity=".85"/>
  <!-- contorno de la esclerótica -->
  <path d="M285.8 212.5 A155 155 0 1 1 285.8 367.5" fill="none" stroke="#C6D2CA" stroke-width="4"/>

  <!-- CÁMARA ANTERIOR (humor acuoso) -->
  <path d="M285.8 212.5 A101 101 0 0 0 285.8 367.5 L291 362 L306 314 L330 290 L306 266 L291 218 Z" fill="#0D2A31" opacity=".9"/>
  <!-- CÓRNEA -->
  <path d="M285.8 212.5 A101 101 0 0 0 285.8 367.5" fill="rgba(165,243,252,.09)" stroke="#9BE7F2" stroke-width="4"/>

  <!-- MÚSCULO CILIAR + ZÓNULA -->
  <path d="M290 215 L307 231 L294 236 Z" fill="#A6555C"/>
  <path d="M290 365 L307 349 L294 344 Z" fill="#A6555C"/>
  <g stroke="#8FA69A" stroke-width="1.2" opacity=".7">
    <path d="M305 232 L330 240"/><path d="M305 238 L330 250"/>
    <path d="M305 348 L330 340"/><path d="M305 342 L330 330"/>
  </g>

  <!-- IRIS (dos cuñas; entre ellas queda la pupila) -->
  <path d="M288 214 C299 231 307 249 310 264 L296 270 C293 251 286 233 280 222 Z" fill="#3A93A8" stroke="#7DD3FC" stroke-width="1.8"/>
  <path d="M288 366 C299 349 307 331 310 316 L296 310 C293 329 286 347 280 358 Z" fill="#3A93A8" stroke="#7DD3FC" stroke-width="1.8"/>

  <!-- CRISTALINO -->
  <path d="M330 235 C352 252 352 328 330 345 C308 328 308 252 330 235 Z" fill="rgba(191,219,254,.16)" stroke="#BFD9FE" stroke-width="2.6"/>

  <!-- FÓVEA (depresión en el fondo) y DISCO ÓPTICO -->
  <path d="M552 264 Q560 274 552 284" fill="none" stroke="#F0BE63" stroke-width="5"/>
  <circle cx="556" cy="311" r="7" fill="#C8B77E" opacity=".85"/>

  <!-- LUZ: tres rayos que se refractan y convergen en la fóvea -->
  <g stroke="#FBE08A" stroke-width="2.1" fill="none" stroke-linejoin="round">
    <path d="M36 246 L259.5 246 L312 272 L348 278 L554 275"/>
    <path d="M36 290 L330 290 L554 275"/>
    <path d="M36 334 L259.5 334 L312 308 L348 302 L554 275"/>
  </g>
  <g fill="#FBE08A">
    <polygon points="120,246 108,241 108,251"/>
    <polygon points="120,290 108,285 108,295"/>
    <polygon points="120,334 108,329 108,339"/>
  </g>
  <text x="36" y="232" class="sub" fill="#FBE08A">LUZ</text>

  <!-- ETIQUETA INTERIOR -->
  <text x="452" y="392" class="sub" text-anchor="middle" fill="#6E8078">HUMOR VÍTREO</text>

  <!-- LÍNEAS GUÍA -->
  <g class="ldr">
    <path d="M254 254 L140 158"/>
    <path d="M293 232 L300 120"/>
    <path d="M306 268 L378 134"/>
    <path d="M334 246 L470 122"/>
    <path d="M297 356 L232 468"/>
    <path d="M280 338 L152 402"/>
    <path d="M527 200 L652 130"/>
    <path d="M560 224 L700 188"/>
    <path d="M556 274 L690 264"/>
    <path d="M558 314 L690 320"/>
    <path d="M660 374 L696 414"/>
  </g>
  <g class="dot">
    <circle cx="254" cy="254" r="3"/><circle cx="293" cy="232" r="3"/>
    <circle cx="306" cy="268" r="3"/><circle cx="334" cy="246" r="3"/>
    <circle cx="297" cy="356" r="3"/><circle cx="280" cy="338" r="3"/>
    <circle cx="527" cy="200" r="3"/><circle cx="560" cy="224" r="3"/>
    <circle cx="556" cy="274" r="3"/><circle cx="558" cy="314" r="3"/>
    <circle cx="660" cy="374" r="3"/>
  </g>

  <!-- ETIQUETAS -->
  <text x="136" y="152" class="lbl" text-anchor="end">CÓRNEA</text>
  <text x="300" y="112" class="lbl" text-anchor="middle">IRIS</text>
  <text x="378" y="126" class="lbl" text-anchor="middle">PUPILA</text>
  <text x="470" y="114" class="lbl" text-anchor="middle">CRISTALINO</text>
  <text x="232" y="488" class="lbl" text-anchor="middle">MÚSCULO CILIAR</text>
  <text x="148" y="414" class="lbl" text-anchor="end">HUMOR ACUOSO</text>
  <text x="658" y="126" class="lbl">RETINA</text>
  <text x="706" y="184" class="lbl">ESCLERÓTICA</text>
  <text x="696" y="260" class="lbl">FÓVEA</text>
  <text x="696" y="326" class="lbl">PUNTO CIEGO</text>
  <text x="702" y="424" class="lbl">NERVIO ÓPTICO</text>
  <text x="702" y="442" class="sub">lleva la señal al cerebro</text>
</svg>
