<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">Estructura básica de un virus</title>
  <desc id="d">Diagrama de un virus con cápside proteica, material genético y envoltura opcional.</desc>
  <defs>
    <style>
      .bg{fill:#0E1410}
      .label{font-family:Inter,system-ui,sans-serif;font-size:13px;fill:#C8D4CC}
      .title{font-family:Georgia,serif;font-size:20px;font-weight:700;fill:#fff}
      .sub{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:#5A6B60}
      .note{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:#A8B5AD}
    </style>
    <radialGradient id="g" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#0E1410"/>
    </radialGradient>
  </defs>
  <rect width="720" height="420" class="bg" rx="12"/>
  <rect x="0" y="0" width="720" height="420" fill="url(#g)" opacity="0.55" rx="12"/>
  <text x="36" y="40" class="title">Estructura de un virus</text>
  <text x="36" y="62" class="sub">Partícula acelular · no es una célula</text>

  <!-- envelope -->
  <ellipse cx="360" cy="230" rx="150" ry="120" fill="none" stroke="#F87171" stroke-width="10" stroke-dasharray="18 10" opacity="0.85"/>
  <!-- capsid hex -->
  <polygon points="360,130 430,165 430,235 360,270 290,235 290,165" fill="#1F2937" stroke="#FCA5A5" stroke-width="3"/>
  <!-- genome -->
  <path d="M320 185 C340 160,380 160,400 185 C380 210,340 210,320 185 Z" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <path d="M330 200 C350 180,370 220,390 200" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <!-- spikes -->
  <g stroke="#FBBF24" stroke-width="4" stroke-linecap="round">
    <line x1="360" y1="110" x2="360" y2="88"/>
    <line x1="455" y1="150" x2="478" y2="132"/>
    <line x1="455" y1="250" x2="478" y2="268"/>
    <line x1="360" y1="290" x2="360" y2="312"/>
    <line x1="265" y1="250" x2="242" y2="268"/>
    <line x1="265" y1="150" x2="242" y2="132"/>
  </g>
  <g fill="#FBBF24">
    <circle cx="360" cy="82" r="7"/>
    <circle cx="482" cy="128" r="7"/>
    <circle cx="482" cy="272" r="7"/>
    <circle cx="360" cy="318" r="7"/>
    <circle cx="238" cy="272" r="7"/>
    <circle cx="238" cy="128" r="7"/>
  </g>

  <!-- labels -->
  <g>
    <line x1="480" y1="200" x2="560" y2="170" stroke="#5A6B60" stroke-width="1.5"/>
    <text x="568" y="166" class="label">Cápside</text>
    <text x="568" y="184" class="note">(proteínas)</text>

    <line x1="360" y1="200" x2="200" y2="120" stroke="#5A6B60" stroke-width="1.5"/>
    <text x="90" y="112" class="label">Material genético</text>
    <text x="90" y="130" class="note">ADN o ARN</text>

    <line x1="430" y1="100" x2="520" y2="70" stroke="#5A6B60" stroke-width="1.5"/>
    <text x="528" y="66" class="label">Espículas</text>
    <text x="528" y="84" class="note">(reconocen al huésped)</text>

    <line x1="500" y1="280" x2="560" y2="320" stroke="#5A6B60" stroke-width="1.5"/>
    <text x="480" y="340" class="label">Envoltura (a veces)</text>
    <text x="480" y="358" class="note">membrana del huésped</text>
  </g>
</svg>
