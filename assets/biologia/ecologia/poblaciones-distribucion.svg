<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tres patrones de distribución de una población</title>
  <desc id="desc">Ilustración con distribución agrupada, uniforme y aleatoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#102d27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f3f7f4" font-family="Arial, sans-serif" font-size="29" font-weight="700">¿Cómo se distribuyen los individuos?</text>
  <text x="60" y="98" fill="#a9c4b8" font-family="Arial, sans-serif" font-size="17">El patrón espacial brinda pistas sobre los recursos y las relaciones dentro de una población.</text>
  <g filter="url(#shadow)">
    <rect x="48" y="140" width="344" height="340" rx="18" fill="#102a23" stroke="#3dd6a3" stroke-opacity=".45"/>
    <rect x="428" y="140" width="344" height="340" rx="18" fill="#102a23" stroke="#60a5fa" stroke-opacity=".45"/>
    <rect x="808" y="140" width="344" height="340" rx="18" fill="#102a23" stroke="#f59e0b" stroke-opacity=".45"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="185" fill="#6ee7b7" font-size="23" font-weight="700">Agrupada</text>
    <text x="600" y="185" fill="#93c5fd" font-size="23" font-weight="700">Uniforme</text>
    <text x="980" y="185" fill="#fcd34d" font-size="23" font-weight="700">Aleatoria</text>
    <text x="220" y="216" fill="#c7ddd3" font-size="15">La más frecuente en la naturaleza</text>
    <text x="600" y="216" fill="#c7ddd3" font-size="15">Distancias parecidas entre individuos</text>
    <text x="980" y="216" fill="#c7ddd3" font-size="15">Sin un patrón visible</text>
  </g>
  <g fill="#5eead4">
    <circle cx="145" cy="292" r="10"/><circle cx="175" cy="276" r="10"/><circle cx="206" cy="304" r="10"/><circle cx="236" cy="284" r="10"/><circle cx="267" cy="313" r="10"/><circle cx="180" cy="335" r="10"/><circle cx="218" cy="346" r="10"/><circle cx="251" cy="337" r="10"/>
    <circle cx="300" cy="408" r="10"/><circle cx="330" cy="394" r="10"/><circle cx="357" cy="424" r="10"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="490" cy="278" r="9"/><circle cx="570" cy="278" r="9"/><circle cx="650" cy="278" r="9"/><circle cx="730" cy="278" r="9"/>
    <circle cx="490" cy="348" r="9"/><circle cx="570" cy="348" r="9"/><circle cx="650" cy="348" r="9"/><circle cx="730" cy="348" r="9"/>
    <circle cx="490" cy="418" r="9"/><circle cx="570" cy="418" r="9"/><circle cx="650" cy="418" r="9"/><circle cx="730" cy="418" r="9"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="862" cy="265" r="9"/><circle cx="924" cy="302" r="9"/><circle cx="1010" cy="270" r="9"/><circle cx="1094" cy="330" r="9"/><circle cx="868" cy="395" r="9"/><circle cx="956" cy="365" r="9"/><circle cx="1045" cy="430" r="9"/><circle cx="1110" cy="395" r="9"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#d6e5de">
    <text x="220" y="452" text-anchor="middle">Ej.: carpinchos cerca del agua</text>
    <text x="600" y="452" text-anchor="middle">Ej.: plantas separadas por competencia</text>
    <text x="980" y="452" text-anchor="middle">Ej.: semillas dispersadas por el viento</text>
  </g>
</svg>
