<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Efecto Tyndall</title><desc id="desc">Comparación entre una solución, donde el haz no se observa, y un coloide, donde las partículas dispersan la luz y vuelven visible el haz.</desc><defs><linearGradient id="beam" x2="1"><stop stop-color="#fde047" stop-opacity=".95"/><stop offset="1" stop-color="#fde047" stop-opacity=".08"/></linearGradient></defs><rect width="1200" height="675" fill="#07151b"/><text x="55" y="65" fill="#86efac" font-family="Arial,sans-serif" font-size="29" font-weight="700">EFECTO TYNDALL</text><text x="55" y="102" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="19">Las partículas de un coloide dispersan la luz y hacen visible su recorrido.</text>
  <g transform="translate(70 160)" font-family="Arial,sans-serif"><rect width="500" height="390" rx="24" fill="#10242a" stroke="#38bdf8"/><text x="250" y="44" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">SOLUCIÓN</text><path d="M175 95h150l-18 240H193z" fill="#0c4a6e" stroke="#bae6fd" stroke-width="4"/><path d="M30 205h145" stroke="#fde047" stroke-width="18" opacity=".28"/><circle cx="25" cy="205" r="25" fill="#facc15"/><g fill="#93c5fd" opacity=".7"><circle cx="220" cy="180" r="4"/><circle cx="270" cy="240" r="4"/><circle cx="245" cy="295" r="4"/></g><text x="250" y="372" fill="#c8d4cc" font-size="18" text-anchor="middle">partículas demasiado pequeñas</text></g>
  <g transform="translate(630 160)" font-family="Arial,sans-serif"><rect width="500" height="390" rx="24" fill="#10242a" stroke="#facc15"/><text x="250" y="44" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">COLOIDE</text><path d="M175 95h150l-18 240H193z" fill="#374151" stroke="#e5e7eb" stroke-width="4"/><path d="M30 205h300" stroke="url(#beam)" stroke-width="32"/><circle cx="25" cy="205" r="25" fill="#facc15"/><g fill="#f3f4f6"><circle cx="210" cy="145" r="8"/><circle cx="260" cy="180" r="10"/><circle cx="230" cy="235" r="7"/><circle cx="285" cy="265" r="9"/><circle cx="245" cy="305" r="8"/></g><g stroke="#fde68a" stroke-width="3"><path d="M210 205l-35-35M235 205l30-45M270 205l40-28M250 205l25 40"/></g><text x="250" y="372" fill="#fef3c7" font-size="18" text-anchor="middle">el haz se vuelve visible</text></g>
  <text x="600" y="620" fill="#dcfce7" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">Ejemplos: leche, niebla y humo. La dispersión permite distinguirlos de una solución.</text></svg>
