<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Mezcla de partículas</title><desc id="desc">Dos sustancias se combinan físicamente y sus partículas conservan su identidad.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#86efac"/></marker></defs><rect width="1200" height="675" fill="#07151b"/><text x="55" y="65" fill="#86efac" font-family="Arial,sans-serif" font-size="29" font-weight="700">UNA MEZCLA COMBINA SUSTANCIAS</text><text x="55" y="102" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="19">Las partículas se intercalan, pero cada sustancia conserva sus propiedades.</text>
  <g stroke="#64748b" stroke-width="4" fill="#10242a"><rect x="70" y="165" width="285" height="330" rx="30"/><rect x="458" y="165" width="285" height="330" rx="30"/><rect x="845" y="165" width="285" height="330" rx="30"/></g>
  <g fill="#38bdf8"><circle cx="135" cy="235" r="23"/><circle cx="220" cy="290" r="23"/><circle cx="295" cy="220" r="23"/><circle cx="150" cy="390" r="23"/><circle cx="285" cy="410" r="23"/></g><g fill="#facc15"><rect x="520" y="220" width="44" height="44" rx="7"/><rect x="640" y="260" width="44" height="44" rx="7"/><rect x="545" y="370" width="44" height="44" rx="7"/><rect x="660" y="410" width="44" height="44" rx="7"/></g>
  <path d="M365 330H440M750 330H825" stroke="#86efac" stroke-width="7" marker-end="url(#a)"/>
  <g transform="translate(845 165)"><g fill="#38bdf8"><circle cx="65" cy="70" r="23"/><circle cx="205" cy="105" r="23"/><circle cx="125" cy="225" r="23"/><circle cx="220" cy="275" r="23"/></g><g fill="#facc15"><rect x="120" y="55" width="44" height="44" rx="7"/><rect x="55" y="155" width="44" height="44" rx="7"/><rect x="185" y="180" width="44" height="44" rx="7"/><rect x="70" y="275" width="44" height="44" rx="7"/></g></g>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><text x="212" y="545">Sustancia A</text><text x="600" y="545">Sustancia B</text><text x="987" y="545">Mezcla A + B</text></g><text x="600" y="620" fill="#dcfce7" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">No aparecen partículas nuevas: el cambio es físico, no químico.</text></svg>
