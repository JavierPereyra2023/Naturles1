<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Esquema de la cuenca del río Reconquista</title><desc id="desc">Recorrido esquemático desde la presa Roggero, en Moreno, por el curso medio e inferior hasta el río Luján.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#7dd3fc"/></marker><linearGradient id="land"><stop stop-color="#234a35"/><stop offset="1" stop-color="#142f2b"/></linearGradient></defs>
  <rect width="1200" height="675" fill="#07151b"/><text x="60" y="70" fill="#86efac" font-family="Arial,sans-serif" font-size="30" font-weight="700">CUENCA DEL RÍO RECONQUISTA</text><text x="60" y="108" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="20">Esquema orientativo del recorrido oeste → este, no es un mapa a escala.</text>
  <path d="M80 180Q270 120 430 175T740 160Q940 125 1120 210V590Q900 625 720 570T390 590Q230 620 80 560z" fill="url(#land)" stroke="#4d7c5d" stroke-width="3"/>
  <path d="M125 330C245 285 300 390 420 350S610 245 730 325 900 430 1080 335" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/><path d="M125 330C245 285 300 390 420 350S610 245 730 325 900 430 1080 335" fill="none" stroke="#bae6fd" stroke-width="4" marker-end="url(#arr)"/>
  <g font-family="Arial,sans-serif"><g transform="translate(120 270)"><circle cy="60" r="18" fill="#facc15"/><text y="0" fill="#fff" font-size="21" font-weight="700">Presa Ing. Roggero</text><text y="25" fill="#d1d5db" font-size="18">Moreno · nacientes</text></g><g transform="translate(430 410)"><circle cy="-60" r="15" fill="#22c55e"/><text y="0" fill="#fff" font-size="21" font-weight="700">Curso medio</text><text y="25" fill="#d1d5db" font-size="18">Área urbana e industrial</text></g><g transform="translate(765 245)"><circle cy="80" r="15" fill="#fb923c"/><text y="0" fill="#fff" font-size="21" font-weight="700">Curso inferior</text><text y="25" fill="#d1d5db" font-size="18">Canal y humedales</text></g><g transform="translate(945 405)"><circle cx="135" cy="-70" r="18" fill="#a78bfa"/><text fill="#fff" font-size="21" font-weight="700">Río Luján</text><text y="25" fill="#d1d5db" font-size="18">Desembocadura</text></g></g>
  <g transform="translate(90 530)" font-family="Arial,sans-serif"><rect width="1020" height="80" rx="16" fill="#0c2730" stroke="#22c55e"/><text x="25" y="34" fill="#dcfce7" font-size="20">Una cuenca reúne el agua de lluvias y arroyos que fluye hacia un mismo río.</text><text x="25" y="61" fill="#bae6fd" font-size="18">Lo que ocurre aguas arriba afecta la calidad del agua aguas abajo.</text></g>
</svg>
