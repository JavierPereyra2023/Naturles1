<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tensión superficial del agua</title><desc id="desc">Un insecto zapatero se sostiene sobre la película superficial del agua gracias a la cohesión entre moléculas.</desc>
  <defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#075985"/></linearGradient></defs>
  <rect width="1200" height="675" fill="#07151b"/><text x="60" y="70" fill="#86efac" font-family="Arial,sans-serif" font-size="30" font-weight="700">TENSIÓN SUPERFICIAL</text><text x="60" y="108" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="20">La superficie se comporta como una película elástica.</text>
  <path d="M0 365Q150 335 300 365T600 365T900 365T1200 365V675H0z" fill="url(#water)"/><path d="M0 365Q150 335 300 365T600 365T900 365T1200 365" fill="none" stroke="#bae6fd" stroke-width="12"/>
  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="3"><circle cx="100" cy="430" r="22"/><circle cx="180" cy="470" r="22"/><circle cx="265" cy="420" r="22"/><circle cx="350" cy="470" r="22"/><circle cx="440" cy="425" r="22"/><circle cx="530" cy="470" r="22"/><circle cx="620" cy="425" r="22"/><circle cx="710" cy="470" r="22"/><circle cx="800" cy="425" r="22"/><circle cx="890" cy="470" r="22"/><circle cx="980" cy="425" r="22"/><circle cx="1070" cy="470" r="22"/></g>
  <g stroke="#93c5fd" stroke-width="3" stroke-dasharray="7 7"><path d="M122 430L158 465M202 465L243 426M287 426L328 465M372 465L418 429M462 429L508 465M552 465L598 429M642 429L688 465M732 465L778 429M822 429L868 465M912 465L958 429M1002 429L1048 465"/></g>
  <g fill="none" stroke="#18181b" stroke-width="11" stroke-linecap="round"><ellipse cx="600" cy="260" rx="72" ry="32" fill="#27272a"/><path d="M555 270L420 350M575 280L505 365M645 270L780 350M625 280L695 365M570 245L485 180M630 245L715 180"/></g><circle cx="600" cy="225" r="27" fill="#27272a"/>
  <g fill="none" stroke="#facc15" stroke-width="5"><ellipse cx="420" cy="365" rx="56" ry="14"/><ellipse cx="505" cy="375" rx="48" ry="12"/><ellipse cx="695" cy="375" rx="48" ry="12"/><ellipse cx="780" cy="365" rx="56" ry="14"/></g>
  <rect x="70" y="535" width="1060" height="92" rx="18" fill="#0c2730" stroke="#22c55e"/><text x="600" y="574" fill="#dcfce7" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Las moléculas de la superficie son atraídas hacia el interior.</text><text x="600" y="606" fill="#bae6fd" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Las patas reparten el peso y no rompen la película.</text>
</svg>
