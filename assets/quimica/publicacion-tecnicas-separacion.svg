<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Técnicas de separación de mezclas</title><desc id="desc">Cuatro paneles muestran filtración, decantación, imantación y evaporación.</desc><rect width="1200" height="675" fill="#07151b"/><text x="55" y="65" fill="#86efac" font-family="Arial,sans-serif" font-size="29" font-weight="700">TÉCNICAS DE SEPARACIÓN</text><text x="55" y="102" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="19">La técnica se elige según la propiedad que diferencia a los componentes.</text>
