<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Perfil del suelo y sus horizontes</title><desc id="desc">Corte vertical del suelo con horizontes O, A, B y C desde la materia orgánica hasta la roca madre.</desc>
  <rect width="1200" height="675" fill="#07151b"/><text x="60" y="65" fill="#86efac" font-family="Arial,sans-serif" font-size="30" font-weight="700">PERFIL DEL SUELO</text><text x="60" y="102" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="20">Los horizontes se forman lentamente por procesos físicos, químicos y biológicos.</text>
  <g transform="translate(100 145)"><rect width="610" height="72" fill="#263b22"/><rect y="72" width="610" height="105" fill="#493426"/><rect y="177" width="610" height="135" fill="#875c35"/><rect y="312" width="610" height="145" fill="#b88a55"/><rect y="457" width="610" height="55" fill="#64748b"/>
    <g fill="#a3e635"><path d="M80 0q10-65 20 0M160 0q-12-72-24 0M250 0q9-58 18 0M340 0q-10-78-22 0M460 0q12-62 24 0"/></g><g stroke="#d6b27b" stroke-width="5" fill="none"><path d="M100 25q20 90 55 130M235 20q-25 100-5 180M390 20q35 85 5 190M510 15q-40 120-20 230"/></g>
    <g fill="#d1a876"><circle cx="65" cy="215" r="8"/><circle cx="180" cy="250" r="11"/><circle cx="330" cy="220" r="7"/><circle cx="470" cy="275" r="12"/><circle cx="550" cy="340" r="9"/></g>
  </g>
  <g transform="translate(760 150)" font-family="Arial,sans-serif"><g><circle cx="28" cy="30" r="25" fill="#22c55e"/><text x="28" y="39" text-anchor="middle" fill="#07151b" font-size="25" font-weight="700">O</text><text x="70" y="24" fill="#fff" font-size="22" font-weight="700">Orgánico</text><text x="70" y="50" fill="#c8d4cc" font-size="18">hojarasca y restos vivos</text></g><g transform="translate(0 105)"><circle cx="28" cy="30" r="25" fill="#8b6b49"/><text x="28" y="39" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">A</text><text x="70" y="24" fill="#fff" font-size="22" font-weight="700">Superficial</text><text x="70" y="50" fill="#c8d4cc" font-size="18">humus, raíces y minerales</text></g><g transform="translate(0 225)"><circle cx="28" cy="30" r="25" fill="#c08457"/><text x="28" y="39" text-anchor="middle" fill="#07151b" font-size="25" font-weight="700">B</text><text x="70" y="24" fill="#fff" font-size="22" font-weight="700">Subsuelo</text><text x="70" y="50" fill="#c8d4cc" font-size="18">arcillas y minerales acumulados</text></g><g transform="translate(0 365)"><circle cx="28" cy="30" r="25" fill="#d6ad72"/><text x="28" y="39" text-anchor="middle" fill="#07151b" font-size="25" font-weight="700">C</text><text x="70" y="24" fill="#fff" font-size="22" font-weight="700">Material parental</text><text x="70" y="50" fill="#c8d4cc" font-size="18">fragmentos de roca madre</text></g></g>
</svg>
