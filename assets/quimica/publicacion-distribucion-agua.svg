<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Distribución del agua en la Tierra</title><desc id="desc">Comparación entre 97,5 por ciento de agua salada y 2,5 por ciento de agua dulce, subdividida en hielo, aguas subterráneas y agua superficial.</desc>
  <rect width="1200" height="675" fill="#07151b"/><text x="60" y="70" fill="#86efac" font-family="Arial,sans-serif" font-size="30" font-weight="700">¿DÓNDE ESTÁ EL AGUA DEL PLANETA?</text><text x="60" y="108" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="20">De cada 100 litros, apenas 2,5 litros son agua dulce.</text>
  <g transform="translate(70 155)"><rect width="650" height="180" rx="24" fill="#082f49" stroke="#38bdf8" stroke-width="3"/><rect x="18" y="78" width="599" height="56" rx="28" fill="#075985"/><rect x="18" y="78" width="584" height="56" rx="28" fill="#0ea5e9"/><rect x="602" y="78" width="15" height="56" rx="7" fill="#dbeafe"/><text x="34" y="55" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">TODA EL AGUA</text><text x="315" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">97,5 % salada</text><text x="634" y="164" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" text-anchor="end">2,5 % dulce</text></g>
  <g transform="translate(70 385)"><text x="0" y="0" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">DENTRO DEL 2,5 % DE AGUA DULCE</text><rect y="35" width="720" height="66" rx="12" fill="#172554"/><rect y="35" width="497" height="66" rx="12" fill="#bfdbfe"/><rect x="497" y="35" width="216" height="66" fill="#60a5fa"/><rect x="713" y="35" width="7" height="66" rx="3" fill="#22c55e"/><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><text x="248" y="76" fill="#17202a" text-anchor="middle">≈ 69 % hielo y glaciares</text><text x="605" y="76" fill="#082f49" text-anchor="middle">≈ 30 % subterránea</text><text x="730" y="130" fill="#86efac">&lt; 1 % superficial</text></g></g>
  <g transform="translate(840 175)"><path d="M140 0C95 72 25 145 25 225a115 115 0 0 0 230 0C255 145 185 72 140 0z" fill="#0ea5e9" stroke="#bae6fd" stroke-width="5"/><text x="140" y="205" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">2,5 %</text><text x="140" y="242" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="20">agua dulce</text></g>
  <rect x="70" y="570" width="1060" height="58" rx="14" fill="#0c2730"/><text x="600" y="607" fill="#dcfce7" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">El agua accesible para consumo es una fracción muy pequeña: cuidarla es esencial.</text>
</svg>
