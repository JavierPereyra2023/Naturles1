<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Destilación fraccionada del petróleo</title><desc id="desc">Torre que separa fracciones del petróleo según sus diferentes temperaturas de ebullición.</desc>
  <defs><linearGradient id="tower" x2="1"><stop stop-color="#334155"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#334155"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#f97316"/></marker></defs><rect width="1200" height="675" fill="#07151b"/><text x="55" y="65" fill="#86efac" font-family="Arial,sans-serif" font-size="29" font-weight="700">DESTILACIÓN FRACCIONADA</text><text x="55" y="102" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="19">Cada fracción se condensa a una altura distinta según su punto de ebullición.</text>
  <path d="M420 155h260l45 430H375z" fill="url(#tower)" stroke="#cbd5e1" stroke-width="4"/><g stroke="#1e293b" stroke-width="7"><path d="M400 250h300M390 340h320M382 430h336M375 520h350"/></g>
  <g stroke="#f97316" stroke-width="8" marker-end="url(#a)"><path d="M145 560H370"/><path d="M550 575V175"/></g><text x="130" y="535" fill="#fdba74" font-family="Arial,sans-serif" font-size="20">petróleo crudo caliente</text><text x="575" y="205" fill="#fecaca" font-family="Arial,sans-serif" font-size="18">más frío</text><text x="575" y="555" fill="#fed7aa" font-family="Arial,sans-serif" font-size="18">más caliente</text>
  <g font-family="Arial,sans-serif" font-size="19"><g stroke="#facc15" stroke-width="5"><path d="M680 205h160"/><path d="M700 290h140"/><path d="M710 385h130"/><path d="M720 480h120"/><path d="M725 555h115"/></g><g fill="#fff"><text x="860" y="212">gases · GLP</text><text x="860" y="297">nafta</text><text x="860" y="392">queroseno</text><text x="860" y="487">gasoil</text><text x="860" y="562">fuel oil y asfalto</text></g></g>
  <rect x="55" y="610" width="1090" height="43" rx="12" fill="#0c2730"/><text x="600" y="638" fill="#dcfce7" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Separación física: no se crean sustancias nuevas; se aprovechan distintos puntos de ebullición.</text>
</svg>
